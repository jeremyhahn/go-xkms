# Host-facing developer/coverage stack, NOT part of `make integration-test`.
#
# The host port bindings below are deliberately fixed: `make emulator-status`,
# `make coverage-awskms` and friends run on the host and dial these numbers
# directly. That does mean two concurrent copies of THIS stack would collide
# on the ports -- acceptable only because no CI job starts it. Everything CI
# runs publishes on an ephemeral host port instead (host side 0). If this
# stack is ever added to CI, the ports must be made ephemeral too and the
# callers taught to resolve them with `docker compose port`, the way
# `integration-test-ssh-backends` already does.
services:
  # Floci - AWS Emulator (KMS)
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    environment:
      - FLOCI_DEFAULT_REGION=us-east-1
      - FLOCI_STORAGE_MODE=memory
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_floci/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - xkms-test

  # Floci - GCP Emulator (Cloud KMS)
  floci-gcp:
    image: floci/floci-gcp:latest
    ports:
      - "4588:4588"
    environment:
      - FLOCI_GCP_DEFAULT_PROJECT_ID=test-project
      - FLOCI_GCP_STORAGE_MODE=memory
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4588/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - xkms-test

  # Azure Key Vault Emulator
  azure-keyvault:
    image: jamesgoulddev/azure-keyvault-emulator:latest
    ports:
      - "4997:4997"
    environment:
      - Persist=false
      - Kestrel__Certificates__Default__Password=emulator
      - Kestrel__Certificates__Default__Path=/certs/emulator.pfx
      - ASPNETCORE_ENVIRONMENT=Development
      - DisableAuthentication=true
      - AzureKeyVault__DisableAuthentication=true
    volumes:
      - "./.azure-emulator/certs:/certs"
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://localhost:4997/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - xkms-test

  # HashiCorp Vault
  vault:
    image: hashicorp/vault:latest
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=root
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - VAULT_ADDR=http://0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    command: server -dev -dev-root-token-id=root
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - xkms-test

networks:
  xkms-test:
    driver: bridge
