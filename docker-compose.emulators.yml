services:
  # Floci - AWS Emulator (KMS)
  floci:
    image: floci/floci:latest
    container_name: go-xkms-floci
    ports:
      - "4566:4566"
    environment:
      - FLOCI_DEFAULT_REGION=us-east-1
      - FLOCI_STORAGE_MODE=memory
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_floci/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - xkms-test

  # Floci - GCP Emulator (Cloud KMS)
  floci-gcp:
    image: floci/floci-gcp:latest
    container_name: go-xkms-floci-gcp
    ports:
      - "4588:4588"
    environment:
      - FLOCI_GCP_DEFAULT_PROJECT_ID=test-project
      - FLOCI_GCP_STORAGE_MODE=memory
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4588/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - xkms-test

  # Azure Key Vault Emulator
  azure-keyvault:
    image: jamesgoulddev/azure-keyvault-emulator:latest
    container_name: go-xkms-azure-kv
    ports:
      - "4997:4997"
    environment:
      - Persist=false
      - Kestrel__Certificates__Default__Password=emulator
      - Kestrel__Certificates__Default__Path=/certs/emulator.pfx
      - ASPNETCORE_ENVIRONMENT=Development
      - DisableAuthentication=true
      - AzureKeyVault__DisableAuthentication=true
    volumes:
      - "./.azure-emulator/certs:/certs"
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://localhost:4997/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - xkms-test

  # HashiCorp Vault
  vault:
    image: hashicorp/vault:latest
    container_name: go-xkms-vault
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=root
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - VAULT_ADDR=http://0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    command: server -dev -dev-root-token-id=root
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - xkms-test

networks:
  xkms-test:
    driver: bridge
