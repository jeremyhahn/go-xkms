# Compose project name.
name: go-xkms

# Hardened posture for the CI stages: no capabilities, no network, read-only root.
x-posture: &posture
  init: true
  read_only: true
  network_mode: none
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 4096
  mem_limit: 8g
  memswap_limit: 8g
  ulimits:
    memlock: 67108864
    core: 1048576
    nofile: 65536
  working_dir: /src

services:
  integration:
    <<: *posture
    profiles: [integration]
    image: ${GO_XKMS_IT_IMAGE:-go-xkms-it:local}
    pull_policy: never
    user: "10001:10001"
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=3g,mode=1777
    volumes:
      - gocache:/gocache
    environment:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      GOPROXY: "off"

  toolchain:
    <<: *posture
    profiles: [toolchain]
    # Offline unless the caller opts in.
    network_mode: ${GO_XKMS_TOOLCHAIN_NETWORK:-none}
    image: go-xkms-toolchain:${GO_XKMS_TOOLCHAIN_TAG:-latest}
    pull_policy: never
    user: "${GO_XKMS_UID:-10001}:${GO_XKMS_GID:-10001}"
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=3g,mode=1777
    volumes:
      - ../../..:/src
      - toolchain-gocache:/gocache
    environment:
      HOME: /tmp

  devcontainer:
    # The interactive stage of the devcontainer Dockerfile.
    build:
      context: ../../..
      dockerfile: build/docker/devcontainer/Dockerfile
      target: devcontainer
      args:
        GO_IMAGE: ${GO_IMAGE:?GO_IMAGE is unset; build through make, which exports scripts/tool-pins.sh}
      # Module credentials reach the build through the gomodauth BuildKit secret.
      secrets:
        - gomodauth
        - apt_proxy
    image: go-xkms-dev:${XKMS_IMAGE_TAG:-latest}
    # Privileged mode required for QEMU with KVM acceleration
    privileged: true
    # Capabilities for QEMU/KVM and hardware testing
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN        # For mount operations
      - NET_ADMIN        # For network configuration
      - IPC_LOCK         # For TPM memory locking
    # Device access for KVM acceleration; /dev/uhid is handled in post-start.
    devices:
      - /dev/kvm:/dev/kvm
    # Shared memory for QEMU
    shm_size: '2gb'
    # Memory limits for TPM operations
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ../../..:/workspace:cached
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/home/vscode/.cache/go-build
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared socket volume for xkms server communication
      - xkms-socket:/var/run/xkms
      # The xkms-server's state directory, read-only.
      - xkms-data:/xkms-data:ro
    environment:
      # Devcontainer identity marker, also baked into the image.
      - XKMS_DEVCONTAINER=1
      - GOPATH=/go
      # Builds never resolve through a workspace.
      - GOWORK=off
      - GOPRIVATE=${GOMODAUTH_GOPRIVATE:-${GITEA_HOST:+github.com/jeremyhahn/*}}
      - GIT_CONFIG_COUNT=${GOMODAUTH_GIT_CONFIG_COUNT:-${GITEA_HOST:+1}}
      - GIT_CONFIG_KEY_0=${GOMODAUTH_GIT_CONFIG_KEY_0:-url.http://x:${FORGE_MODULE_TOKEN}@${GITEA_HOST}/jeremyhahn/.insteadOf}
      - GIT_CONFIG_VALUE_0=${GOMODAUTH_GIT_CONFIG_VALUE_0:-https://github.com/jeremyhahn/}
      - CGO_ENABLED=1
      - TPM_USE_SIMULATOR=true
      - TPM_SIMULATOR_HOST=swtpm
      - TPM_SIMULATOR_PORT=2321
      - SOFTHSM2_CONF=/etc/softhsm/softhsm2.conf
      - PKCS11_LIBRARY=/usr/lib/softhsm/libsofthsm2.so
      # Integration test endpoints
      - XKMS_UNIX_SOCKET=/var/run/xkms/xkms.sock
      - XKMS_GRPC_ADDR=xkms-server:9443
      - XKMS_GRPC_TLS_ENABLED=true
      # Written by scripts/ensure-server-ca.sh from the read-only xkms-data mount.
      - XKMS_GRPC_TLS_CA=/tmp/xkms/ca.crt
      # First-boot admin mTLS credential, published by ensure-server-ca.sh.
      - XKMS_GRPC_TLS_CERT=/tmp/xkms/admin-cert.pem
      - XKMS_GRPC_TLS_KEY=/tmp/xkms/admin-key.pem
      - XKMS_SERVER_STATE_DIR=/xkms-data
      # The test SO PIN, which is also the server's barrier passphrase.
      - XKMS_SERVER_BARRIER_SECRET=${XKMS_TEST_SO_PIN:-xkms-integration-test-so-pin}
      # The same trust anchor and admin credential under the names the PKCS#11 module reads.
      - XKMS_PKCS11_TLS_ENABLED=true
      - XKMS_PKCS11_TLS_CA=/tmp/xkms/ca.crt
      - XKMS_PKCS11_TLS_CERT=/tmp/xkms/admin-cert.pem
      - XKMS_PKCS11_TLS_KEY=/tmp/xkms/admin-key.pem
      # Legacy endpoints (KEYSTORE_* prefix)
      - KEYSTORE_UNIX_SOCKET=/var/run/xkms/xkms.sock
      - KEYSTORE_REST_URL=https://xkms-server:8443
      - KEYSTORE_GRPC_ADDR=xkms-server:9443
      - KEYSTORE_QUIC_URL=https://xkms-server:8444
      - KEYSTORE_MCP_ADDR=xkms-server:8445
      - KEYSTORE_TLS_CA=/etc/xkms/certs/ca.crt
      # PKCS#11 module configuration
      - PKCS11_MODULE=/workspace/build/lib/libxkms_pkcs11.so
      - PKCS11_TOKEN_LABEL=xkms-token
      - PKCS11_PIN=87654321
      - PKCS11_SO_PIN=12345678
      # PKCS#11 module auto-initialization and persistence
      - XKMS_PKCS11_AUTO_INIT_TOKEN=true
      - XKMS_PKCS11_SO_PIN=12345678
      - XKMS_PKCS11_USER_PIN=87654321
      - XKMS_PKCS11_TOKEN_LABEL=test-token
      - XKMS_PKCS11_STORAGE_TYPE=file
      - XKMS_PKCS11_STORAGE_PATH=/tmp/pkcs11-storage
      # FIDO2 configuration (auto-detect device or use FIDO2_DEVICE_PATH).
      - FIDO2_PIN=123456
      - FIDO2_DEVICE_PATH=
      - FIDO2_USE_VIRTUAL=true
    networks:
      - xkms-dev
    depends_on:
      swtpm:
        condition: service_healthy
      softhsm:
        condition: service_healthy
    security_opt:
      - seccomp:unconfined
    command: sleep infinity

  # SWTPM TPM 2.0 Simulator (shared across all tests)
  swtpm:
    build:
      context: ../../../test/docker/swtpm
      dockerfile: Dockerfile
      # Ruling 886: scripts/apk-mirror.sh, bind-mounted by the Dockerfile.
      additional_contexts:
        scripts: ../../../scripts
      secrets:
        - apk_mirror
    image: go-xkms-swtpm:${XKMS_IMAGE_TAG:-dev}
    volumes:
      - swtpm-state:/var/lib/swtpm/tpmstate
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2321"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - xkms-dev

  # SoftHSM PKCS#11 service (shared across all tests)
  softhsm:
    build:
      context: ../../../test/docker/softhsm
      dockerfile: Dockerfile
      # The SoftHSM pin.
      additional_contexts:
        softhsm-pin: ../../../scripts
      secrets:
        - apk_mirror
    image: go-xkms-softhsm:${XKMS_IMAGE_TAG:-dev}
    volumes:
      - softhsm-tokens:/tokens
    environment:
      - SOFTHSM2_CONF=/home/softhsm/softhsm2.conf
      - PKCS11_LIBRARY=/usr/local/lib/softhsm/libsofthsm2.so
    healthcheck:
      # Loads the library rather than checking the file exists.
      test: ["CMD", "softhsm2-util", "--show-slots"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - xkms-dev

  # XKMS server for integration tests (optional, started manually)
  xkms-server:
    build:
      context: ../../..
      dockerfile: Dockerfile
      # Module credentials reach the build through the gomodauth BuildKit secret.
      secrets:
        - gomodauth
        - apt_proxy
    image: go-xkms-server:${XKMS_IMAGE_TAG:-dev}
    # Published on an ephemeral host port.
    ports:
      - "${XKMS_HOST_REST_PORT:-0}:8443"    # REST API
      - "${XKMS_HOST_GRPC_PORT:-0}:9443"    # gRPC
      - "${XKMS_HOST_QUIC_PORT:-0}:8444"    # QUIC
      - "${XKMS_HOST_MCP_PORT:-0}:8445"     # MCP
      - "${XKMS_HOST_METRICS_PORT:-0}:9090" # Metrics
    volumes:
      - xkms-data:/data
      - xkms-socket:/var/run/xkms
      # xkmsd.yaml is baked into the image, not bind-mounted, because the daemon resolves mounts on its own host.
    environment:
      - XKMS_CONFIG=/etc/xkms/xkmsd.yaml
      - KEYSTORE_LOG_LEVEL=debug
      - KEYSTORE_DATA_DIR=/data
      - TPM_DEVICE_PATH=tcp://swtpm:2321
      - TPM_USE_SIMULATOR=true
      - PKCS11_LIBRARY=/usr/lib/softhsm/libsofthsm2.so
      - SOFTHSM2_CONF=/etc/softhsm/softhsm2.conf
      # Test SO PIN for `xkmsd init`, also the barrier passphrase.
      - XKMS_SO_PIN=${XKMS_TEST_SO_PIN:-xkms-integration-test-so-pin}
    depends_on:
      swtpm:
        condition: service_healthy
      softhsm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-S", "/var/run/xkms/xkms.sock"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      xkms-dev:
        # A WebAuthn RPID needs a dot, so the fido2 leg dials this dotted alias.
        aliases:
          - xkms-server.test
    # xkmsd refuses to start while ComplianceGaps is non-empty.
    command:
      - /bin/sh
      - -ec
      - |
        if [ -f /data/storage/admin-cert.pem ] && [ -f /data/storage/admin-key.pem ]; then
          echo "xkms-server: admin credential present; volume already initialized"
        else
          /app/xkmsd init --config /etc/xkms/xkmsd.yaml --hostname xkms-server --admin-factor mtls
        fi
        exec env -u XKMS_SO_PIN /app/xkmsd -config /etc/xkms/xkmsd.yaml

  # quicbaasd fixture for the login verification matrix.
  quicbaas-server:
    build:
      context: ../../../../go-quicbaas
      dockerfile: Dockerfile
      args:
        # The login matrix needs the rest tag; gms_pure_go stays for the CGO_ENABLED=0 build.
        BUILD_TAGS: "gms_pure_go rest"
      secrets:
        - gomodauth
    image: go-quicbaas-server:${XKMS_IMAGE_TAG:-dev}
    profiles:
      - quicbaas
    volumes:
      - quicbaas-data:/data
      - ../../../configs/quicbaasd-integration.yaml:/etc/quicbaas/quicbaas.yaml:ro
    # "start" is a single-node local PebbleDB backend.
    command: ["start", "--config", "/etc/quicbaas/quicbaas.yaml", "--data-dir", "/data"]
    healthcheck:
      # A TCP connect proves liveness without credentials.
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 8443 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    networks:
      xkms-dev:
        # Dotted alias for the WebAuthn RPID.
        aliases:
          - quicbaas-server.test

  # Virtual FIDO2 authenticator for WebAuthn testing without hardware.
  softfido:
    build:
      context: .
      dockerfile: Dockerfile.softfido
      secrets:
        - apt_proxy
    image: go-xkms-softfido:${XKMS_IMAGE_TAG:-dev}
    volumes:
      - softfido-state:/var/lib/softfido
      - softfido-run:/var/run/softfido
    environment:
      - SOFTFIDO_PIN=123456
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - xkms-dev

volumes:
  gocache:
  toolchain-gocache:
  go-mod-cache:
  go-build-cache:
  swtpm-state:
  softhsm-tokens:
  xkms-data:
  xkms-socket:
  quicbaas-data:
  softfido-state:
  softfido-run:

networks:
  xkms-dev:
    driver: bridge

# Module-fetch credentials staged by `make stage-gomodauth`; empty when none are configured.
secrets:
  gomodauth:
    file: ./gomodauth.env
  # Optional package caches as BuildKit secrets; empty when unset.
  apk_mirror:
    environment: DEVCACHE_APK_MIRROR
  apt_proxy:
    environment: DEVCACHE_APT_PROXY
