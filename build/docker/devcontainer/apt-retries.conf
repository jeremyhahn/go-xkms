// apt fetch resilience for every image built from build/docker (go-xkms#342).
// Each stage that runs apt-get copies this file to
// /etc/apt/apt.conf.d/80-retries first; internal/buildgates/apt_test.go
// fails a Dockerfile apt-get layer that does not.
//
// A fetch that fails with a transient error (connection refused or reset,
// unreachable network, timeout) is retried up to Acquire::Retries times.
// apt waits between retries with an exponential backoff (1 s, 2 s, 4 s, ...)
// capped at Acquire::Retries::Delay::Maximum seconds, so ten retries ride out
// an archive outage of about five minutes before the build fails.
Acquire::Retries "10";
Acquire::Retries::Delay "true";
Acquire::Retries::Delay::Maximum "60";

// The timeout bounds both the connect and a stalled transfer, so a hung
// mirror fails fast into the next retry instead of holding the build.
Acquire::http::Timeout "30";
Acquire::https::Timeout "30";
