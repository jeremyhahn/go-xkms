services:
  # Integration test runner for storage packages
  test:
    image: golang:bookworm
    working_dir: /app
    volumes:
      - ../../..:/app
      # Sibling module mounts (for go.mod replace directives)
      - ../../../../go-qrdb:/go-qrdb:cached
      - ../../../../go-quicraft:/go-quicraft:cached
      - ../../../../go-objstore:/go-objstore:cached
      - ../../../../go-truststrap:/go-truststrap:cached
      - ../../../../go-codec:/go-codec:cached
      - ../../../../go-frost:/go-frost:cached
    environment:
      - CGO_ENABLED=1
      - GOTOOLCHAIN=auto
      - GOCACHE=/tmp/go-cache
      - GOPATH=/tmp/go
    command: >
      sh -c "
      bash .devcontainer/scripts/ensure-gowork.sh && export GOWORK=/tmp/go.work &&
      apt-get update && apt-get install -y --no-install-recommends build-essential &&
      go test -v -tags='integration codec_cbor codec_json codec_msgpack' ./test/integration/storage/... -timeout 30m
      "
    networks:
      - storage-test-network

  # File storage tests (no special requirements, run standalone)
  test-file:
    image: golang:bookworm
    working_dir: /app
    volumes:
      - ../../..:/app
      # Sibling module mounts (for go.mod replace directives)
      - ../../../../go-qrdb:/go-qrdb:cached
      - ../../../../go-quicraft:/go-quicraft:cached
      - ../../../../go-objstore:/go-objstore:cached
      - ../../../../go-truststrap:/go-truststrap:cached
      - ../../../../go-codec:/go-codec:cached
      - ../../../../go-frost:/go-frost:cached
    environment:
      - CGO_ENABLED=0
      - GOTOOLCHAIN=auto
      - GOCACHE=/tmp/go-cache
      - GOPATH=/tmp/go
    command: >
      sh -c "
      bash .devcontainer/scripts/ensure-gowork.sh && export GOWORK=/tmp/go.work &&
      go test -v -tags='integration codec_cbor codec_json codec_msgpack' ./test/integration/storage/...
      -run 'TestFileStorage' -timeout 15m
      "
    networks:
      - storage-test-network

  # Memory storage tests (no special requirements, run standalone)
  test-memory:
    image: golang:bookworm
    working_dir: /app
    volumes:
      - ../../..:/app
      # Sibling module mounts (for go.mod replace directives)
      - ../../../../go-qrdb:/go-qrdb:cached
      - ../../../../go-quicraft:/go-quicraft:cached
      - ../../../../go-objstore:/go-objstore:cached
      - ../../../../go-truststrap:/go-truststrap:cached
      - ../../../../go-codec:/go-codec:cached
      - ../../../../go-frost:/go-frost:cached
    environment:
      - CGO_ENABLED=0
      - GOTOOLCHAIN=auto
      - GOCACHE=/tmp/go-cache
      - GOPATH=/tmp/go
    command: >
      sh -c "
      bash .devcontainer/scripts/ensure-gowork.sh && export GOWORK=/tmp/go.work &&
      go test -v -tags='integration codec_cbor codec_json codec_msgpack' ./test/integration/storage/...
      -run 'TestMemoryStorage' -timeout 15m
      "
    networks:
      - storage-test-network

  # Hardware storage tests with PKCS#11 (SoftHSM)
  test-hardware-pkcs11:
    image: golang:bookworm
    working_dir: /app
    volumes:
      - ../../..:/app
      # Sibling module mounts (for go.mod replace directives)
      - ../../../../go-qrdb:/go-qrdb:cached
      - ../../../../go-quicraft:/go-quicraft:cached
      - ../../../../go-objstore:/go-objstore:cached
      - ../../../../go-truststrap:/go-truststrap:cached
      - ../../../../go-codec:/go-codec:cached
      - ../../../../go-frost:/go-frost:cached
      - softhsm-tokens:/var/lib/softhsm/tokens
    environment:
      - CGO_ENABLED=1
      - GOTOOLCHAIN=auto
      - GOCACHE=/tmp/go-cache
      - GOPATH=/tmp/go
      - SOFTHSM2_CONF=/app/test/integration/storage/softhsm2.conf
      - PKCS11_LIB=/usr/lib/softhsm/libsofthsm2.so
    depends_on:
      softhsm-init:
        condition: service_completed_successfully
    command: >
      sh -c "
      bash .devcontainer/scripts/ensure-gowork.sh && export GOWORK=/tmp/go.work &&
      apt-get update && apt-get install -y --no-install-recommends build-essential softhsm2 libsofthsm2 &&
      go test -v -tags='integration,pkcs11,codec_cbor,codec_json,codec_msgpack' ./test/integration/storage/...
      -run 'TestHardwareStorage' -timeout 30m
      "
    networks:
      - storage-test-network

  # Hardware storage tests with TPM2
  test-hardware-tpm2:
    image: golang:bookworm
    working_dir: /app
    volumes:
      - ../../..:/app
      # Sibling module mounts (for go.mod replace directives)
      - ../../../../go-qrdb:/go-qrdb:cached
      - ../../../../go-quicraft:/go-quicraft:cached
      - ../../../../go-objstore:/go-objstore:cached
      - ../../../../go-truststrap:/go-truststrap:cached
      - ../../../../go-codec:/go-codec:cached
      - ../../../../go-frost:/go-frost:cached
    environment:
      - CGO_ENABLED=1
      - GOTOOLCHAIN=auto
      - GOCACHE=/tmp/go-cache
      - GOPATH=/tmp/go
      - TPM2_SIMULATOR_HOST=tpm-simulator
      - TPM2_SIMULATOR_PORT=2321
    depends_on:
      tpm-simulator:
        condition: service_healthy
    command: >
      sh -c "
      bash .devcontainer/scripts/ensure-gowork.sh && export GOWORK=/tmp/go.work &&
      apt-get update && apt-get install -y --no-install-recommends build-essential libtss2-dev &&
      sleep 3 &&
      go test -v -tags='integration,tpm2,codec_cbor,codec_json,codec_msgpack' ./test/integration/storage/...
      -run 'TestHardwareStorage' -timeout 30m
      "
    networks:
      - storage-test-network

  # SoftHSM initialization service
  softhsm-init:
    image: golang:bookworm
    volumes:
      - softhsm-tokens:/var/lib/softhsm/tokens
      - ../../..:/app
      # Sibling module mounts (for go.mod replace directives)
      - ../../../../go-qrdb:/go-qrdb:cached
      - ../../../../go-quicraft:/go-quicraft:cached
      - ../../../../go-objstore:/go-objstore:cached
      - ../../../../go-truststrap:/go-truststrap:cached
      - ../../../../go-codec:/go-codec:cached
      - ../../../../go-frost:/go-frost:cached
    environment:
      - SOFTHSM2_CONF=/app/test/integration/storage/softhsm2.conf
    # No Go workspace needed here — this init service only provisions the token.
    command: >
      sh -c "
      apt-get update && apt-get install -y --no-install-recommends softhsm2 &&
      mkdir -p /var/lib/softhsm/tokens &&
      softhsm2-util --init-token --slot 0 --label test-token --so-pin 1234 --pin 1234 &&
      echo 'SoftHSM initialized successfully'
      "
    networks:
      - storage-test-network

  # TPM2 simulator for hardware tests
  tpm-simulator:
    image: ghcr.io/stefanberger/swtpm:latest
    command:
      - socket
      - --tpmstate
      - dir=/tmp
      - --tpm2
      - --server
      - type=tcp,port=2321,bindaddr=0.0.0.0
      - --ctrl
      - type=tcp,port=2322,bindaddr=0.0.0.0
      - --flags
      - startup-clear
      - --log
      - level=1
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q '[s]wtpm' || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
    ports:
      - "2321:2321"
      - "2322:2322"
    networks:
      - storage-test-network

networks:
  storage-test-network:
    driver: bridge

volumes:
  softhsm-tokens:
