services:
  # Integration test runner for storage packages
  test:
    build:
      context: ../../..
      dockerfile: test/integration/storage/Dockerfile
      args:
        # libicu-dev/libusb-1.0-0-dev: unconditional cgo deps of the module
        # graph itself (dolthub/go-icu-regex, google/gousb via go-qrdb), not
        # gated by any tag here -- needed for any CGO_ENABLED=1 build.
        EXTRA_APT_PACKAGES: "build-essential libicu-dev libusb-1.0-0-dev"
      secrets:
        - gomodauth
    working_dir: /app
    environment:
      - CGO_ENABLED=1
    command: >
      sh -c "
      go test -v -tags='integration codec_cbor codec_json codec_msgpack' ./test/integration/storage/... -timeout 30m
      "
    networks:
      - storage-test-network

  # File storage tests (no special requirements, run standalone)
  test-file:
    build:
      context: ../../..
      dockerfile: test/integration/storage/Dockerfile
      secrets:
        - gomodauth
    working_dir: /app
    environment:
      - CGO_ENABLED=0
    # gms_pure_go selects go-mysql-server's non-cgo regex engine; without it
    # the cgo-only variant (github.com/dolthub/go-icu-regex) fails to build
    # under CGO_ENABLED=0 with "build constraints exclude all Go files".
    command: >
      sh -c "
      go test -v -tags='integration codec_cbor codec_json codec_msgpack gms_pure_go' ./test/integration/storage/...
      -run 'TestFileStorage' -timeout 15m
      "
    networks:
      - storage-test-network

  # Memory storage tests (no special requirements, run standalone)
  test-memory:
    build:
      context: ../../..
      dockerfile: test/integration/storage/Dockerfile
      secrets:
        - gomodauth
    working_dir: /app
    environment:
      - CGO_ENABLED=0
    # gms_pure_go: see test-file's identical comment above.
    command: >
      sh -c "
      go test -v -tags='integration codec_cbor codec_json codec_msgpack gms_pure_go' ./test/integration/storage/...
      -run 'TestMemoryStorage' -timeout 15m
      "
    networks:
      - storage-test-network

  # Hardware storage tests with PKCS#11 (SoftHSM)
  test-hardware-pkcs11:
    build:
      context: ../../..
      dockerfile: test/integration/storage/Dockerfile
      args:
        # libicu-dev/libusb-1.0-0-dev: see the "test" service's comment --
        # unconditional cgo deps of the module graph, needed for any
        # CGO_ENABLED=1 build regardless of tags.
        EXTRA_APT_PACKAGES: "build-essential libicu-dev libusb-1.0-0-dev"
      secrets:
        - gomodauth
    working_dir: /app
    volumes:
      - softhsm-tokens:/var/lib/softhsm/tokens
    environment:
      - CGO_ENABLED=1
      - SOFTHSM2_CONF=/app/test/integration/storage/softhsm2.conf
      - PKCS11_LIB=/usr/lib/softhsm/libsofthsm2.so
    depends_on:
      softhsm-init:
        condition: service_completed_successfully
    command: >
      sh -c "
      go test -v -tags='integration,pkcs11,codec_cbor,codec_json,codec_msgpack' ./test/integration/storage/...
      -run 'TestHardwareStorage' -timeout 30m
      "
    networks:
      - storage-test-network

  # Hardware storage tests with TPM2
  test-hardware-tpm2:
    build:
      context: ../../..
      dockerfile: test/integration/storage/Dockerfile
      args:
        # libicu-dev/libusb-1.0-0-dev: see the "test" service's comment --
        # unconditional cgo deps of the module graph, needed for any
        # CGO_ENABLED=1 build regardless of tags.
        EXTRA_APT_PACKAGES: "build-essential libtss2-dev libicu-dev libusb-1.0-0-dev"
      secrets:
        - gomodauth
    working_dir: /app
    environment:
      - CGO_ENABLED=1
      - TPM2_SIMULATOR_HOST=tpm-simulator
      - TPM2_SIMULATOR_PORT=2321
    depends_on:
      tpm-simulator:
        condition: service_healthy
    command: >
      sh -c "
      sleep 3 &&
      go test -v -tags='integration,tpm2,codec_cbor,codec_json,codec_msgpack' ./test/integration/storage/...
      -run 'TestHardwareStorage' -timeout 30m
      "
    networks:
      - storage-test-network

  # SoftHSM initialization service. Runs no Go code and needs no module
  # source, so it builds only the shared Dockerfile's "softhsm" stage -- the
  # same pinned SoftHSM 2.7.0 (scripts/build-softhsm.sh, go-xkms#1418) the
  # test lanes load, so the token is written by the release that later opens
  # it -- and runs softhsm2-util (with --module) from that stage's staged
  # install. The config it needs (directories.tokendir) is written inline
  # below instead of bind-mounting test/integration/storage/softhsm2.conf
  # from the host: on the Gitea Actions runner a relative bind mount
  # resolves against the JOB CONTAINER's filesystem, not the true host's, so
  # the mount would silently attach an unrelated (usually empty) directory
  # instead of erroring.
  softhsm-init:
    build:
      context: ../../..
      dockerfile: test/integration/storage/Dockerfile
      target: softhsm
    volumes:
      - softhsm-tokens:/var/lib/softhsm/tokens
    environment:
      - SOFTHSM2_CONF=/etc/softhsm/softhsm2.conf
    # Runs once per dependent service on the same softhsm-tokens volume, so it
    # initializes test-token only when no token carries that label yet.
    # --free takes SoftHSM's empty slot: once a token exists, slot 0 is gone.
    command: >
      sh -c "
      mkdir -p /var/lib/softhsm/tokens /etc/softhsm &&
      echo 'directories.tokendir = /var/lib/softhsm/tokens' > /etc/softhsm/softhsm2.conf &&
      echo 'objectstore.backend = file' >> /etc/softhsm/softhsm2.conf &&
      echo 'log.level = INFO' >> /etc/softhsm/softhsm2.conf &&
      if /build/softhsm-install/usr/bin/softhsm2-util --module /build/softhsm-install/usr/lib/softhsm/libsofthsm2.so --show-slots | grep -q 'Label: *test-token *$$'; then
      echo 'SoftHSM token test-token already initialized';
      else
      /build/softhsm-install/usr/bin/softhsm2-util --module /build/softhsm-install/usr/lib/softhsm/libsofthsm2.so --init-token --free --label test-token --so-pin 1234 --pin 1234 &&
      echo 'SoftHSM initialized successfully';
      fi
      "
    networks:
      - storage-test-network

  # TPM2 simulator for hardware tests
  tpm-simulator:
    image: ghcr.io/stefanberger/swtpm:v0.10.0@sha256:303a1998b9ae7ad500146036bb63e1e0703208f788db8741233f0080c3125a78
    command:
      - socket
      - --tpmstate
      - dir=/tmp
      - --tpm2
      - --server
      - type=tcp,port=2321,bindaddr=0.0.0.0
      - --ctrl
      - type=tcp,port=2322,bindaddr=0.0.0.0
      - --flags
      - startup-clear
      - --log
      - level=1
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q '[s]wtpm' || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
    ports:
      - "0:2321"
      - "0:2322"
    networks:
      - storage-test-network

networks:
  storage-test-network:
    driver: bridge

volumes:
  softhsm-tokens:

# Staged by `make stage-gomodauth` (dependency-resolution.md §6) into the
# gitignored build/docker/devcontainer/gomodauth.env; empty when no Gitea credentials are
# available, in which case the Dockerfile's optional secret mount falls back
# to public module resolution.
secrets:
  gomodauth:
    file: ../../../build/docker/devcontainer/gomodauth.env
