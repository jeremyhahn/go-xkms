services:
  certstore-integration-test:
    build:
      context: ../../..
      dockerfile: test/integration/certstore/Dockerfile
    environment:
      - GOWORK=off
      - GOPRIVATE=github.com/jeremyhahn/*
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=url.http://x:${GITEA_GO_TOKEN}@198.51.100.91:3001/jeremyhahn/.insteadOf
      - GIT_CONFIG_VALUE_0=https://github.com/jeremyhahn/
      - GO_TEST_TIMEOUT=10m
    volumes:
      - ../../../:/workspace
    working_dir: /workspace
    command: >
      sh -c "go test -v -tags='integration codec_cbor codec_json codec_msgpack'
      -timeout=10m
      -coverprofile=/tmp/coverage.out
      ./test/integration/certstore/... &&
      go tool cover -func=/tmp/coverage.out"
