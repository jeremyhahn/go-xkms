services:
  certstore-integration-test:
    build:
      context: ../../..
      dockerfile: test/integration/certstore/Dockerfile
    environment:
      - GOWORK=off
      - GOPRIVATE=${GOMODAUTH_GOPRIVATE:-${GITEA_HOST:+github.com/jeremyhahn/*}}
      - GIT_CONFIG_COUNT=${GOMODAUTH_GIT_CONFIG_COUNT:-${GITEA_HOST:+1}}
      - GIT_CONFIG_KEY_0=${GOMODAUTH_GIT_CONFIG_KEY_0:-url.http://x:${FORGE_MODULE_TOKEN}@${GITEA_HOST}/jeremyhahn/.insteadOf}
      - GIT_CONFIG_VALUE_0=${GOMODAUTH_GIT_CONFIG_VALUE_0:-https://github.com/jeremyhahn/}
      - GO_TEST_TIMEOUT=10m
    volumes:
      - ../../../:/workspace
    working_dir: /workspace
    command: >
      sh -c "go test -v -tags='integration codec_cbor codec_json codec_msgpack'
      -timeout=10m
      -coverprofile=/tmp/coverage.out
      ./test/integration/certstore/... &&
      go tool cover -func=/tmp/coverage.out"
