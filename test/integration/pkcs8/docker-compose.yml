services:
  test:
    build:
      context: ../../..
      dockerfile: test/integration/pkcs8/Dockerfile
    volumes:
      - ../../..:/app
    environment:
      - GOWORK=off
      - GOPRIVATE=github.com/jeremyhahn/*
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=url.http://x:${GITEA_GO_TOKEN}@198.51.100.91:3001/jeremyhahn/.insteadOf
      - GIT_CONFIG_VALUE_0=https://github.com/jeremyhahn/
    working_dir: /app

networks:
  default:
    name: xkms-pkcs8-test
