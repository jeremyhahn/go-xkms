services:
  quantum-test:
    build:
      context: ../../..
      dockerfile: test/integration/quantum/Dockerfile
    environment:
      - GO111MODULE=on
    volumes:
      - ../../../:/workspace
      # Sibling module mounts (for go.mod replace directives)
      - ../../../../go-qrdb:/go-qrdb:cached
      - ../../../../go-quicraft:/go-quicraft:cached
      - ../../../../go-objstore:/go-objstore:cached
      - ../../../../go-truststrap:/go-truststrap:cached
      - ../../../../go-codec:/go-codec:cached
      - ../../../../go-frost:/go-frost:cached
      - go-modules:/go/pkg/mod
    working_dir: /workspace
    command: >
      go test -v -tags="integration codec_cbor codec_json codec_msgpack"
      -timeout 30m
      ./test/integration/quantum/...
    networks:
      - quantum-test-network

networks:
  quantum-test-network:
    driver: bridge

volumes:
  go-modules:
