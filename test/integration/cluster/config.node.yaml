# xkmsd configuration for cluster integration test nodes.
#
# Per-node identity (node_id, raft_address, listen_address, peers) is supplied
# entirely through XKMS_CLUSTER_* environment variables so this single file
# is mounted read-only on all three nodes. All other settings are shared.

server:
  host: "0.0.0.0"
  rest_port: 8443

protocols:
  rest: true

logging:
  level: "debug"
  format: "json"

# TLS is served with a certificate minted by the node's own embedded CA
# (see the ca block below) — no certificate files are provisioned.
tls:
  enabled: true
  server_cn: "localhost"
  # Request-and-verify client certificates when offered: the harness (and any
  # enrolled operator) authenticates with the first-boot admin mTLS credential.
  client_auth: "verify"

# Adaptive authentication: anonymous until the first user is provisioned, then
# enforced. Satisfies the secure-by-default gate (the daemon has no insecure
# override) without pre-seeding credentials into the cluster fixtures.
auth:
  enabled: true
  type: "composite"

# Encryption-at-rest. There is no config-sourced boot-time secret any more
# (matching go-qrdb's own SealConfig): a software strategy never auto-unseals
# from configuration, so each node now needs an unseal ceremony (or a
# hardware seal strategy) instead of the previous config-sourced passphrase.
# See go-xkms#653.
barrier:
  enabled: true
  strategy: "passphrase"

ratelimit:
  enabled: false

health:
  enabled: true
  path: "/health"

# qrdb storage backend is required for Raft clustering.
datastore:
  engine: pebble
  path: "/data/storage"

default_backend: "pkcs8"

backends:
  pkcs8:
    enabled: true
    path: "/data/keys/pkcs8"
  # The CA root identity below names keystore-type "software", and a standalone
  # node resolves that keystore straight out of the configured backends (only a
  # clustered node routes the CA key through the cluster key-custody strategy
  # instead). There is no "pkcs8" StoreType, so the software backend has to be
  # enabled for the CA to have anywhere to keep its root key.
  software:
    enabled: true
    path: "/data/keys/software"

# Embedded CA. Each node mints its own TLS server certificate from this root,
# so the cluster serves TLS with no externally provisioned key material and
# satisfies the secure-by-default gate.
ca:
  enabled: true
  identity:
    - subject:
        cn: "Cluster Integration Test Root CA"
        organization: "XKMS Integration Tests"
      valid: 10
      keys:
        - algorithm: "ECDSA"
          ecc-curve: "P-256"
          key_type: "CA"
      keystore-type: "software"
      is-root: true
  selected-ca: 0
  default-validity-days: 365
