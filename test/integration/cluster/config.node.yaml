# xkmsd configuration for cluster integration test nodes.
#
# Per-node identity (node_id, raft_address, listen_address, peers) is supplied
# entirely through XKMS_CLUSTER_* environment variables so this single file
# is mounted read-only on all three nodes. All other settings are shared.

server:
  host: "0.0.0.0"
  rest_port: 8443

protocols:
  rest: true

logging:
  level: "debug"
  format: "json"

tls:
  enabled: false

auth:
  enabled: false

ratelimit:
  enabled: false

health:
  enabled: true
  path: "/health"

# qrdb storage backend is required for Raft clustering.
storage:
  backend: "qrdb"
  path: "/data/storage"

default_backend: "pkcs8"

backends:
  pkcs8:
    enabled: true
    path: "/data/keys/pkcs8"
