################################################################################
# 3-node xkmsd cluster integration test harness
#
# All three nodes are built from the same raft-tagged Dockerfile.xkmsd image.
# Per-node Raft identity is injected entirely through XKMS_CLUSTER_* env vars
# so a single config.node.yaml can be mounted read-only on every node.
#
# Cluster layout
#   node1  node_id=1  raft=node1:63001  REST=8443  (bootstraps the shard)
#   node2  node_id=2  raft=node2:63001  REST=8443  (joins via XKMS_CLUSTER_JOIN=true)
#   node3  node_id=3  raft=node3:63001  REST=8443  (joins via XKMS_CLUSTER_JOIN=true)
#
# node1 bootstraps with XKMS_CLUSTER_JOIN=false and a full Peers list so
# go-qrdb forms the shard. node2 and node3 set Join=true and list themselves
# first so they do not attempt to re-bootstrap an existing shard.
#
# The PEERS string lists all three members; ClusterConfig.Members() parses it
# into the replica-ID → address map passed to NewClusteredNode.
################################################################################

services:

  # ---------------------------------------------------------------------------
  # node1: shard bootstrapper
  # ---------------------------------------------------------------------------
  node1:
    build:
      context: ../../..
      dockerfile: test/integration/cluster/Dockerfile.xkmsd
      args:
        - VERSION=${VERSION:-0.0.1-test}
      secrets:
        - gomodauth
    image: go-xkms-cluster-node:${XKMS_IMAGE_TAG:-latest}
    hostname: node1
    # Boot-time cluster formation can outlast a single attempt when sibling
    # nodes lag (image start stagger); retry like systemd would in production.
    restart: on-failure
    volumes:
      - node1-data:/data
      - ./config.node.yaml:/etc/xkms/xkmsd.yaml:ro
      - ./certs:/certs:ro
    # The Raft member identities gen-certs.sh derives from the per-node certs.
    # Optional only so the file loads before gen-certs.sh has run:
    # clean-test-containers tears this project down from a fresh checkout,
    # and a required env file fails every compose command, `down` included.
    # integration-test-cluster always generates it before the stack starts.
    env_file:
      - path: ./certs/cluster.env
        required: false
    environment:
      - XKMS_CONFIG=/etc/xkms/xkmsd.yaml
      - XKMS_LOGGING_LEVEL=debug
      - XKMS_STORAGE_PATH=/data
      # config.node.yaml serves TLS from the node's own embedded CA and enables
      # composite auth, so it passes the secure-by-default gate on its own;
      # cmd/xkmsd refuses any reported gap and has no override.
      # Raft identity for node 1
      - XKMS_CLUSTER_ENABLED=true
      - XKMS_CLUSTER_NODE_ID=1
      - XKMS_CLUSTER_SHARD_ID=1
      - XKMS_CLUSTER_RAFT_ADDRESS=node1:63001
      - XKMS_CLUSTER_LISTEN_ADDRESS=node1:63001
      # Full peer list — node1 bootstraps the shard (Join=false, default).
      - XKMS_CLUSTER_PEERS=1=node1:63001,2=node2:63001,3=node3:63001
      # Raft mTLS (operator-supplied PEM; go-quicraft requires it when the QUIC
      # raft transport is enabled). Per-node cert generated by gen-certs.sh.
      - XKMS_CLUSTER_RAFT_TLS_CA_CERT_FILE=/certs/ca.crt
      - XKMS_CLUSTER_RAFT_TLS_CERT_FILE=/certs/node1.crt
      - XKMS_CLUSTER_RAFT_TLS_KEY_FILE=/certs/node1.key
      - XKMS_CLUSTER_JOIN=false
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "--no-check-certificate", "https://localhost:8443/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - cluster-net

  # ---------------------------------------------------------------------------
  # node2: cluster joiner
  # ---------------------------------------------------------------------------
  node2:
    image: go-xkms-cluster-node:${XKMS_IMAGE_TAG:-latest}
    hostname: node2
    # Boot-time cluster formation can outlast a single attempt when sibling
    # nodes lag (image start stagger); retry like systemd would in production.
    restart: on-failure
    volumes:
      - node2-data:/data
      - ./config.node.yaml:/etc/xkms/xkmsd.yaml:ro
      - ./certs:/certs:ro
    # The Raft member identities gen-certs.sh derives from the per-node certs.
    # Optional only so the file loads before gen-certs.sh has run:
    # clean-test-containers tears this project down from a fresh checkout,
    # and a required env file fails every compose command, `down` included.
    # integration-test-cluster always generates it before the stack starts.
    env_file:
      - path: ./certs/cluster.env
        required: false
    environment:
      - XKMS_CONFIG=/etc/xkms/xkmsd.yaml
      - XKMS_LOGGING_LEVEL=debug
      - XKMS_STORAGE_PATH=/data
      # config.node.yaml serves TLS from the node's own embedded CA and enables
      # composite auth, so it passes the secure-by-default gate on its own;
      # cmd/xkmsd refuses any reported gap and has no override.
      # Raft identity for node 2
      - XKMS_CLUSTER_ENABLED=true
      - XKMS_CLUSTER_NODE_ID=2
      - XKMS_CLUSTER_SHARD_ID=1
      - XKMS_CLUSTER_RAFT_ADDRESS=node2:63001
      - XKMS_CLUSTER_LISTEN_ADDRESS=node2:63001
      - XKMS_CLUSTER_PEERS=1=node1:63001,2=node2:63001,3=node3:63001
      # Raft mTLS (operator-supplied PEM; go-quicraft requires it when the QUIC
      # raft transport is enabled). Per-node cert generated by gen-certs.sh.
      - XKMS_CLUSTER_RAFT_TLS_CA_CERT_FILE=/certs/ca.crt
      - XKMS_CLUSTER_RAFT_TLS_CERT_FILE=/certs/node2.crt
      - XKMS_CLUSTER_RAFT_TLS_KEY_FILE=/certs/node2.key
      - XKMS_CLUSTER_JOIN=false
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "--no-check-certificate", "https://localhost:8443/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      node1:
        condition: service_started
    networks:
      - cluster-net

  # ---------------------------------------------------------------------------
  # node3: cluster joiner
  # ---------------------------------------------------------------------------
  node3:
    image: go-xkms-cluster-node:${XKMS_IMAGE_TAG:-latest}
    hostname: node3
    # Boot-time cluster formation can outlast a single attempt when sibling
    # nodes lag (image start stagger); retry like systemd would in production.
    restart: on-failure
    volumes:
      - node3-data:/data
      - ./config.node.yaml:/etc/xkms/xkmsd.yaml:ro
      - ./certs:/certs:ro
    # The Raft member identities gen-certs.sh derives from the per-node certs.
    # Optional only so the file loads before gen-certs.sh has run:
    # clean-test-containers tears this project down from a fresh checkout,
    # and a required env file fails every compose command, `down` included.
    # integration-test-cluster always generates it before the stack starts.
    env_file:
      - path: ./certs/cluster.env
        required: false
    environment:
      - XKMS_CONFIG=/etc/xkms/xkmsd.yaml
      - XKMS_LOGGING_LEVEL=debug
      - XKMS_STORAGE_PATH=/data
      # config.node.yaml serves TLS from the node's own embedded CA and enables
      # composite auth, so it passes the secure-by-default gate on its own;
      # cmd/xkmsd refuses any reported gap and has no override.
      # Raft identity for node 3
      - XKMS_CLUSTER_ENABLED=true
      - XKMS_CLUSTER_NODE_ID=3
      - XKMS_CLUSTER_SHARD_ID=1
      - XKMS_CLUSTER_RAFT_ADDRESS=node3:63001
      - XKMS_CLUSTER_LISTEN_ADDRESS=node3:63001
      - XKMS_CLUSTER_PEERS=1=node1:63001,2=node2:63001,3=node3:63001
      # Raft mTLS (operator-supplied PEM; go-quicraft requires it when the QUIC
      # raft transport is enabled). Per-node cert generated by gen-certs.sh.
      - XKMS_CLUSTER_RAFT_TLS_CA_CERT_FILE=/certs/ca.crt
      - XKMS_CLUSTER_RAFT_TLS_CERT_FILE=/certs/node3.crt
      - XKMS_CLUSTER_RAFT_TLS_KEY_FILE=/certs/node3.key
      - XKMS_CLUSTER_JOIN=false
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "--no-check-certificate", "https://localhost:8443/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      node1:
        condition: service_started
    networks:
      - cluster-net

  # ---------------------------------------------------------------------------
  # standalone: a single non-clustered qrdb-backed xkmsd — the standalone-server
  # counterpart to the 3-node Raft cluster. It reuses the node image but sets NO
  # XKMS_CLUSTER_* env, so xkmsd hosts an embedded standalone qrdb node.
  # ---------------------------------------------------------------------------
  standalone:
    image: go-xkms-cluster-node:${XKMS_IMAGE_TAG:-latest}
    hostname: standalone
    volumes:
      - standalone-data:/data
      - ./config.node.yaml:/etc/xkms/xkmsd.yaml:ro
    environment:
      - XKMS_CONFIG=/etc/xkms/xkmsd.yaml
      - XKMS_LOGGING_LEVEL=debug
      - XKMS_STORAGE_PATH=/data
      # The suite reaches it as https://standalone:8443. A cluster node's
      # certificate names the node from its Raft address; a standalone node
      # has none, so its service name is configured as a SAN.
      - XKMS_TLS_EXTRA_SANS=standalone
      # `xkmsd init` issues the admin credential from its own one-shot
      # bootstrap CA, so client_auth "verify" accepts it only with init's
      # bundle in the client-CA pool. init writes it beside the credential
      # before the daemon starts (entrypoint below).
      - XKMS_TLS_CLIENT_CAS=/data/storage/ca-bundle.pem
      # Throwaway test SO PIN for `xkmsd init`, which also becomes the
      # passphrase of this server's barrier. It must equal barrierPassphrase
      # in barrier_test.go, which unseals the server with it.
      - XKMS_SO_PIN=xkms-cluster-harness-barrier-passphrase
    # A fresh volume is bootstrapped the supported way, with `xkmsd init`, as
    # the devcontainer's xkms-server is: the sealed window refuses barrier
    # initialization (HTTP 409). init does not refuse a second run (it fails
    # partway, once the admin exists), so the admin credential pair it writes
    # marks the volume as initialized. The PIN reaches init only through its
    # environment, never argv, and is dropped before the daemon starts; the
    # daemon then boots sealed until the suite's TestMain unseals it.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ -f /data/storage/admin-cert.pem ] && [ -f /data/storage/admin-key.pem ]; then
          echo "standalone: admin credential present; volume already initialized"
        else
          /app/xkmsd init --config /etc/xkms/xkmsd.yaml --hostname standalone --admin-factor mtls
        fi
        exec env -u XKMS_SO_PIN /app/xkmsd -config /etc/xkms/xkmsd.yaml
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "--no-check-certificate", "https://localhost:8443/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - cluster-net

  # ---------------------------------------------------------------------------
  # test runner
  # ---------------------------------------------------------------------------
  test:
    build:
      context: ../../..
      dockerfile: test/integration/cluster/Dockerfile.test
      secrets:
        - gomodauth
    image: go-xkms-cluster-test:${XKMS_IMAGE_TAG:-latest}
    # The nodes boot sealed (passphrase barrier) and turn healthy only once
    # unsealed, which is this container's first job (TestMain), so it waits
    # for them to start rather than for health.
    depends_on:
      node1:
        condition: service_started
      node2:
        condition: service_started
      node3:
        condition: service_started
      standalone:
        condition: service_started
    volumes:
      # The resilience (chaos) tests drive docker directly to kill/restart nodes.
      - /var/run/docker.sock:/var/run/docker.sock
      # First-boot admin credentials: the suite authenticates with admin mTLS,
      # reading the generate-and-distribute certificate first boot wrote. The
      # credential lands on whichever node executed first boot, so all three
      # node volumes are visible.
      - node1-data:/node1-data:ro
      - node2-data:/node2-data:ro
      - node3-data:/node3-data:ro
      - standalone-data:/standalone-data:ro
      - go-build-cache:/root/.cache/go-build
    environment:
      - CGO_ENABLED=0
      - GOWORK=off
      - GOPRIVATE=github.com/jeremyhahn/*
      - GIT_CONFIG_COUNT=${GOMODAUTH_GIT_CONFIG_COUNT:-${GITEA_HOST:+1}}
      - GIT_CONFIG_KEY_0=${GOMODAUTH_GIT_CONFIG_KEY_0:-url.http://x:${FORGE_MODULE_TOKEN}@${GITEA_HOST}/jeremyhahn/.insteadOf}
      - GIT_CONFIG_VALUE_0=${GOMODAUTH_GIT_CONFIG_VALUE_0:-https://github.com/jeremyhahn/}
      # Node REST endpoints reachable inside cluster-net.
      - CLUSTER_NODE1_URL=https://node1:8443
      - CLUSTER_NODE2_URL=https://node2:8443
      - CLUSTER_NODE3_URL=https://node3:8443
      # Standalone (non-clustered) node endpoint.
      - CLUSTER_STANDALONE_URL=https://standalone:8443
      # Shard identifier the tests will query for a leader.
      - CLUSTER_SHARD_ID=1
    working_dir: /workspace
    networks:
      - cluster-net

volumes:
  node1-data:
    driver: local
  node2-data:
    driver: local
  node3-data:
    driver: local
  standalone-data:
    driver: local
  go-build-cache:
    driver: local

networks:
  cluster-net:
    driver: bridge

secrets:
  gomodauth:
    file: ../../../build/docker/devcontainer/gomodauth.env
