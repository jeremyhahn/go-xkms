services:
  floci-gcp:
    image: floci/floci-gcp:latest
    environment:
      - GOWORK=off
      - GOPRIVATE=github.com/jeremyhahn/*
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=url.http://x:${GITEA_GO_TOKEN}@198.51.100.91:3001/jeremyhahn/.insteadOf
      - GIT_CONFIG_VALUE_0=https://github.com/jeremyhahn/
      - FLOCI_GCP_DEFAULT_PROJECT_ID=test-project
      - FLOCI_GCP_STORAGE_MODE=memory
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4588/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "0:4588"

  test:
    build:
      context: ../../..
      dockerfile: test/integration/gcpkms/Dockerfile
      secrets:
        - gomodauth
    depends_on:
      floci-gcp:
        condition: service_healthy
    environment:
      - GOOGLE_CLOUD_PROJECT=test-project
      - GCPKMS_EMULATOR_ENDPOINT=floci-gcp:4588
    working_dir: /app

# Staged by `make stage-gomodauth` (dependency-resolution.md §6) into the
# gitignored .devcontainer/gomodauth.env; empty when no Gitea credentials are
# available, in which case the Dockerfile's optional secret mount falls back
# to public module resolution.
secrets:
  gomodauth:
    file: ../../../.devcontainer/gomodauth.env
