services:
  tpm-simulator:
    image: ghcr.io/stefanberger/swtpm:latest
    command:
      - socket
      - --tpmstate
      - dir=/tmp
      - --tpm2
      - --server
      - type=tcp,port=2421,bindaddr=0.0.0.0
      - --ctrl
      - type=tcp,port=2422,bindaddr=0.0.0.0
      - --flags
      - startup-clear
      - --log
      - level=1
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q '[s]wtpm' || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
    ports:
      - "0:2421"
      - "0:2422"

  test:
    build:
      context: ../../..
      dockerfile: test/integration/tpm2/Dockerfile
      secrets:
        - gomodauth
    depends_on:
      tpm-simulator:
        condition: service_healthy
    environment:
      - TPM2_SIMULATOR_HOST=tpm-simulator
      - TPM2_SIMULATOR_PORT=2421
    working_dir: /app

# Staged by `make stage-gomodauth` (dependency-resolution.md §6) into the
# gitignored .devcontainer/gomodauth.env; empty when no Gitea credentials are
# available, in which case the Dockerfile's optional secret mount falls back
# to public module resolution.
secrets:
  gomodauth:
    file: ../../../.devcontainer/gomodauth.env
