services:
  tpm-simulator:
    image: ghcr.io/stefanberger/swtpm:v0.10.0@sha256:303a1998b9ae7ad500146036bb63e1e0703208f788db8741233f0080c3125a78
    command:
      - socket
      - --tpmstate
      - dir=/tmp
      - --tpm2
      - --server
      - type=tcp,port=2421,bindaddr=0.0.0.0
      - --ctrl
      - type=tcp,port=2422,bindaddr=0.0.0.0
      - --flags
      - startup-clear
      - --log
      - level=1
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q '[s]wtpm' || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
    ports:
      - "0:2421"
      - "0:2422"

  test:
    build:
      context: ../../..
      dockerfile: test/integration/Dockerfile.suite
      secrets:
        - gomodauth
    depends_on:
      tpm-simulator:
        condition: service_healthy
    environment:
      - TPM2_SIMULATOR_HOST=tpm-simulator
      - TPM2_SIMULATOR_PORT=2421
    image: go-xkms-integration-suite:${XKMS_IMAGE_TAG:-latest}
    working_dir: /app
    volumes:
      - gocache:/root/.cache/go-build
    command: ["sh", "-c", "echo 'Waiting for TPM simulator to be ready...'; while ! nc -z tpm-simulator 2421; do sleep 1; done; echo 'TPM simulator is ready, running tests...'; go test -v -tags='integration tpm2 codec_cbor codec_json codec_msgpack gms_pure_go' -timeout 30m ./test/integration/tpm2/..."]

volumes:
  gocache:
    external: true
    name: ${XKMS_GOCACHE_VOLUME:-go-xkms-gocache-latest}

# Staged by `make stage-gomodauth` (dependency-resolution.md §6) into the
# gitignored build/docker/devcontainer/gomodauth.env; empty when no Gitea credentials are
# available, in which case the Dockerfile's optional secret mount falls back
# to public module resolution.
secrets:
  gomodauth:
    file: ../../../build/docker/devcontainer/gomodauth.env
