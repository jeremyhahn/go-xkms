services:
  tpm-simulator:
    image: ghcr.io/stefanberger/swtpm:v0.10.0@sha256:303a1998b9ae7ad500146036bb63e1e0703208f788db8741233f0080c3125a78
    command:
      - socket
      - --tpmstate
      - dir=/tmp
      - --tpm2
      - --server
      - type=tcp,port=2421,bindaddr=0.0.0.0
      - --ctrl
      - type=tcp,port=2422,bindaddr=0.0.0.0
      - --flags
      - startup-clear
      - --log
      - level=1
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q '[s]wtpm' || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
    ports:
      - "0:2421"
      - "0:2422"

  test:
    build:
      context: ../../..
      dockerfile: test/integration/tpm2/Dockerfile
      secrets:
        - gomodauth
    depends_on:
      tpm-simulator:
        condition: service_healthy
    environment:
      - TPM2_SIMULATOR_HOST=tpm-simulator
      - TPM2_SIMULATOR_PORT=2421
    working_dir: /app

# Module credentials staged by `make stage-gomodauth`; empty when none are configured.
secrets:
  gomodauth:
    file: ../../../build/docker/devcontainer/gomodauth.env
