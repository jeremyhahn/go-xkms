# Nginx configuration for HTTP-01 E2E testing
# This nginx instance receives the issued certificate and serves HTTPS

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    # HTTP server for health checks (always available)
    server {
        listen 80;
        server_name localhost;

        location /health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 200 "HTTP OK - Waiting for certificate\n";
            add_header Content-Type text/plain;
        }
    }

    # HTTPS server - uses certificate issued by ACME server
    # Only starts when certificates exist
    server {
        listen 443 ssl;
        server_name secure.test.example.com test.example.com localhost;

        # Certificate paths - will be populated by test
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;

        location /health {
            return 200 "HTTPS OK\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 200 "HTTPS OK - Certificate installed successfully\n";
            add_header Content-Type text/plain;
        }
    }
}
