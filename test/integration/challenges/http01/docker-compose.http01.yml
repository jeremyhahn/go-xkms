# Docker Compose configuration for HTTP-01 E2E integration testing
# Tests the complete HTTP-01 challenge flow:
# 1. Client requests certificate from ACME server
# 2. Server validates HTTP-01 challenge by making HTTP request to target
# 3. Certificate is issued and installed on nginx
# 4. TLS connection is verified

services:
  # ACME Server
  acme-server:
    build:
      context: ../../../..
      dockerfile: go-trusted-ca/test/Dockerfile.server
    container_name: http01-acme-server
    networks:
      http01-network:
        aliases:
          - acme-server
    environment:
      ACME_LOG_LEVEL: "debug"
      ACME_EXTERNAL_URL: "http://acme-server:8080"
      GO_ENV: "test"
    ports:
      - "8480:8080"  # Map to 8480 on host to avoid conflicts
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/acme/directory"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 10s
    volumes:
      - acme-data:/app/data

  # Challenge Responder - serves /.well-known/acme-challenge/{token}
  # This simulates the target domain responding to HTTP-01 challenges
  challenge-responder:
    build:
      context: .
      dockerfile: Dockerfile.challenge-responder
    container_name: http01-challenge-responder
    networks:
      http01-network:
        aliases:
          - test.example.com
          - www.test.example.com
    ports:
      - "80:80"
    environment:
      LISTEN_PORT: "80"
    volumes:
      - challenge-tokens:/challenges
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 5s

  # Nginx - receives the issued certificate
  nginx:
    image: nginx:alpine
    container_name: http01-nginx
    networks:
      http01-network:
        aliases:
          - secure.test.example.com
    ports:
      - "443:443"
    volumes:
      - nginx-certs:/etc/nginx/certs
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-entrypoint.sh:/docker-entrypoint.d/99-generate-cert.sh:ro
    depends_on:
      challenge-responder:
        condition: service_healthy
    command: ["sh", "-c", "apk add --no-cache openssl && /docker-entrypoint.d/99-generate-cert.sh"]

  # E2E Test Runner
  http01-e2e-tests:
    build:
      context: ../../../..
      dockerfile: go-trusted-ca/test/integration/http01/Dockerfile.http01-tests
    container_name: http01-e2e-tests
    networks:
      - http01-network
    depends_on:
      acme-server:
        condition: service_healthy
      challenge-responder:
        condition: service_healthy
    environment:
      ACME_SERVER_URL: "http://acme-server:8080"
      CHALLENGE_RESPONDER_URL: "http://challenge-responder:80"
      NGINX_URL: "https://nginx:443"
      NGINX_CERTS_PATH: "/nginx-certs"
      TEST_DOMAIN: "test.example.com"
      GO_TEST_FLAGS: "-v -timeout 5m -run 'TestHTTP01E2E_'"
    volumes:
      - challenge-tokens:/challenges
      - nginx-certs:/nginx-certs

networks:
  http01-network:
    driver: bridge
    name: http01-network

volumes:
  acme-data:
    name: http01-acme-data
  challenge-tokens:
    name: http01-challenge-tokens
  nginx-certs:
    name: http01-nginx-certs
