# Docker Compose stack for the ACME challenge integration suite (make integration-test-challenges).
services:
  acme-server:
    build:
      context: ../../..
      dockerfile: Dockerfile
      secrets:
        - gomodauth
        - apt_proxy
    image: go-xkms-integration-acme-server:${XKMS_IMAGE_TAG:-latest}
    volumes:
      - acme-data:/data
    environment:
      - KEYSTORE_LOG_LEVEL=debug
      - KEYSTORE_DATA_DIR=/data
    command: >
      sh -c "
      set -e &&
      go run ./test/integration/acme-tpm/certgen -cn acme-server -cert /data/acme-tls/acme.crt -key /data/acme-tls/acme.key &&
      exec /app/xkmsd -config /workspace/test/integration/acme-tpm/config.acme-tpm.yaml
      "
    healthcheck:
      test: ["CMD", "curl", "-sfk", "https://localhost:8443/acme/health"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 10s
    networks:
      - challenges-network

  test:
    build:
      context: ../../..
      dockerfile: Dockerfile
      secrets:
        - gomodauth
        - apt_proxy
    image: go-xkms-integration-test:${XKMS_IMAGE_TAG:-latest}
    depends_on:
      acme-server:
        condition: service_healthy
    volumes:
      # Read-only: acme-server writes its certificate before it turns healthy.
      - acme-data:/data:ro
    environment:
      - CGO_ENABLED=1
      - ACME_SERVER_URL=https://acme-server:8443
      # Trust the acme-server's certificate explicitly.
      - ACME_CA_CERT=/data/acme-tls/acme.crt
    working_dir: /workspace
    command: >
      go test -v -tags=integration
      ./test/integration/challenges/enroll01/... ./test/integration/challenges/endorse01/...
      -timeout 10m
    networks:
      - challenges-network

networks:
  challenges-network:
    driver: bridge

volumes:
  acme-data:
    driver: local

secrets:
  gomodauth:
    file: ../../../build/docker/devcontainer/gomodauth.env
  # Optional package caches as BuildKit secrets; empty when unset.
  apt_proxy:
    environment: DEVCACHE_APT_PROXY
