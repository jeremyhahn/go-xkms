# xkmsd configuration for the acmeadmin integration compose stack
# (test/integration/acmeadmin/docker-compose.yml).
#
# Enables the ACME (RFC 8555) server and its admin plane, mounted on the
# unified REST listener (server.rest_port) per cmd/xkmsd/admin.go.
#
# The unified listener's own TLS material is deliberately NOT set here
# (no tls.cert_file/key_file/ca_file): with a CA configured (see `ca:`
# below) and network serving on, pkg/config/config.go's Validate leaves
# them optional, and pkg/server/unified_tls.go's buildUnifiedTLSConfig
# self-issues a node-local bootstrap certificate at boot, then upgrades to
# one signed by the embedded CA once it composes — the same "every node
# mints its serving certificate from its own embedded CA at boot" flow
# test/integration/cluster's TestMain trusts via TOFU
# (test/integration/acmeadmin/main_test.go does the same). The qrdb
# first-boot ceremony (pkg/server/firstboot.go) issues the administrator's
# mTLS client certificate from that same CA, so it verifies once the
# upgrade lands — no operator-supplied client CA needed either.
#
# The ACME (RFC 8555) protocol listener is a separate, dedicated HTTPS
# listener (acme.https_addr below) that xkmsd does NOT CA-back the same
# way; it requires explicit tls.cert_file/key_file
# (pkg/config/acme.go's ErrACMEMissingTLS), generated by
# scripts/generate-test-certs.sh before this config is read. Nothing in
# this suite dials that listener directly.

server:
  host: "0.0.0.0"
  rest_port: 8443

protocols:
  unix: false
  rest: true
  grpc: false
  quic: false
  mcp: false

logging:
  level: "debug"
  format: "json"

tls:
  enabled: true
  # server_cn seeds the key ID buildTLSConfig's CA-backed TLS path derives
  # for the legacy pkg/api/rest module's own certificate
  # (pkg/server/server.go's buildTLSConfig: "attrs.CN = s.config.TLS.ServerCN").
  # Left empty it produces a malformed "backend:type:algo:" key ID (no
  # keyname), which pkg/xkms rejects as ErrInvalidKeyID and that module
  # never composes — matching xkmsd-integration.yaml's own server_cn.
  server_cn: "xkmsd"
  # "verify": the ACME admin plane authenticates every request with an mTLS
  # client certificate (admin.NewMTLSAuthHandler, cmd/xkmsd/admin.go:153) —
  # without this the TLS layer never requests one. VerifyClientCertIfGiven
  # (pkg/server/unified_tls.go's parseClientAuthMode), not
  # RequireAndVerifyClientCert: a request with no client certificate still
  # reaches the handler, and PermissionGate (pkg/acme/admin/authz.go)
  # reports it as 401, not a TLS handshake failure.
  client_auth: "verify"

auth:
  enabled: true
  type: "composite"

barrier:
  enabled: true
  # "none": auto-unseals unattended at startup (pkg/config/config.go's
  # BarrierConfig.NodeFlipWired lists it alongside passphrase/shamir/tpm2,
  # so it still counts as the qrdb node's own barrier for the
  # ComplianceGaps gate). "passphrase"/"shamir" instead defer to an
  # operator-driven unseal behind a sealed-window listener
  # (pkg/server/sealed_window.go) that refuses to bind server.host=0.0.0.0
  # — this compose network needs xkmsd reachable from the test container,
  # and this suite has no unseal-ceremony step, so "none" is what lets a
  # fresh node come up ready without inventing one.
  strategy: "none"

ratelimit:
  enabled: false

health:
  enabled: true
  path: "/health"

storage:
  backend: "qrdb"
  path: "/data/storage"

rng:
  mode: "software"
  fallback_mode: "software"

default_backend: "software"

backends:
  software:
    enabled: true
    path: "/data/keys"

ca:
  identity:
    - subject:
        cn: "acmeadmin Integration Test Root CA"
        organization: "go-xkms Integration Tests"
        country: "US"
      valid: 10
      keys:
        - algorithm: "ECDSA"
          ecc:
            curve: "P-256"
          hash: "SHA-256"
          signature-algorithm: "ECDSAWithSHA256"
          store: "software"
          key-type: "CA"
      keystore-type: "software"
      is-root: true
      max-path-length: 1
  selected-ca: 0
  default-validity-days: 365
  include-localhost-sans: true
  home-dir: "/data/ca"

# The ACME (RFC 8555) certificate authority. Enabling it is what makes
# cmd/xkmsd/main.go call finalizeAdminModule (cmd/xkmsd/admin.go:130),
# which is what publishes the ACME admin REST routes this suite drives.
acme:
  enabled: true
  https_addr: ":8444"
  external_url: "https://xkmsd:8444"
  keystore_backend: "software"
  data_dir: "/data/acme"
  caa_identities:
    - "ca.kms.example.com"
  challenges:
    http01: true
  tls:
    cert_file: "/etc/xkms/certs/server.crt"
    key_file: "/etc/xkms/certs/server.key"
