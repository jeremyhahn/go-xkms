services:
  # xkmsd with the ACME server and its admin plane enabled (xkmsd.yaml).
  xkmsd:
    build:
      context: ../../..
      # Dockerfile.xkmsd adds the codec build tag the qrdb-backed admin plane needs.
      dockerfile: test/integration/acmeadmin/Dockerfile.xkmsd
      secrets:
        - gomodauth
    image: go-xkms-acmeadmin:${XKMS_IMAGE_TAG:-latest}
    volumes:
      - xkmsd-data:/data
      - xkmsd-certs:/etc/xkms/certs
      - ./xkmsd.yaml:/etc/xkms/xkmsd.yaml:ro
      - ./scripts:/scripts:ro
    environment:
      - XKMS_CONFIG=/etc/xkms/xkmsd.yaml
      - XKMS_LOGGING_LEVEL=debug
    healthcheck:
      # No --ca-certificate: the listener's certificate comes from the embedded CA.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "--no-check-certificate", "https://localhost:8443/health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s
    networks:
      - acmeadmin-net
    user: root
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /etc/xkms/certs /data
        echo "Generating TLS certificates..."
        /scripts/generate-test-certs.sh
        echo "Starting xkmsd..."
        exec /app/xkmsd

  # Integration test runner for the CLI-driven ACME admin suite.
  test:
    build:
      context: ../../..
      dockerfile: test/integration/acmeadmin/Dockerfile.test
      secrets:
        - gomodauth
    depends_on:
      xkmsd:
        condition: service_healthy
    volumes:
      # Read-only; TestMain reads the first-boot admin credential from here.
      - xkmsd-data:/data:ro
      - go-build-cache:/root/.cache/go-build
    environment:
      - CGO_ENABLED=1
      - XKMSCTL_ACME_SERVER=https://xkmsd:8443
      - XKMSCTL_ACME_TRANSPORT=rest
      - XKMSCTL_SERVER=https://xkmsd:8443
      - XKMSCTL_TRANSPORT=rest
      # TestMain sets the TLS settings after fetching the CA and the admin credential.
      - XKMSCTL_ADMIN_CRED_DIR=/data/storage
      - XKMSCTL_BINARY=/usr/local/bin/xkmsctl
    working_dir: /workspace
    networks:
      - acmeadmin-net
    command: >
      sh -c "
      go test -v -tags='integration' ./test/integration/acmeadmin/... -timeout 10m
      "

volumes:
  xkmsd-data:
    driver: local
  xkmsd-certs:
    driver: local
  go-build-cache:
    driver: local

networks:
  acmeadmin-net:
    driver: bridge

secrets:
  gomodauth:
    file: ../../../build/docker/devcontainer/gomodauth.env
