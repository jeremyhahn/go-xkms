# Integration test configuration for xkms server
# Enables ALL protocols for comprehensive testing

server:
  host: "0.0.0.0"
  rest_port: 8443
  grpc_port: 9443
  quic_port: 8444
  mcp_port: 9444

# Enable ALL protocols for complete integration testing
protocols:
  unix: true    # Unix domain socket for local CLI
  rest: true    # REST/HTTP API
  grpc: true    # gRPC API
  quic: true    # QUIC/HTTP3 API (requires TLS)
  mcp: true     # MCP JSON-RPC API

# Unix socket configuration
unix:
  socket_path: /var/run/xkms/xkms.sock

logging:
  level: "debug"
  format: "json"

# TLS enabled for QUIC (QUIC requires TLS 1.3)
tls:
  enabled: true
  cert_file: /etc/xkms/certs/server.crt
  key_file: /etc/xkms/certs/server.key
  ca_file: /etc/xkms/certs/ca.crt
  min_version: TLS1.3
  # "request" asks every client for its certificate without chain-verifying
  # it in the handshake: "none" sends no CertificateRequest, so the client
  # never presents one (RFC 8446 §4.4.2) and every call is anonymous.
  client_auth: request

# Composite authentication admits no anonymous caller (the adaptive mode was
# removed). The suite authenticates with the admin mTLS credential that
# `xkmsd init --admin-factor mtls` writes to /data/xkms; the auth chain, not
# the handshake, checks that certificate (the SPKI thumbprint bound to the
# admin user), as test/integration/initceremony does.
auth:
  enabled: true
  type: "composite"

# WebAuthn/FIDO2 authentication enabled for integration tests
webauthn:
  enabled: true
  rp_id: "localhost"
  rp_origins:
    - "http://localhost:8443"
    - "https://localhost:8443"
  rp_display_name: "xKMS Integration Tests"
  attestation_preference: "none"
  authenticator_attachment: ""
  resident_key: "preferred"
  user_verification: "preferred"
  # Registration is closed by default (go-xkms#184); the suite creates its
  # users through open sign-up, so opt in explicitly.
  allow_public_registration: true

ratelimit:
  enabled: false

metrics:
  enabled: true
  path: "/metrics"
  port: 9090

health:
  enabled: true
  path: "/health"

# Storage configuration
datastore:
  engine: file
  path: "/data/xkms"

# Certificate Authority configuration
ca:
  enabled: true
  identity:
    - subject:
        cn: "Integration Test Root CA"
        organization: "XKMS Integration Tests"
      valid: 10
      keys:
        - algorithm: "ECDSA"
          ecc-curve: "P-256"
          key_type: "CA"
      keystore-type: "software"
      is-root: true
  selected-ca: 0
  default-validity-days: 365

# Default backend for key operations
default_backend: "software"

# Backend configurations
backends:
  software:
    enabled: true
    path: "/data/xkms/software"

  tpm2:
    enabled: true  # swtpm simulator container is provisioned by docker-compose
    use_simulator: true
    simulator_host: "swtpm"
    simulator_port: 2321

  pkcs11:
    # PKCS#11 loads in-process: the server container's own SoftHSM2 install
    # is used (Debian path); the token is initialized by the entrypoint.
    # No pin: backends.pkcs11.pin is a protected secret target (go-xkms#654)
    # that refuses a literal, so the entrypoint seals the token PIN with
    # `xkmsd seal-pkcs11-pin` and the backend releases it from the
    # TPM-backed pre-barrier store.
    enabled: true
    library: "/usr/lib/softhsm/libsofthsm2.so"
    token: "test-token"

# Encryption-at-rest. Required by the secure-by-default gate (the daemon has
# no insecure override). There is no config-sourced boot-time secret any more
# (matching go-qrdb's own SealConfig): storage.backend is "file" below, so
# xkmsd's ComplianceGaps gate does not require auto-unseal here, but the
# barrier itself stays sealed until an unseal ceremony runs against it.
barrier:
  enabled: true
  strategy: "passphrase"
  # The barrier boots sealed and the node serves its sealed window on
  # server.host, which must stay 0.0.0.0 so the integration-tests container
  # can dial xkms-server over the compose network; the node refuses that bind
  # and xkmsd exits at startup unless this is set. Acceptable only because
  # this is a throwaway per-run test server on the run's private compose
  # network, guarding a disposable data volume. Same precedent as
  # configs/xkmsd-integration.yaml; a deployment binds the window to loopback
  # or a trusted management interface.
  sealed_window_allow_remote: true
