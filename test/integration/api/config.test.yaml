# Integration test configuration for xkms server
# Enables ALL protocols for comprehensive testing

server:
  host: "0.0.0.0"
  rest_port: 8443
  grpc_port: 9443
  # QUIC is HTTP/3 on the REST port (pkg/server: "http3 on rest_port"), so
  # the listener is 8443/udp, which docker-compose.yml exposes and
  # KEYSTORE_QUIC_URL targets; quic_port names the same port.
  quic_port: 8443
  mcp_port: 9444

# Enable ALL protocols for complete integration testing
protocols:
  unix: true    # Unix domain socket for local CLI
  rest: true    # REST/HTTP API
  grpc: true    # gRPC API
  quic: true    # QUIC/HTTP3 API (requires TLS)
  mcp: true     # MCP JSON-RPC API

# Unix socket configuration
unix:
  socket_path: /var/run/xkms/xkms.sock

logging:
  level: "debug"
  format: "json"

# TLS enabled for QUIC (QUIC requires TLS 1.3)
tls:
  enabled: true
  cert_file: /etc/xkms/certs/server.crt
  key_file: /etc/xkms/certs/server.key
  ca_file: /etc/xkms/certs/ca.crt
  min_version: TLS1.3
  # verify requests a client certificate (the init admin's mTLS credential) without requiring one.
  client_auth: verify
  # xkmsd init issues the admin credential from this bundle's CA, beside the credential.
  client_cas:
    - "/data/storage/ca-bundle.pem"

# Adaptive authentication: anonymous until the first user is provisioned, then
# enforced. This keeps the integration suites able to exercise the API without
# pre-seeding credentials while still satisfying the secure-by-default gate
# (the daemon has no insecure override).
auth:
  enabled: true
  type: "composite"
  # The suites run every login and ceremony from one address within seconds; the limiter stays on.
  session:
    login_rate_per_min: 6000

# WebAuthn/FIDO2 authentication enabled for integration tests
webauthn:
  enabled: true
  rp_id: "localhost"
  rp_origins:
    - "http://localhost:8443"
    - "https://localhost:8443"
  rp_display_name: "xKMS Integration Tests"
  attestation_preference: "none"
  authenticator_attachment: ""
  resident_key: "preferred"
  user_verification: "preferred"
  # Registration is closed by default (go-xkms#184). Even opted in, an
  # enforcing node refuses anonymous sign-up with 403 registration_refused
  # (ruling 602, pending #2202); the suite proves that and provisions its
  # accounts as admin, redeeming each invitation with a passkey.
  allow_public_registration: true

# Submitted credentials persist in the barrier, so the PKCS#11 PIN survives a restart.
credentials:
  seal_strategy: "barrier"

ratelimit:
  enabled: false

metrics:
  enabled: true
  path: "/metrics"
  port: 9090

health:
  enabled: true
  path: "/health"

# Storage configuration
datastore:
  engine: file
  path: "/data/storage"

# Certificate Authority configuration
ca:
  enabled: true
  identity:
    - subject:
        cn: "Integration Test Root CA"
        organization: "XKMS Integration Tests"
      valid: 10
      keys:
        - algorithm: "ECDSA"
          ecc-curve: "P-256"
          key_type: "CA"
      keystore-type: "software"
      is-root: true
  selected-ca: 0
  default-validity-days: 365

# Default backend for key operations
default_backend: "software"

# Backend configurations
backends:
  software:
    enabled: true
    path: "/data/xkms/software"

  tpm2:
    enabled: true  # swtpm simulator container is provisioned by docker-compose
    use_simulator: true
    simulator_host: "swtpm"
    simulator_port: 2321

  pkcs11:
    # PKCS#11 loads in-process: the server container's own SoftHSM2 install
    # is used (Debian path); the token is initialized by the entrypoint.
    enabled: true
    library: "/usr/lib/softhsm/libsofthsm2.so"
    token: "test-token"
    # A protected target: scripts/start-xkms-server.sh submits this credential on first boot.
    pin: "credential://pkcs11-user-pin"

# Encryption-at-rest. Required by the secure-by-default gate (the daemon has
# no insecure override). There is no config-sourced boot-time secret any more
# (matching go-qrdb's own SealConfig): storage.backend is "file" below, so
# xkmsd's ComplianceGaps gate does not require auto-unseal here, but the
# barrier itself stays sealed until an unseal ceremony runs against it.
barrier:
  enabled: true
  strategy: "passphrase"
  # The test containers dial xkms-server over the compose network, so the window binds 0.0.0.0 too.
  sealed_window_allow_remote: true
