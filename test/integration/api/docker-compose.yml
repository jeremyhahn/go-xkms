services:
  # Keystore server with all protocols enabled
  xkms-server:
    build:
      context: ../../..
      dockerfile: Dockerfile
      args:
        - VERSION=${VERSION:-0.0.1-alpha}
      secrets:
        - gomodauth
    image: go-xkms-integration:${XKMS_IMAGE_TAG:-latest}
    # Ports are exposed but NOT published to the host. A published host port
    # is host-global, so publishing would make this stack collide with the
    # devcontainer's and with any other CI job running this same suite. Test
    # containers reach each other by compose SERVICE name over the project
    # network (xkms-server:8443, etc.), which needs no host publication and is
    # scoped to the project -- so two runs can serve :8443 side by side.
    expose:
      - "8443/tcp"   # REST API (HTTP/2 over TCP)
      - "8443/udp"   # QUIC/HTTP3 on the unified REST port (Alt-Svc h3)
      - "9443"       # gRPC
      - "9444"       # MCP
      - "9090"       # Metrics
    # Required for QUIC UDP buffer settings
    privileged: true
    volumes:
      - xkms-data:/data
      - xkms-socket:/var/run/xkms
      - xkms-certs:/etc/xkms/certs
    # The config and the cert script are read from the source tree the image
    # COPYs into /workspace, not bind-mounted: on the CI runner the docker
    # daemon resolves bind-mount sources on its own host, which lacks the
    # job's checkout (DS-4181).
    environment:
      - XKMS_CONFIG=/workspace/test/integration/api/config.test.yaml
      # The config enables the passphrase barrier, so the server boots sealed
      # and serves only its sealed window. The SO PIN is the barrier
      # passphrase: `xkmsd init` (entrypoint) consumes it, and the
      # integration-tests service unseals with the same value. The daemon
      # itself is started without it, as in the devcontainer stack.
      - XKMS_SO_PIN=${XKMS_TEST_SO_PIN:-xkms-integration-test-so-pin}
      - KEYSTORE_LOG_LEVEL=debug
      - KEYSTORE_DATA_DIR=/data
      # TPM configuration
      - XKMS_BACKENDS_TPM2_DEVICE_PATH=tcp://swtpm:2321
      - TPM_USE_SIMULATOR=true
      # PKCS#11 configuration (in-process SoftHSM2 in THIS container;
      # token initialized by the entrypoint)
      - XKMS_BACKENDS_PKCS11_LIBRARY=/usr/lib/softhsm/libsofthsm2.so
      - SOFTHSM2_CONF=/etc/softhsm/softhsm2.conf
      # Certificate directory
      - CERT_DIR=/etc/xkms/certs
    depends_on:
      swtpm:
        condition: service_healthy
      softhsm:
        condition: service_healthy
    # Ready means "up and serving its sealed window", not unsealed: /health
    # answers 503 until the barrier is opened, so the healthcheck follows the
    # devcontainer stack and checks for the unix socket the sealed window
    # binds. integration-tests then unseals and waits for /health itself.
    healthcheck:
      test: ["CMD", "test", "-S", "/var/run/xkms/xkms.sock"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - xkms-integration
    # Run as root for integration tests (allows cert generation and UDP buffer config)
    user: root
    entrypoint:
      - /bin/sh
      - -c
      - |
        # Set UDP buffer sizes for QUIC
        echo "Configuring UDP buffers for QUIC..."
        echo 2500000 > /proc/sys/net/core/rmem_max 2>/dev/null || echo "Warning: Could not set rmem_max"
        echo 2500000 > /proc/sys/net/core/wmem_max 2>/dev/null || echo "Warning: Could not set wmem_max"
        cat /proc/sys/net/core/rmem_max || true
        # Ensure directories exist
        mkdir -p /etc/xkms/certs /var/run/xkms /data
        # Generate TLS certificates for QUIC
        echo "Generating TLS certificates..."
        /workspace/test/integration/api/scripts/generate-test-certs.sh
        # Verify certificates were created
        ls -la /etc/xkms/certs/
        # Initialize the in-process SoftHSM2 token (idempotent) — the pkcs11
        # backend loads libsofthsm2.so in THIS container, not the sidecar.
        mkdir -p /var/lib/softhsm/tokens
        softhsm2-util --show-slots | grep -q "test-token" || \
          softhsm2-util --init-token --free --label test-token --so-pin 123456 --pin 123456
        # Initialize the barrier and the admin mTLS credential once; the
        # sealed window refuses barrier initialization.
        if [ -f /data/xkms/admin-cert.pem ] && [ -f /data/xkms/admin-key.pem ]; then
          echo "Barrier already initialized; reusing the admin credential"
        else
          /app/xkmsd init --config /workspace/test/integration/api/config.test.yaml --hostname xkms-server --admin-factor mtls
        fi
        echo "Starting xkms server..."
        exec env -u XKMS_SO_PIN /app/xkmsd

  # SWTPM TPM 2.0 Simulator
  swtpm:
    build:
      context: ../../../test/docker/swtpm
      dockerfile: Dockerfile
    image: go-xkms-swtpm:${XKMS_IMAGE_TAG:-latest}
    expose:
      - "2321"  # TPM command port
      - "2322"  # TPM control port
    volumes:
      - swtpm-data:/var/lib/swtpm/tpmstate
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2321"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - xkms-integration

  # SoftHSM PKCS#11 Service
  softhsm:
    build:
      context: ../../../test/docker/softhsm
      dockerfile: Dockerfile
      # The SoftHSM pin (scripts/build-softhsm.sh, go-xkms#1418).
      additional_contexts:
        softhsm-pin: ../../../scripts
    image: go-xkms-softhsm:${XKMS_IMAGE_TAG:-latest}
    volumes:
      - softhsm-tokens:/tokens
    environment:
      - SOFTHSM2_CONF=/home/softhsm/softhsm2.conf
      - PKCS11_LIBRARY=/usr/local/lib/softhsm/libsofthsm2.so
    healthcheck:
      test: ["CMD", "test", "-f", "/usr/local/lib/softhsm/libsofthsm2.so"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - xkms-integration

  # Integration test runner
  integration-tests:
    build:
      context: ../../..
      dockerfile: Dockerfile
      secrets:
        - gomodauth
    image: go-xkms-integration:${XKMS_IMAGE_TAG:-latest}
    # Required for QUIC UDP buffer settings
    privileged: true
    user: root
    depends_on:
      xkms-server:
        condition: service_healthy
    # Runs from the source tree baked into the image's /workspace (DS-4181).
    volumes:
      - xkms-socket:/var/run/xkms
      - xkms-certs:/etc/xkms/certs:ro
      - cli-build:/app/build
      - go-cache:/root/go
      - go-build-cache:/root/.cache/go-build
    environment:
      - CGO_ENABLED=1
      - GOWORK=off
      - GOPRIVATE=github.com/jeremyhahn/*
      - GIT_CONFIG_COUNT=${GOMODAUTH_GIT_CONFIG_COUNT:-${GITEA_HOST:+1}}
      - GIT_CONFIG_KEY_0=${GOMODAUTH_GIT_CONFIG_KEY_0:-url.http://x:${GITEA_GO_TOKEN}@${GITEA_HOST}/jeremyhahn/.insteadOf}
      - GIT_CONFIG_VALUE_0=${GOMODAUTH_GIT_CONFIG_VALUE_0:-https://github.com/jeremyhahn/}
      # Server endpoints (all use TLS now)
      - KEYSTORE_UNIX_SOCKET=/var/run/xkms/xkms.sock
      - KEYSTORE_REST_URL=https://xkms-server:8443
      - KEYSTORE_GRPC_ADDR=xkms-server:9443
      - KEYSTORE_QUIC_URL=https://xkms-server:8443
      - KEYSTORE_MCP_ADDR=xkms-server:9444
      - KEYSTORE_CLI_BIN=/app/build/bin/xkmsctl
      # TLS configuration - use CA certificate for proper verification
      - KEYSTORE_TLS_CA=/etc/xkms/certs/ca.crt
      - XKMS_SERVER_BARRIER_SECRET=${XKMS_TEST_SO_PIN:-xkms-integration-test-so-pin}
      # Test configuration
      - INTEGRATION_TIMEOUT=60s
      - GO_TEST_FLAGS=-v -tags=integration,frost
      # The xkmsctl frost share verbs encrypt their wrapping key under this
      # passphrase (go-xkms#1324); the CLI subprocesses inherit it.
      - XKMS_FROST_PASSPHRASE=frost-integration-passphrase
    working_dir: /workspace
    networks:
      - xkms-integration
    # The entrypoint unseals the server before any command, so a Makefile
    # runner's own command tests an unsealed server too.
    entrypoint: ["sh", "./test/integration/api/entrypoint.sh"]
    command: >
      sh -c "
      echo 'Configuring UDP buffers for QUIC...' &&
      echo 2500000 > /proc/sys/net/core/rmem_max 2>/dev/null || echo 'Warning: Could not set rmem_max' &&
      echo 2500000 > /proc/sys/net/core/wmem_max 2>/dev/null || echo 'Warning: Could not set wmem_max' &&
      echo 'Checking Unix socket...' &&
      ls -la /var/run/xkms/ || true &&
      echo 'Checking TLS certificates...' &&
      ls -la /etc/xkms/certs/ || true &&
      echo 'Building CLI binary...' &&
      mkdir -p /app/build/bin &&
      CGO_ENABLED=0 go build -buildvcs=false -tags='frost gms_pure_go' -o /app/build/bin/xkmsctl ./cmd/xkmsctl &&
      echo 'Running integration tests...' &&
      go test -v -tags=integration,frost,codec_cbor,codec_json,codec_msgpack ./test/integration/api/... -timeout 15m
      "

volumes:
  xkms-data:
    driver: local
  xkms-socket:
    driver: local
  xkms-certs:
    driver: local
  softhsm-tokens:
    driver: local
  swtpm-data:
    driver: local
  cli-build:
    driver: local
  go-cache:
    driver: local
  go-build-cache:
    driver: local

networks:
  xkms-integration:
    driver: bridge

secrets:
  gomodauth:
    file: ../../../build/docker/devcontainer/gomodauth.env
