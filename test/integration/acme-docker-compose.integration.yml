# Docker Compose for Integration Testing
# Uses the devcontainer image with all backend dependencies
# Tests CA with: software, tpm2, pkcs11, awskms, gcpkms, azurekv, vault

services:
  # ACME Server
  acme-server:
    build:
      context: ../../..
      dockerfile: go-trusted-ca/test/Dockerfile.server
      additional_contexts:
        go-quicraft: /home/jhahn/sources/go-quicraft
        go-qrdb: /home/jhahn/sources/go-qrdb
    container_name: acme-integration-server
    networks:
      - integration-network
    environment:
      ACME_LOG_LEVEL: debug
    ports:
      - "18443:8443"      # ACME (HTTPS) - use alternate port to avoid conflicts
      - "19443:9443"      # Admin REST
      - "19444:9444"      # Admin gRPC
      - "19445:9445"      # Admin QUIC
      - "19446:9446"      # Admin MCP
    healthcheck:
      test: ["CMD", "curl", "-sf", "-k", "https://localhost:8443/health"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 10s
    volumes:
      - server-data:/app/data
      - unix-socket:/run

  # Integration Tests - uses devcontainer with all dependencies
  integration-tests:
    build:
      context: ../../..
      dockerfile: go-trusted-ca/.devcontainer/Dockerfile
    container_name: acme-integration-tests
    networks:
      - integration-network
    depends_on:
      acme-server:
        condition: service_healthy
    environment:
      ACME_SERVER_URL: https://acme-server:8443
      ACME_SERVER_BASE_URL: https://acme-server:8443
      ACME_ADMIN_BASE_URL: https://acme-server:9443
      ACME_SERVER_TLS_INSECURE: "true"
      WORKSPACE_DIR: /workspace/go-trusted-ca
      TEST_LOGS_DIR: /var/log/tests
      CGO_ENABLED: "1"
      # TPM
      TPM_STATE_DIR: /tpm
      TPM_SOCKET_HOST: localhost
      TPM_SOCKET_PORT: "2321"
      TPM_CTRL_PORT: "2322"
      TPM2TOOLS_TCTI: "swtpm:host=localhost,port=2321"
      # PKCS11
      PKCS11_MODULE: /usr/lib/softhsm/libsofthsm2.so
      SOFTHSM2_CONF: /etc/softhsm/softhsm2.conf
      SOFTHSM_SO_PIN: "12345678"
      SOFTHSM_USER_PIN: "87654321"
      SOFTHSM_TOKEN_LABEL: TrustedCA
      # Vault
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_TOKEN: dev-root-token
      # Admin API - enable multi-protocol tests
      # Note: Using HTTPS with InsecureSkipVerify for integration tests
      TRUSTED_CA_ADMIN_API_ENABLED: "true"
      TRUSTED_CA_REST_URL: https://acme-server:9443
      TRUSTED_CA_GRPC_ADDR: acme-server:9444
      TRUSTED_CA_QUIC_ADDR: acme-server:9445
      TRUSTED_CA_MCP_ADDR: acme-server:9446
      TRUSTED_CA_GRPC_UNIX_PATH: /run/trusted-ca-grpc.sock
      TRUSTED_CA_HTTP_UNIX_PATH: /run/trusted-ca-rest.sock
      TRUSTED_CA_TLS_INSECURE: "true"
      # cactl CLI configuration
      CACTL_BINARY: /workspace/go-trusted-ca/bin/cactl
      CACTL_TRANSPORT: rest
      CACTL_ADDRESS: https://acme-server:9443
      CACTL_TLS_INSECURE: "true"
      # Transport matrix test addresses
      CACTL_REST_ADDR: https://acme-server:9443
      CACTL_GRPC_ADDR: acme-server:9444
      CACTL_QUIC_ADDR: acme-server:9445
      CACTL_MCP_ADDR: acme-server:9446
      CACTL_UNIX_PATH: /run/trusted-ca-rest.sock
      # Test flags - include grpc tag for full protocol coverage
      GO_TEST_FLAGS: "-v -timeout 10m -count=1"
    volumes:
      - ../..:/workspace/go-trusted-ca
      - ../../../go-xkms:/workspace/go-xkms
      - ../../../go-objstore:/workspace/go-objstore
      - ../../../go-tpm:/workspace/go-tpm
      - ../../../go-codec:/workspace/go-codec
      - /home/jhahn/sources/go-quicraft:/workspace/go-quicraft
      - /home/jhahn/sources/go-qrdb:/workspace/go-qrdb
      - test-results:/test-results
      - test-logs:/var/log/tests
      - tpm-state:/tpm
      - unix-socket:/run
    working_dir: /workspace/go-trusted-ca
    command: /workspace/go-trusted-ca/test/scripts/run-backend-integration-tests.sh

networks:
  integration-network:
    driver: bridge

volumes:
  server-data:
  test-results:
  test-logs:
  tpm-state:
  unix-socket:
