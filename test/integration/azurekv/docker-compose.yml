services:
  test:
    build:
      context: ../../..
      dockerfile: test/integration/azurekv/Dockerfile
    environment:
      # No AZURE_KEYVAULT_ENDPOINT - use mock client
      - AZURE_TENANT_ID=test-tenant
      - AZURE_CLIENT_ID=test-client
      - AZURE_CLIENT_SECRET=test-secret
    volumes:
      - ../../..:/app
      # Sibling module mounts (for go.mod replace directives)
      - ../../../../go-qrdb:/go-qrdb:cached
      - ../../../../go-quicraft:/go-quicraft:cached
      - ../../../../go-objstore:/go-objstore:cached
      - ../../../../go-truststrap:/go-truststrap:cached
      - ../../../../go-codec:/go-codec:cached
      - ../../../../go-frost:/go-frost:cached
    working_dir: /app

networks:
  default:
    name: xkms-azurekv-test
