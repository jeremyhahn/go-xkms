services:
  test:
    build:
      context: ../../..
      dockerfile: test/integration/azurekv/Dockerfile
      secrets:
        - gomodauth
    environment:
      # No AZURE_KEYVAULT_ENDPOINT - use mock client
      - AZURE_TENANT_ID=test-tenant
      - AZURE_CLIENT_ID=test-client
      - AZURE_CLIENT_SECRET=test-secret
    working_dir: /app

# Module credentials staged by `make stage-gomodauth`; empty when none are configured.
secrets:
  gomodauth:
    file: ../../../build/docker/devcontainer/gomodauth.env
