services:
  frost-test:
    build:
      context: ../../..
      dockerfile: test/integration/frost/Dockerfile
    environment:
      - GOWORK=off
      - GOPRIVATE=github.com/jeremyhahn/*
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=url.http://x:${GITEA_GO_TOKEN}@git.example.internal/jeremyhahn/.insteadOf
      - GIT_CONFIG_VALUE_0=https://github.com/jeremyhahn/
      - GO111MODULE=on
      - CGO_ENABLED=0
    volumes:
      - ../../../:/workspace
      - go-modules:/go/pkg/mod
    working_dir: /workspace
    command: >
      go test -v -tags="integration frost codec_cbor codec_json codec_msgpack"
      -timeout 30m
      ./test/integration/frost/...
    networks:
      - frost-test-network

networks:
  frost-test-network:
    driver: bridge

volumes:
  go-modules:
