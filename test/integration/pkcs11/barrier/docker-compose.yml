# TPM-sealed PKCS#11 barrier PIN (go-xkms#811): `make integration-test-pkcs11-barrier`.
#
# One swtpm runs for the whole test and outlives every xkmsd the test starts,
# so an xkmsd restart sees the TPM state a reboot would. The test service is
# the SoftHSM 2.7.0 image from ../Dockerfile; the test provisions its own
# token, so the image's token-initializing CMD is replaced by the Makefile.
services:
  tpm-simulator:
    image: ghcr.io/stefanberger/swtpm:v0.10.0@sha256:303a1998b9ae7ad500146036bb63e1e0703208f788db8741233f0080c3125a78
    command:
      - socket
      - --tpmstate
      - dir=/tmp
      - --tpm2
      - --server
      - type=tcp,port=2421,bindaddr=0.0.0.0
      - --ctrl
      - type=tcp,port=2422,bindaddr=0.0.0.0
      - --flags
      - startup-clear
      - --log
      - level=1
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q '[s]wtpm' || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  test:
    build:
      context: ../../../..
      dockerfile: test/integration/pkcs11/Dockerfile
      secrets:
        - gomodauth
    depends_on:
      tpm-simulator:
        condition: service_healthy
    environment:
      - TPM2_SIMULATOR_HOST=tpm-simulator
      - TPM2_SIMULATOR_PORT=2421
    working_dir: /app

# Staged by `make stage-gomodauth` (dependency-resolution.md §6) into the
# gitignored build/docker/devcontainer/gomodauth.env; empty when no Gitea credentials are
# available, in which case the Dockerfile's optional secret mount falls back
# to public module resolution.
secrets:
  gomodauth:
    file: ../../../../build/docker/devcontainer/gomodauth.env
