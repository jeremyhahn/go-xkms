services:
  test:
    build:
      context: ../../..
      dockerfile: test/integration/pkcs11/Dockerfile
      secrets:
        - gomodauth
    environment:
      - PKCS11_MODULE=/usr/lib/softhsm/libsofthsm2.so
      - PKCS11_TOKEN_LABEL=test-token
      - PKCS11_PIN=1234
    volumes:
      - softhsm-data:/var/lib/softhsm
    working_dir: /app

volumes:
  softhsm-data:

# Module credentials staged by `make stage-gomodauth`; empty when none are configured.
secrets:
  gomodauth:
    file: ../../../build/docker/devcontainer/gomodauth.env
