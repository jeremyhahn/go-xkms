services:
  test:
    build:
      context: ../../..
      dockerfile: test/integration/pkcs11/Dockerfile
    environment:
      - GOWORK=off
      - GOPRIVATE=github.com/jeremyhahn/*
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=url.http://x:${GITEA_GO_TOKEN}@198.51.100.91:3001/jeremyhahn/.insteadOf
      - GIT_CONFIG_VALUE_0=https://github.com/jeremyhahn/
      - PKCS11_MODULE=/usr/lib/softhsm/libsofthsm2.so
      - PKCS11_TOKEN_LABEL=test-token
      - PKCS11_PIN=1234
    volumes:
      - ../../..:/app
      - softhsm-data:/var/lib/softhsm
    working_dir: /app

volumes:
  softhsm-data:

networks:
  default:
    name: xkms-pkcs11-test
