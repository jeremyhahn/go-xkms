services:
  # xKMS server with REST + Noise bootstrap enabled.
  #
  # The REST (8443) and Noise (8445) ports are published to the host so
  # this compose can double as an interactive dev backend for the xkey
  # desktop app. The mappings can be overridden via the XKMS_HOST_REST_PORT
  # and XKMS_HOST_NOISE_PORT env vars if those ports are already in use
  # locally. When running the integration tests the publish is harmless;
  # the test runner container reaches the server via bootstrap-net.
  xkms-server:
    build:
      context: ../../..
      dockerfile: Dockerfile
      args:
        - VERSION=${VERSION:-0.0.1-alpha}
      secrets:
        - gomodauth
    image: go-xkms-bootstrap:${XKMS_IMAGE_TAG:-latest}
    ports:
      - "${XKMS_HOST_REST_PORT:-0}:8443"
      - "${XKMS_HOST_NOISE_PORT:-0}:8445"
    volumes:
      - xkms-data:/data
      - xkms-certs:/etc/xkms/certs
      - ./scripts:/scripts:ro
    environment:
      # This suite exercises the bootstrap trust protocol (Noise handshake, SPKI
      # pin, admin mTLS) using generated test certs at the transport layer.
      # scripts/generate-test-certs.sh still writes a config with auth.enabled
      # false and no ca section: config.ComplianceGaps reports both, and
      # cmd/xkmsd refuses to start on any gap with no override flag or
      # environment variable, so that config has to gain an authenticator and a
      # CA before the suite can bring the daemon up. The XKMS_INSECURE opt-in
      # this comment used to name was removed in v0.3.0-alpha.
      # KNOWN GAP (go-xkms#653): the generated config enables a barrier
      # (passphrase strategy). go-xkms#653 removed the config-sourced
      # boot-time barrier secret entirely (matching go-qrdb's own SealConfig,
      # which carries none either), and XKMS_BARRIER_PASSPHRASE along with it
      # -- setting it now fails config.Load with a typed RemovedFieldError,
      # which would crash-loop this container, so it cannot be restored here.
      # Without it the qrdb node barrier no longer auto-unseals at startup:
      # the data plane boots sealed, and tenant operations (including the
      # TenantBarrierInit/Unseal tests this suite exercises) fail with
      # "barrier is sealed" until an unseal ceremony runs against the node's
      # sealed-window listener. Wiring the passphrase/shamir strategies into
      # the qrdb node's own barrier behind that ceremony (so this suite can
      # drive it, matching go-qrdb's own qrdbd boot sequence) is scoped as an
      # owner-approved follow-up to #653, not invented here.
      - XKMS_CONFIG=/etc/xkms/xkmsd.yaml
      - XKMS_LOGGING_LEVEL=debug
      - XKMS_BOOTSTRAP_NOISE_ENABLED=true
      - XKMS_SERVER_NOISE_PORT=8445
      - CERT_DIR=/etc/xkms/certs
      # Host the embedded go-qrdb node so the custodian-group / tenant endpoints
      # (which pass through to the node) are available for the bootstrap flow.
      - XKMS_STORAGE_BACKEND=qrdb
      - XKMS_STORAGE_PATH=/data/storage
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "--ca-certificate=/etc/xkms/certs/ca.crt", "https://localhost:8443/health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s
    networks:
      - bootstrap-net
    user: root
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /etc/xkms/certs /data
        echo "Generating TLS certificates..."
        /scripts/generate-test-certs.sh
        echo "Starting xkms server..."
        exec /app/xkmsd

  # One-shot zone generator: reads server cert, computes TLSA, writes zone file
  zone-generator:
    build:
      context: ../../..
      dockerfile: Dockerfile
      secrets:
        - gomodauth
    image: go-xkms-bootstrap:${XKMS_IMAGE_TAG:-latest}
    user: root
    volumes:
      - xkms-certs:/etc/xkms/certs:ro
      - zone-data:/etc/coredns/zones
      - ./setup:/setup:ro
    depends_on:
      xkms-server:
        condition: service_healthy
    networks:
      - bootstrap-net
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Generating TLSA zone file from server certificate..."
        /setup/generate-zone.sh
        echo "Zone file generated."

  # CoreDNS serving TLSA records for bootstrap.test zone.
  # Starts AFTER zone-generator writes the zone file. The CoreDNS container
  # is scratch-based (no shell), so we cannot use a traditional health check.
  # The zone-generator service_completed_successfully dependency guarantees
  # the zone file exists before CoreDNS starts.
  coredns:
    image: coredns/coredns:latest
    volumes:
      - ./coredns/Corefile:/etc/coredns/Corefile:ro
      - zone-data:/etc/coredns/zones:ro
    command: ["-conf", "/etc/coredns/Corefile"]
    depends_on:
      zone-generator:
        condition: service_completed_successfully
    networks:
      - bootstrap-net

  # Integration test runner
  test:
    build:
      context: ../../..
      dockerfile: test/integration/bootstrap/Dockerfile.test
      secrets:
        - gomodauth
    depends_on:
      xkms-server:
        condition: service_healthy
      coredns:
        condition: service_started
    volumes:
      - xkms-certs:/etc/xkms/certs:ro
      - go-build-cache:/root/.cache/go-build
    environment:
      - CGO_ENABLED=1
      - BOOTSTRAP_SERVER_URL=https://xkms-server:8443
      - BOOTSTRAP_NOISE_ADDR=xkms-server:8445
      - BOOTSTRAP_DNS_SERVER=coredns:1053
      - BOOTSTRAP_HOSTNAME=bootstrap.test
      - BOOTSTRAP_TLS_CA=/etc/xkms/certs/ca.crt
    working_dir: /workspace
    networks:
      - bootstrap-net
    command: >
      sh -c "
      echo 'Adding test CA to system trust store...' &&
      cp /etc/xkms/certs/ca.crt /usr/local/share/ca-certificates/xkms-test-ca.crt &&
      update-ca-certificates >/dev/null 2>&1 &&
      echo 'Waiting for CoreDNS to initialize...' &&
      sleep 5 &&
      export BOOTSTRAP_SPKI_PIN=$$(cat /etc/xkms/certs/spki.pin) &&
      echo \"SPKI pin: $${BOOTSTRAP_SPKI_PIN}\" &&
      echo 'Running bootstrap integration tests...' &&
      echo 'The Noise_NK public key is discovered from the running server over' &&
      echo 'the admin API (go-xkms#632), not pre-shared -- see' &&
      echo 'discoveredBootstrapKeys in test/integration/bootstrap/testutil.go.' &&
      go test -v -tags='integration codec_cbor codec_json codec_msgpack' ./test/integration/bootstrap/... -timeout 10m
      "

  # TrustService facade integration runner — exercises
  # xkey/pkg/gui/services.TrustService.ImportFromTrustStrap end-to-end
  # against the same xkms-server + CoreDNS stack, verifying the
  # upper-most GUI facade (per xkey integration test conventions).
  # Runs inside the xkey Go module so cross-module imports resolve
  # naturally without workspace or replace-directive gymnastics.
  xkey-truststrap-test:
    build:
      context: ../../..
      dockerfile: test/integration/bootstrap/Dockerfile.test
      secrets:
        - gomodauth
    depends_on:
      xkms-server:
        condition: service_healthy
      coredns:
        condition: service_started
    volumes:
      - xkms-certs:/etc/xkms/certs:ro
      - go-build-cache:/root/.cache/go-build
      - ./scripts:/scripts:ro
    environment:
      - CGO_ENABLED=1
      - BOOTSTRAP_SERVER_URL=https://xkms-server:8443
      - BOOTSTRAP_NOISE_ADDR=xkms-server:8445
      - BOOTSTRAP_DNS_SERVER=coredns:1053
      - BOOTSTRAP_HOSTNAME=bootstrap.test
      - BOOTSTRAP_TLS_CA=/etc/xkms/certs/ca.crt
    working_dir: /workspace/xkey
    networks:
      - bootstrap-net
    profiles:
      - xkey
    command: ["/scripts/run-xkey-truststrap-tests.sh"]

volumes:
  xkms-data:
    driver: local
  xkms-certs:
    driver: local
  zone-data:
    driver: local
  go-build-cache:
    driver: local

networks:
  bootstrap-net:
    driver: bridge

secrets:
  gomodauth:
    file: ../../../.devcontainer/gomodauth.env
