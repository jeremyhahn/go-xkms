# Docker Compose stack for the acme-tpm integration suite (make integration-test-acme-tpm).
services:
  tpm-simulator:
    build:
      context: ../../../test/docker/swtpm
      dockerfile: Dockerfile
      # Ruling 886: scripts/apk-mirror.sh, bind-mounted by the Dockerfile.
      additional_contexts:
        scripts: ../../../scripts
      secrets:
        - apk_mirror
    image: go-xkms-swtpm:${XKMS_IMAGE_TAG:-latest}
    expose:
      - "2321" # TPM command port
      - "2322" # TPM control port
    volumes:
      - swtpm-data:/var/lib/swtpm/tpmstate
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2321"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - acme-tpm-network

  acme-server:
    build:
      context: ../../..
      dockerfile: Dockerfile
      secrets:
        - gomodauth
        - apt_proxy
    image: go-xkms-integration-acme-server:${XKMS_IMAGE_TAG:-latest}
    # Config and trust anchor come from the image's source copy, not bind mounts, because the daemon resolves mounts on its own host.
    volumes:
      - acme-data:/data
    environment:
      - KEYSTORE_LOG_LEVEL=debug
      - KEYSTORE_DATA_DIR=/data
    # Generate the ACME listener's throwaway TLS certificate, then exec xkmsd.
    command: >
      sh -c "
      set -e &&
      go run ./test/integration/acme-tpm/certgen -cn acme-server -cert /data/acme-tls/acme.crt -key /data/acme-tls/acme.key &&
      exec /app/xkmsd -config /workspace/test/integration/acme-tpm/config.acme-tpm.yaml
      "
    healthcheck:
      test: ["CMD", "curl", "-sfk", "https://localhost:8443/acme/health"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 10s
    # Resolve the "test" service by a static hosts entry.
    extra_hosts:
      - "test:172.28.90.10"
    networks:
      - acme-tpm-network

  test:
    build:
      context: ../../..
      dockerfile: Dockerfile
      secrets:
        - gomodauth
        - apt_proxy
    image: go-xkms-integration-test:${XKMS_IMAGE_TAG:-latest}
    depends_on:
      tpm-simulator:
        condition: service_healthy
      acme-server:
        condition: service_healthy
    volumes:
      # Read-only: acme-server writes its certificate before it turns healthy.
      - acme-data:/data:ro
    environment:
      - CGO_ENABLED=1
      - ACME_SERVER_URL=https://acme-server:8443
      - ACME_TPM_HOST=tpm-simulator
      - TPM_SOCKET_HOST=tpm-simulator
      - TPM_SOCKET_PORT=2321
      # Trust the acme-server's throwaway certificate explicitly.
      - ACME_CA_CERT=/data/acme-tls/acme.crt
      # The hostname and port the acme-server dials back for the test's challenge responses.
      - CHALLENGE_CLIENT_HOSTNAME=test
      - CHALLENGE_CLIENT_PORT=8080
    working_dir: /workspace
    command: >
      go test -v -tags='integration,tpm2,codec_cbor,codec_json,codec_msgpack,gms_pure_go'
      ./test/integration/acme-tpm/... -timeout 20m
    networks:
      acme-tpm-network:
        # A static IP, because Docker's embedded DNS intermittently failed to resolve sibling services.
        ipv4_address: 172.28.90.10

networks:
  acme-tpm-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.90.0/24

volumes:
  swtpm-data:
    driver: local
  acme-data:
    driver: local

secrets:
  gomodauth:
    file: ../../../build/docker/devcontainer/gomodauth.env
  # Optional package caches as BuildKit secrets; empty when unset.
  apk_mirror:
    environment: DEVCACHE_APK_MIRROR
  apt_proxy:
    environment: DEVCACHE_APT_PROXY
