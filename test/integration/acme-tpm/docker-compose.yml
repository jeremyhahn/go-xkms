# Docker Compose stack for the acme-tpm integration lane
# (make integration-test-acme-tpm).
#
# test/integration/acme-tpm (build tags `integration tpm2`) exercises the
# device-attest-01, enroll-01 and permanent-identifier ACME end-to-end flows:
# the test runner acts as the TPM-backed device (dialing swtpm directly, and
# serving its own enroll-01 challenge-response HTTP endpoint), and dials a
# real ACME server over the network for the account/order/challenge/finalize
# protocol exchange.
#
# Three services, all built from images/Dockerfiles this repository already
# builds elsewhere:
#   - tpm-simulator: the same test/docker/swtpm image the top-level
#     docker-compose.yml and test/integration/api/docker-compose.yml use.
#   - acme-server: xkmsd (root Dockerfile, already builds /app/xkmsd) with
#     its embedded ACME server turned on via config.acme-tpm.yaml.
#   - test: the same image as acme-server (root Dockerfile bakes the full
#     source tree and pre-built xkmsd into one image), running `go test`
#     against the baked-in source instead of a runtime bind mount --
#     test/integration/tpm2/Dockerfile's comment explains why a runtime bind
#     mount is unreliable on the Gitea Actions runner.
services:
  tpm-simulator:
    build:
      context: ../../../test/docker/swtpm
      dockerfile: Dockerfile
    image: go-xkms-swtpm:${XKMS_IMAGE_TAG:-latest}
    expose:
      - "2321" # TPM command port
      - "2322" # TPM control port
    volumes:
      - swtpm-data:/var/lib/swtpm/tpmstate
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2321"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - acme-tpm-network

  acme-server:
    build:
      context: ../../..
      dockerfile: Dockerfile
      secrets:
        - gomodauth
    image: go-xkms-integration:${XKMS_IMAGE_TAG:-latest}
    volumes:
      - ./config.acme-tpm.yaml:/etc/xkms/xkmsd.yaml
      - acme-data:/data
      # The fixed EK issuer trust anchor config.acme-tpm.yaml's
      # ca.tcg-config.trust-anchors points at -- see that file's comment,
      # and swtpm_helper_test.go's swtpmTestEKIssuer, for why this is a
      # committed file rather than something generated at runtime.
      - ./testdata:/testdata:ro
    environment:
      - KEYSTORE_LOG_LEVEL=debug
      - KEYSTORE_DATA_DIR=/data
    # Generates the ACME listener's throwaway self-signed TLS cert (see
    # certgen/main.go for why this runs stdlib-only `go run` rather than
    # shelling out to openssl, which the runtime image does not carry) and
    # then execs the daemon xkmsd already builds at image build time.
    command: >
      sh -c "
      set -e &&
      go run ./test/integration/acme-tpm/certgen -cn acme-server -cert /data/acme-tls/acme.crt -key /data/acme-tls/acme.key &&
      exec /app/xkmsd -config /etc/xkms/xkmsd.yaml
      "
    healthcheck:
      test: ["CMD", "curl", "-sfk", "https://localhost:8443/acme/health"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 10s
    # Resolve the "test" service via a static /etc/hosts entry instead of
    # Docker's embedded DNS -- see the "test" service's ipv4_address comment
    # below for why. Every callback this container makes to the device under
    # test (enroll-01/endorse-01/device-attest-01 challenge fetches) goes
    # through CHALLENGE_CLIENT_HOSTNAME=test, so this is the one name that
    # matters here.
    extra_hosts:
      - "test:172.28.90.10"
    networks:
      - acme-tpm-network

  test:
    build:
      context: ../../..
      dockerfile: Dockerfile
      secrets:
        - gomodauth
    image: go-xkms-integration:${XKMS_IMAGE_TAG:-latest}
    depends_on:
      tpm-simulator:
        condition: service_healthy
      acme-server:
        condition: service_healthy
    volumes:
      # Read-only: the acme-server container generates
      # /data/acme-tls/acme.crt (certgen/main.go) before it becomes healthy,
      # so it already exists by the time this depends_on condition is met.
      # Sharing the same named volume (rather than copying the file) means
      # there is nothing to keep in sync if the cert is regenerated.
      - acme-data:/data:ro
    environment:
      - CGO_ENABLED=1
      - ACME_SERVER_URL=https://acme-server:8443
      - ACME_TPM_HOST=tpm-simulator
      - TPM_SOCKET_HOST=tpm-simulator
      - TPM_SOCKET_PORT=2321
      # The acme-server listener presents the throwaway self-signed cert
      # certgen generates; trust it explicitly here (getTLSConfig in
      # helpers_test.go, and createTestACMEClient via trustedRootPEM) rather
      # than skip verification. It is the ACME server's own leaf certificate,
      # self-signed, which is a valid (if unusual) x509.CertPool root entry:
      # verification succeeds against it because Issuer == Subject and the
      # presented chain is exactly that one certificate.
      - ACME_CA_CERT=/data/acme-tls/acme.crt
      # The test runner serves its own enroll-01/endorse-01/device-attest-01
      # challenge-response HTTP endpoint (test/integration/acme-tpm's
      # startChallengeServer et al.), which the acme-server container must be
      # able to reach back by this hostname:port, named explicitly so the
      # value matches pkg/acme/server/handlers/challenge.go's 8080 default
      # for enrollment-type challenges rather than the test helpers' bare
      # 8888 fallback (which nothing server-side would ever dial).
      - CHALLENGE_CLIENT_HOSTNAME=test
      - CHALLENGE_CLIENT_PORT=8080
    working_dir: /workspace
    command: >
      go test -v -tags='integration,tpm2,codec_cbor,codec_json,codec_msgpack,gms_pure_go'
      ./test/integration/acme-tpm/... -timeout 20m
    networks:
      acme-tpm-network:
        # Static IP, not the compose-assigned DNS name: acme-server's
        # callback to CHALLENGE_CLIENT_HOSTNAME=test repeatedly failed with
        # "dial tcp: lookup test on 127.0.0.11:53: server misbehaving" --
        # Docker's embedded DNS proxy returning SERVFAIL for a sibling
        # service's own name, observed often enough in one run (every
        # concurrent-enrollment test, plus the resulting cascade below) to
        # be a real reliability gap, not a one-off. A fixed address removes
        # the embedded resolver from this specific lookup entirely; every
        # other cross-container name in this stack (acme-server,
        # tpm-simulator) keeps using normal compose DNS.
        ipv4_address: 172.28.90.10

networks:
  acme-tpm-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.90.0/24

volumes:
  swtpm-data:
    driver: local
  acme-data:
    driver: local

secrets:
  gomodauth:
    file: ../../../.devcontainer/gomodauth.env
