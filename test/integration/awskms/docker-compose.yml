services:
  # Pinned by tag and digest (DS-4181): floci 2.3.0 moved to ubi9-micro, which
  # ships no curl, so a curl probe never passes. The image's own bash probe
  # polls GET /_floci/init on 4566 until the emulator reports ready.
  floci:
    image: floci/floci:2.3.0@sha256:e0b292df4dc9559b7b1bf4f51bdda4bb8e269276236438cd03cae661260ea8a9
    environment:
      - GOWORK=off
      - GOPRIVATE=${GOMODAUTH_GOPRIVATE:-${GITEA_HOST:+github.com/jeremyhahn/*}}
      - GIT_CONFIG_COUNT=${GOMODAUTH_GIT_CONFIG_COUNT:-${GITEA_HOST:+1}}
      - GIT_CONFIG_KEY_0=${GOMODAUTH_GIT_CONFIG_KEY_0:-url.http://x:${FORGE_MODULE_TOKEN}@${GITEA_HOST}/jeremyhahn/.insteadOf}
      - GIT_CONFIG_VALUE_0=${GOMODAUTH_GIT_CONFIG_VALUE_0:-https://github.com/jeremyhahn/}
      - FLOCI_DEFAULT_REGION=us-east-1
      - FLOCI_STORAGE_MODE=memory
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    ports:
      - "0:4566"

  test:
    build:
      context: ../../..
      dockerfile: test/integration/awskms/Dockerfile
      secrets:
        - gomodauth
    depends_on:
      floci:
        condition: service_healthy
    environment:
      - AWS_ENDPOINT_URL=http://floci:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-1
    working_dir: /app

# Staged by `make stage-gomodauth` (dependency-resolution.md §6) into the
# gitignored build/docker/devcontainer/gomodauth.env; empty when no Gitea credentials are
# available, in which case the Dockerfile's optional secret mount falls back
# to public module resolution.
secrets:
  gomodauth:
    file: ../../../build/docker/devcontainer/gomodauth.env
