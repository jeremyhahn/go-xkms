services:
  floci:
    image: floci/floci:latest
    environment:
      - FLOCI_DEFAULT_REGION=us-east-1
      - FLOCI_STORAGE_MODE=memory
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_floci/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "4566:4566"

  test:
    build:
      context: ../../..
      dockerfile: test/integration/awskms/Dockerfile
    depends_on:
      floci:
        condition: service_healthy
    environment:
      - AWS_ENDPOINT_URL=http://floci:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-1
    volumes:
      - ../../..:/app
      # Sibling module mounts (for go.mod replace directives)
      - ../../../../go-qrdb:/go-qrdb:cached
      - ../../../../go-quicraft:/go-quicraft:cached
      - ../../../../go-objstore:/go-objstore:cached
      - ../../../../go-truststrap:/go-truststrap:cached
      - ../../../../go-codec:/go-codec:cached
      - ../../../../go-frost:/go-frost:cached
    working_dir: /app

networks:
  default:
    name: xkms-awskms-test
