message GetCACertificateResponse {
  bytes certificate_pem = 1;
  string subject = 2;
  string issuer = 3;
  string serial_number = 4;
  string not_before = 5;
  string not_after = 6;
  bool is_ca = 7;
}

// SignCSRRequest contains a CSR to be signed.
message SignCSRRequest {
  bytes csr_pem = 1;
  string profile = 2;
  int32 validity_days = 3;
}

// SignCSRResponse contains the signed certificate.
message SignCSRResponse {
  bytes certificate_pem = 1;
  bytes chain_pem = 2;
  string serial_number = 3;
}

// IssueCertificateRequest requests certificate issuance.
message IssueCertificateRequest {
  string profile = 1;
  string common_name = 2;
  string organization = 3;
  repeated string sans = 4;
  int32 validity_days = 5;
  string algorithm = 6;
}

// IssueCertificateResponse contains the issued certificate.
message IssueCertificateResponse {
  bytes certificate_pem = 1;
  bytes chain_pem = 2;
  bytes private_key_pem = 3;
  string serial_number = 4;
}

// RevokeCertificateRequest requests certificate revocation.
message RevokeCertificateRequest {
  string serial_number = 1;
  int32 reason = 2;
}

// RevokeCertificateResponse confirms revocation.
message RevokeCertificateResponse {
  bool success = 1;
  string message = 2;
}

// GenerateCRLRequest requests CRL generation.
message GenerateCRLRequest {}

// GenerateCRLResponse contains the generated CRL.
message GenerateCRLResponse {
  bytes crl_pem = 1;
}

// IsRevokedRequest checks revocation status.
message IsRevokedRequest {
  string serial_number = 1;
}

// IsRevokedResponse contains the revocation status.
message IsRevokedResponse {
  bool revoked = 1;
  int32 reason = 2;
  string message = 3;
}

