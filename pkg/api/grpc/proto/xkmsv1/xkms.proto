syntax = "proto3";

package xkms.v1;

option go_package = "github.com/jeremyhahn/go-xkms/pkg/api/grpc/proto/xkmsv1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "qrdb/v1/permission.proto";

// KeystoreService provides key management and cryptographic operations
service KeystoreService {
  // Health returns the health status of the service
  rpc Health(HealthRequest) returns (HealthResponse);

  // ListBackends returns all available backend providers
  rpc ListBackends(ListBackendsRequest) returns (ListBackendsResponse) {
    option (qrdb.v1.permission) = "backends:list";
  }

  // GetBackendInfo returns detailed information about a specific backend
  rpc GetBackendInfo(GetBackendInfoRequest) returns (GetBackendInfoResponse) {
    option (qrdb.v1.permission) = "backends:read";
  }

  // GenerateKey generates a new cryptographic key
  rpc GenerateKey(GenerateKeyRequest) returns (GenerateKeyResponse) {
    option (qrdb.v1.permission) = "keys:create";
  }

  // ListKeys lists all keys in the specified backend
  rpc ListKeys(ListKeysRequest) returns (ListKeysResponse) {
    option (qrdb.v1.permission) = "keys:list";
  }

  // GetKey retrieves information about a specific key
  rpc GetKey(GetKeyRequest) returns (GetKeyResponse) {
    option (qrdb.v1.permission) = "keys:get";
  }

  // Sign signs data with the specified key
  rpc Sign(SignRequest) returns (SignResponse) {
    option (qrdb.v1.permission) = "keys:sign";
  }

  // Verify verifies a signature with the specified key
  rpc Verify(VerifyRequest) returns (VerifyResponse) {
    option (qrdb.v1.permission) = "keys:verify";
  }

  // DeleteKey deletes a key from the backend
  rpc DeleteKey(DeleteKeyRequest) returns (DeleteKeyResponse) {
    option (qrdb.v1.permission) = "keys:delete";
  }

  // RotateKey rotates an existing key
  rpc RotateKey(RotateKeyRequest) returns (RotateKeyResponse) {
    option (qrdb.v1.permission) = "keys:rotate";
  }

  // CreateOTAImageKey creates the ES256 OTA image-signing key of one
  // trusted-firmware board.
  rpc CreateOTAImageKey(OTAImageKeyRequest) returns (GenerateKeyResponse) {
    option (qrdb.v1.permission) = "keys:create";
  }

  // RotateOTAImageKey creates the next version of a board's OTA
  // image-signing key; earlier versions keep verifying.
  rpc RotateOTAImageKey(OTAImageKeyRequest) returns (RotateKeyResponse) {
    option (qrdb.v1.permission) = "keys:rotate";
  }

  // SignOTAImage signs an OTA image with the current version of its board's
  // key.
  rpc SignOTAImage(SignOTAImageRequest) returns (SignResponse) {
    option (qrdb.v1.permission) = "keys:sign";
  }

  // ListKeyVersions lists every version of a key and marks the current one.
  // A key that was never rotated lists version 1 alone.
  rpc ListKeyVersions(ListKeyVersionsRequest) returns (ListKeyVersionsResponse) {
    option (qrdb.v1.permission) = "keys:list";
  }

  // EnableKeyVersion enables a disabled version of a key. A retired version
  // cannot be enabled.
  rpc EnableKeyVersion(EnableKeyVersionRequest) returns (EnableKeyVersionResponse) {
    option (qrdb.v1.permission) = "keys:rotate";
  }

  // DisableKeyVersion disables a version of a key. The current version
  // cannot be disabled; rotate first.
  rpc DisableKeyVersion(DisableKeyVersionRequest) returns (DisableKeyVersionResponse) {
    option (qrdb.v1.permission) = "keys:rotate";
  }

  // EnableAllKeyVersions enables every disabled version of a key.
  rpc EnableAllKeyVersions(EnableAllKeyVersionsRequest) returns (EnableAllKeyVersionsResponse) {
    option (qrdb.v1.permission) = "keys:rotate";
  }

  // DisableAllKeyVersions disables every enabled version of a key except the
  // current one.
  rpc DisableAllKeyVersions(DisableAllKeyVersionsRequest) returns (DisableAllKeyVersionsResponse) {
    option (qrdb.v1.permission) = "keys:rotate";
  }

  // RetireKeyVersion deletes a version's key material for good. The current
  // version cannot be retired; rotate first.
  rpc RetireKeyVersion(RetireKeyVersionRequest) returns (RetireKeyVersionResponse) {
    option (qrdb.v1.permission) = "keys:delete";
  }

  // RotateScopeKeys rotates every key of a tenant and reports each key's
  // result. A tenant caller rotates its own tenant; only a system caller may
  // name another in tenant_id.
  rpc RotateScopeKeys(RotateScopeKeysRequest) returns (RotateScopeKeysResponse) {
    option (qrdb.v1.permission) = "keys:rotate";
  }

  // Encrypt encrypts data with the specified key (symmetric encryption)
  rpc Encrypt(EncryptRequest) returns (EncryptResponse) {
    option (qrdb.v1.permission) = "keys:encrypt";
  }

  // Decrypt decrypts data with the specified key
  rpc Decrypt(DecryptRequest) returns (DecryptResponse) {
    option (qrdb.v1.permission) = "keys:decrypt";
  }

  // EncryptAsym encrypts data using asymmetric encryption (RSA-OAEP)
  rpc EncryptAsym(EncryptAsymRequest) returns (EncryptAsymResponse) {
    option (qrdb.v1.permission) = "keys:encrypt";
  }

  // ==================== Crypto Utility Operations ====================

  // Rewrap decrypts a ciphertext under its source key and encrypts the
  // plaintext under a target key (the source key's current version when no
  // target is named). The plaintext never leaves the service.
  rpc Rewrap(RewrapRequest) returns (RewrapResponse) {
    option (qrdb.v1.permission) = "keys:decrypt";
  }

  // EncryptBatch encrypts up to MaxBatchItems plaintexts with one key and
  // reports each item's result.
  rpc EncryptBatch(EncryptBatchRequest) returns (EncryptBatchResponse) {
    option (qrdb.v1.permission) = "keys:encrypt";
  }

  // DecryptBatch decrypts up to MaxBatchItems ciphertexts with one key and
  // reports each item's result.
  rpc DecryptBatch(DecryptBatchRequest) returns (DecryptBatchResponse) {
    option (qrdb.v1.permission) = "keys:decrypt";
  }

  // GenerateDataKey generates a random data key and returns it in plaintext
  // and wrapped under the named key, for envelope encryption.
  rpc GenerateDataKey(GenerateDataKeyRequest) returns (GenerateDataKeyResponse) {
    option (qrdb.v1.permission) = "keys:encrypt";
  }

  // GenerateWrappedDataKey generates a random data key and returns it only
  // wrapped under the named key.
  rpc GenerateWrappedDataKey(GenerateDataKeyRequest) returns (GenerateWrappedDataKeyResponse) {
    option (qrdb.v1.permission) = "keys:encrypt";
  }

  // GenerateHMAC computes an HMAC (RFC 2104) of data with a symmetric key.
  rpc GenerateHMAC(GenerateHMACRequest) returns (GenerateHMACResponse) {
    option (qrdb.v1.permission) = "keys:sign";
  }

  // VerifyHMAC verifies an HMAC (RFC 2104) of data with a symmetric key.
  rpc VerifyHMAC(VerifyHMACRequest) returns (VerifyHMACResponse) {
    option (qrdb.v1.permission) = "keys:verify";
  }

  // GenerateRandom returns up to MaxRandomBytes bytes from the service's
  // cryptographic random source.
  rpc GenerateRandom(GenerateRandomRequest) returns (GenerateRandomResponse) {
    option (qrdb.v1.permission) = "keys:verify";
  }

  // Hash computes the digest of data with a named hash function.
  rpc Hash(HashRequest) returns (HashResponse) {
    option (qrdb.v1.permission) = "keys:verify";
  }

  // ==================== Key Management Operations ====================
  //
  // Adopted from go-quicbaas api/proto/kms.proto (service KeyManagement),
  // field names and numbers kept; every key-scoped request gains a backend
  // field at its next free number. Policies, rotation policies, safety
  // limits, status and metadata persist in go-xkms's key-policy store.

  // GetPublicKey retrieves the DER-encoded public key component of an
  // asymmetric key without exposing private key material.
  rpc GetPublicKey(GetPublicKeyRequest) returns (GetPublicKeyResponse) {
    option (qrdb.v1.permission) = "keys:get";
  }

  // RevokeKey marks a key as revoked and unusable. Revocation is terminal.
  rpc RevokeKey(RevokeKeyRequest) returns (RevokeKeyResponse) {
    option (qrdb.v1.permission) = "keys:delete";
  }

  // UpdateKeyStatus enables or disables a key or key version.
  rpc UpdateKeyStatus(UpdateKeyStatusRequest) returns (UpdateKeyStatusResponse) {
    option (qrdb.v1.permission) = "keys:rotate";
  }

  // GetKeyMetadata retrieves metadata for a key without exposing key material.
  rpc GetKeyMetadata(GetKeyMetadataRequest) returns (GetKeyMetadataResponse) {
    option (qrdb.v1.permission) = "keys:get";
  }

  // UpdateKeyMetadata updates mutable metadata fields for a key.
  rpc UpdateKeyMetadata(UpdateKeyMetadataRequest) returns (UpdateKeyMetadataResponse) {
    option (qrdb.v1.permission) = "keys:rotate";
  }

  // SetKeyPolicy sets the access control policy for a key. The policy
  // narrows what RBAC already grants; it never widens it.
  rpc SetKeyPolicy(SetKeyPolicyRequest) returns (SetKeyPolicyResponse) {
    option (qrdb.v1.permission) = "keys:rotate";
  }

  // GetKeyPolicy retrieves the access control policy for a key.
  rpc GetKeyPolicy(GetKeyPolicyRequest) returns (GetKeyPolicyResponse) {
    option (qrdb.v1.permission) = "keys:get";
  }

  // DeleteKeyPolicy removes the access control policy for a key; the key
  // falls back to RBAC alone, never to unauthenticated access.
  rpc DeleteKeyPolicy(DeleteKeyPolicyRequest) returns (DeleteKeyPolicyResponse) {
    option (qrdb.v1.permission) = "keys:delete";
  }

  // SetKeyRotationPolicy sets or replaces the automatic rotation policy for a key.
  rpc SetKeyRotationPolicy(SetKeyRotationPolicyRequest) returns (SetKeyRotationPolicyResponse) {
    option (qrdb.v1.permission) = "keys:rotate";
  }

  // GetKeyRotationPolicy retrieves the current automatic rotation policy for a key.
  rpc GetKeyRotationPolicy(GetKeyRotationPolicyRequest) returns (GetKeyRotationPolicyResponse) {
    option (qrdb.v1.permission) = "keys:get";
  }

  // DeleteKeyRotationPolicy removes the rotation policy for a key, disabling
  // automatic rotation.
  rpc DeleteKeyRotationPolicy(DeleteKeyRotationPolicyRequest) returns (DeleteKeyRotationPolicyResponse) {
    option (qrdb.v1.permission) = "keys:delete";
  }

  // GetSupportedAlgorithms returns the cryptographic algorithms the named
  // backend supports, so a caller can check before attempting an operation.
  rpc GetSupportedAlgorithms(GetSupportedAlgorithmsRequest) returns (GetSupportedAlgorithmsResponse) {
    option (qrdb.v1.permission) = "keys:list";
  }

  // BackendStatus returns health and capability information about a backend.
  rpc BackendStatus(BackendStatusRequest) returns (BackendStatusResponse) {
    option (qrdb.v1.permission) = "backends:read";
  }

  // BackendTest performs a non-destructive seal/unseal round trip to verify
  // backend functionality.
  rpc BackendTest(BackendTestRequest) returns (BackendTestResponse) {
    option (qrdb.v1.permission) = "backends:read";
  }

  // SetKeySafety configures AEAD usage limits (NIST SP 800-38D §8.3,
  // RFC 8439 §4) for a symmetric key.
  rpc SetKeySafety(SetKeySafetyRequest) returns (SetKeySafetyResponse) {
    option (qrdb.v1.permission) = "keys:rotate";
  }

  // ClearKeySafety removes custom AEAD usage limits from a key.
  rpc ClearKeySafety(ClearKeySafetyRequest) returns (ClearKeySafetyResponse) {
    option (qrdb.v1.permission) = "keys:rotate";
  }

  // SafetyCheck returns warnings for keys approaching their usage limits.
  rpc SafetyCheck(SafetyCheckRequest) returns (SafetyCheckResponse) {
    option (qrdb.v1.permission) = "keys:get";
  }

  // SafetyReport returns a safety report for every key with usage limits.
  rpc SafetyReport(SafetyReportRequest) returns (SafetyReportResponse) {
    option (qrdb.v1.permission) = "keys:get";
  }

  // DeriveKey derives a key using the specified algorithm and parameters
  // Supports HKDF, ECDH, DH, SP800-108, PBKDF2, and other key derivation mechanisms
  rpc DeriveKey(DeriveKeyRequest) returns (DeriveKeyResponse) {
    option (qrdb.v1.permission) = "keys:derive";
  }

  // DeriveKeyECDH performs ECDH key agreement and derives a symmetric key
  // This operation combines ECDH shared secret computation with a KDF to produce
  // a derived key suitable for symmetric encryption
  rpc DeriveKeyECDH(DeriveKeyECDHRequest) returns (DeriveKeyECDHResponse) {
    option (qrdb.v1.permission) = "keys:derive";
  }

  // DeriveKeyECDHSecure performs ECDH key agreement with configurable security modes
  // Supports EXPORT (returns key bytes), HSM_RESIDENT (keeps key in HSM),
  // HSM_KDF (runs KDF in HSM), and TPM_WRAPPED (seals key in TPM)
  rpc DeriveKeyECDHSecure(DeriveKeyECDHSecureRequest) returns (DeriveKeyECDHSecureResponse);

  // UseResidentKey performs a cryptographic operation using an HSM/TPM-resident key
  rpc UseResidentKey(UseResidentKeyRequest) returns (UseResidentKeyResponse);

  // DestroyResidentKey destroys an HSM/TPM-resident derived key
  rpc DestroyResidentKey(DestroyResidentKeyRequest) returns (DestroyResidentKeyResponse);

  // GenerateEphemeralECDH generates an ephemeral ECDH key pair inside the TPM
  // and derives a shared secret with the peer's static public key
  rpc GenerateEphemeralECDH(GenerateEphemeralECDHRequest) returns (GenerateEphemeralECDHResponse);

  // SaveCert stores a certificate
  rpc SaveCert(SaveCertRequest) returns (SaveCertResponse) {
    option (qrdb.v1.permission) = "certs:enroll";
  }

  // GetCert retrieves a certificate
  rpc GetCert(GetCertRequest) returns (GetCertResponse) {
    option (qrdb.v1.permission) = "certs:read";
  }

  // DeleteCert removes a certificate
  rpc DeleteCert(DeleteCertRequest) returns (DeleteCertResponse) {
    option (qrdb.v1.permission) = "certs:revoke";
  }

  // ListCerts lists all certificates
  rpc ListCerts(ListCertsRequest) returns (ListCertsResponse) {
    option (qrdb.v1.permission) = "certs:list";
  }

  // CertExists checks if a certificate exists
  rpc CertExists(CertExistsRequest) returns (CertExistsResponse) {
    option (qrdb.v1.permission) = "certs:read";
  }

  // SaveCertChain stores a certificate chain
  rpc SaveCertChain(SaveCertChainRequest) returns (SaveCertChainResponse) {
    option (qrdb.v1.permission) = "certs:enroll";
  }

  // GetCertChain retrieves a certificate chain
  rpc GetCertChain(GetCertChainRequest) returns (GetCertChainResponse) {
    option (qrdb.v1.permission) = "certs:read";
  }

  // GetTLSCertificate returns a TLS certificate and its chain. The private
  // key never travels on this response (go-xkms#627).
  rpc GetTLSCertificate(GetTLSCertificateRequest) returns (GetTLSCertificateResponse) {
    option (qrdb.v1.permission) = "certs:read";
  }

  // GetImportParameters retrieves parameters needed to import a key
  rpc GetImportParameters(GetImportParametersRequest) returns (GetImportParametersResponse) {
    option (qrdb.v1.permission) = "keys:import";
  }

  // WrapKey wraps key material for secure transport
  rpc WrapKey(WrapKeyRequest) returns (WrapKeyResponse) {
    option (qrdb.v1.permission) = "keys:wrap";
  }

  // UnwrapKey unwraps previously wrapped key material
  rpc UnwrapKey(UnwrapKeyRequest) returns (UnwrapKeyResponse) {
    option (qrdb.v1.permission) = "keys:unwrap";
  }

  // WrapKeyByID wraps a target key using a wrapping key, both identified by key IDs.
  // This enables PKCS#11 C_WrapKey functionality with server-side keys.
  // The target key must be extractable (exportable=true for symmetric keys).
  rpc WrapKeyByID(WrapKeyByIDRequest) returns (WrapKeyByIDResponse) {
    option (qrdb.v1.permission) = "keys:wrap";
  }

  // UnwrapKeyByID unwraps key material and imports it as a new key.
  // This enables PKCS#11 C_UnwrapKey functionality with server-side keys.
  rpc UnwrapKeyByID(UnwrapKeyByIDRequest) returns (UnwrapKeyByIDResponse) {
    option (qrdb.v1.permission) = "keys:unwrap";
  }

  // ImportKey imports externally generated key material into the backend
  rpc ImportKey(ImportKeyRequest) returns (ImportKeyResponse) {
    option (qrdb.v1.permission) = "keys:import";
  }

  // ExportKey exports a key in wrapped form for secure transport
  rpc ExportKey(ExportKeyRequest) returns (ExportKeyResponse) {
    option (qrdb.v1.permission) = "keys:export";
  }

  // ExportKeyMaterial exports raw symmetric key bytes for extractable keys.
  //
  // SECURITY WARNING: This method returns plaintext key material without any
  // cryptographic protection. Use with extreme caution:
  //   - ONLY works for symmetric keys (AES, ChaCha20, etc.)
  //   - Key must have been created with exportable=true
  //   - Asymmetric keys (RSA, ECDSA, Ed25519) cannot be exported via this method
  //   - For secure key transport between backends, use ExportKey instead
  //
  // Use cases:
  //   - Extracting symmetric keys for use in external systems
  //   - Key backup scenarios where raw material is required
  //   - Testing and development environments
  rpc ExportKeyMaterial(ExportKeyMaterialRequest) returns (ExportKeyMaterialResponse) {
    option (qrdb.v1.permission) = "keys:export";
  }

  // CopyKey copies a key from one backend to another
  rpc CopyKey(CopyKeyRequest) returns (CopyKeyResponse) {
    option (qrdb.v1.permission) = "keys:create";
  }

  // ==================== Sealing Operations ====================

  // Seal encrypts data using the backend's sealing mechanism
  rpc Seal(SealRequest) returns (SealResponse) {
    option (qrdb.v1.permission) = "keys:encrypt";
  }

  // Unseal decrypts previously sealed data
  rpc Unseal(UnsealRequest) returns (UnsealResponse) {
    option (qrdb.v1.permission) = "keys:decrypt";
  }

  // CanSeal checks if a backend supports sealing operations
  rpc CanSeal(CanSealRequest) returns (CanSealResponse) {
    option (qrdb.v1.permission) = "keys:get";
  }

  // ==================== Attestation Operations ====================

  // AttestKey generates a key attestation statement proving hardware backing
  rpc AttestKey(AttestKeyRequest) returns (AttestKeyResponse) {
    option (qrdb.v1.permission) = "keys:get";
  }

  // ==================== FROST Threshold Signature Operations ====================

  // FrostGenerateKey generates FROST key packages using trusted dealer model
  rpc FrostGenerateKey(FrostGenerateKeyRequest) returns (FrostGenerateKeyResponse) {
    option (qrdb.v1.permission) = "keys:create";
  }

  // FrostImportKey imports a FROST key package
  rpc FrostImportKey(FrostImportKeyRequest) returns (FrostImportKeyResponse) {
    option (qrdb.v1.permission) = "keys:import";
  }

  // FrostListKeys lists all FROST keys
  rpc FrostListKeys(FrostListKeysRequest) returns (FrostListKeysResponse) {
    option (qrdb.v1.permission) = "keys:list";
  }

  // FrostGetKey retrieves information about a specific FROST key
  rpc FrostGetKey(FrostGetKeyRequest) returns (FrostGetKeyResponse) {
    option (qrdb.v1.permission) = "keys:get";
  }

  // FrostDeleteKey deletes a FROST key
  rpc FrostDeleteKey(FrostDeleteKeyRequest) returns (FrostDeleteKeyResponse) {
    option (qrdb.v1.permission) = "keys:delete";
  }

  // FrostGenerateNonces generates nonces and commitments for Round 1 of FROST signing
  rpc FrostGenerateNonces(FrostGenerateNoncesRequest) returns (FrostGenerateNoncesResponse) {
    option (qrdb.v1.permission) = "keys:sign";
  }

  // FrostSignRound generates a signature share for Round 2 of FROST signing
  rpc FrostSignRound(FrostSignRoundRequest) returns (FrostSignRoundResponse) {
    option (qrdb.v1.permission) = "keys:sign";
  }

  // FrostAggregate combines signature shares into a final FROST signature
  rpc FrostAggregate(FrostAggregateRequest) returns (FrostAggregateResponse) {
    option (qrdb.v1.permission) = "keys:sign";
  }

  // FrostVerify verifies a FROST signature against the group public key
  rpc FrostVerify(FrostVerifyRequest) returns (FrostVerifyResponse) {
    option (qrdb.v1.permission) = "keys:verify";
  }

  // ==================== CA Bundle Operations ====================

  // GetCABundle retrieves the CA certificate bundle for trust store population.
  // REST equivalent: GET /v1/ca/bundle
  rpc GetCABundle(GetCABundleRequest) returns (GetCABundleResponse) {
    option (qrdb.v1.permission) = "certs:read";
  }

  // ==================== CA Operations ====================

  // GetCACertificate retrieves the CA certificate with metadata.
  rpc GetCACertificate(GetCACertificateRequest) returns (GetCACertificateResponse) {
    option (qrdb.v1.permission) = "certs:read";
  }

  // SignCSR signs a certificate signing request.
  rpc SignCSR(SignCSRRequest) returns (SignCSRResponse) {
    option (qrdb.v1.permission) = "certs:issue";
  }

  // IssueCertificate issues a new certificate.
  rpc IssueCertificate(IssueCertificateRequest) returns (IssueCertificateResponse) {
    option (qrdb.v1.permission) = "certs:issue";
  }

  // RevokeCertificate revokes a certificate by serial number.
  rpc RevokeCertificate(RevokeCertificateRequest) returns (RevokeCertificateResponse) {
    option (qrdb.v1.permission) = "certs:revoke";
  }

  // GenerateCRL generates a certificate revocation list.
  rpc GenerateCRL(GenerateCRLRequest) returns (GenerateCRLResponse) {
    option (qrdb.v1.permission) = "certs:read";
  }

  // IsRevoked checks if a certificate is revoked.
  rpc IsRevoked(IsRevokedRequest) returns (IsRevokedResponse) {
    option (qrdb.v1.permission) = "certs:read";
  }

  // ==================== TCG Certificate Operations ====================

  // IssueEKCertificate issues an Endorsement Key certificate for a TPM.
  rpc IssueEKCertificate(IssueEKCertificateRequest) returns (IssueEKCertificateResponse) {
    option (qrdb.v1.permission) = "certs:issue";
  }

  // IssueAKCertificate issues an Attestation Key certificate for a TPM.
  rpc IssueAKCertificate(IssueAKCertificateRequest) returns (IssueAKCertificateResponse) {
    option (qrdb.v1.permission) = "certs:issue";
  }

  // SignTCGCSR signs a TCG-CSR-IDEVID and returns IAK and IDevID certificates.
  rpc SignTCGCSR(SignTCGCSRRequest) returns (SignTCGCSRResponse) {
    option (qrdb.v1.permission) = "certs:issue";
  }

  // EnrollDevice performs full TCG device enrollment with credential activation challenge.
  rpc EnrollDevice(EnrollDeviceRequest) returns (EnrollDeviceResponse) {
    option (qrdb.v1.permission) = "certs:issue";
  }

  // IssueLAKCertificate issues a Local Attestation Key certificate in the
  // WebAuthn Level 2 section 8.3.1 profile, after verifying the LAK's
  // TPM2_Certify evidence against the device's IAK certificate (go-xkms#715).
  rpc IssueLAKCertificate(IssueLAKCertificateRequest) returns (IssueLAKCertificateResponse) {
    option (qrdb.v1.permission) = "certs:issue";
  }

  // ==================== Trust Bootstrap ====================

  // BootstrapListenerKeys reports the running trust-bootstrap listener's
  // public static keys, for an administrator to distribute to first-contact
  // clients. Only public material is ever returned.
  rpc BootstrapListenerKeys(google.protobuf.Empty) returns (BootstrapListenerKeysResponse) {
    option (qrdb.v1.permission) = "bootstrap:read";
  }

  // ==================== PIN Operations ====================

  // SetSOPIN sets the Security Officer PIN. If the SO PIN is already set,
  // current_so_pin must match the existing PIN.
  rpc SetSOPIN(SetSOPINRequest) returns (google.protobuf.Empty) {
    option (qrdb.v1.permission) = "pin:write";
  }

  // SetUserPIN sets the user PIN. Requires SO PIN authorization.
  rpc SetUserPIN(SetUserPINRequest) returns (google.protobuf.Empty) {
    option (qrdb.v1.permission) = "pin:write";
  }

  // ChangeSOPIN changes the Security Officer PIN.
  rpc ChangeSOPIN(ChangeSOPINRequest) returns (google.protobuf.Empty) {
    option (qrdb.v1.permission) = "pin:write";
  }

  // ChangeUserPIN changes the user PIN.
  rpc ChangeUserPIN(ChangeUserPINRequest) returns (google.protobuf.Empty) {
    option (qrdb.v1.permission) = "pin:write";
  }

  // VerifySOPIN verifies the provided Security Officer PIN.
  rpc VerifySOPIN(VerifySOPINRequest) returns (google.protobuf.Empty) {
    option (qrdb.v1.permission) = "pin:read";
  }

  // VerifyUserPIN verifies the provided user PIN.
  rpc VerifyUserPIN(VerifyUserPINRequest) returns (google.protobuf.Empty) {
    option (qrdb.v1.permission) = "pin:read";
  }

  // GetLockoutStatus returns the current PIN lockout status including
  // failed attempts, max attempts, and lockout duration.
  rpc GetLockoutStatus(google.protobuf.Empty) returns (LockoutStatusResponse) {
    option (qrdb.v1.permission) = "pin:read";
  }

  // ResetLockout resets the PIN lockout counter using SO PIN authorization.
  rpc ResetLockout(ResetLockoutRequest) returns (google.protobuf.Empty) {
    option (qrdb.v1.permission) = "pin:write";
  }

  // ==================== PIV Operations ====================

  // ListPIVSlots returns the status of all PIV slots for the specified backend.
  rpc ListPIVSlots(ListPIVSlotsRequest) returns (ListPIVSlotsResponse) {
    option (qrdb.v1.permission) = "piv:read";
  }

  // GetPIVCertificate retrieves a certificate from a PIV slot.
  rpc GetPIVCertificate(GetPIVCertificateRequest) returns (GetPIVCertificateResponse) {
    option (qrdb.v1.permission) = "piv:read";
  }

  // StorePIVCertificate stores a certificate in a PIV slot.
  rpc StorePIVCertificate(StorePIVCertificateRequest) returns (google.protobuf.Empty) {
    option (qrdb.v1.permission) = "piv:write";
  }

  // DeletePIVCertificate removes a certificate from a PIV slot.
  rpc DeletePIVCertificate(DeletePIVCertificateRequest) returns (google.protobuf.Empty) {
    option (qrdb.v1.permission) = "piv:delete";
  }

  // GeneratePIVKey generates a new key pair in a PIV slot with a self-signed certificate.
  rpc GeneratePIVKey(GeneratePIVKeyRequest) returns (GeneratePIVKeyResponse) {
    option (qrdb.v1.permission) = "piv:write";
  }

  // ImportPIVCertificate imports a certificate into a PIV slot.
  rpc ImportPIVCertificate(StorePIVCertificateRequest) returns (google.protobuf.Empty) {
    option (qrdb.v1.permission) = "piv:write";
  }

  // ExportPIVCertificate exports a certificate from a PIV slot.
  rpc ExportPIVCertificate(GetPIVCertificateRequest) returns (GetPIVCertificateResponse) {
    option (qrdb.v1.permission) = "piv:read";
  }

  // GeneratePIVCSR generates a certificate signing request for a PIV slot key.
  rpc GeneratePIVCSR(GeneratePIVCSRRequest) returns (GeneratePIVCSRResponse) {
    option (qrdb.v1.permission) = "piv:use";
  }


  // Algorithms reports the cryptographic algorithms this build supports and
  // which backends provide each one. Public discovery: it reflects compiled-in
  // capability only and reads no state.
  rpc Algorithms(AlgorithmsRequest) returns (AlgorithmsResponse);

  // ==================== Tenant Operations ====================

  // CreateTenant creates a new tenant.
  rpc CreateTenant(CreateTenantRequest) returns (CreateTenantResponse) {
    option (qrdb.v1.permission) = "tenants:create";
  }

  // GetTenant retrieves a tenant by ID.
  rpc GetTenant(GetTenantRequest) returns (GetTenantResponse) {
    option (qrdb.v1.permission) = "tenants:read";
  }

  // ListTenants returns all tenants.
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse) {
    option (qrdb.v1.permission) = "tenants:list";
  }

  // DeleteTenant deletes a tenant.
  rpc DeleteTenant(DeleteTenantRequest) returns (google.protobuf.Empty) {
    option (qrdb.v1.permission) = "tenants:delete";
  }

  // UpdateTenantEntitlements updates a tenant's feature entitlements. Plan
  // management: gated on tenants:set_entitlements, never tenants:update, and
  // admitted only for a cross-tenant (system) identity.
  rpc UpdateTenantEntitlements(UpdateTenantEntitlementsRequest) returns (UpdateTenantEntitlementsResponse) {
    option (qrdb.v1.permission) = "tenants:set_entitlements";
  }

  // UpdateTenantQuotas updates a tenant's resource quotas. Plan management:
  // gated on tenants:set_quotas, never tenants:update, and admitted only for a
  // cross-tenant (system) identity.
  rpc UpdateTenantQuotas(UpdateTenantQuotasRequest) returns (UpdateTenantQuotasResponse) {
    option (qrdb.v1.permission) = "tenants:set_quotas";
  }

  // ==================== Password Store Operations ====================

  // PasswordAdd adds a new password entry to the encrypted store.
  rpc PasswordAdd(PasswordAddRequest) returns (PasswordAddResponse) {
    option (qrdb.v1.permission) = "passwords:write";
  }

  // PasswordGet retrieves a password entry by ID or name.
  rpc PasswordGet(PasswordGetRequest) returns (PasswordGetResponse) {
    option (qrdb.v1.permission) = "passwords:read";
  }

  // PasswordList lists password entries, optionally filtered by folder or scope.
  rpc PasswordList(PasswordListRequest) returns (PasswordListResponse) {
    option (qrdb.v1.permission) = "passwords:read";
  }

  // PasswordUpdate updates an existing password entry.
  rpc PasswordUpdate(PasswordUpdateRequest) returns (PasswordUpdateResponse) {
    option (qrdb.v1.permission) = "passwords:write";
  }

  // PasswordDelete removes a password entry from the store.
  rpc PasswordDelete(PasswordDeleteRequest) returns (PasswordDeleteResponse) {
    option (qrdb.v1.permission) = "passwords:delete";
  }

  // PasswordStoreUnlock opens the caller's personal password session with
  // one of the caller's own vault factors.
  rpc PasswordStoreUnlock(PasswordStoreUnlockRequest) returns (PasswordStoreStatusResponse) {
    option (qrdb.v1.permission) = "passwords:unlock";
  }

  // PasswordVaultStatus describes the caller's personal vault and its
  // enrolled factors.
  rpc PasswordVaultStatus(PasswordVaultStatusRequest) returns (PasswordVaultStatusResponse) {
    option (qrdb.v1.permission) = "passwords:read";
  }

  // PasswordVaultEnroll enrolls a passphrase or passkey on the caller's
  // vault; the first enrollment initializes it and returns the recovery
  // code. Managing one's own vault factors is gated with the session verb,
  // passwords:unlock.
  rpc PasswordVaultEnroll(PasswordVaultEnrollRequest) returns (PasswordVaultEnrollResponse) {
    option (qrdb.v1.permission) = "passwords:unlock";
  }

  // PasswordVaultRotate re-wraps the caller's DEK under a new secret for a
  // factor.
  rpc PasswordVaultRotate(PasswordVaultRotateRequest) returns (PasswordVaultEnrollResponse) {
    option (qrdb.v1.permission) = "passwords:unlock";
  }

  // PasswordVaultRemoveFactor removes one of the caller's factors.
  rpc PasswordVaultRemoveFactor(PasswordVaultRemoveFactorRequest) returns (PasswordVaultRemoveFactorResponse) {
    option (qrdb.v1.permission) = "passwords:unlock";
  }

  // PasswordVaultRecover uses the caller's one-time recovery code to enroll a
  // new factor and returns the replacement code.
  rpc PasswordVaultRecover(PasswordVaultRecoverRequest) returns (PasswordVaultEnrollResponse) {
    option (qrdb.v1.permission) = "passwords:unlock";
  }

  // PasswordStoreLock locks the tenant password store session.
  rpc PasswordStoreLock(PasswordStoreLockRequest) returns (PasswordStoreStatusResponse) {
    option (qrdb.v1.permission) = "passwords:lock";
  }

  // PasswordStoreStatus returns the current status of the password store.
  rpc PasswordStoreStatus(PasswordStoreStatusRequest) returns (PasswordStoreStatusResponse) {
    option (qrdb.v1.permission) = "passwords:read";
  }

  // PasswordGenerate generates a random password with specified constraints.
  rpc PasswordGenerate(PasswordGenerateRequest) returns (PasswordGenerateResponse) {
    option (qrdb.v1.permission) = "passwords:generate";
  }

  // PasswordStoreSetAccessMode selects the access-control strategy for the
  // password store addressed by the request context. Gated the same as its
  // PasswordAdd/PasswordUpdate siblings: passwords:write.
  rpc PasswordStoreSetAccessMode(PasswordStoreSetAccessModeRequest) returns (PasswordStoreSetAccessModeResponse) {
    option (qrdb.v1.permission) = "passwords:write";
  }

  // ==================== TPM Policy Operations ====================
  // Named TPM policies that many TPM keys and sealed objects of a tenant
  // share, the registry of which object uses which policy, and each
  // tenant's TPM mode (pkg/tpmpolicy). tpm_policy:* is an xkms-owned
  // permission family (pkg/auth.ResourceTPMPolicy) whose tenancy scope
  // pkg/apimodule's module_scopes.go declares; tenants:set_tpm_mode is
  // system-scope only.

  // TPMPolicyCreate creates a named policy of branches, capturing the
  // values of its pcr conditions from the tenant's TPM.
  rpc TPMPolicyCreate(TPMPolicyCreateRequest) returns (TPMPolicy) {
    option (qrdb.v1.permission) = "tpm_policy:create";
  }

  // TPMPolicyGet returns a named policy.
  rpc TPMPolicyGet(TPMPolicyRequest) returns (TPMPolicy) {
    option (qrdb.v1.permission) = "tpm_policy:get";
  }

  // TPMPolicyList returns the tenant's named policies.
  rpc TPMPolicyList(TPMPolicyListRequest) returns (TPMPolicyListResponse) {
    option (qrdb.v1.permission) = "tpm_policy:list";
  }

  // TPMPolicyUpdate re-captures a policy's PCR values, or updates one
  // branch from signed reference values, and re-approves it.
  rpc TPMPolicyUpdate(TPMPolicyUpdateRequest) returns (TPMPolicy) {
    option (qrdb.v1.permission) = "tpm_policy:update";
  }

  // TPMPolicyRevoke withdraws a policy's current approval.
  rpc TPMPolicyRevoke(TPMPolicyRequest) returns (TPMPolicy) {
    option (qrdb.v1.permission) = "tpm_policy:revoke";
  }

  // TPMPolicyVerify compares a policy's captured PCR values with the live
  // ones.
  rpc TPMPolicyVerify(TPMPolicyRequest) returns (TPMPolicyVerifyResponse) {
    option (qrdb.v1.permission) = "tpm_policy:verify";
  }

  // TPMPolicyDelete deletes a policy no object is assigned to.
  rpc TPMPolicyDelete(TPMPolicyDeleteRequest) returns (TPMPolicyDeleteResponse) {
    option (qrdb.v1.permission) = "tpm_policy:delete";
  }

  // TPMPolicyObjects lists the objects assigned to a policy.
  rpc TPMPolicyObjects(TPMPolicyRequest) returns (TPMPolicyObjectsResponse) {
    option (qrdb.v1.permission) = "tpm_policy:get";
  }

  // TPMPolicySetAutoUnseal sets or clears a policy's auto-unseal mark.
  rpc TPMPolicySetAutoUnseal(TPMPolicyAutoUnsealRequest) returns (TPMPolicy) {
    option (qrdb.v1.permission) = "tpm_policy:update";
  }

  // TPMPolicySetDescription replaces a policy's description.
  rpc TPMPolicySetDescription(TPMPolicyDescriptionRequest) returns (TPMPolicy) {
    option (qrdb.v1.permission) = "tpm_policy:update";
  }

  // TPMObjectPolicy returns the policy a TPM key or sealed object was
  // created under.
  rpc TPMObjectPolicy(TPMObjectPolicyRequest) returns (TPMObjectPolicyResponse) {
    option (qrdb.v1.permission) = "tpm_policy:get";
  }

  // TPMPolicyRotateAuthority replaces the tenant's policy authority.
  rpc TPMPolicyRotateAuthority(TPMAuthorityRotateRequest) returns (TPMAuthorityRotateResponse) {
    option (qrdb.v1.permission) = "tpm_policy:rotate";
  }

  // GetTenantTPMMode returns a tenant's TPM mode. System scope only.
  rpc GetTenantTPMMode(TenantTPMModeRequest) returns (TenantTPMModeResponse) {
    option (qrdb.v1.permission) = "tenants:read";
  }

  // SetTenantTPMMode changes a tenant's TPM mode. System scope only.
  rpc SetTenantTPMMode(SetTenantTPMModeRequest) returns (TenantTPMModeResponse) {
    option (qrdb.v1.permission) = "tenants:set_tpm_mode";
  }

  // TenantVTPMStatus reports a tenant's virtual TPM. System scope only.
  rpc TenantVTPMStatus(TenantVTPMRequest) returns (TenantVTPMStatusResponse) {
    option (qrdb.v1.permission) = "tenants:read";
  }

  // TenantVTPMStart starts a vtpm-mode tenant's virtual TPM. System scope
  // only.
  rpc TenantVTPMStart(TenantVTPMRequest) returns (TenantVTPMStatusResponse) {
    option (qrdb.v1.permission) = "tenants:set_tpm_mode";
  }

  // TenantVTPMStop stops a vtpm-mode tenant's virtual TPM. System scope only.
  rpc TenantVTPMStop(TenantVTPMRequest) returns (TenantVTPMStatusResponse) {
    option (qrdb.v1.permission) = "tenants:set_tpm_mode";
  }

  // ==================== Trust Root Operations ====================
  // The platform's purpose-classified trust-root store
  // (pkg/attestation/truststore). trust_roots:* is an xkms-owned permission
  // family (pkg/auth.ResourceTrustRoots); the store is process-wide, so
  // every RPC is system scope only.

  // TrustRootList lists the roots, optionally of one purpose.
  rpc TrustRootList(TrustRootListRequest) returns (TrustRootListResponse) {
    option (qrdb.v1.permission) = "trust_roots:list";
  }

  // TrustRootGet returns one root, its PEM included.
  rpc TrustRootGet(TrustRootRequest) returns (TrustRoot) {
    option (qrdb.v1.permission) = "trust_roots:get";
  }

  // TrustRootImport adds the certificates of a PEM bundle.
  rpc TrustRootImport(TrustRootImportRequest) returns (TrustRootImportResponse) {
    option (qrdb.v1.permission) = "trust_roots:import";
  }

  // TrustRootQuarantine reclassifies a root as "synced", which anchors
  // nothing.
  rpc TrustRootQuarantine(TrustRootRequest) returns (TrustRoot) {
    option (qrdb.v1.permission) = "trust_roots:update";
  }

  // TrustRootRemove deletes a root.
  rpc TrustRootRemove(TrustRootRequest) returns (TrustRootRemoveResponse) {
    option (qrdb.v1.permission) = "trust_roots:delete";
  }

  // ==================== OIDC Credential Operations ====================
  // Server-side OIDC credentials (pkg/oidc/credential): named OAuth/OIDC
  // logins held on the tenant barrier and refreshed by the server,
  // tenant-shared or personal. oidc_credentials:* is an xkms-owned
  // permission family (pkg/auth.ResourceOIDCCredentials); a consumer reads
  // a current access token with oidc_credentials:token and never holds the
  // refresh token.

  // OIDCCredentialCreate creates a credential, with tokens when they are at
  // hand or pending a device login or an import otherwise.
  rpc OIDCCredentialCreate(OIDCCredentialCreateRequest) returns (OIDCCredential) {
    option (qrdb.v1.permission) = "oidc_credentials:create";
  }

  // OIDCCredentialImport replaces a credential's login with tokens obtained
  // elsewhere and makes it active.
  rpc OIDCCredentialImport(OIDCCredentialImportRequest) returns (OIDCCredential) {
    option (qrdb.v1.permission) = "oidc_credentials:update";
  }

  // OIDCCredentialGet returns a credential's public view (no tokens).
  rpc OIDCCredentialGet(OIDCCredentialRef) returns (OIDCCredential) {
    option (qrdb.v1.permission) = "oidc_credentials:get";
  }

  // OIDCCredentialList returns the credentials of a tenant the caller can
  // see.
  rpc OIDCCredentialList(OIDCCredentialListRequest) returns (OIDCCredentialListResponse) {
    option (qrdb.v1.permission) = "oidc_credentials:list";
  }

  // OIDCCredentialDelete deletes a credential.
  rpc OIDCCredentialDelete(OIDCCredentialRef) returns (OIDCCredentialDeleteResponse) {
    option (qrdb.v1.permission) = "oidc_credentials:delete";
  }

  // OIDCCredentialRefresh refreshes a credential now.
  rpc OIDCCredentialRefresh(OIDCCredentialRef) returns (OIDCCredential) {
    option (qrdb.v1.permission) = "oidc_credentials:update";
  }

  // OIDCCredentialGetAccessToken returns a current access token, refreshing
  // first when the token is inside its refresh margin.
  rpc OIDCCredentialGetAccessToken(OIDCCredentialRef) returns (OIDCAccessToken) {
    option (qrdb.v1.permission) = "oidc_credentials:token";
  }

  // OIDCCredentialDeviceStart starts a device login; the returned
  // credential's device_login carries the user code.
  rpc OIDCCredentialDeviceStart(OIDCCredentialRef) returns (OIDCCredential) {
    option (qrdb.v1.permission) = "oidc_credentials:update";
  }

  // OIDCCredentialDevicePoll polls the device login once: the credential
  // stays pending until the user approves.
  rpc OIDCCredentialDevicePoll(OIDCCredentialRef) returns (OIDCCredential) {
    option (qrdb.v1.permission) = "oidc_credentials:update";
  }

  // ==================== Peer Attestation Operations ====================
  // The attested-caller verbs (pkg/attestation/peergate): a caller asks for a
  // challenge and answers it with a TPM quote bound to its connection. Both
  // identify the caller by the verified client certificate of the call's
  // mutual-TLS connection, so they answer only over mTLS.

  // PeerAttestationChallenge issues a single-use nonce to the caller's
  // certificate.
  rpc PeerAttestationChallenge(PeerAttestationChallengeRequest) returns (PeerAttestationChallengeResponse) {
    option (qrdb.v1.permission) = "peer_attestation:challenge";
  }

  // SubmitPeerAttestation answers the caller's outstanding challenge with a
  // TPM quote and stores the evidence the attested-caller gate checks.
  rpc SubmitPeerAttestation(SubmitPeerAttestationRequest) returns (SubmitPeerAttestationResponse) {
    option (qrdb.v1.permission) = "peer_attestation:submit";
  }

  // ==================== Repository Signing Keys ====================
  // The key that signs a repository's images and CoRIM: the tenant release
  // key unless a binding names another of the tenant's keys (go-xkms#1697).
  // Every call acts on the caller's tenant.

  // SetSigningKeyBinding names the key that signs a repository.
  rpc SetSigningKeyBinding(SetSigningKeyBindingRequest) returns (SigningKeyBinding) {
    option (qrdb.v1.permission) = "attestation_signing_keys:bind";
  }

  // GetSigningKeyBinding returns a repository's binding.
  rpc GetSigningKeyBinding(GetSigningKeyBindingRequest) returns (SigningKeyBinding) {
    option (qrdb.v1.permission) = "attestation_signing_keys:get";
  }

  // ListSigningKeyBindings returns the tenant's bindings.
  rpc ListSigningKeyBindings(ListSigningKeyBindingsRequest) returns (ListSigningKeyBindingsResponse) {
    option (qrdb.v1.permission) = "attestation_signing_keys:list";
  }

  // DeleteSigningKeyBinding removes a repository's binding, so the release
  // key signs it again.
  rpc DeleteSigningKeyBinding(DeleteSigningKeyBindingRequest) returns (DeleteSigningKeyBindingResponse) {
    option (qrdb.v1.permission) = "attestation_signing_keys:bind";
  }

  // ResolveSigningKey returns the key that signs a repository.
  rpc ResolveSigningKey(ResolveSigningKeyRequest) returns (SigningKeyResolution) {
    option (qrdb.v1.permission) = "attestation_signing_keys:get";
  }

  // SignCoRIM signs a repository's CoRIM with the key ResolveSigningKey
  // returns, as a draft-ietf-rats-corim-11 §4.2 signed CoRIM.
  rpc SignCoRIM(SignCoRIMRequest) returns (SignedCoRIM) {
    option (qrdb.v1.permission) = "attestation_signing_keys:sign";
  }

  // SignImage signs an image with the key ResolveSigningKey returns for the
  // image's repository and pushes the DSSE attestation to the registry as an
  // OCI 1.1 referrer and to the image's cosign ".att" tag.
  rpc SignImage(SignImageRequest) returns (SignedImage) {
    option (qrdb.v1.permission) = "attestation_signing_keys:sign";
  }

  // ==================== PKCS#11 State Operations ====================
  // Durable token and object state for a PKCS#11 module running with
  // StorageType "remote". Values are opaque module-serialised records.

  rpc PKCS11StatePut(PKCS11StatePutRequest) returns (PKCS11StatePutResponse) {
    option (qrdb.v1.permission) = "keys:create";
  }
  rpc PKCS11StatePutIfAbsent(PKCS11StatePutIfAbsentRequest) returns (PKCS11StatePutIfAbsentResponse) {
    option (qrdb.v1.permission) = "keys:create";
  }
  rpc PKCS11StateCAS(PKCS11StateCASRequest) returns (PKCS11StateCASResponse) {
    option (qrdb.v1.permission) = "keys:update";
  }
  rpc PKCS11StateCAD(PKCS11StateCADRequest) returns (PKCS11StateCADResponse) {
    option (qrdb.v1.permission) = "keys:delete";
  }
  rpc PKCS11StateGet(PKCS11StateGetRequest) returns (PKCS11StateGetResponse) {
    option (qrdb.v1.permission) = "keys:get";
  }
  rpc PKCS11StateDelete(PKCS11StateDeleteRequest) returns (PKCS11StateDeleteResponse) {
    option (qrdb.v1.permission) = "keys:delete";
  }
  rpc PKCS11StateList(PKCS11StateListRequest) returns (PKCS11StateListResponse) {
    option (qrdb.v1.permission) = "keys:list";
  }

  // ==================== Platform Sealed Store Operations ====================
  // The machine-local sealed credential store: secrets sealed to the host's
  // hardware sealer (TPM 2.0 when available). Gated by the same per-verb
  // keys:* permissions as the PKCS#11 state above, since both persist
  // key-protection material.

  rpc SealStorePut(SealStorePutRequest) returns (SealStorePutResponse) {
    option (qrdb.v1.permission) = "keys:create";
  }
  rpc SealStoreGet(SealStoreGetRequest) returns (SealStoreGetResponse) {
    option (qrdb.v1.permission) = "keys:get";
  }
  rpc SealStoreDelete(SealStoreDeleteRequest) returns (SealStoreDeleteResponse) {
    option (qrdb.v1.permission) = "keys:delete";
  }
  rpc SealStoreList(SealStoreListRequest) returns (SealStoreListResponse) {
    option (qrdb.v1.permission) = "keys:list";
  }
  rpc SealStoreReseal(SealStoreResealRequest) returns (SealStoreResealResponse) {
    option (qrdb.v1.permission) = "keys:update";
  }
  rpc SealStoreStatus(SealStoreStatusRequest) returns (SealStoreStatusResponse) {
    option (qrdb.v1.permission) = "keys:get";
  }

  // User management. xkms presents its own user model; the backing store is
  // the embedded qrdb node.
  rpc CreateUser(CreateUserRequest) returns (UserResponse) {
    option (qrdb.v1.permission) = "users:create";
  }
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (qrdb.v1.permission) = "users:list";
  }
  rpc GetUser(GetUserRequest) returns (UserResponse) {
    option (qrdb.v1.permission) = "users:read";
  }
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {
    option (qrdb.v1.permission) = "users:delete";
  }
  rpc EnableUser(EnableUserRequest) returns (UserResponse) {
    option (qrdb.v1.permission) = "users:enable";
  }
  rpc DisableUser(DisableUserRequest) returns (UserResponse) {
    option (qrdb.v1.permission) = "users:disable";
  }
  rpc BindUserCert(BindUserCertRequest) returns (UserResponse) {
    option (qrdb.v1.permission) = "users:update";
  }
  rpc ListUserCredentials(ListUserCredentialsRequest) returns (ListUserCredentialsResponse) {
    option (qrdb.v1.permission) = "users:read";
  }

  // FIDO2/WebAuthn registration ceremony. BeginRegistration returns the
  // JSON-marshaled WebAuthn options plus an opaque session ID; the client
  // drives an authenticator and echoes the session ID back to
  // FinishRegistration together with the attestation JSON.
  rpc BeginRegistration(BeginRegistrationRequest) returns (BeginRegistrationResponse);
  rpc FinishRegistration(FinishRegistrationRequest) returns (FinishRegistrationResponse);

  // FIDO2/WebAuthn authentication (login) ceremony. BeginAuthentication returns
  // the JSON-marshaled WebAuthn assertion options plus an opaque session ID; the
  // client drives an authenticator and echoes the session ID back to
  // FinishAuthentication together with the assertion JSON.
  rpc BeginAuthentication(BeginAuthenticationRequest) returns (BeginAuthenticationResponse);
  rpc FinishAuthentication(FinishAuthenticationRequest) returns (FinishAuthenticationResponse);

  // Invitation redemption (go-xkms#1294 part B): how an account CreateUser
  // provisioned with zero credentials enrolls its first one. Deliberately
  // ungated, for the same reason the ceremony RPCs above are: there is no
  // credential yet to authenticate a request with.
  rpc GetInvite(GetInviteRequest) returns (GetInviteResponse);
  rpc BeginInviteRegistration(BeginInviteRegistrationRequest) returns (BeginInviteRegistrationResponse);
  rpc FinishInviteRegistration(FinishInviteRegistrationRequest) returns (FinishInviteRegistrationResponse);
  rpc ActivateInvitePIV(ActivateInvitePIVRequest) returns (ActivateInvitePIVResponse);

  // ==================== SSH Operations ====================

  // SSHGenerateKey generates a new SSH key. When backend is set the key is
  // created on that crypto backend (private key never leaves a hardware
  // backend); otherwise a software key is generated server-side.
  rpc SSHGenerateKey(SSHGenerateKeyRequest) returns (SSHKeyResponse) {
    option (qrdb.v1.permission) = "ssh:write";
  }

  // SSHImportKey imports a PEM-encoded SSH private key.
  rpc SSHImportKey(SSHImportKeyRequest) returns (SSHKeyResponse) {
    option (qrdb.v1.permission) = "ssh:write";
  }

  // SSHListKeys enumerates SSH keys by (scope, owner).
  rpc SSHListKeys(SSHListKeysRequest) returns (SSHListKeysResponse) {
    option (qrdb.v1.permission) = "ssh:read";
  }

  // SSHGetKey loads metadata for a single SSH key.
  rpc SSHGetKey(SSHKeyRef) returns (SSHKeyResponse) {
    option (qrdb.v1.permission) = "ssh:read";
  }

  // SSHDeleteKey removes an SSH key (and its backend material, if any).
  rpc SSHDeleteKey(SSHKeyRef) returns (google.protobuf.Empty) {
    option (qrdb.v1.permission) = "ssh:delete";
  }

  // SSHExportPublic returns the authorized_keys public line for a key.
  rpc SSHExportPublic(SSHKeyRef) returns (SSHPublicKeyResponse) {
    option (qrdb.v1.permission) = "ssh:read";
  }

  // SSHSign signs a digest with the key's private half (delegated to the
  // backend for hardware-backed keys) and returns the SSH signature blob.
  rpc SSHSign(SSHSignRequest) returns (SSHSignResponse) {
    option (qrdb.v1.permission) = "ssh:write";
  }

  // SSHAddKnownHost pins a host key.
  rpc SSHAddKnownHost(SSHAddKnownHostRequest) returns (google.protobuf.Empty) {
    option (qrdb.v1.permission) = "ssh:write";
  }

  // SSHListKnownHosts enumerates host-key pins.
  rpc SSHListKnownHosts(SSHListKnownHostsRequest) returns (SSHListKnownHostsResponse) {
    option (qrdb.v1.permission) = "ssh:read";
  }

  // SSHRemoveKnownHost removes a host-key pin.
  rpc SSHRemoveKnownHost(SSHRemoveKnownHostRequest) returns (google.protobuf.Empty) {
    option (qrdb.v1.permission) = "ssh:delete";
  }

  // SSHAddAuthorizedKey persists an authorized_keys entry.
  rpc SSHAddAuthorizedKey(SSHAddAuthorizedKeyRequest) returns (google.protobuf.Empty) {
    option (qrdb.v1.permission) = "ssh:write";
  }

  // SSHListAuthorizedKeys enumerates authorized_keys entries.
  rpc SSHListAuthorizedKeys(SSHListAuthorizedKeysRequest) returns (SSHListAuthorizedKeysResponse) {
    option (qrdb.v1.permission) = "ssh:read";
  }

  // SSHRemoveAuthorizedKey removes an authorized_keys entry.
  rpc SSHRemoveAuthorizedKey(SSHAuthorizedKeyRef) returns (google.protobuf.Empty) {
    option (qrdb.v1.permission) = "ssh:delete";
  }

  // ==================== Audit Operations ====================

}

// UserInfo describes an xkms user.
message UserInfo {
  string username = 1;
  string display_name = 2;
  reserved 3;
  reserved "role";
  bool enabled = 4;
  // id is the numeric identifier the embedded qrdb node assigns. The
  // N-factor endpoints are keyed by it, so callers that manage factors need
  // it alongside the username.
  uint64 id = 5;
  // email is the canonical tenant-unique login key. Without it a client can
  // create a user with a login key and never read it back.
  string email = 6;
  // roles names every role the user holds, in the order qrdb stores them.
  repeated string roles = 7;
}

// CreateUserRequest creates a new xkms user.
message CreateUserRequest {
  string username = 1;
  string display_name = 2;
  string role = 3;
  string tenant_id = 4;
  // email is the canonical tenant-unique login key (go-qrdb #190). It is
  // REQUIRED: xkms resolves logins and WebAuthn enrollment by this key, so a
  // user created without one is provisioned and unreachable.
  string email = 5;
  // without_email_login_key DECLARES that this user intentionally has no email
  // login key -- the certificate-authenticated admin path. Absence must be
  // stated, never defaulted, or a user silently becomes unreachable.
  bool without_email_login_key = 6;
  // invite_ttl_seconds overrides how long the minted activation invitation
  // stays redeemable (go-xkms#1294 part B). Zero or negative takes the
  // server's configured default; a value above the server's configured cap
  // is clamped down to it, never refused. Ignored when
  // without_email_login_key is set.
  int64 invite_ttl_seconds = 7;
}

// InviteInfo is the one-time activation invitation CreateUser mints for a
// new account with an email login key (go-xkms#1294 part B). token is the
// plaintext token: it is returned exactly once, here, and cannot be
// recovered afterwards -- only its digest is stored.
message InviteInfo {
  string token = 1;
  string url = 2;
  google.protobuf.Timestamp expires_at = 3;
}

// UserResponse returns a single xkms user. invite is set only by CreateUser,
// for an account created with an email login key; every other caller
// (GetUser, UpdateUser) leaves it unset.
message UserResponse {
  UserInfo user = 1;
  InviteInfo invite = 2;
}

// ListUsersRequest lists xkms users.
message ListUsersRequest {}

// ListUsersResponse returns a list of xkms users.
message ListUsersResponse {
  repeated UserInfo users = 1;
}

// GetUserRequest resolves a user by username.
message GetUserRequest {
  string username = 1;
}

// DeleteUserRequest removes a user by username.
message DeleteUserRequest {
  string username = 1;
}

// DeleteUserResponse reports the outcome of a delete.
message DeleteUserResponse {
  string username = 1;
  bool deleted = 2;
}

// EnableUserRequest enables a user by username.
message EnableUserRequest {
  string username = 1;
}

// DisableUserRequest disables a user by username.
message DisableUserRequest {
  string username = 1;
}

// BindUserCertRequest binds an mTLS certificate SPKI thumbprint to a user.
message BindUserCertRequest {
  string username = 1;
  string thumbprint = 2;
  int64 not_after_unix = 3;
}

// ListUserCredentialsRequest lists a user's credentials.
message ListUserCredentialsRequest {
  string username = 1;
}

// UserCredential describes a single user credential.
message UserCredential {
  string id = 1;
  string name = 2;
}

// ListUserCredentialsResponse returns a user's credentials.
message ListUserCredentialsResponse {
  repeated UserCredential credentials = 1;
}

// HealthRequest is the request for health check
message HealthRequest {}

// HealthResponse contains the health status
message HealthResponse {
  string status = 1;
  string version = 2;
}

// BackendInfo describes a backend provider
message BackendInfo {
  string name = 1;
  string type = 2;
  string description = 3;
  bool hardware_backed = 4;
  bool supports_signing = 5;
  bool supports_decryption = 6;
  bool supports_rotation = 7;
  bool supports_symmetric_encryption = 8;
}

// ListBackendsRequest requests the list of available backends
message ListBackendsRequest {}

// ListBackendsResponse contains the list of backends
message ListBackendsResponse {
  repeated BackendInfo backends = 1;
  int32 count = 2;
}

// GetBackendInfoRequest requests info about a specific backend
message GetBackendInfoRequest {
  string name = 1;
}

// GetBackendInfoResponse contains backend information
message GetBackendInfoResponse {
  BackendInfo backend = 1;
}

// GenerateKeyRequest requests generation of a new key
message GenerateKeyRequest {
  string key_id = 1;
  string backend = 2;
  string key_type = 3;  // "rsa", "ecdsa", "ed25519", "symmetric"
  int32 key_size = 4;
  string curve = 5;
  string hash = 6;
  string partition = 7;
  string algorithm = 8;  // Explicit algorithm: "aes-128-gcm", "aes-192-gcm", "aes-256-gcm"
  bool exportable = 9;   // Whether the key can be exported
  // Whether the key's plaintext may ever be released (PKCS#11 CKA_SENSITIVE).
  // Independent of exportable: a sensitive key may still be wrapped out, but
  // ExportKeyMaterial refuses it.
  bool sensitive = 10;
  // The TPM policy of the tenant's scope a TPM2 key is bound to; empty is
  // the built-in "platform" policy.
  string tpm_policy = 11;
}

// GenerateKeyResponse contains the generated key information
message GenerateKeyResponse {
  string key_id = 1;
  string backend = 2;
  string key_type = 3;
  string public_key_pem = 4;
  google.protobuf.Timestamp created_at = 5;
}

// KeyInfo contains information about a key
message KeyInfo {
  string key_id = 1;
  string backend = 2;
  string key_type = 3;
  string algorithm = 4;
  int32 key_size = 5;
  string curve = 6;
  string partition = 7;
  google.protobuf.Timestamp created_at = 8;
  // key_version is the key's current version, the one sign and encrypt use.
  uint32 key_version = 9;
}

// ListKeysRequest requests a list of keys
message ListKeysRequest {
  string backend = 1;
  string partition = 2;
  int32 limit = 3;
  int32 offset = 4;
}

// ListKeysResponse contains the list of keys
message ListKeysResponse {
  repeated KeyInfo keys = 1;
  int32 total = 2;
}

// GetKeyRequest requests information about a specific key
message GetKeyRequest {
  string key_id = 1;
  string backend = 2;
}

// GetKeyResponse contains key information
message GetKeyResponse {
  KeyInfo key = 1;
  string public_key_pem = 2;
}

// SignRequest requests data to be signed
message SignRequest {
  string key_id = 1;
  string backend = 2;
  bytes data = 3;
  string hash = 4;
  // padding selects the RSA signature scheme: "" or "pkcs1v15" (default), or "pss".
  string padding = 5;
  // salt_length is the RSA-PSS salt length in bytes; 0 selects the largest
  // salt the modulus allows. Ignored unless padding is "pss".
  int32 salt_length = 6;
  // data_is_digest states that data is already the digest and must not be
  // hashed again, while hash still names which digest produced it. Required
  // for RSASSA-PSS over a caller-supplied digest (PKCS#11 v3.2 section
  // 6.1.15), where the hash identity is needed for MGF1 but the data is not
  // to be hashed a second time.
  bool data_is_digest = 7;
}

// SignResponse contains the signature
message SignResponse {
  bytes signature = 1;
  // key_version is the key version that produced the signature: always the
  // current one. It is metadata beside the signature, never inside it.
  uint32 key_version = 2;
}

// VerifyRequest requests signature verification
message VerifyRequest {
  string key_id = 1;
  string backend = 2;
  bytes data = 3;
  bytes signature = 4;
  string hash = 5;
  // padding selects the RSA signature scheme: "" or "pkcs1v15" (default), or "pss".
  string padding = 6;
  // salt_length is the RSA-PSS salt length in bytes the signature is expected
  // to use; 0 auto-detects. Ignored unless padding is "pss".
  int32 salt_length = 7;
  // data_is_digest states that data is already the digest and must not be
  // hashed again. See SignRequest.data_is_digest.
  bool data_is_digest = 8;
  // key_version optionally names the key version to verify with; it must be
  // enabled. 0 tries every enabled version, newest first.
  uint32 key_version = 9;
}

// VerifyResponse contains verification result
message VerifyResponse {
  bool valid = 1;
  string message = 2;
  // key_version is the key version the signature verified under; 0 when it
  // did not verify.
  uint32 key_version = 3;
}

// DeleteKeyRequest requests deletion of a key
message DeleteKeyRequest {
  string key_id = 1;
  string backend = 2;
}

// DeleteKeyResponse contains deletion result
message DeleteKeyResponse {
  bool success = 1;
  string message = 2;
}

// RotateKeyRequest requests rotation of an existing key
message RotateKeyRequest {
  string key_id = 1;
  string backend = 2;
}

// RotateKeyResponse contains the rotated key information
message RotateKeyResponse {
  string key_id = 1;
  string backend = 2;
  string key_type = 3;
  string public_key_pem = 4;
  google.protobuf.Timestamp rotated_at = 5;
  // key_version is the version the rotation created, now current.
  uint32 key_version = 6;
  // certificate_reissue_required reports that the key has a certificate,
  // which still certifies the previous version.
  bool certificate_reissue_required = 7;
}

// OTAImageKeyRequest names the OTA image-signing key of one trusted-firmware
// board, to create or rotate.
message OTAImageKeyRequest {
  // board_id is 1-63 of a-z, 0-9 and single inner hyphens.
  string board_id = 1;
  string backend = 2;
  // algorithm must be "ES256"; empty selects it.
  string algorithm = 3;
}

// SignOTAImageRequest signs an OTA image, or its SHA-256 digest.
message SignOTAImageRequest {
  string board_id = 1;
  string backend = 2;
  bytes data = 3;
  // data_is_digest states that data is already the image's SHA-256 digest.
  bool data_is_digest = 4;
}

// KeyVersionInfo contains information about a key version
message KeyVersionInfo {
  int32 version = 1;
  string status = 2;
  string created_at = 3;
  string created_by = 4;
  // current reports whether this is the version sign and encrypt use.
  bool current = 5;
  // public_key_pem is the version's public key, for an asymmetric version
  // that has not been retired.
  string public_key_pem = 6;
}

// ListKeyVersionsRequest requests listing of key versions
message ListKeyVersionsRequest {
  string key_id = 1;
  string backend = 2;
}

// ListKeyVersionsResponse contains the list of key versions
message ListKeyVersionsResponse {
  string key_id = 1;
  repeated KeyVersionInfo versions = 2;
  int32 total = 3;
  string backend = 4;
  // current_version is the version sign and encrypt use.
  int32 current_version = 5;
}

// EnableKeyVersionRequest requests enabling of a key version
message EnableKeyVersionRequest {
  string key_id = 1;
  string backend = 2;
  int32 version = 3;
}

// EnableKeyVersionResponse contains the result of enabling a key version
message EnableKeyVersionResponse {
  string key_id = 1;
  int32 version = 2;
  string status = 3;
  // changed reports whether the state changed.
  bool changed = 4;
}

// DisableKeyVersionRequest requests disabling of a key version
message DisableKeyVersionRequest {
  string key_id = 1;
  string backend = 2;
  int32 version = 3;
}

// DisableKeyVersionResponse contains the result of disabling a key version
message DisableKeyVersionResponse {
  string key_id = 1;
  int32 version = 2;
  string status = 3;
  // changed reports whether the state changed.
  bool changed = 4;
}

// EnableAllKeyVersionsRequest requests enabling of all key versions
message EnableAllKeyVersionsRequest {
  string key_id = 1;
  string backend = 2;
}

// EnableAllKeyVersionsResponse contains the result of enabling all key versions
message EnableAllKeyVersionsResponse {
  string key_id = 1;
  int32 count = 2;
  string message = 3;
  // versions lists the versions whose state changed, ascending.
  repeated int32 versions = 4;
  // state is the state the versions were set to.
  string state = 5;
}

// DisableAllKeyVersionsRequest requests disabling of all key versions
message DisableAllKeyVersionsRequest {
  string key_id = 1;
  string backend = 2;
}

// DisableAllKeyVersionsResponse contains the result of disabling all key versions
message DisableAllKeyVersionsResponse {
  string key_id = 1;
  int32 count = 2;
  string message = 3;
  // versions lists the versions whose state changed, ascending.
  repeated int32 versions = 4;
  // state is the state the versions were set to.
  string state = 5;
}

// RetireKeyVersionRequest requests retiring a key version
message RetireKeyVersionRequest {
  string key_id = 1;
  string backend = 2;
  int32 version = 3;
}

// RetireKeyVersionResponse contains the result of retiring a key version
message RetireKeyVersionResponse {
  string key_id = 1;
  int32 version = 2;
  string status = 3;
  bool changed = 4;
}

// RotateScopeKeysRequest names the tenant whose keys to rotate
message RotateScopeKeysRequest {
  // tenant_id is the tenant to rotate. A tenant caller may leave it empty or
  // name its own tenant; only a system caller may name another, and a system
  // caller naming none rotates the system tenant's own keys.
  string tenant_id = 1;
}

// KeyRotationResult is the outcome of rotating one key
message KeyRotationResult {
  string backend = 1;
  string key_id = 2;
  // key_version is the new current version; 0 unless rotated.
  uint32 key_version = 3;
  // error describes why the key was not rotated; empty unless failed.
  string error = 4;
  // state is "rotated", "skipped" or "failed".
  string state = 5;
  // reason says why a skipped key was left alone.
  string reason = 6;
}

// RotateScopeKeysResponse reports the rotation of every key of a tenant
message RotateScopeKeysResponse {
  string tenant_id = 1;
  repeated KeyRotationResult results = 2;
  int32 rotated = 3;
  int32 failed = 4;
  int32 skipped = 5;
}

// EncryptRequest requests encryption of data (symmetric encryption)
message EncryptRequest {
  string key_id = 1;
  string backend = 2;
  bytes plaintext = 3;
  bytes additional_data = 4;  // Optional AAD for GCM mode
  // nonce optionally supplies the IV/nonce. When empty the backend generates
  // one and returns it in EncryptResponse.nonce. Only meaningful for the
  // default AEAD mode; AES-CBC uses iv instead.
  bytes nonce = 5;
  // mode selects the symmetric cipher mode of operation: "" (default)
  // selects the key's native AEAD mode (AES-GCM or
  // ChaCha20-Poly1305/XChaCha20-Poly1305); "cbc" selects unpadded AES-CBC
  // (plaintext must already be a whole number of AES blocks); "cbc-pad"
  // selects AES-CBC with PKCS#7 padding. CBC modes require an AES key and
  // reject additional_data.
  string mode = 6;
  // iv supplies the AES-CBC initialization vector, exactly 16 bytes. Ignored
  // for the default AEAD modes, which use nonce instead. If empty on
  // encrypt with a CBC mode, a random IV is generated and returned in
  // EncryptResponse.iv.
  bytes iv = 7;
  // tag_size is the AEAD authentication tag length in bytes; 0 selects the
  // cipher's full-length tag. NIST SP 800-38D section 5.2.1.2 defines a
  // t-bit GCM tag as the leading t bits of the full tag, so AES-GCM admits
  // 12, 13, 14, 15 and 16 bytes.
  int32 tag_size = 8;
}

// EncryptResponse contains the encrypted data
message EncryptResponse {
  bytes ciphertext = 1;
  bytes nonce = 2;
  bytes tag = 3;
  // iv is the AES-CBC initialization vector used for encryption. Populated
  // when the request's mode was "cbc" or "cbc-pad"; empty for the default
  // AEAD modes, which populate nonce instead.
  bytes iv = 4;
  // gcm_nonce_mode mirrors transport.EncryptResponse.GCMNonceMode: "" for a
  // caller- or RNG-supplied nonce, "random" when GODEBUG=fips140=only
  // forced this encryption through cipher.NewGCMWithRandomNonce. Echo it
  // back unchanged on the matching DecryptRequest; Decrypt cannot infer it
  // from the ciphertext bytes alone.
  string gcm_nonce_mode = 5;
  // key_version is the key version that produced the ciphertext: always the
  // current one. Keep it: AES-CBC ciphertext cannot be decrypted without it
  // once the key has more than one enabled version.
  uint32 key_version = 6;
}

// DecryptRequest requests decryption of data
message DecryptRequest {
  string key_id = 1;
  string backend = 2;
  bytes ciphertext = 3;
  bytes additional_data = 4;  // Optional AAD for symmetric decryption
  bytes nonce = 5;            // Required for symmetric decryption
  bytes tag = 6;              // Required for symmetric decryption (GCM)
  // padding selects the RSA decryption scheme for an asymmetric key:
  // "" or "pkcs1v15" (default), or "oaep".
  string padding = 7;
  // hash names the OAEP digest. Ignored unless padding is "oaep"; empty
  // selects SHA-1, which is OAEP's own default.
  string hash = 8;
  // label is the optional OAEP label. Ignored unless padding is "oaep".
  bytes label = 9;
  // mode selects the symmetric cipher mode of operation. See
  // EncryptRequest.mode; must match the mode used to produce ciphertext.
  // Ignored for asymmetric (RSA) decryption, which uses padding/hash/label.
  string mode = 10;
  // iv is the AES-CBC initialization vector used at encryption time, exactly
  // 16 bytes. Required when mode is "cbc" or "cbc-pad".
  bytes iv = 11;
  // tag_size is the AEAD authentication tag length in bytes that tag
  // carries; 0 selects the cipher's full-length tag. It must equal the
  // tag_size used to encrypt.
  int32 tag_size = 12;
  // gcm_nonce_mode is the value the matching EncryptResponse.gcm_nonce_mode
  // reported. Required, unchanged, to decrypt an AES-GCM ciphertext
  // produced under GODEBUG=fips140=only.
  string gcm_nonce_mode = 13;
  // key_version optionally names the key version to decrypt with; it must be
  // enabled. 0 tries every enabled version, newest first, for AEAD and
  // RSA-OAEP ciphertext, and requires exactly one enabled version for AES-CBC
  // and RSA PKCS#1 v1.5 ciphertext.
  uint32 key_version = 14;
}

// DecryptResponse contains the decrypted data
message DecryptResponse {
  bytes plaintext = 1;
  // key_version is the key version that decrypted the ciphertext.
  uint32 key_version = 2;
}

// ==================== Crypto Utility Messages ====================

// RewrapRequest names the ciphertext to unwrap, as a DecryptRequest, and the
// key to wrap its plaintext under. An empty target_key_id rewraps under the
// source key's current version; an empty target_backend uses the source
// backend. The source additional_data authenticates the new ciphertext too.
message RewrapRequest {
  DecryptRequest source = 1;
  string target_key_id = 2;
  string target_backend = 3;
}

message RewrapResponse {
  // source_key_version is the source key version that decrypted the input.
  uint32 source_key_version = 1;
  // wrapped is the ciphertext under the target key.
  EncryptResponse wrapped = 2;
}

message EncryptBatchItem {
  bytes plaintext = 1;
  bytes additional_data = 2;
}

message EncryptBatchRequest {
  string key_id = 1;
  string backend = 2;
  repeated EncryptBatchItem items = 3;
}

// EncryptBatchResult is one item's outcome: result on success, error
// otherwise.
message EncryptBatchResult {
  EncryptResponse result = 1;
  string error = 2;
}

message EncryptBatchResponse {
  repeated EncryptBatchResult results = 1;
}

message DecryptBatchItem {
  bytes ciphertext = 1;
  bytes additional_data = 2;
  bytes nonce = 3;
  bytes tag = 4;
  string gcm_nonce_mode = 5;
  uint32 key_version = 6;
}

message DecryptBatchRequest {
  string key_id = 1;
  string backend = 2;
  repeated DecryptBatchItem items = 3;
}

// DecryptBatchResult is one item's outcome: plaintext and key_version on
// success, error otherwise.
message DecryptBatchResult {
  bytes plaintext = 1;
  uint32 key_version = 2;
  string error = 3;
}

message DecryptBatchResponse {
  repeated DecryptBatchResult results = 1;
}

// GenerateDataKeyRequest names the wrapping key and the data key's size in
// bytes (16, 24 or 32; 0 means 32).
message GenerateDataKeyRequest {
  string key_id = 1;
  string backend = 2;
  int32 key_size = 3;
  bytes additional_data = 4;
}

message GenerateDataKeyResponse {
  bytes plaintext = 1;
  EncryptResponse wrapped = 2;
}

message GenerateWrappedDataKeyResponse {
  EncryptResponse wrapped = 1;
}

// GenerateHMACRequest names a symmetric key and the hash function (empty
// means SHA-256).
message GenerateHMACRequest {
  string key_id = 1;
  string backend = 2;
  bytes data = 3;
  string hash = 4;
}

message GenerateHMACResponse {
  bytes mac = 1;
  uint32 key_version = 2;
  string hash = 3;
}

// VerifyHMACRequest checks mac against data; key_version 0 tries the enabled
// versions newest first.
message VerifyHMACRequest {
  string key_id = 1;
  string backend = 2;
  bytes data = 3;
  bytes mac = 4;
  string hash = 5;
  uint32 key_version = 6;
}

message VerifyHMACResponse {
  bool valid = 1;
  uint32 key_version = 2;
}

message GenerateRandomRequest {
  int32 length = 1;
}

message GenerateRandomResponse {
  bytes random = 1;
}

// HashRequest names the hash function (empty means SHA-256).
message HashRequest {
  bytes data = 1;
  string hash = 2;
}

message HashResponse {
  bytes digest = 1;
  string hash = 2;
}

// ==================== Key Management Messages ====================
//
// Adopted from go-quicbaas api/proto/kms.proto with field names and numbers
// kept; backend is added at the next free number of each request.

// GetPublicKeyRequest retrieves the public key component of an asymmetric key.
message GetPublicKeyRequest {
  string key_id = 1;
  // version optionally targets a specific key version (0 = current).
  uint64 version = 2;
  string backend = 3;
}

// GetPublicKeyResponse returns the DER-encoded public key.
message GetPublicKeyResponse {
  string key_id = 1;
  // public_key is the DER-encoded (PKIX) public key.
  bytes public_key = 2;
  KeyAlgorithm algorithm = 3;
  uint64 version = 4;
  int64 timestamp = 5;
}

message RevokeKeyRequest {
  string key_id = 1;
  string reason = 2;
  string backend = 3;
}

message RevokeKeyResponse {
  string key_id = 1;
  KeyStatus status = 2;
  int64 timestamp = 3;
}

message UpdateKeyStatusRequest {
  string key_id = 1;
  uint64 version = 2; // Optional: 0 means the key as a whole
  KeyStatus status = 3;
  string backend = 4;
}

message UpdateKeyStatusResponse {
  string key_id = 1;
  uint64 version = 2;
  KeyStatus status = 3;
  int64 timestamp = 4;
}

message GetKeyMetadataRequest {
  string key_id = 1;
  string backend = 2;
}

message GetKeyMetadataResponse {
  KeyMetadata metadata = 1;
  int64 timestamp = 2;
}

message UpdateKeyMetadataRequest {
  string key_id = 1;
  string name = 2;
  string description = 3;
  map<string, string> tags = 4;
  repeated string remove_tags = 5;
  string backend = 6;
}

message UpdateKeyMetadataResponse {
  KeyMetadata metadata = 1;
  int64 timestamp = 2;
}

message SetKeyPolicyRequest {
  string key_id = 1;
  KeyPolicy policy = 2;
  string backend = 3;
}

message SetKeyPolicyResponse {
  string key_id = 1;
  uint64 policy_version = 2;
  int64 timestamp = 3;
}

message GetKeyPolicyRequest {
  string key_id = 1;
  string backend = 2;
}

message GetKeyPolicyResponse {
  KeyPolicy policy = 1;
  int64 timestamp = 2;
}

// DeleteKeyPolicyRequest removes the access control policy for a key.
message DeleteKeyPolicyRequest {
  string key_id = 1;
  string backend = 2;
}

// DeleteKeyPolicyResponse confirms that the policy was removed.
message DeleteKeyPolicyResponse {
  string key_id = 1;
  int64 timestamp = 2;
}

// SetKeyRotationPolicyRequest sets the automatic rotation policy for a key.
message SetKeyRotationPolicyRequest {
  string key_id = 1;
  RotationPolicy policy = 2;
  string backend = 3;
}

// SetKeyRotationPolicyResponse confirms the rotation policy was applied.
message SetKeyRotationPolicyResponse {
  string key_id = 1;
  // policy is the stored rotation policy (with computed next_rotation).
  RotationPolicy policy = 2;
  int64 timestamp = 3;
}

// GetKeyRotationPolicyRequest retrieves the rotation policy for a key.
message GetKeyRotationPolicyRequest {
  string key_id = 1;
  string backend = 2;
}

// GetKeyRotationPolicyResponse returns the current rotation policy.
message GetKeyRotationPolicyResponse {
  string key_id = 1;
  // policy is the current rotation policy; absent when none is configured.
  RotationPolicy policy = 2;
  int64 timestamp = 3;
}

// DeleteKeyRotationPolicyRequest removes the rotation policy for a key,
// disabling automatic rotation.
message DeleteKeyRotationPolicyRequest {
  string key_id = 1;
  string backend = 2;
}

// DeleteKeyRotationPolicyResponse confirms the rotation policy was removed.
message DeleteKeyRotationPolicyResponse {
  string key_id = 1;
  int64 timestamp = 2;
}

// GetSupportedAlgorithmsRequest names the backend to query (empty means the
// default backend).
message GetSupportedAlgorithmsRequest {
  string backend = 1;
}

// GetSupportedAlgorithmsResponse contains the list of cryptographic algorithms
// supported by the backend.
message GetSupportedAlgorithmsResponse {
  // algorithms is the list of supported algorithm names (e.g., "AES-256-GCM", "ChaCha20-Poly1305").
  repeated string algorithms = 1;
}

// BackendStatusRequest names the backend to query (empty means the default
// backend).
message BackendStatusRequest {
  string backend = 1;
}

// BackendStatusResponse contains information about the KMS backend.
message BackendStatusResponse {
  // backend_type is the backend type (tpm2, awskms, azurekms, gcpkms, software, etc.)
  string backend_type = 1;
  // status is the backend status (healthy, degraded, unavailable)
  string status = 2;
  // device is the device path for TPM backends
  string device = 3;
  // region is the region for cloud KMS backends
  string region = 4;
  // key_id is the key identifier
  string key_id = 5;
  // pcr_banks are the PCR banks available (TPM only)
  repeated string pcr_banks = 6;
  // pcr_registers are the PCR registers in use (TPM only)
  repeated int32 pcr_registers = 7;
  // capabilities indicate what operations the backend supports
  map<string, bool> capabilities = 8;
  // timestamp is when the status was retrieved
  int64 timestamp = 9;
}

// BackendTestRequest names the backend to test (empty means the default
// backend).
message BackendTestRequest {
  string backend = 1;
}

// BackendTestResponse contains the result of a backend test cycle.
message BackendTestResponse {
  // success indicates if the test succeeded
  bool success = 1;
  // duration_ms is how long the test took in milliseconds
  int64 duration_ms = 2;
  // message contains additional information or error details
  string message = 3;
  // timestamp is when the test was performed
  int64 timestamp = 4;
}

message SetKeySafetyRequest {
  string key_id = 1;
  uint64 max_operations = 2;
  uint64 max_bytes = 3;
  int32 warning_percent = 4;
  string backend = 5;
}

message SetKeySafetyResponse {
  string key_id = 1;
  int64 timestamp = 2;
}

message ClearKeySafetyRequest {
  string key_id = 1;
  string backend = 2;
}

message ClearKeySafetyResponse {
  string key_id = 1;
  int64 timestamp = 2;
}

message SafetyCheckRequest {}

message SafetyCheckResponse {
  repeated SafetyWarning warnings = 1;
  int64 timestamp = 2;
}

message SafetyReportRequest {
  string format = 1; // "json", "table", "prometheus"
}

message SafetyReportResponse {
  repeated SafetyWarning all_items = 1;
  int32 total_keys = 2;
  int32 total_deks = 3;
  int32 keys_at_warning = 4;
  int32 keys_at_critical = 5;
  int32 deks_at_warning = 6;
  int32 deks_at_critical = 7;
  int64 timestamp = 8;
}

// KeyAlgorithm specifies the cryptographic algorithm for a key.
enum KeyAlgorithm {
  KEY_ALG_UNSPECIFIED = 0;

  // Symmetric Encryption
  KEY_ALG_AES_128_GCM = 1;
  KEY_ALG_AES_192_GCM = 2;
  KEY_ALG_AES_256_GCM = 3;
  KEY_ALG_CHACHA20_POLY1305 = 4;
  KEY_ALG_XCHACHA20_POLY1305 = 5;

  // RSA
  KEY_ALG_RSA_2048 = 10;
  KEY_ALG_RSA_3072 = 11;
  KEY_ALG_RSA_4096 = 12;

  // ECDSA
  KEY_ALG_ECDSA_P256 = 20;
  KEY_ALG_ECDSA_P384 = 21;
  KEY_ALG_ECDSA_P521 = 22;

  // EdDSA
  KEY_ALG_ED25519 = 30;
  KEY_ALG_ED448 = 31;

  // Key Exchange
  KEY_ALG_X25519 = 40;
  KEY_ALG_X448 = 41;

  // HMAC
  KEY_ALG_HMAC_SHA256 = 50;
  KEY_ALG_HMAC_SHA384 = 51;
  KEY_ALG_HMAC_SHA512 = 52;
}

// KeyStatus represents the lifecycle state of a key.
enum KeyStatus {
  KEY_STATUS_UNSPECIFIED = 0;
  KEY_STATUS_ENABLED = 1;
  KEY_STATUS_DISABLED = 2;
  KEY_STATUS_PENDING_DELETION = 3;
  KEY_STATUS_DELETED = 4;
  KEY_STATUS_ROTATING = 5;
  KEY_STATUS_COMPROMISED = 6;
}

// KeyMetadata contains non-sensitive metadata about a key.
message KeyMetadata {
  string key_id = 1;
  string name = 2;
  string description = 3;
  KeyAlgorithm algorithm = 4;
  KeyStatus status = 5;
  repeated KeyUsage usage = 6;
  uint64 version = 7;
  bool exportable = 8;
  bool deletion_protection = 9;
  int64 created_at = 10; // Unix timestamp
  int64 updated_at = 11; // Unix timestamp
  int64 last_used_at = 12; // Unix timestamp (optional)
  RotationPolicy rotation_policy = 13;
  map<string, string> tags = 14;
  string owner = 15;
}

// KeyPolicy defines access control and usage policies.
message KeyPolicy {
  string key_id = 1;
  uint64 version = 2;
  repeated KeyUsage allowed_operations = 3;
  repeated string allowed_principals = 4;
  repeated string denied_principals = 5;
  int64 expires_at = 6; // Unix timestamp (optional)
  bool rotation_required = 7;
  uint64 max_usage_count = 8;
  bool require_mfa = 9;
  int64 updated_at = 10; // Unix timestamp
}

// RotationPolicy defines automatic key rotation behavior.
message RotationPolicy {
  bool enabled = 1;
  int64 interval_seconds = 2;
  int64 next_rotation = 3; // Unix timestamp
  int32 retain_versions = 4;
  bool auto_rotate = 5;
}

message SafetyWarning {
  string type = 1;           // "key" or "dek"
  string path = 2;           // key_id or dek path
  double usage_percent = 3;
  string status = 4;         // "warning", "critical", "exceeded"
  uint64 operations_used = 5;
  uint64 bytes_used = 6;
  uint64 max_operations = 7;
  uint64 max_bytes = 8;
}

// KeyUsage specifies permitted operations for a key.
enum KeyUsage {
  KEY_USAGE_UNSPECIFIED = 0;
  KEY_USAGE_ENCRYPT = 1;
  KEY_USAGE_DECRYPT = 2;
  KEY_USAGE_SIGN = 3;
  KEY_USAGE_VERIFY = 4;
  KEY_USAGE_WRAP_KEY = 5;
  KEY_USAGE_DERIVE_KEY = 6;
  KEY_USAGE_GENERATE_MAC = 7;
  KEY_USAGE_VERIFY_MAC = 8;
}

// EncryptAsymRequest requests asymmetric encryption (RSA-OAEP)
message EncryptAsymRequest {
  string key_id = 1;
  string backend = 2;
  bytes plaintext = 3;
  string hash = 4;  // Hash algorithm for OAEP (e.g., "sha256")
  // label is the optional OAEP label, RFC 8017's encoding parameter L. It must
  // match the label the matching Decrypt carries, or the decryption fails as
  // though the ciphertext were corrupt. DecryptRequest already carries one;
  // omitting it here meant every encryption over gRPC ran under the empty label
  // while the decryption sent the caller's, so the round trip could not close.
  bytes label = 5;
}

// EncryptAsymResponse contains the asymmetrically encrypted data
message EncryptAsymResponse {
  bytes ciphertext = 1;
  // key_version is the key version whose public key produced the
  // ciphertext: always the current one.
  uint32 key_version = 2;
}

// DeriveKeyRequest requests key derivation using the specified algorithm
message DeriveKeyRequest {
  string backend = 1;              // Backend identifier
  string key_id = 2;               // Source key ID (for key-based derivation like ECDH)
  string algorithm = 3;            // Algorithm: HKDF, ECDH, DH, SP800-108-COUNTER, etc.
  bytes input_key_material = 4;    // Input key material (for HKDF without a key)
  bytes salt = 5;                  // Salt value
  bytes info = 6;                  // Context/application-specific info (HKDF)
  bytes peer_public_key = 7;       // Peer's public key (ECDH/DH key agreement)
  int32 key_length = 8;            // Desired output key length in bytes
  string hash = 9;                 // Hash algorithm (SHA-256, SHA-384, SHA-512)
  int32 iterations = 10;           // Iteration count (PBKDF2)
  string prf = 11;                 // Pseudo-random function (SP800-108)
  bytes label = 12;                // Label (SP800-108)
  bytes context = 13;              // Context (SP800-108)
  uint32 counter = 14;             // Counter value (SP800-108 counter mode)
  bool use_cofactor = 15;          // Use cofactor multiplication (ECDH)
  bool store_result = 16;          // Store the derived key in the backend
  string derived_key_id = 17;      // Key ID for stored derived key
  string derived_key_type = 18;    // Type of derived key (AES, HMAC)
  // key_version optionally names the version of the stored base key to derive
  // from; it must be enabled. 0 derives from the current version.
  uint32 key_version = 19;
}

// DeriveKeyResponse contains the result of key derivation
message DeriveKeyResponse {
  bytes derived_key = 1;           // Derived key material (if store_result is false)
  string key_id = 2;               // Key ID of stored derived key (if store_result is true)
  string algorithm = 3;            // Algorithm used
  int32 key_length = 4;            // Actual output key length in bytes
  // key_version is the version of the stored base key the key was derived
  // from; 0 when the derivation used caller-supplied key material.
  uint32 key_version = 5;
}

// DeriveKeyECDHRequest requests ECDH key agreement and key derivation
// This combines ECDH shared secret computation with a KDF to produce a derived key
message DeriveKeyECDHRequest {
  // key_id identifies the local private key to use for ECDH
  // This key must be an ECDSA key (P-256, P-384, or P-521)
  string key_id = 1;

  // backend specifies which backend contains the private key
  string backend = 2;

  // peer_public_key is the peer's public key in DER or uncompressed point format
  // The public key must use the same curve as the private key
  bytes peer_public_key = 3;

  // kdf_algorithm specifies the KDF to apply to the raw ECDH shared secret
  // Supported values: "HKDF", "SP800-108-COUNTER", "SP800-108-FEEDBACK",
  // "SP800-56A", "X963"
  // If empty, defaults to "HKDF"
  string kdf_algorithm = 4;

  // kdf_hash specifies the hash algorithm for the KDF
  // Supported values: "SHA-256", "SHA-384", "SHA-512"
  // If empty, defaults to "SHA-256"
  string kdf_hash = 5;

  // kdf_salt is an optional salt value for the KDF
  // For HKDF, this is used in the extract phase
  bytes kdf_salt = 6;

  // kdf_info is optional context/application-specific information
  // For HKDF, this is used in the expand phase
  // For SP800-108, this is the Context
  bytes kdf_info = 7;

  // key_length specifies the desired output key length in bytes
  // Must be positive. Common values: 16 (AES-128), 32 (AES-256)
  // If not specified or 0, defaults to 32 bytes
  int32 key_length = 8;

  // kdf_label is the SP800-108 Label, the purpose string bound into the fixed
  // input data as Label || 0x00 || Context || [L]_2 (SP 800-108r1 section 4).
  // It provides domain separation: two protocols deriving from the same shared
  // secret with the same context but different labels get different keys.
  // SP800-108 only; the other constructions have no label input and reject a
  // non-empty value. An empty label is valid and is the default, so a client
  // that does not set it derives exactly what it did before this field existed.
  bytes kdf_label = 9;
  // key_version optionally names the version of the local key to agree
  // with; it must be enabled. 0 uses the current version.
  uint32 key_version = 10;
}

// DeriveKeyECDHResponse contains the derived key from ECDH key agreement
message DeriveKeyECDHResponse {
  // derived_key is the key material derived from ECDH + KDF
  // The length matches the requested key_length
  bytes derived_key = 1;
  // key_version is the version of the local key the agreement used.
  uint32 key_version = 2;
}

// =============================================================================
// Secure ECDH Key Agreement Types
// =============================================================================

// KeyDerivationMode specifies how the derived key from ECDH is handled
enum KeyDerivationMode {
  // KEY_DERIVATION_MODE_EXPORT returns derived key bytes to the caller
  KEY_DERIVATION_MODE_EXPORT = 0;

  // KEY_DERIVATION_MODE_HSM_RESIDENT keeps the derived key inside the HSM
  KEY_DERIVATION_MODE_HSM_RESIDENT = 1;

  // KEY_DERIVATION_MODE_HSM_KDF runs the KDF inside the HSM, then exports the result
  KEY_DERIVATION_MODE_HSM_KDF = 2;

  // KEY_DERIVATION_MODE_TPM_WRAPPED seals the derived key using TPM2
  KEY_DERIVATION_MODE_TPM_WRAPPED = 3;
}

// ResidentKeyOperation identifies operations that can be performed with a resident key
enum ResidentKeyOperation {
  // RESIDENT_KEY_OP_ENCRYPT uses the key for encryption
  RESIDENT_KEY_OP_ENCRYPT = 0;

  // RESIDENT_KEY_OP_DECRYPT uses the key for decryption
  RESIDENT_KEY_OP_DECRYPT = 1;

  // RESIDENT_KEY_OP_MAC uses the key for MAC computation
  RESIDENT_KEY_OP_MAC = 2;

  // RESIDENT_KEY_OP_VERIFY_MAC uses the key for MAC verification
  RESIDENT_KEY_OP_VERIFY_MAC = 3;

  // RESIDENT_KEY_OP_WRAP uses the key to wrap another key
  RESIDENT_KEY_OP_WRAP = 4;

  // RESIDENT_KEY_OP_UNWRAP uses the key to unwrap another key
  RESIDENT_KEY_OP_UNWRAP = 5;
}

// DerivedKeyHandle references a key that resides within an HSM or TPM
message DerivedKeyHandle {
  // id is a unique identifier for this derived key
  string id = 1;

  // backend identifies which backend contains this key
  string backend = 2;

  // extractable indicates whether the key can be exported
  bool extractable = 3;

  // key_length is the length of the derived key in bytes
  int32 key_length = 4;

  // algorithm identifies the key type (e.g., "AES", "HMAC")
  string algorithm = 5;

  // ephemeral indicates the key should be destroyed when the session ends
  bool ephemeral = 6;

  // hsm_handle is the PKCS#11 object handle for HSM-resident keys
  uint64 hsm_handle = 7;

  // tpm_handle contains TPM-specific handle information
  TPMDerivedKeyHandle tpm_handle = 8;
}

// TPMDerivedKeyHandle contains TPM-specific information for derived keys
message TPMDerivedKeyHandle {
  // handle is the TPM object handle
  uint32 handle = 1;

  // parent_handle is the handle of the parent storage key
  uint32 parent_handle = 2;

  // public contains the TPM2B_PUBLIC structure for the key
  bytes public = 3;

  // private contains the TPM2B_PRIVATE structure (encrypted)
  bytes private = 4;

  // policy_digest is the policy digest if policy-based authorization is used
  bytes policy_digest = 5;
}

// DerivedKeyTemplate specifies attributes for HSM-resident derived keys
message DerivedKeyTemplate {
  // label is a human-readable name for the key
  string label = 1;

  // id is an optional byte identifier for the key
  string id = 2;

  // key_type specifies the type of key to create (e.g., "AES", "GENERIC_SECRET")
  string key_type = 3;

  // token indicates whether the key should persist on the token
  bool token = 4;

  // private indicates whether the key requires login to use
  bool private = 5;

  // sensitive indicates the key is sensitive and should never be revealed
  bool sensitive = 6;

  // allow_encrypt permits use for encryption operations
  bool allow_encrypt = 7;

  // allow_decrypt permits use for decryption operations
  bool allow_decrypt = 8;

  // allow_wrap permits use for key wrapping operations
  bool allow_wrap = 9;

  // allow_unwrap permits use for key unwrapping operations
  bool allow_unwrap = 10;

  // allow_derive permits use for further key derivation
  bool allow_derive = 11;
}

// OperationParams contains parameters for operations using resident keys
message OperationParams {
  // algorithm specifies the algorithm to use (e.g., "AES-GCM", "AES-CBC")
  string algorithm = 1;

  // iv is the initialization vector for CBC/CTR modes
  bytes iv = 2;

  // aad is additional authenticated data for AEAD modes
  bytes aad = 3;

  // tag_length is the authentication tag length in bits for AEAD modes
  int32 tag_length = 4;
}

// DeriveKeyECDHSecureRequest requests secure ECDH key agreement with mode selection
message DeriveKeyECDHSecureRequest {
  // key_id identifies the local private key to use for ECDH
  string key_id = 1;

  // backend specifies which backend contains the private key
  string backend = 2;

  // peer_public_key is the peer's public key in DER or uncompressed point format
  bytes peer_public_key = 3;

  // kdf_algorithm specifies the KDF to apply to the raw ECDH shared secret
  string kdf_algorithm = 4;

  // kdf_hash specifies the hash algorithm for the KDF
  string kdf_hash = 5;

  // kdf_salt is an optional salt value for the KDF
  bytes kdf_salt = 6;

  // kdf_info is optional context/application-specific information
  bytes kdf_info = 7;

  // key_length specifies the desired output key length in bytes
  int32 key_length = 8;

  // derivation_mode specifies how the derived key should be handled
  KeyDerivationMode derivation_mode = 9;

  // derived_key_template contains template parameters for HSM-resident keys
  // Only used when derivation_mode is KEY_DERIVATION_MODE_HSM_RESIDENT
  DerivedKeyTemplate derived_key_template = 10;

  // hsm_kdf_type specifies the PKCS#11 KDF type for HSM_KDF mode
  uint32 hsm_kdf_type = 11;
}

// DeriveKeyECDHSecureResponse contains the result of secure ECDH key derivation
message DeriveKeyECDHSecureResponse {
  // mode indicates which derivation mode was used
  KeyDerivationMode mode = 1;

  // derived_key contains the key bytes for EXPORT and HSM_KDF modes
  bytes derived_key = 2;

  // handle references the HSM/TPM-resident key for HSM_RESIDENT and TPM_WRAPPED modes
  DerivedKeyHandle handle = 3;

  // ephemeral_public_key is the ephemeral public key for TPM_WRAPPED mode
  bytes ephemeral_public_key = 4;
}

// UseResidentKeyRequest requests a cryptographic operation using a resident key
message UseResidentKeyRequest {
  // handle is the DerivedKeyHandle from a previous DeriveKeyECDHSecure call
  DerivedKeyHandle handle = 1;

  // operation is the operation to perform
  ResidentKeyOperation operation = 2;

  // data is the input data for the operation
  bytes data = 3;

  // params contains additional parameters for the operation
  OperationParams params = 4;
}

// UseResidentKeyResponse contains the result of a resident key operation
message UseResidentKeyResponse {
  // result is the operation result (ciphertext, plaintext, MAC, etc.)
  bytes result = 1;
}

// DestroyResidentKeyRequest requests destruction of a resident derived key
message DestroyResidentKeyRequest {
  // handle is the DerivedKeyHandle to destroy
  DerivedKeyHandle handle = 1;
}

// DestroyResidentKeyResponse contains the result of key destruction
message DestroyResidentKeyResponse {
  // success indicates whether the key was successfully destroyed
  bool success = 1;
}

// GenerateEphemeralECDHRequest requests ephemeral ECDH key generation in TPM
message GenerateEphemeralECDHRequest {
  // backend specifies which backend to use (must be "tpm2")
  string backend = 1;

  // curve specifies the elliptic curve to use (e.g., "P-256", "P-384")
  string curve = 2;

  // peer_static_public_key is the peer's static public key
  bytes peer_static_public_key = 3;

  // kdf_algorithm specifies the KDF to apply
  string kdf_algorithm = 4;

  // kdf_hash specifies the hash algorithm for the KDF
  string kdf_hash = 5;

  // kdf_salt is an optional salt value for the KDF
  bytes kdf_salt = 6;

  // kdf_info is optional context/application-specific information
  bytes kdf_info = 7;

  // key_length specifies the desired output key length in bytes
  int32 key_length = 8;

  // derivation_mode specifies how the derived key should be handled
  KeyDerivationMode derivation_mode = 9;
}

// GenerateEphemeralECDHResponse contains the result of ephemeral ECDH generation
message GenerateEphemeralECDHResponse {
  // mode indicates which derivation mode was used
  KeyDerivationMode mode = 1;

  // derived_key contains the key bytes for EXPORT mode
  bytes derived_key = 2;

  // handle references the TPM-resident key for TPM_WRAPPED mode
  DerivedKeyHandle handle = 3;

  // ephemeral_public_key is the ephemeral public key that the peer needs
  // to compute the same shared secret
  bytes ephemeral_public_key = 4;
}

// SaveCertRequest requests storage of a certificate
message SaveCertRequest {
  string key_id = 1;
  string cert_pem = 2;
}

// SaveCertResponse contains the result of certificate storage
message SaveCertResponse {
  bool success = 1;
  string message = 2;
}

// GetCertRequest requests retrieval of a certificate
message GetCertRequest {
  string key_id = 1;
}

// GetCertResponse contains the certificate
message GetCertResponse {
  string cert_pem = 1;
}

// DeleteCertRequest requests deletion of a certificate
message DeleteCertRequest {
  string key_id = 1;
}

// DeleteCertResponse contains the result of certificate deletion
message DeleteCertResponse {
  bool success = 1;
  string message = 2;
}

// ListCertsRequest requests a list of all certificates
message ListCertsRequest {}

// ListCertsResponse contains the list of certificate IDs
message ListCertsResponse {
  repeated string key_ids = 1;
  int32 total = 2;
}

// CertExistsRequest checks if a certificate exists
message CertExistsRequest {
  string key_id = 1;
}

// CertExistsResponse contains the result of existence check
message CertExistsResponse {
  bool exists = 1;
}

// SaveCertChainRequest requests storage of a certificate chain
message SaveCertChainRequest {
  string key_id = 1;
  repeated string cert_chain_pem = 2;
}

// SaveCertChainResponse contains the result of certificate chain storage
message SaveCertChainResponse {
  bool success = 1;
  string message = 2;
}

// GetCertChainRequest requests retrieval of a certificate chain
message GetCertChainRequest {
  string key_id = 1;
}

// GetCertChainResponse contains the certificate chain
message GetCertChainResponse {
  repeated string cert_chain_pem = 1;
}

// GetTLSCertificateRequest requests a TLS certificate and its chain
message GetTLSCertificateRequest {
  string key_id = 1;
  string backend = 2;
}

// GetTLSCertificateResponse contains the TLS certificate and its chain.
// The private key never travels on this response: it stays in the backend
// that holds it (go-xkms#627).
message GetTLSCertificateResponse {
  string cert_pem = 1;
  repeated string cert_chain_pem = 2;
}

// GetImportParametersRequest requests parameters needed to import a key
message GetImportParametersRequest {
  string key_id = 1;
  string backend = 2;
  string wrapping_algorithm = 3;  // "RSAES_OAEP_SHA_1", "RSAES_OAEP_SHA_256", "RSA_AES_KEY_WRAP_SHA_1", "RSA_AES_KEY_WRAP_SHA_256"
  string key_type = 4;  // "rsa", "ecdsa", "ed25519", "symmetric"
  int32 key_size = 5;
  string curve = 6;
  string hash = 7;
  string partition = 8;
}

// GetImportParametersResponse contains parameters needed for key import
message GetImportParametersResponse {
  bytes wrapping_public_key = 1;  // DER-encoded public key
  bytes import_token = 2;
  string algorithm = 3;
  google.protobuf.Timestamp expires_at = 4;
  string key_spec = 5;
}

// WrapKeyRequest requests wrapping of key material
message WrapKeyRequest {
  bytes key_material = 1;
  bytes wrapping_public_key = 2;  // DER-encoded public key
  bytes import_token = 3;
  string algorithm = 4;
  string key_spec = 5;
  // Backend whose wrapping semantics are used. The server used to loop over
  // every registered backend until one answered, which made the choice depend
  // on map iteration order; it is now named by the caller.
  string backend = 6;
}

// WrapKeyResponse contains wrapped key material
message WrapKeyResponse {
  bytes wrapped_key = 1;
  string algorithm = 2;
  bytes import_token = 3;
  map<string, string> metadata = 4;
}

// UnwrapKeyRequest requests unwrapping of key material
message UnwrapKeyRequest {
  bytes wrapped_key = 1;
  string algorithm = 2;
  bytes import_token = 3;
  bytes wrapping_public_key = 4;  // DER-encoded public key
  string key_spec = 5;
  map<string, string> metadata = 6;
  // Backend that performs the unwrap. It has to be the backend that produced
  // the wrapped material. The server used to try every registered backend in
  // turn and return the first success, which both made the choice
  // non-deterministic and turned this RPC into an unwrap oracle across
  // backends: a caller learned which backend held a key from which attempt
  // succeeded, and got a free unwrap attempt against every other one.
  string backend = 7;
}

// UnwrapKeyResponse contains unwrapped key material
message UnwrapKeyResponse {
  bytes key_material = 1;
}

// WrapKeyByIDRequest wraps a target key using a wrapping key identified by key IDs.
// This corresponds to PKCS#11 C_WrapKey operation.
message WrapKeyByIDRequest {
  // ID of the key used for wrapping (Key Encryption Key)
  string wrapping_key_id = 1;
  // Backend containing the wrapping key
  string wrapping_key_backend = 2;
  // ID of the key to be wrapped (must be extractable/exportable).
  // Exactly one of target_key_id and target_key_material must be set.
  string target_key_id = 3;
  // Backend containing the target key
  string target_key_backend = 4;
  // Wrapping algorithm (e.g., "RSAES_OAEP_SHA_256", "AES_KEY_WRAP")
  string algorithm = 5;
  // Plaintext of a key the caller holds that is resident in no backend, for
  // PKCS#11 C_WrapKey on a key imported with C_CreateObject and CKA_VALUE.
  bytes target_key_material = 6;
  // CK_GCM_PARAMS.pIv, or the 16-byte AES-CBC IV. Empty asks the service to
  // generate one; it is carried in the wrapped blob either way.
  bytes iv = 7;
  // CK_GCM_PARAMS.pAAD. Authenticated but not encrypted, so it is not carried
  // in the blob and must be repeated on unwrap.
  bytes aad = 8;
  // CK_GCM_PARAMS.ulTagBits (96, 104, 112, 120 or 128). Zero means full length.
  int32 tag_bits = 9;
  // CK_RSA_PKCS_OAEP_PARAMS.pSourceData, the RSA-OAEP label.
  bytes oaep_label = 10;
}

// WrapKeyByIDResponse contains the wrapped key material
message WrapKeyByIDResponse {
  // The wrapped (encrypted) key material
  bytes wrapped_key = 1;
  // Algorithm used for wrapping
  string algorithm = 2;
  // wrapping_key_version is the version of the wrapping key that wrapped the
  // key: always the current one. Pass it back on UnwrapKeyByID.
  uint32 wrapping_key_version = 3;
}

// UnwrapKeyByIDRequest unwraps key material and imports it as a new key.
// This corresponds to PKCS#11 C_UnwrapKey operation.
message UnwrapKeyByIDRequest {
  // The wrapped key material to unwrap
  bytes wrapped_key = 1;
  // ID of the key used for unwrapping
  string unwrapping_key_id = 2;
  // Backend containing the unwrapping key
  string unwrapping_key_backend = 3;
  // Unwrapping algorithm used
  string algorithm = 4;
  // Target key template - attributes for the newly created key
  // ID for the new key
  string target_key_id = 5;
  // Backend to store the new key
  string target_key_backend = 6;
  // Key type: "symmetric", "rsa", "ecdsa", "ed25519"
  string target_key_type = 7;
  // Key size in bits (e.g., 128, 192, 256 for AES)
  int32 target_key_size = 8;
  // Curve for ECDSA keys (e.g., "P-256", "P-384")
  string target_curve = 9;
  // Partition for the new key
  string target_partition = 10;
  // Whether the new key can be exported
  bool target_exportable = 11;
  // CK_GCM_PARAMS.pIv, or the 16-byte AES-CBC IV. Normally empty: the framing
  // WrapKeyByID produced carries it inside wrapped_key.
  bytes iv = 12;
  // CK_GCM_PARAMS.pAAD. Never carried in the blob, so an AES-GCM wrap made
  // with AAD can only be reversed by repeating it here.
  bytes aad = 13;
  // CK_GCM_PARAMS.ulTagBits. Must equal the value the wrap used.
  int32 tag_bits = 14;
  // CK_RSA_PKCS_OAEP_PARAMS.pSourceData. Must equal the label the wrap used.
  bytes oaep_label = 15;
  // unwrapping_key_version optionally names the unwrapping key's version; it
  // must be enabled. 0 tries every enabled version, newest first, for AES-KW,
  // AES-KWP, AES-GCM and RSA-OAEP, and requires exactly one enabled version
  // for AES-CBC and RSA PKCS#1 v1.5.
  uint32 unwrapping_key_version = 16;
}

// UnwrapKeyByIDResponse contains the result of the unwrap operation
message UnwrapKeyByIDResponse {
  // ID of the newly created key
  string key_id = 1;
  // Backend where the key was stored
  string backend = 2;
  // Whether the operation succeeded
  bool success = 3;
  // Status message
  string message = 4;
}

// ImportKeyRequest requests import of externally generated key material
message ImportKeyRequest {
  string key_id = 1;
  string backend = 2;
  bytes wrapped_key = 3;
  string algorithm = 4;
  bytes import_token = 5;
  map<string, string> metadata = 6;
  string key_type = 7;  // "rsa", "ecdsa", "ed25519", "symmetric"
  int32 key_size = 8;
  string curve = 9;
  string hash = 10;
  string partition = 11;
  // exportable records whether the imported key may leave the backend again.
  // Unset keeps the write-once default: true for symmetric material, false
  // for asymmetric; an explicit false imports non-extractable secret material.
  optional bool exportable = 12;
  // sensitive carries PKCS#11 CKA_SENSITIVE: the plaintext may never be
  // released. Independent of exportable, as on GenerateKeyRequest.
  bool sensitive = 13;
}

// ImportKeyResponse contains the result of key import
message ImportKeyResponse {
  bool success = 1;
  string message = 2;
  string key_id = 3;
}

// ExportKeyRequest requests export of a key in wrapped form
message ExportKeyRequest {
  string key_id = 1;
  string backend = 2;
  string wrapping_algorithm = 3;
}

// ExportKeyResponse contains wrapped key material for export
message ExportKeyResponse {
  bytes wrapped_key = 1;
  string algorithm = 2;
  bytes import_token = 3;
  map<string, string> metadata = 4;
}

// ExportKeyMaterialRequest requests export of raw symmetric key bytes.
//
// SECURITY WARNING: This exports plaintext key material without cryptographic
// protection. Only use for extractable symmetric keys.
message ExportKeyMaterialRequest {
  // Key identifier
  string key_id = 1;
  // Backend containing the key
  string backend = 2;
}

// ExportKeyMaterialResponse contains the raw key material.
//
// SECURITY WARNING: The key_material field contains plaintext secret key bytes.
// Handle with extreme care - do not log, store insecurely, or transmit over
// untrusted channels.
message ExportKeyMaterialResponse {
  // Raw key bytes (plaintext symmetric key material)
  bytes key_material = 1;
  // Type of the key (e.g., "aes256-gcm", "chacha20-poly1305")
  string key_type = 2;
  // Size of the key in bits (e.g., 128, 192, 256)
  int32 key_size = 3;
}

// CopyKeyRequest requests copying a key from one backend to another
message CopyKeyRequest {
  string source_backend = 1;
  string source_key_id = 2;
  string dest_backend = 3;
  string dest_key_id = 4;
  string wrapping_algorithm = 5;  // Wrapping algorithm to use for secure transport
}

// CopyKeyResponse contains the result of key copy operation
message CopyKeyResponse {
  bool success = 1;
  string message = 2;
  string dest_key_id = 3;
}

// ==================== Sealing Operations Messages ====================

// SealRequest requests sealing (encryption) of data using the backend's sealing mechanism
message SealRequest {
  string backend = 1;
  string key_id = 2;
  bytes data = 3;
  bytes aad = 4; // Additional authenticated data (optional)
  // The TPM2 sealed object's authorization value. With a TPM policy it counts
  // only inside the policy; without one it is the object's only protection.
  // It is bytes, not string, so a server can hold it as a slice it wipes. The
  // wire type is unchanged (both are length-delimited), so peers built against
  // the string field still interoperate for any UTF-8 password.
  bytes password = 5;
  // The TPM policy a TPM2 sealed object is bound to: "platform", a named
  // policy of the tenant's scope, or empty for none. A TPM2 seal needs a
  // policy, a password or both.
  string tpm_policy = 6;
}

// SealResponse contains the sealed data. metadata values are base64.
message SealResponse {
  string backend = 1;
  bytes ciphertext = 2;
  bytes nonce = 3;
  bytes tag = 4;
  map<string, string> metadata = 5;
  // The TPM2 sealed object's public and private areas.
  bytes tpm_public = 6;
  bytes tpm_private = 7;
  // The wrapped data-encryption key of an envelope-sealing backend.
  bytes wrapped_dek = 8;
  // The key (or TPM2 sealed object) that performed the sealing.
  string key_id = 9;
  // key_version is the version of the sealing key that sealed the data; 0 for
  // a TPM2 sealed object, which has no versions. Pass it back on Unseal.
  uint32 key_version = 10;
}

// UnsealRequest requests unsealing (decryption) of previously sealed data:
// a ciphertext, or a TPM2 sealed object's public and private areas.
// metadata values are base64, as SealResponse returns them.
message UnsealRequest {
  string backend = 1;
  string key_id = 2;
  bytes ciphertext = 3;
  bytes nonce = 4;
  bytes tag = 5;
  bytes aad = 6;
  bytes tpm_public = 7;
  bytes tpm_private = 8;
  bytes wrapped_dek = 9;
  map<string, string> metadata = 10;
  // The sealed object's authorization value (TPM2). bytes for the reason
  // SealRequest.password is.
  bytes password = 11;
  // key_version is the sealing key version SealResponse.key_version
  // reported. 0 tries every enabled version, newest first.
  uint32 key_version = 12;
}

// UnsealResponse contains the unsealed (decrypted) data
message UnsealResponse {
  bytes plaintext = 1;
}

// CanSealRequest checks if a backend supports sealing operations
message CanSealRequest {
  string backend = 1; // Optional - if empty, checks default backend
}

// CanSealResponse contains the sealing capability status
message CanSealResponse {
  bool can_seal = 1;
}

// ==================== Attestation Operations Messages ====================

// AttestKeyRequest contains parameters for requesting key attestation.
message AttestKeyRequest {
  string backend = 1;
  string key_id = 2;
  bytes nonce = 3;
}

// AttestKeyResponse contains the attestation statement.
message AttestKeyResponse {
  string format = 1;
  repeated bytes certificate_chain = 2;
  bytes attestation_data = 3;
  bytes signature = 4;
  string signature_algorithm = 5;
  bytes nonce = 6;
  string backend = 7;
}

// ==================== FROST Threshold Signature Messages ====================

// FrostKeyInfo contains information about a FROST key
message FrostKeyInfo {
  string key_id = 1;
  string algorithm = 2;  // FROST ciphersuite (e.g., "FROST-Ed25519-SHA512")
  int32 threshold = 3;   // Minimum signers required (M)
  int32 total = 4;       // Total participants (N)
  uint32 participant_id = 5;
  bytes group_public_key = 6;
  repeated string participants = 7;  // Participant names/identifiers
  google.protobuf.Timestamp created_at = 8;
}

// FrostKeyPackage represents a participant's key package for import/export
message FrostKeyPackage {
  string key_id = 1;
  string algorithm = 2;
  int32 threshold = 3;
  int32 total = 4;
  uint32 participant_id = 5;
  string participant_name = 6;
  bytes secret_share = 7;
  bytes group_public_key = 8;
  map<uint32, bytes> verification_shares = 9;
}

// FrostCommitment represents a participant's nonce commitments
message FrostCommitment {
  uint32 participant_id = 1;
  bytes hiding_commitment = 2;
  bytes binding_commitment = 3;
}

// FrostSignatureShare represents a participant's signature share
message FrostSignatureShare {
  uint32 participant_id = 1;
  string session_id = 2;
  bytes share = 3;
}

// FrostGenerateKeyRequest requests generation of FROST key packages
message FrostGenerateKeyRequest {
  string key_id = 1;           // Custom key identifier (auto-generated if empty)
  string algorithm = 2;        // FROST ciphersuite (default: "FROST-Ed25519-SHA512")
  int32 threshold = 3;         // Minimum signers required (M)
  int32 total = 4;             // Total participants (N)
  repeated string participants = 5;  // Participant names/identifiers
  uint32 participant_id = 6;   // This participant's ID (1 to total); 0 = dealer mode
  bool dealer_mode = 7;        // Generate all packages (trusted dealer mode)
}

// FrostGenerateKeyResponse contains the generated key information
message FrostGenerateKeyResponse {
  string key_id = 1;
  string algorithm = 2;
  int32 threshold = 3;
  int32 total = 4;
  bytes group_public_key = 5;
  uint32 participant_id = 6;   // Only set in participant mode
  repeated FrostKeyPackage packages = 7;  // All packages in dealer mode
  google.protobuf.Timestamp created_at = 8;
}

// FrostImportKeyRequest requests import of a FROST key package
message FrostImportKeyRequest {
  FrostKeyPackage package = 1;
}

// FrostImportKeyResponse contains the result of key package import
message FrostImportKeyResponse {
  bool success = 1;
  string message = 2;
  string key_id = 3;
  uint32 participant_id = 4;
  bytes group_public_key = 5;
}

// FrostListKeysRequest requests listing of all FROST keys
message FrostListKeysRequest {
  int32 limit = 1;
  int32 offset = 2;
}

// FrostListKeysResponse contains the list of FROST keys
message FrostListKeysResponse {
  repeated FrostKeyInfo keys = 1;
  int32 total = 2;
}

// FrostGetKeyRequest requests information about a specific FROST key
message FrostGetKeyRequest {
  string key_id = 1;
}

// FrostGetKeyResponse contains FROST key information
message FrostGetKeyResponse {
  FrostKeyInfo key = 1;
}

// FrostDeleteKeyRequest requests deletion of a FROST key
message FrostDeleteKeyRequest {
  string key_id = 1;
}

// FrostDeleteKeyResponse contains the result of key deletion
message FrostDeleteKeyResponse {
  bool success = 1;
  string message = 2;
}

// FrostGenerateNoncesRequest requests generation of nonces for Round 1
message FrostGenerateNoncesRequest {
  string key_id = 1;
}

// FrostGenerateNoncesResponse contains the nonces and commitments for Round 1
message FrostGenerateNoncesResponse {
  uint32 participant_id = 1;
  string session_id = 2;
  bytes hiding_nonce = 3;      // Secret - keep private
  bytes binding_nonce = 4;     // Secret - keep private
  bytes hiding_commitment = 5; // Public - share with participants
  bytes binding_commitment = 6; // Public - share with participants
}

// FrostSignRoundRequest requests generation of a signature share for Round 2
message FrostSignRoundRequest {
  string key_id = 1;
  bytes message = 2;
  string session_id = 3;
  bytes hiding_nonce = 4;      // This participant's hiding nonce
  bytes binding_nonce = 5;     // This participant's binding nonce
  bytes hiding_commitment = 6; // This participant's hiding commitment
  bytes binding_commitment = 7; // This participant's binding commitment
  repeated FrostCommitment commitments = 8;  // All participants' commitments
}

// FrostSignRoundResponse contains the signature share
message FrostSignRoundResponse {
  uint32 participant_id = 1;
  string session_id = 2;
  bytes signature_share = 3;
}

// FrostAggregateRequest requests aggregation of signature shares
message FrostAggregateRequest {
  string key_id = 1;
  bytes message = 2;
  repeated FrostCommitment commitments = 3;
  repeated FrostSignatureShare shares = 4;
  bool verify = 5;  // Verify signature after aggregation (default: true)
}

// FrostAggregateResponse contains the final aggregated signature
message FrostAggregateResponse {
  bytes signature = 1;
  bool verified = 2;
}

// FrostVerifyRequest requests verification of a FROST signature
message FrostVerifyRequest {
  string key_id = 1;
  bytes message = 2;
  bytes signature = 3;
}

// FrostVerifyResponse contains the verification result
message FrostVerifyResponse {
  bool valid = 1;
  string message = 2;
}

// ==================== CA Bundle Messages ====================

// GetCABundleRequest requests the CA certificate bundle
message GetCABundleRequest {
  // Optional: Filter by store type ("software", "tpm2", "pkcs11")
  string store_type = 1;
  // Optional: Filter by algorithm ("RSA", "ECDSA", "Ed25519")
  string algorithm = 2;
}

// GetCABundleResponse contains the CA certificate bundle
message GetCABundleResponse {
  // PEM-encoded certificate chain (intermediate + root)
  bytes bundle_pem = 1;
  // Individual DER-encoded certificates
  repeated bytes certificates = 2;
  // Content type: "application/pem-certificate-chain"
  string content_type = 3;
}

// ==================== CA Operations Messages ====================

// GetCACertificateRequest requests the CA certificate.
message GetCACertificateRequest {
  string identity = 1;
}

// GetCACertificateResponse contains the CA certificate.
message GetCACertificateResponse {
  bytes certificate_pem = 1;
  string subject = 2;
  string issuer = 3;
  string serial_number = 4;
  string not_before = 5;
  string not_after = 6;
  bool is_ca = 7;
}

// SignCSRRequest contains a CSR to be signed.
message SignCSRRequest {
  bytes csr_pem = 1;
  string profile = 2;
  int32 validity_days = 3;
  // tenant_id names the tenant stamped into the certificate's SPIFFE URI SAN;
  // a tenant-scoped caller may name only its own tenant.
  string tenant_id = 4;
  // spiffe_kind selects the SPIFFE URI's workload kind, "user" or "svc";
  // empty keeps the default. "svc" requires certs:issue_service
  // (go-xkms#1659).
  string spiffe_kind = 5;
}

// SignCSRResponse contains the signed certificate.
message SignCSRResponse {
  bytes certificate_pem = 1;
  bytes chain_pem = 2;
  string serial_number = 3;
}

// IssueCertificateRequest requests certificate issuance.
message IssueCertificateRequest {
  string profile = 1;
  string common_name = 2;
  string organization = 3;
  repeated string sans = 4;
  int32 validity_days = 5;
  string algorithm = 6;
}

// IssueCertificateResponse contains the issued certificate.
message IssueCertificateResponse {
  bytes certificate_pem = 1;
  bytes chain_pem = 2;
  bytes private_key_pem = 3;
  string serial_number = 4;
}

// RevokeCertificateRequest requests certificate revocation.
message RevokeCertificateRequest {
  string serial_number = 1;
  int32 reason = 2;
}

// RevokeCertificateResponse confirms revocation.
message RevokeCertificateResponse {
  bool success = 1;
  string message = 2;
}

// GenerateCRLRequest requests CRL generation.
message GenerateCRLRequest {}

// GenerateCRLResponse contains the generated CRL.
message GenerateCRLResponse {
  bytes crl_pem = 1;
}

// IsRevokedRequest checks revocation status.
message IsRevokedRequest {
  string serial_number = 1;
}

// IsRevokedResponse contains the revocation status.
message IsRevokedResponse {
  bool revoked = 1;
  int32 reason = 2;
  string message = 3;
}

// ==================== TCG Certificate Messages ====================

// IssueEKCertificateRequest requests issuance of an Endorsement Key certificate.
message IssueEKCertificateRequest {
  string common_name = 1;
  string organization = 2;
  bytes ek_public_key = 3;
}

// IssueEKCertificateResponse contains the issued EK certificate.
message IssueEKCertificateResponse {
  bytes certificate_der = 1;
  bytes certificate_pem = 2;
  string serial_number = 3;
}

// IssueAKCertificateRequest requests issuance of an Attestation Key certificate.
message IssueAKCertificateRequest {
  string common_name = 1;
  string organization = 2;
  bytes public_key = 3;
}

// IssueAKCertificateResponse contains the issued AK certificate.
message IssueAKCertificateResponse {
  bytes certificate_der = 1;
  bytes certificate_pem = 2;
  string serial_number = 3;
}

// SignTCGCSRRequest requests signing of a TCG-CSR-IDEVID.
message SignTCGCSRRequest {
  string common_name = 1;
  string organization = 2;
  bytes tcg_csr = 3;
}

// SignTCGCSRResponse contains the signed IAK and IDevID certificates.
message SignTCGCSRResponse {
  bytes iak_cert_der = 1;
  bytes idevid_cert_der = 2;
}

// EnrollDeviceRequest requests full TCG device enrollment.
message EnrollDeviceRequest {
  string common_name = 1;
  string organization = 2;
  bytes packed_csr = 3;
}

// EnrollDeviceResponse contains the enrollment result with certificates and challenge.
message EnrollDeviceResponse {
  bytes iak_cert_der = 1;
  bytes idevid_cert_der = 2;
  bytes credential_blob = 3;
  bytes encrypted_secret = 4;
  bytes plain_secret = 5;
}

// IssueLAKCertificateRequest requests issuance of a Local Attestation Key
// certificate in the WebAuthn Level 2 section 8.3.1 profile (go-xkms#715).
// The LAK's certificate has no Subject, so this carries no common_name or
// organization, unlike the other TCG issuance requests above.
message IssueLAKCertificateRequest {
  string tpm_manufacturer = 1;
  string tpm_model = 2;
  string tpm_firmware_version = 3;
  bytes iak_certificate_der = 4;
  bytes certify_info = 5;
  bytes signature = 6;
  int32 signature_algorithm = 7;
  bytes lak_public_area = 8;
  bytes nonce = 9;
}

// IssueLAKCertificateResponse contains the issued LAK certificate.
message IssueLAKCertificateResponse {
  bytes certificate_der = 1;
  bytes certificate_pem = 2;
  string serial_number = 3;
}

// BootstrapListenerKeysResponse reports the running trust-bootstrap
// listener's public static keys (go-xkms#632). Only public material is
// ever returned. Both fields are hex-encoded in exactly the form
// pkg/trust/bootstrap.NoiseConfig accepts: noise_public_key is the value
// for NoiseConfig.ServerStaticKey / `--noise-key`, and p256_public_key is
// the value for NoiseConfig.ServerP256StaticKey / `--p256-key`. A field is
// empty when that suite is not offered by this build/configuration; at
// least one field is populated whenever this response is returned at all.
message BootstrapListenerKeysResponse {
  // noise_public_key is the hex-encoded Noise_NK (X25519) static public key.
  string noise_public_key = 1;
  // p256_public_key is the hex-encoded uncompressed P-256 static public key
  // of the FIPS-approved TSBOOT1_P256_AESGCM_SHA256 suite.
  string p256_public_key = 2;
}

// ==================== PIN Operations Messages ====================

// SetSOPINRequest requests setting the Security Officer PIN.
message SetSOPINRequest {
  // current_so_pin must match the existing SO PIN, or be empty if not yet set.
  string current_so_pin = 1;
  // new_so_pin is the new Security Officer PIN to set.
  string new_so_pin = 2;
}

// SetUserPINRequest requests setting the user PIN.
message SetUserPINRequest {
  // so_pin is required for SO PIN authorization.
  string so_pin = 1;
  // new_user_pin is the new user PIN to set.
  string new_user_pin = 2;
}

// ChangeSOPINRequest requests changing the Security Officer PIN.
message ChangeSOPINRequest {
  // current_so_pin is the current SO PIN for verification.
  string current_so_pin = 1;
  // new_so_pin is the new SO PIN to set.
  string new_so_pin = 2;
}

// ChangeUserPINRequest requests changing the user PIN.
message ChangeUserPINRequest {
  // current_user_pin is the current user PIN for verification.
  string current_user_pin = 1;
  // new_user_pin is the new user PIN to set.
  string new_user_pin = 2;
}

// VerifySOPINRequest requests verification of the Security Officer PIN.
message VerifySOPINRequest {
  // so_pin is the SO PIN to verify.
  string so_pin = 1;
}

// VerifyUserPINRequest requests verification of the user PIN.
message VerifyUserPINRequest {
  // user_pin is the user PIN to verify.
  string user_pin = 1;
}

// LockoutStatusResponse reports the current PIN lockout state.
message LockoutStatusResponse {
  // failed_attempts is the number of consecutive failed PIN attempts.
  int32 failed_attempts = 1;
  // max_attempts is the maximum allowed failed attempts before lockout.
  int32 max_attempts = 2;
  // is_locked is true when the PIN is locked due to too many failed attempts.
  bool is_locked = 3;
  // lockout_until is the time when the lockout expires (RFC 3339).
  // Empty if not locked.
  string lockout_until = 4;
  // recovery_seconds is the number of seconds remaining until lockout expires.
  int32 recovery_seconds = 5;
}

// ResetLockoutRequest requests resetting the PIN lockout counter.
message ResetLockoutRequest {
  // so_pin is the Security Officer PIN for authorization.
  string so_pin = 1;
}

// ==================== PIV Operations Messages ====================

// PIVSlotStatus describes the status of a single PIV slot.
message PIVSlotStatus {
  // slot is the PIV slot identifier (e.g., "9a", "9c", "9d", "9e").
  string slot = 1;
  // name is the human-readable slot name (e.g., "Authentication").
  string name = 2;
  // description is a longer description of the slot's purpose.
  string description = 3;
  // has_cert indicates whether the slot contains a certificate.
  bool has_cert = 4;
  // subject is the certificate subject CN (populated when has_cert is true).
  string subject = 5;
  // algorithm is the key algorithm (e.g., "ECDSA", "RSA").
  string algorithm = 6;
  // key_size is the key size in bits.
  int32 key_size = 7;
  // not_after is the certificate expiry date (RFC 3339).
  string not_after = 8;
  // fingerprint is the certificate SHA-256 fingerprint.
  string fingerprint = 9;
}

// ListPIVSlotsRequest requests listing all PIV slots.
message ListPIVSlotsRequest {
  // backend is the backend identifier.
  string backend = 1;
}

// ListPIVSlotsResponse contains the list of PIV slot statuses.
message ListPIVSlotsResponse {
  // slots contains the status of each PIV slot.
  repeated PIVSlotStatus slots = 1;
}

// GetPIVCertificateRequest requests retrieval of a PIV certificate.
message GetPIVCertificateRequest {
  // backend is the backend identifier.
  string backend = 1;
  // slot is the PIV slot identifier.
  string slot = 2;
  // format is the certificate format ("pem" or "der").
  string format = 3;
}

// GetPIVCertificateResponse contains the PIV certificate data.
message GetPIVCertificateResponse {
  // slot is the PIV slot identifier.
  string slot = 1;
  // certificate is the certificate data in the requested format.
  bytes certificate = 2;
  // format is the certificate format.
  string format = 3;
}

// StorePIVCertificateRequest requests storing a certificate in a PIV slot.
message StorePIVCertificateRequest {
  // backend is the backend identifier.
  string backend = 1;
  // slot is the PIV slot identifier.
  string slot = 2;
  // certificate is the certificate data.
  bytes certificate = 3;
  // format is the certificate format ("pem" or "der").
  string format = 4;
}

// DeletePIVCertificateRequest requests deletion of a PIV certificate.
message DeletePIVCertificateRequest {
  // backend is the backend identifier.
  string backend = 1;
  // slot is the PIV slot identifier.
  string slot = 2;
}

// GeneratePIVKeyRequest requests generation of a key pair in a PIV slot.
message GeneratePIVKeyRequest {
  // backend is the backend identifier.
  string backend = 1;
  // slot is the PIV slot identifier.
  string slot = 2;
  // algorithm is the key algorithm ("rsa2048", "rsa4096", "ecdsap256", "ecdsap384", "ed25519").
  string algorithm = 3;
  // subject is the certificate subject CN.
  string subject = 4;
}

// GeneratePIVKeyResponse contains the result of PIV key generation.
message GeneratePIVKeyResponse {
  // slot is the PIV slot identifier.
  string slot = 1;
  // certificate is the self-signed certificate (PEM-encoded).
  bytes certificate = 2;
  // public_key is the public key (PEM-encoded).
  bytes public_key = 3;
}

// GeneratePIVCSRRequest requests generation of a CSR for a PIV slot key.
message GeneratePIVCSRRequest {
  // backend is the backend identifier.
  string backend = 1;
  // slot is the PIV slot identifier.
  string slot = 2;
  // subject is the CSR subject CN.
  string subject = 3;
}

// GeneratePIVCSRResponse contains the generated CSR.
message GeneratePIVCSRResponse {
  // slot is the PIV slot identifier.
  string slot = 1;
  // csr is the PEM-encoded certificate signing request.
  bytes csr = 2;
}

// ==================== Algorithm Discovery Messages ====================

// AlgorithmsRequest requests the supported-algorithm inventory.
message AlgorithmsRequest {}

// AlgorithmInfo describes one algorithm and the backends providing it.
message AlgorithmInfo {
  string algorithm = 1;
  repeated string curves = 2;
  repeated int32 key_sizes = 3;
  repeated string backends = 4;
  bool post_quantum = 5;
}

// AlgorithmsResponse groups the supported algorithms by purpose.
message AlgorithmsResponse {
  repeated AlgorithmInfo signing = 1;
  repeated AlgorithmInfo key_encapsulation = 2;
}


// ==================== Tenant Messages ====================

// TenantInfo represents a tenant.
message TenantInfo {
  string id = 1;
  string name = 2;
  string description = 3;
  string status = 4;
  string created_at = 5;
  string updated_at = 6;
  // isolation_type is the tenant's isolation mode (prefix / barrier / volume /
  // raft). Empty for legacy tenants (resolves to prefix).
  string isolation_type = 7;
  // quotas are the tenant's resource limits (omitted when unset).
  TenantQuotas quotas = 8;
  // entitlements are the tenant's permitted isolation tiers / features.
  TenantEntitlements entitlements = 9;
}

// TenantQuotas describes a tenant's resource limits.
message TenantQuotas {
  int64 max_databases = 1;
  int64 max_raft_groups = 2;
  int64 max_replicas_per_group = 3;
  int64 max_total_replicas = 4;
  int64 max_collections = 5;
  int64 max_keys = 6;
  int64 max_storage_bytes = 7;
  int64 max_database_size_bytes = 8;
  int64 max_users = 9;
  int64 max_roles = 10;
  int64 max_certificates = 11;
  int64 max_backups = 12;
  int64 max_vector_dims = 13;
  int64 max_ts_metrics = 14;
}

// TenantEntitlements describes which isolation tiers and dedicated-storage
// features a tenant's plan permits.
message TenantEntitlements {
  repeated string allowed_isolation_modes = 1;
  bool allow_dedicated_raft = 2;
  bool allow_volume_storage = 3;
  bool allow_system_managed_barrier = 4;
}

// UpdateTenantEntitlementsRequest updates a tenant's feature entitlements.
message UpdateTenantEntitlementsRequest {
  string tenant_id = 1;
  TenantEntitlements entitlements = 2;
}

// UpdateTenantEntitlementsResponse contains the updated tenant.
message UpdateTenantEntitlementsResponse {
  TenantInfo tenant = 1;
}

// UpdateTenantQuotasRequest updates a tenant's resource quotas.
message UpdateTenantQuotasRequest {
  string tenant_id = 1;
  TenantQuotas quotas = 2;
}

// UpdateTenantQuotasResponse contains the updated tenant.
message UpdateTenantQuotasResponse {
  TenantInfo tenant = 1;
}

// CreateTenantRequest requests creation of a new tenant.
message CreateTenantRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  // isolation_type selects the tenant's isolation mode (prefix / barrier /
  // volume / raft). Empty defaults to prefix (barrier isolation is opt-in).
  string isolation_type = 4;
  // barrier_auto_unseal opts a dedicated-isolation tenant into system-managed
  // auto-unseal (entitlement-gated). Default false is self-managed.
  bool barrier_auto_unseal = 5;
}

// CreateTenantResponse contains the created tenant.
message CreateTenantResponse {
  TenantInfo tenant = 1;
}

// GetTenantRequest requests retrieval of a tenant.
message GetTenantRequest {
  string tenant_id = 1;
}

// GetTenantResponse contains the tenant.
message GetTenantResponse {
  TenantInfo tenant = 1;
}

// ListTenantsRequest requests listing of all tenants.
message ListTenantsRequest {}

// ListTenantsResponse contains the list of tenants.
message ListTenantsResponse {
  repeated TenantInfo tenants = 1;
}

// DeleteTenantRequest requests deletion of a tenant.
message DeleteTenantRequest {
  string tenant_id = 1;
}

// ==================== Password Store Messages ====================

// PasswordEntry represents a stored password.
message PasswordEntry {
  string id = 1;
  string name = 2;
  string username = 3;
  string password = 4;
  string url = 5;
  string notes = 6;
  string folder_path = 7;
  string backend_id = 8;
  google.protobuf.Timestamp expires_at = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  bool read_only = 12;
  bool encrypted = 13;
  string owner_id = 14;
  bool shared = 15;
}

// PasswordAddRequest requests adding a new password entry.
message PasswordAddRequest {
  string name = 1;
  string username = 2;
  string password = 3;
  string url = 4;
  string notes = 5;
  string folder_path = 6;
  string expires_at = 7;
  bool shared = 8;
}

// PasswordAddResponse contains the result of adding a password.
message PasswordAddResponse {
  string id = 1;
  string name = 2;
  string created_at = 3;
}

// PasswordGetRequest requests retrieval of a password entry.
message PasswordGetRequest {
  reserved 2;
  reserved "decrypt";
  string id = 1;
}

// PasswordGetResponse contains the password entry.
message PasswordGetResponse {
  PasswordEntry entry = 1;
}

// PasswordListRequest requests listing of password entries.
message PasswordListRequest {
  string folder_path = 1;
  string scope = 2;
}

// PasswordListResponse contains the list of password entries.
message PasswordListResponse {
  repeated PasswordEntry passwords = 1;
  int32 total = 2;
}

// PasswordUpdateRequest requests updating a password entry.
message PasswordUpdateRequest {
  string id = 1;
  optional string name = 2;
  optional string username = 3;
  optional string password = 4;
  optional string url = 5;
  optional string notes = 6;
  optional string folder_path = 7;
  optional string expires_at = 8;
}

// PasswordUpdateResponse contains the result of updating a password.
message PasswordUpdateResponse {
  string id = 1;
  string message = 2;
}

// PasswordDeleteRequest requests deletion of a password entry.
message PasswordDeleteRequest {
  string id = 1;
}

// PasswordDeleteResponse contains the result of deleting a password.
message PasswordDeleteResponse {
  bool success = 1;
  string message = 2;
}

// ==================== PKCS#11 State Messages ====================
// Opaque per-tenant/per-token key-value records for the remote-mode PKCS#11
// module. tenant_id empty is the system scope; token is the token label; key is
// the module's own storage key; value is an opaque serialised record.

message PKCS11StatePutRequest {
  string tenant_id = 1;
  string token = 2;
  string key = 3;
  bytes value = 4;
}
message PKCS11StatePutResponse {}

message PKCS11StatePutIfAbsentRequest {
  string tenant_id = 1;
  string token = 2;
  string key = 3;
  bytes value = 4;
}
message PKCS11StatePutIfAbsentResponse {
  bool stored = 1;
}

message PKCS11StateCASRequest {
  reserved 6;
  reserved "expect_absent";
  string tenant_id = 1;
  string token = 2;
  string key = 3;
  bytes expected = 4;
  bytes new = 5;
}
message PKCS11StateCASResponse {
  bool swapped = 1;
  bytes current = 2;
}

// PKCS11StateCADRequest is the guarded delete: the record is removed only if
// its current value equals expected. A nil/empty expected matches a stored
// empty value only; it never means "require absent".
message PKCS11StateCADRequest {
  string tenant_id = 1;
  string token = 2;
  string key = 3;
  bytes expected = 4;
}
message PKCS11StateCADResponse {
  bool deleted = 1;
}

message PKCS11StateGetRequest {
  string tenant_id = 1;
  string token = 2;
  string key = 3;
}
message PKCS11StateGetResponse {
  bytes value = 1;
  bool found = 2;
}

message PKCS11StateDeleteRequest {
  string tenant_id = 1;
  string token = 2;
  string key = 3;
}
message PKCS11StateDeleteResponse {}

message PKCS11StateListRequest {
  string tenant_id = 1;
  string token = 2;
  string prefix = 3;
}
message PKCS11StateListResponse {
  repeated string keys = 1;
}

// SealStorePutRequest requests storing a secret in the platform-sealed store.
message SealStorePutRequest {
  string name = 1;
  bytes secret = 2;
}

// SealStorePutResponse confirms a secret was stored.
message SealStorePutResponse {
  string name = 1;
}

// SealStoreGetRequest requests a secret from the platform-sealed store.
message SealStoreGetRequest {
  string name = 1;
}

// SealStoreGetResponse contains a retrieved, unsealed secret.
message SealStoreGetResponse {
  string name = 1;
  bytes secret = 2;
}

// SealStoreDeleteRequest requests deleting a secret from the platform-sealed store.
message SealStoreDeleteRequest {
  string name = 1;
}

// SealStoreDeleteResponse confirms a secret was deleted.
message SealStoreDeleteResponse {}

// SealStoreListRequest requests the names of all stored secrets.
message SealStoreListRequest {}

// SealStoreListResponse contains the names of all stored secrets.
message SealStoreListResponse {
  repeated string names = 1;
}

// SealStoreResealRequest requests resealing a secret with the current
// platform sealing key.
message SealStoreResealRequest {
  string name = 1;
}

// SealStoreResealResponse confirms a secret was resealed.
message SealStoreResealResponse {
  string name = 1;
}

// SealStoreStatusRequest requests the platform-sealed store status.
message SealStoreStatusRequest {}

// SealStoreStatusResponse contains the platform-sealed store status.
message SealStoreStatusResponse {
  bool available = 1;
  string sealer_id = 2;
  int32 secret_count = 3;
  repeated string secret_names = 4;
}

// PasswordVaultCredential is a factor of the caller's personal vault: a
// passphrase, or a passkey (a FIDO2 credential with the hmac-secret / WebAuthn
// PRF extension).
message PasswordVaultCredential {
  // factor is "passphrase", "passkey", "piv", "certificate" or "tpm".
  string factor = 1;
  // passphrase is the passphrase (factor "passphrase").
  string passphrase = 2;
  // credential_id identifies the passkey (factor "passkey").
  bytes credential_id = 3;
  // prf_salt is the 32-byte salt the authenticator evaluated hmac-secret
  // over; required to enroll a passkey.
  bytes prf_salt = 4;
  // secret is the 32-byte hmac-secret (PRF) output (factor "passkey"), or
  // the 32-byte secret a key factor's private key recovered (key-factor
  // unlock).
  bytes secret = 5;
  // label names an enrolled factor.
  string label = 6;
  // rp_id is the WebAuthn relying party ID the passkey was created for;
  // required to enroll a passkey, and it must be the server's.
  string rp_id = 7;
  // public_key (PKIX DER) or certificate (DER) enrolls a key factor; a
  // certificate factor needs certificate.
  bytes public_key = 8;
  bytes certificate = 9;
  // key_fingerprint selects the key factor a key-factor unlock opens.
  string key_fingerprint = 10;
  // key_ref records where the client keeps a key factor's private key.
  PasswordVaultKeyRef key_ref = 11;
}

// PasswordVaultKeyRef is where a key factor's private key lives on the
// client: the xkms backend, the key's ID there, and a TPM key's named TPM
// policy.
message PasswordVaultKeyRef {
  string backend = 1;
  string key_id = 2;
  string tpm_policy = 3;
}

// PasswordStoreUnlockRequest opens the caller's personal password session
// with one of the caller's own vault factors.
message PasswordStoreUnlockRequest {
  PasswordVaultCredential credential = 1;
}

// PasswordVaultFactor describes one enrolled factor (no key material).
message PasswordVaultFactor {
  string id = 1;
  string factor = 2;
  string label = 3;
  string created_at = 4;
  bytes credential_id = 5;
  bytes prf_salt = 6;
  // rp_id is the relying party ID a passkey was created for.
  string rp_id = 7;
  // Key factors: what a client needs to recover the secret with its
  // private key, where the key is kept, and a certificate's subject.
  string key_fingerprint = 8;
  string key_algorithm = 9;
  bytes key_challenge = 10;
  bytes key_check = 11;
  PasswordVaultKeyRef key_ref = 12;
  string certificate_subject = 13;
}

// PasswordVaultStatusRequest requests the caller's vault status.
message PasswordVaultStatusRequest {}

// PasswordVaultStatusResponse describes the caller's personal vault.
message PasswordVaultStatusResponse {
  bool initialized = 1;
  bool unlocked = 2;
  repeated PasswordVaultFactor factors = 3;
  // passkey_rp_id is the relying party ID a new passkey must be created
  // for; empty when the deployment offers no passkeys.
  string passkey_rp_id = 4;
}

// PasswordVaultEnrollRequest enrolls a factor; the first enrollment
// initializes the vault.
message PasswordVaultEnrollRequest {
  PasswordVaultCredential credential = 1;
}

// PasswordVaultEnrollResponse is the enrolled factor and, on the first
// enrollment or a recovery, the one-time recovery code (shown once).
message PasswordVaultEnrollResponse {
  PasswordVaultFactor factor = 1;
  string recovery_code = 2;
}

// PasswordVaultRotateRequest replaces factor factor_id with a new secret of
// the same type.
message PasswordVaultRotateRequest {
  string factor_id = 1;
  PasswordVaultCredential credential = 2;
}

// PasswordVaultRemoveFactorRequest removes factor factor_id.
message PasswordVaultRemoveFactorRequest {
  string factor_id = 1;
}

// PasswordVaultRemoveFactorResponse acknowledges a removal.
message PasswordVaultRemoveFactorResponse {}

// PasswordVaultRecoverRequest uses the recovery code to enroll a new factor.
message PasswordVaultRecoverRequest {
  string recovery_code = 1;
  PasswordVaultCredential credential = 2;
}

// PasswordStoreLockRequest requests locking the password store.
message PasswordStoreLockRequest {}

// PasswordStoreStatusRequest requests the password store status.
message PasswordStoreStatusRequest {}

// PasswordStoreStatusResponse contains the password store status.
message PasswordStoreStatusResponse {
  string access_mode = 1;
  bool is_locked = 2;
  bool barrier_sealed = 3;
  bool auto_unsealed = 4;
  int32 password_count = 5;
  string message = 6;
}

// PasswordGenerateRequest requests generation of a random password.
message PasswordGenerateRequest {
  int32 length = 1;
  bool upper = 2;
  bool lower = 3;
  bool digits = 4;
  bool symbols = 5;
  // charset names a charset ("all", "alphanumeric") or lists the characters
  // to draw from; exclusive with the class flags.
  string charset = 6;
}

// PasswordGenerateResponse contains the generated password.
message PasswordGenerateResponse {
  string password = 1;
  int32 length = 2;
}

// PasswordStoreSetAccessModeRequest requests changing the password store's
// access-control strategy.
message PasswordStoreSetAccessModeRequest {
  string mode = 1;
}

// PasswordStoreSetAccessModeResponse confirms the access mode was set.
message PasswordStoreSetAccessModeResponse {
  string mode = 1;
  string message = 2;
}

// ==================== TPM Policy Operations ====================

// TPMPolicyCondition is one condition of a TPM policy branch; only the
// fields of its type are set. type is "pcr" (bank and pcrs; pcr_values and
// pcr_digest are hex-encoded, captured from the TPM and never supplied),
// "auth_value" (the object's password) or "locality" (localities 0-4).
message TPMPolicyCondition {
  string type = 1;
  string bank = 2;
  repeated uint32 pcrs = 3;
  map<uint32, string> pcr_values = 4;
  string pcr_digest = 5;
  repeated uint32 localities = 6;
}

// TPMPolicyBranch is one branch of a TPM policy: the AND of its conditions.
// name is unique within the policy; a create request may leave it empty, and
// the branch is then named branch-N, N its position counted from 1.
// approved and reference are reported on a policy and have no meaning in a
// create request.
message TPMPolicyBranch {
  repeated TPMPolicyCondition conditions = 1;
  bool approved = 2;
  TPMPolicyReference reference = 3;
  string name = 4;
}

// TPMPolicyReference identifies the signed reference values a branch was
// last updated from: the CoRIM's id, profile and signer name, and the
// SHA-256 digest of the signed CoRIM.
message TPMPolicyReference {
  string id = 1;
  string profile = 2;
  string signer = 3;
  bytes digest = 4;
}

// TPMPolicy describes a named TPM policy: an OR of branches, tried in order.
// created_at and updated_at are RFC 3339.
message TPMPolicy {
  reserved 3, 4, 5, 6;
  reserved "bank", "pcrs", "pcr_values", "pcr_digest";
  string name = 1;
  string tenant_id = 2;
  uint32 index = 7;
  bool approved = 8;
  uint64 epoch = 9;
  uint64 authority_generation = 10;
  bool auto_unseal = 11;
  string created_at = 12;
  string updated_at = 13;
  string description = 14;
  repeated TPMPolicyBranch branches = 15;
}

// TPMPolicyCreateRequest creates a named policy of branches, capturing the
// values of its pcr conditions from the tenant's TPM. owner_auth authorizes
// the physical TPM's owner hierarchy.
message TPMPolicyCreateRequest {
  reserved 3, 4;
  reserved "bank", "pcrs";
  string tenant_id = 1;
  string name = 2;
  bool auto_unseal = 5;
  bytes owner_auth = 6;
  string description = 7;
  repeated TPMPolicyBranch branches = 8;
}

// TPMPolicyDescriptionRequest replaces a policy's description.
message TPMPolicyDescriptionRequest {
  string tenant_id = 1;
  string name = 2;
  string description = 3;
}

// TPMPolicyRequest names one policy of a tenant.
message TPMPolicyRequest {
  string tenant_id = 1;
  string name = 2;
}

// TPMPolicyUpdateRequest updates a policy to its next epoch: every branch
// from the live PCRs without a branch, or only the named branch from
// reference_values, a COSE_Sign1 signed CoRIM, when one is set.
message TPMPolicyUpdateRequest {
  reserved 3;
  string tenant_id = 1;
  string name = 2;
  bytes reference_values = 4;
  string branch = 5;
}

// TPMPolicyListRequest lists a tenant's policies.
message TPMPolicyListRequest {
  string tenant_id = 1;
}

// TPMPolicyListResponse contains a tenant's policies, sorted by name.
message TPMPolicyListResponse {
  repeated TPMPolicy policies = 1;
}

// TPMPolicyDeleteRequest deletes a policy no object is assigned to.
message TPMPolicyDeleteRequest {
  string tenant_id = 1;
  string name = 2;
  bytes owner_auth = 3;
}

// TPMPolicyDeleteResponse confirms a policy was deleted.
message TPMPolicyDeleteResponse {}

// TrustRoot is one certificate of the platform trust-root store.
// Timestamps are RFC 3339 in UTC; pem is set by TrustRootGet only.
message TrustRoot {
  string fingerprint = 1;
  string purpose = 2;
  string subject = 3;
  string issuer = 4;
  string algorithm = 5;
  string not_before = 6;
  string not_after = 7;
  string added_at = 8;
  string source = 9;
  string pem = 10;
}

// TrustRootListRequest optionally keeps only the roots of one purpose.
message TrustRootListRequest {
  string purpose = 1;
}

// TrustRootListResponse lists trust roots, sorted by subject.
message TrustRootListResponse {
  repeated TrustRoot roots = 1;
}

// TrustRootRequest names a trust root by its SHA-256 fingerprint.
message TrustRootRequest {
  string fingerprint = 1;
}

// TrustRootImportRequest imports a PEM bundle; an empty purpose classifies
// each certificate from its contents.
message TrustRootImportRequest {
  string pem = 1;
  string purpose = 2;
  string source = 3;
}

// TrustRootImportResponse counts the certificates added and skipped.
message TrustRootImportResponse {
  int32 added = 1;
  int32 skipped = 2;
}

// TrustRootRemoveResponse confirms a root was removed.
message TrustRootRemoveResponse {}

// TPMPolicyBranchVerification compares one branch's captured PCR values
// with the live ones and reports whether its approval is current. A branch
// approved with a reference is approved for the image that CoRIM registers.
message TPMPolicyBranchVerification {
  bool match = 1;
  repeated uint32 mismatched = 2;
  bool approved = 3;
  TPMPolicyReference reference = 4;
  string name = 5;
}

// TPMPolicyVerifyResponse compares a policy's captured PCR values with the
// live ones, branch by branch.
message TPMPolicyVerifyResponse {
  reserved 3;
  reserved "mismatched";
  string name = 1;
  bool match = 2;
  bool approved = 4;
  repeated TPMPolicyBranchVerification branches = 5;
}

// TPMPolicyObjectsResponse lists the "<kind>/<name>" IDs of the objects
// assigned to a policy.
message TPMPolicyObjectsResponse {
  string name = 1;
  repeated string objects = 2;
}

// TPMPolicyAutoUnsealRequest sets or clears a policy's auto-unseal mark.
message TPMPolicyAutoUnsealRequest {
  string tenant_id = 1;
  string name = 2;
  bool enabled = 3;
}

// TPMObjectPolicyRequest asks which policy an object was created under.
// kind is "key" (the default) or "sealed".
message TPMObjectPolicyRequest {
  string tenant_id = 1;
  string key_id = 2;
  string kind = 3;
}

// TPMObjectPolicyResponse reports an object's policy and its hex-encoded
// authPolicy digest at creation.
message TPMObjectPolicyResponse {
  string object_id = 1;
  string kind = 2;
  string policy = 3;
  string auth_policy = 4;
  string created_at = 5;
}

// TPMAuthorityRotateRequest rotates a tenant's policy authority.
message TPMAuthorityRotateRequest {
  string tenant_id = 1;
}

// TPMAuthorityRotateResponse describes the new policy authority.
message TPMAuthorityRotateResponse {
  string tenant_id = 1;
  uint64 generation = 2;
  string authority_name = 3;
  uint64 epoch = 4;
}

// TenantTPMModeRequest names the tenant whose TPM mode is read.
message TenantTPMModeRequest {
  string tenant_id = 1;
}

// TenantTPMModeResponse reports a tenant's TPM mode: none, shared or vtpm.
message TenantTPMModeResponse {
  string tenant_id = 1;
  string mode = 2;
}

// SetTenantTPMModeRequest changes a tenant's TPM mode.
message SetTenantTPMModeRequest {
  string tenant_id = 1;
  string mode = 2;
  bytes owner_auth = 3;
}

// TenantVTPMRequest names the tenant whose virtual TPM is addressed.
message TenantVTPMRequest {
  string tenant_id = 1;
}

// TenantVTPMStatusResponse reports a tenant's virtual TPM.
message TenantVTPMStatusResponse {
  string tenant_id = 1;
  bool running = 2;
  int64 pid = 3;
  string socket = 4;
  int64 restarts = 5;
}

// ==================== OIDC Credential Operations ====================

// OIDCCredentialRef names a credential. tenant_id empty is the caller's
// tenant; scope is "tenant" (shared) or "user" (personal); owner is the
// owning subject of a personal credential, empty for the caller.
message OIDCCredentialRef {
  string tenant_id = 1;
  string scope = 2;
  string owner = 3;
  string name = 4;
}

// OIDCCredentialConfig is a credential's provider configuration. A template
// fills every field left empty; endpoints left empty are discovered from the
// issuer at creation. client_secret is accepted on create and never
// returned. token_encoding is "form" (default) or "json"; device_style is
// "rfc8628" (default) or "openai".
message OIDCCredentialConfig {
  string template = 1;
  string issuer = 2;
  string client_id = 3;
  string client_secret = 4;
  repeated string scopes = 5;
  string authorization_endpoint = 6;
  string token_endpoint = 7;
  string device_authorization_endpoint = 8;
  string token_encoding = 9;
  string device_style = 10;
  bool no_refresh = 11;
  int64 token_lifetime_seconds = 12;
  int64 refresh_margin_seconds = 13;
}

// OIDCCredentialTokens are tokens imported into a credential. expires_at
// absent reads the expiry from a JWT access token or the template's token
// lifetime.
message OIDCCredentialTokens {
  string access_token = 1;
  string refresh_token = 2;
  string id_token = 3;
  string token_type = 4;
  string scope = 5;
  google.protobuf.Timestamp expires_at = 6;
}

// OIDCCredentialCreateRequest creates a credential; tokens absent leaves it
// pending a device login or an import.
message OIDCCredentialCreateRequest {
  OIDCCredentialRef ref = 1;
  OIDCCredentialConfig config = 2;
  OIDCCredentialTokens tokens = 3;
}

// OIDCCredentialImportRequest imports tokens into a credential.
message OIDCCredentialImportRequest {
  OIDCCredentialRef ref = 1;
  OIDCCredentialTokens tokens = 2;
}

// OIDCCredentialListRequest lists a tenant's credentials; tenant_id empty is
// the caller's tenant.
message OIDCCredentialListRequest {
  string tenant_id = 1;
}

// OIDCCredentialListResponse holds the credentials the caller can see.
message OIDCCredentialListResponse {
  repeated OIDCCredential credentials = 1;
}

// OIDCCredentialDeleteResponse confirms a credential was deleted.
message OIDCCredentialDeleteResponse {}

// OIDCDeviceLogin is a device login in progress: what the user needs to
// approve it.
message OIDCDeviceLogin {
  string user_code = 1;
  string verification_uri = 2;
  string verification_uri_complete = 3;
  int64 interval_seconds = 4;
  google.protobuf.Timestamp expires_at = 5;
}

// OIDCCredential is a credential's public view: everything but its tokens
// and client secret. status is "pending", "active", "relogin_required" or
// "expired"; expires_at and last_refresh are absent when unknown.
message OIDCCredential {
  OIDCCredentialRef ref = 1;
  OIDCCredentialConfig config = 2;
  string status = 3;
  string status_reason = 4;
  google.protobuf.Timestamp expires_at = 5;
  bool refreshable = 6;
  google.protobuf.Timestamp last_refresh = 7;
  string last_error = 8;
  OIDCDeviceLogin device_login = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  string created_by = 12;
}

// OIDCAccessToken is a current access token of a credential, with the
// login's ID token when it has one.
message OIDCAccessToken {
  string access_token = 1;
  string token_type = 2;
  google.protobuf.Timestamp expires_at = 3;
  string id_token = 4;
  string scope = 5;
}

// ============================================================================
// Peer Attestation Messages
// ============================================================================

message PeerAttestationChallengeRequest {}

// PeerAttestationChallengeResponse is the nonce the caller's quote must
// carry and when it stops being accepted.
message PeerAttestationChallengeResponse {
  bytes nonce = 1;
  google.protobuf.Timestamp expires_at = 2;
}

// SubmitPeerAttestationRequest is a TPM quote answering the caller's
// challenge: the quote and its signature, the challenge nonce, the quoted
// PCR values by index, and the attestation key's certificate in PEM.
message SubmitPeerAttestationRequest {
  bytes quote = 1;
  bytes signature = 2;
  bytes nonce = 3;
  map<uint32, bytes> pcrs = 4;
  bytes ak_certificate_pem = 5;
}

message SubmitPeerAttestationResponse {}

// SigningKeyBinding names the tenant key that signs a repository.
message SigningKeyBinding {
  string repository = 1;
  string key_id = 2;
  // backend is empty for the tenant's default backend.
  string backend = 3;
  google.protobuf.Timestamp updated_at = 4;
}

// SetSigningKeyBindingRequest binds a repository to a key.
message SetSigningKeyBindingRequest {
  string repository = 1;
  string key_id = 2;
  string backend = 3;
}

// GetSigningKeyBindingRequest names a repository's binding.
message GetSigningKeyBindingRequest {
  string repository = 1;
}

// ListSigningKeyBindingsRequest lists the caller's tenant's bindings.
message ListSigningKeyBindingsRequest {}

// ListSigningKeyBindingsResponse holds the tenant's bindings.
message ListSigningKeyBindingsResponse {
  repeated SigningKeyBinding bindings = 1;
}

// DeleteSigningKeyBindingRequest names the binding to remove.
message DeleteSigningKeyBindingRequest {
  string repository = 1;
}

// DeleteSigningKeyBindingResponse confirms a binding was removed.
message DeleteSigningKeyBindingResponse {}

// ResolveSigningKeyRequest names the repository to resolve.
message ResolveSigningKeyRequest {
  string repository = 1;
}

// SigningKeyResolution is the key that signs a repository.
message SigningKeyResolution {
  string repository = 1;
  string key_id = 2;
  string backend = 3;
  // default is true when no binding names the repository, so the key is
  // the tenant's release key.
  bool default = 4;
}

// SignCoRIMRequest is a repository's unsigned CoRIM and the corim-meta of
// its signature, draft-ietf-rats-corim-11 §4.2.3.
message SignCoRIMRequest {
  string repository = 1;
  // corim is the CBOR unsigned-corim-map, tagged #6.501 or not (§4.1).
  bytes corim = 2;
  string signer_name = 3;
  string signer_uri = 4;
  // not_before and not_after bound the signature validity (§7.3); an
  // unset not_after omits it.
  google.protobuf.Timestamp not_before = 5;
  google.protobuf.Timestamp not_after = 6;
}

// SignedCoRIM is the signed CoRIM and the key that signed it.
message SignedCoRIM {
  SigningKeyResolution key = 1;
  // corim is the COSE_Sign1 signed-corim (§4.2).
  bytes corim = 2;
}

// SignImageRequest names the image to sign and the registry credentials to
// push its attestation with; the credentials serve this call only.
message SignImageRequest {
  // reference is the image reference, name[:tag][@digest]; its repository
  // selects the signing key.
  string reference = 1;
  // predicate_type is the in-toto predicate type; cosign's when empty.
  string predicate_type = 2;
  // predicate is the JSON predicate; empty only for cosign's type.
  bytes predicate = 3;
  ImageRegistryCredentials registry = 4;
}

// ImageRegistryCredentials are the registry's basic credentials.
message ImageRegistryCredentials {
  string username = 1;
  bytes password = 2;
}

// SignedImage is the signed image's attestation and where it was pushed.
message SignedImage {
  SigningKeyResolution key = 1;
  // digest is the signed manifest digest.
  string digest = 2;
  // envelope is the DSSE envelope JSON.
  bytes envelope = 3;
  // certificate is the PEM code-signing certificate the service CA issued.
  bytes certificate = 4;
  // referrer is the digest of the OCI 1.1 referrer manifest.
  string referrer = 5;
  // referrer_indexed reports whether the registry indexed the referrer.
  bool referrer_indexed = 6;
  // attestation_tag is the cosign ".att" tag the attestation was added to.
  string attestation_tag = 7;
}

// ==================== FIDO2/WebAuthn Registration ====================

// BeginRegistrationRequest begins a WebAuthn registration ceremony.
message BeginRegistrationRequest {
  // email is the canonical tenant-unique login key of the account the
  // credential is enrolled against.
  string email = 1;
  string display_name = 2;
}

// BeginRegistrationResponse carries the session ID and JSON-marshaled WebAuthn
// registration options (PublicKeyCredentialCreationOptions).
message BeginRegistrationResponse {
  string session_id = 1;
  string options_json = 2;
}

// FinishRegistrationRequest completes a WebAuthn registration ceremony.
message FinishRegistrationRequest {
  string session_id = 1;
  string attestation_json = 2;
}

// FinishRegistrationResponse contains the result of WebAuthn registration.
message FinishRegistrationResponse {
  bool success = 1;
  string credential_id = 2;
  string token = 3;
  string message = 4;
}

// ==================== FIDO2/WebAuthn Authentication ====================

// BeginAuthenticationRequest begins a WebAuthn authentication (login) ceremony.
message BeginAuthenticationRequest {
  // email is the canonical tenant-unique login key of the account whose
  // credentials are challenged.
  string email = 1;
}

// BeginAuthenticationResponse carries the session ID and JSON-marshaled WebAuthn
// authentication options (PublicKeyCredentialRequestOptions).
message BeginAuthenticationResponse {
  string session_id = 1;
  string options_json = 2;
}

// FinishAuthenticationRequest completes a WebAuthn authentication ceremony.
message FinishAuthenticationRequest {
  string session_id = 1;
  // email is the login key of the account whose credentials are asserted.
  string email = 2;
  string assertion_json = 3;
}

// FinishAuthenticationResponse contains the result of WebAuthn authentication.
message FinishAuthenticationResponse {
  bool success = 1;
  string token = 2;
  string username = 3;
  string message = 4;
}

// ==================== Invitation redemption (go-xkms#1294 part B) ====================
//
// How an account CreateUser provisioned with zero credentials enrolls its
// first one. Every RPC below is deliberately ungated, for the same reason
// the FIDO2/WebAuthn ceremony RPCs above are: there is no credential yet to
// authenticate a request with, and an unusable token (absent, expired,
// already redeemed, malformed) answers with the same opaque refusal on
// every RPC so an unauthenticated caller cannot enumerate accounts.

// GetInviteRequest resolves a still-usable invitation's metadata without
// consuming it.
message GetInviteRequest {
  string tenant_id = 1;
  string token = 2;
}

// GetInviteResponse is the invitation metadata an unauthenticated
// activation page reads to render itself.
message GetInviteResponse {
  string email = 1;
  string display_name = 2;
  google.protobuf.Timestamp expires_at = 3;
  // methods lists the credential kinds this build can activate an invite
  // with ("webauthn", "piv").
  repeated string methods = 4;
}

// BeginInviteRegistrationRequest opens the invite-authorized WebAuthn
// registration ceremony for the token's account.
message BeginInviteRegistrationRequest {
  string tenant_id = 1;
  string token = 2;
}

// BeginInviteRegistrationResponse carries the begun ceremony: the session ID
// and JSON-marshaled WebAuthn registration options
// (PublicKeyCredentialCreationOptions).
message BeginInviteRegistrationResponse {
  string session_id = 1;
  string options_json = 2;
}

// FinishInviteRegistrationRequest completes the invite-authorized WebAuthn
// registration ceremony: it binds the credential to the still-pending
// account, activates the account, and redeems the invitation.
message FinishInviteRegistrationRequest {
  string tenant_id = 1;
  string token = 2;
  string session_id = 3;
  string attestation_json = 4;
}

// FinishInviteRegistrationResponse reports which account the redemption
// activated.
message FinishInviteRegistrationResponse {
  uint64 user_id = 1;
}

// ActivateInvitePIVRequest completes PIV invite activation: it verifies the
// presented certificate's chain against the CA's trust roots, binds its
// SPKI thumbprint to the still-pending account, activates the account, and
// redeems the invitation.
message ActivateInvitePIVRequest {
  string tenant_id = 1;
  string token = 2;
  string cert_pem = 3;
}

// ActivateInvitePIVResponse reports which account the redemption activated.
message ActivateInvitePIVResponse {
  uint64 user_id = 1;
}

// ==================== SSH Messages ====================

// SSHKeyRef identifies a single SSH key by (scope, owner, name).
message SSHKeyRef {
  string scope = 1;
  string owner = 2;
  string name = 3;
}

// SSHKeyInfo is the transport-safe representation of an SSH key (public
// material + metadata only; the private half stays server-/backend-side).
message SSHKeyInfo {
  string scope = 1;
  string owner = 2;
  string name = 3;
  string algorithm = 4;
  string public_key = 5;  // authorized_keys line, no newline
  string fingerprint = 6;
  google.protobuf.Timestamp created_at = 7;
  string comment = 8;
  string backend = 9;     // crypto backend holding the private half, if any
  string backend_key_id = 10;  // underlying backend key CN (e.g. ssh-user-local-laptop)
}

message SSHGenerateKeyRequest {
  string scope = 1;
  string owner = 2;
  string name = 3;
  string algorithm = 4;   // ed25519 | rsa | ecdsa-p256 | ecdsa-p384 | ecdsa-p521
  int32 rsa_bits = 5;
  string comment = 6;
  string backend = 7;     // optional crypto backend id
}

message SSHImportKeyRequest {
  string scope = 1;
  string owner = 2;
  string name = 3;
  bytes pem = 4;
  string comment = 5;
}

message SSHKeyResponse {
  SSHKeyInfo key = 1;
}

message SSHListKeysRequest {
  string scope = 1;
  string owner = 2;
}

message SSHListKeysResponse {
  repeated SSHKeyInfo keys = 1;
}

message SSHPublicKeyResponse {
  string algorithm = 1;
  string line = 2;
  string fingerprint = 3;
}

message SSHSignRequest {
  SSHKeyRef key = 1;
  bytes digest = 2;
}

message SSHSignResponse {
  string format = 1;
  bytes blob = 2;
}

// SSHPin is the transport-safe representation of a host-key pin.
message SSHPin {
  string scope = 1;
  string owner = 2;
  string host = 3;
  string fingerprint = 4;
  string algorithm = 5;
  google.protobuf.Timestamp added_at = 6;
  string source = 7;
  // public_key is the authorized_keys-format line of the pinned host key.
  // Every pin carries the full key; there is no fingerprint-only form.
  string public_key = 8;
}

message SSHAddKnownHostRequest {
  string scope = 1;
  string owner = 2;
  string host = 3;
  string fingerprint = 4;
  string algorithm = 5;
  string source = 6;
  // public_key is the authorized_keys-format line of the host key being
  // pinned (e.g. "ssh-ed25519 AAAA..."). Required — the known_hosts store no
  // longer accepts a fingerprint-only pin.
  string public_key = 7;
}

message SSHListKnownHostsRequest {
  string scope = 1;
  string owner = 2;
}

message SSHListKnownHostsResponse {
  repeated SSHPin pins = 1;
}

message SSHRemoveKnownHostRequest {
  string scope = 1;
  string owner = 2;
  string host = 3;
}

// SSHAuthorizedEntry is the transport-safe authorized_keys entry.
message SSHAuthorizedEntry {
  string scope = 1;
  string owner = 2;
  string name = 3;
  string line = 4;
  repeated string options = 5;
  string comment = 6;
}

message SSHAddAuthorizedKeyRequest {
  string scope = 1;
  string owner = 2;
  string name = 3;
  string line = 4;
  repeated string options = 5;
  string comment = 6;
}

message SSHListAuthorizedKeysRequest {
  string scope = 1;
  string owner = 2;
}

message SSHListAuthorizedKeysResponse {
  repeated SSHAuthorizedEntry entries = 1;
}

message SSHAuthorizedKeyRef {
  string scope = 1;
  string owner = 2;
  string name = 3;
}


