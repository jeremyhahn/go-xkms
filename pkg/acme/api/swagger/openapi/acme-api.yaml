openapi: 3.0.3
info:
  title: go-trusted-ca ACME API
  description: |
    ACME (Automatic Certificate Management Environment) API implementing RFC 8555.

    This API enables automated certificate lifecycle management including:
    - Account creation and management
    - Certificate order workflow
    - Domain validation challenges
    - Certificate issuance and revocation

    ## Challenge Types Supported

    | Challenge | Description | RFC/Draft |
    |-----------|-------------|-----------|
    | http-01 | HTTP domain validation | RFC 8555 |
    | dns-01 | DNS TXT record validation | RFC 8555 |
    | device-attest-01 | TPM 2.0 device attestation | draft-acme-device-attest |
    | enroll-01 | TCG-compliant IDevID enrollment | TCG TPM 2.0 Keys for Device Identity |
    | endorse-01 | Endorsement Key certificate provisioning | Custom |

    ## Authentication

    ACME uses JWS (JSON Web Signature) for request authentication:
    - Initial requests use embedded JWK (JSON Web Key)
    - Subsequent requests use KID (Key ID) referencing the account URL

    ## Nonce Management

    All POST requests require a valid nonce in the `Replay-Nonce` header.
    Obtain nonces via HEAD/GET to `/new-nonce` endpoint.

  version: 1.0.0
  contact:
    name: Automate The Things, LLC
    email: support@automatethethings.com
    url: https://github.com/jeremyhahn/go-trusted-ca
  license:
    name: AGPL-3.0 / Commercial
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: https://localhost:8443/acme
    description: Local development server
  - url: https://ca.example.com/acme
    description: Production server

tags:
  - name: Directory
    description: ACME directory and capability discovery
  - name: Nonce
    description: Nonce management for replay protection
  - name: Account
    description: ACME account lifecycle management
  - name: Order
    description: Certificate order workflow
  - name: Authorization
    description: Domain authorization and challenges
  - name: Certificate
    description: Certificate issuance and revocation
  - name: Health
    description: Server health and monitoring endpoints

paths:
  /directory:
    get:
      tags:
        - Directory
      summary: Get ACME directory
      description: |
        Returns the ACME directory containing URLs for all ACME endpoints.
        This is the entry point for ACME clients per RFC 8555 Section 7.1.1.
      operationId: getDirectory
      responses:
        '200':
          description: ACME directory object
          headers:
            Replay-Nonce:
              $ref: '#/components/headers/ReplayNonce'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Directory'
              example:
                newNonce: "https://ca.example.com/acme/new-nonce"
                newAccount: "https://ca.example.com/acme/new-account"
                newOrder: "https://ca.example.com/acme/new-order"
                revokeCert: "https://ca.example.com/acme/revoke-cert"
                keyChange: "https://ca.example.com/acme/key-change"
                meta:
                  termsOfService: "https://ca.example.com/terms"
                  website: "https://ca.example.com"
                  caaIdentities: ["ca.example.com"]
                  externalAccountRequired: false

  /new-nonce:
    head:
      tags:
        - Nonce
      summary: Get new nonce (HEAD)
      description: |
        Obtains a fresh nonce for replay protection.
        Returns the nonce in the Replay-Nonce header.
        HEAD requests are preferred as they return no body.
      operationId: newNonceHead
      responses:
        '200':
          description: Nonce provided in header
          headers:
            Replay-Nonce:
              $ref: '#/components/headers/ReplayNonce'
            Cache-Control:
              schema:
                type: string
                example: "no-store"
    get:
      tags:
        - Nonce
      summary: Get new nonce (GET)
      description: |
        Obtains a fresh nonce for replay protection.
        GET is provided for compatibility but HEAD is preferred.
      operationId: newNonceGet
      responses:
        '204':
          description: Nonce provided in header
          headers:
            Replay-Nonce:
              $ref: '#/components/headers/ReplayNonce'
            Cache-Control:
              schema:
                type: string
                example: "no-store"

  /new-account:
    post:
      tags:
        - Account
      summary: Create new account
      description: |
        Creates a new ACME account or retrieves an existing one.

        Per RFC 8555 Section 7.3:
        - If `onlyReturnExisting` is true, returns existing account or 400 error
        - If `termsOfServiceAgreed` is required, it must be true
        - External Account Binding may be required by server policy

      operationId: newAccount
      requestBody:
        required: true
        content:
          application/jose+json:
            schema:
              $ref: '#/components/schemas/JWSRequest'
            example:
              protected: "eyJhbGciOiJFUzI1NiIsImp3ayI6ey4uLn0sIm5vbmNlIjoiLi4uIiwidXJsIjoiLi4uIn0"
              payload: "eyJ0ZXJtc09mU2VydmljZUFncmVlZCI6dHJ1ZSwiY29udGFjdCI6WyJtYWlsdG86YWRtaW5AZXhhbXBsZS5jb20iXX0"
              signature: "..."
      responses:
        '201':
          description: Account created
          headers:
            Location:
              description: URL of the created account
              schema:
                type: string
                format: uri
            Replay-Nonce:
              $ref: '#/components/headers/ReplayNonce'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '200':
          description: Existing account returned
          headers:
            Location:
              description: URL of the existing account
              schema:
                type: string
                format: uri
            Replay-Nonce:
              $ref: '#/components/headers/ReplayNonce'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Terms of service not agreed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /account/{accountId}:
    post:
      tags:
        - Account
      summary: Update account
      description: |
        Updates an existing ACME account.

        Supports:
        - Contact information updates
        - Account deactivation (status: "deactivated")
        - POST-as-GET (empty payload) to retrieve account info

      operationId: updateAccount
      parameters:
        - $ref: '#/components/parameters/AccountIdParam'
      requestBody:
        required: true
        content:
          application/jose+json:
            schema:
              $ref: '#/components/schemas/JWSRequest'
      responses:
        '200':
          description: Account updated
          headers:
            Replay-Nonce:
              $ref: '#/components/headers/ReplayNonce'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /new-order:
    post:
      tags:
        - Order
      summary: Create new order
      description: |
        Creates a new certificate order for the specified identifiers.

        Per RFC 8555 Section 7.4:
        - Identifiers can be DNS names, IP addresses, or permanent identifiers
        - Returns authorizations that must be completed
        - Order expires if not finalized within the validity period

      operationId: newOrder
      requestBody:
        required: true
        content:
          application/jose+json:
            schema:
              $ref: '#/components/schemas/JWSRequest'
      responses:
        '201':
          description: Order created
          headers:
            Location:
              description: URL of the created order
              schema:
                type: string
                format: uri
            Replay-Nonce:
              $ref: '#/components/headers/ReplayNonce'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Authorization failed (e.g., CAA check failed)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /order/{orderId}:
    post:
      tags:
        - Order
      summary: Get order status
      description: |
        Retrieves the current status of a certificate order.
        Use POST-as-GET (empty JWS payload) to fetch order details.
      operationId: getOrder
      parameters:
        - $ref: '#/components/parameters/OrderIdParam'
      requestBody:
        required: true
        content:
          application/jose+json:
            schema:
              $ref: '#/components/schemas/JWSRequest'
      responses:
        '200':
          description: Order details
          headers:
            Replay-Nonce:
              $ref: '#/components/headers/ReplayNonce'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'

  /order/{orderId}/finalize:
    post:
      tags:
        - Order
      summary: Finalize order
      description: |
        Submits a CSR to finalize the order and request certificate issuance.

        Per RFC 8555 Section 7.4:
        - Order must be in "ready" state
        - CSR must match the order identifiers
        - Certificate is issued asynchronously

      operationId: finalizeOrder
      parameters:
        - $ref: '#/components/parameters/OrderIdParam'
      requestBody:
        required: true
        content:
          application/jose+json:
            schema:
              $ref: '#/components/schemas/JWSRequest'
      responses:
        '200':
          description: Order finalized, certificate processing
          headers:
            Replay-Nonce:
              $ref: '#/components/headers/ReplayNonce'
            Retry-After:
              description: Suggested retry interval in seconds
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '403':
          description: Order not ready for finalization
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /orders/{accountId}:
    post:
      tags:
        - Order
      summary: List account orders
      description: |
        Returns a list of orders for the specified account.
        Supports pagination via Link header.
      operationId: listOrders
      parameters:
        - $ref: '#/components/parameters/AccountIdParam'
        - name: cursor
          in: query
          description: Pagination cursor
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/jose+json:
            schema:
              $ref: '#/components/schemas/JWSRequest'
      responses:
        '200':
          description: List of order URLs
          headers:
            Replay-Nonce:
              $ref: '#/components/headers/ReplayNonce'
            Link:
              description: Pagination links
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdersList'

  /authz/{authzId}:
    post:
      tags:
        - Authorization
      summary: Get authorization
      description: |
        Retrieves an authorization object containing challenges.
        Use POST-as-GET (empty JWS payload) to fetch authorization details.
      operationId: getAuthorization
      parameters:
        - $ref: '#/components/parameters/AuthzIdParam'
      requestBody:
        required: true
        content:
          application/jose+json:
            schema:
              $ref: '#/components/schemas/JWSRequest'
      responses:
        '200':
          description: Authorization details
          headers:
            Replay-Nonce:
              $ref: '#/components/headers/ReplayNonce'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Authorization'
        '404':
          $ref: '#/components/responses/NotFound'

  /challenge/{challengeId}:
    post:
      tags:
        - Authorization
      summary: Respond to challenge
      description: |
        Initiates validation for a challenge or retrieves challenge status.

        Per RFC 8555 Section 7.5.1:
        - POST with empty payload triggers validation
        - POST-as-GET retrieves current status
        - Challenge types: http-01, dns-01, device-attest-01, enroll-01, endorse-01

      operationId: respondToChallenge
      parameters:
        - $ref: '#/components/parameters/ChallengeIdParam'
      requestBody:
        required: true
        content:
          application/jose+json:
            schema:
              $ref: '#/components/schemas/JWSRequest'
      responses:
        '200':
          description: Challenge status
          headers:
            Replay-Nonce:
              $ref: '#/components/headers/ReplayNonce'
            Retry-After:
              description: Suggested retry interval for pending challenges
              schema:
                type: integer
            Link:
              description: Link to authorization
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
        '404':
          $ref: '#/components/responses/NotFound'

  /cert/{certId}:
    post:
      tags:
        - Certificate
      summary: Download certificate
      description: |
        Downloads the issued certificate chain.
        Returns the full chain including intermediates.
      operationId: getCertificate
      parameters:
        - $ref: '#/components/parameters/CertIdParam'
      requestBody:
        required: true
        content:
          application/jose+json:
            schema:
              $ref: '#/components/schemas/JWSRequest'
      responses:
        '200':
          description: Certificate chain
          headers:
            Replay-Nonce:
              $ref: '#/components/headers/ReplayNonce'
          content:
            application/pem-certificate-chain:
              schema:
                type: string
                description: PEM-encoded certificate chain
              example: |
                -----BEGIN CERTIFICATE-----
                MIIBkTCB+wIJAKHBfpegBXW...
                -----END CERTIFICATE-----
                -----BEGIN CERTIFICATE-----
                MIIBfDCCASOgAwIBAgIJAL...
                -----END CERTIFICATE-----
        '404':
          $ref: '#/components/responses/NotFound'

  /revoke-cert:
    post:
      tags:
        - Certificate
      summary: Revoke certificate
      description: |
        Revokes a previously issued certificate.

        Per RFC 8555 Section 7.6:
        - Can be authenticated by account key or certificate key
        - Optional reason code per RFC 5280

      operationId: revokeCertificate
      requestBody:
        required: true
        content:
          application/jose+json:
            schema:
              $ref: '#/components/schemas/JWSRequest'
      responses:
        '200':
          description: Certificate revoked
          headers:
            Replay-Nonce:
              $ref: '#/components/headers/ReplayNonce'
        '400':
          description: Already revoked or invalid certificate
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Not authorized to revoke
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /key-change:
    post:
      tags:
        - Account
      summary: Account key rollover
      description: |
        Performs account key rollover per RFC 8555 Section 7.3.5.
        Requires a nested JWS signed by both old and new keys.
      operationId: keyChange
      requestBody:
        required: true
        content:
          application/jose+json:
            schema:
              $ref: '#/components/schemas/JWSRequest'
      responses:
        '200':
          description: Key changed successfully
          headers:
            Replay-Nonce:
              $ref: '#/components/headers/ReplayNonce'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '409':
          description: New key already in use
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /ca-bundle:
    get:
      tags:
        - Certificate
      summary: Get CA bundle
      description: |
        Returns the CA certificate bundle including root and intermediate certificates.
        This is a non-RFC 8555 convenience endpoint.
      operationId: getCaBundle
      responses:
        '200':
          description: CA certificate bundle
          content:
            application/pem-certificate-chain:
              schema:
                type: string
                description: PEM-encoded CA certificates

  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Returns server health status for load balancer health checks.
      operationId: healthCheck
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  timestamp:
                    type: string
                    format: date-time

  /ready:
    get:
      tags:
        - Health
      summary: Readiness check
      description: Returns whether the server is ready to accept requests.
      operationId: readinessCheck
      responses:
        '200':
          description: Server is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready:
                    type: boolean
                    example: true

  /metrics:
    get:
      tags:
        - Health
      summary: Prometheus metrics
      description: Returns Prometheus-formatted metrics for monitoring.
      operationId: getMetrics
      responses:
        '200':
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string

components:
  headers:
    ReplayNonce:
      description: Nonce for replay protection in subsequent requests
      schema:
        type: string
        example: "oFvnlFP1wIhRlYS2jTaXbA"

  parameters:
    AccountIdParam:
      name: accountId
      in: path
      required: true
      description: Account identifier
      schema:
        type: string
        example: "12345"

    OrderIdParam:
      name: orderId
      in: path
      required: true
      description: Order identifier
      schema:
        type: string
        example: "67890"

    AuthzIdParam:
      name: authzId
      in: path
      required: true
      description: Authorization identifier
      schema:
        type: string
        example: "auth-12345"

    ChallengeIdParam:
      name: challengeId
      in: path
      required: true
      description: Challenge identifier
      schema:
        type: string
        example: "chall-67890"

    CertIdParam:
      name: certId
      in: path
      required: true
      description: Certificate identifier (serial number)
      schema:
        type: string
        example: "abc123def456"

  schemas:
    Directory:
      type: object
      required:
        - newNonce
        - newAccount
        - newOrder
      properties:
        newNonce:
          type: string
          format: uri
          description: URL for obtaining new nonces
        newAccount:
          type: string
          format: uri
          description: URL for creating/finding accounts
        newOrder:
          type: string
          format: uri
          description: URL for creating new orders
        newAuthz:
          type: string
          format: uri
          description: URL for pre-authorization (optional)
        revokeCert:
          type: string
          format: uri
          description: URL for certificate revocation
        keyChange:
          type: string
          format: uri
          description: URL for account key rollover
        meta:
          $ref: '#/components/schemas/DirectoryMeta'

    DirectoryMeta:
      type: object
      properties:
        termsOfService:
          type: string
          format: uri
          description: URL to terms of service
        website:
          type: string
          format: uri
          description: CA website
        caaIdentities:
          type: array
          items:
            type: string
          description: CAA identities for this CA
        externalAccountRequired:
          type: boolean
          description: Whether external account binding is required
          default: false

    Account:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [valid, deactivated, revoked]
          description: Account status
        contact:
          type: array
          items:
            type: string
            format: uri
          description: Contact URIs (e.g., mailto:admin@example.com)
        termsOfServiceAgreed:
          type: boolean
          description: Whether ToS was agreed
        orders:
          type: string
          format: uri
          description: URL to list account orders
        externalAccountBinding:
          type: object
          description: External account binding object (if used)

    Order:
      type: object
      required:
        - status
        - identifiers
      properties:
        status:
          type: string
          enum: [pending, ready, processing, valid, invalid]
          description: Order status
        expires:
          type: string
          format: date-time
          description: When the order expires
        notBefore:
          type: string
          format: date-time
          description: Requested certificate notBefore
        notAfter:
          type: string
          format: date-time
          description: Requested certificate notAfter
        identifiers:
          type: array
          items:
            $ref: '#/components/schemas/Identifier'
          description: Identifiers in the order
        authorizations:
          type: array
          items:
            type: string
            format: uri
          description: URLs to authorization objects
        finalize:
          type: string
          format: uri
          description: URL to finalize the order
        certificate:
          type: string
          format: uri
          description: URL to download certificate (when valid)
        error:
          $ref: '#/components/schemas/ProblemDetails'

    OrdersList:
      type: object
      required:
        - orders
      properties:
        orders:
          type: array
          items:
            type: string
            format: uri
          description: URLs to order objects

    Identifier:
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          enum: [dns, ip, permanent-identifier]
          description: |
            Identifier type:
            - dns: Domain name
            - ip: IP address
            - permanent-identifier: Hardware/device identifier
        value:
          type: string
          description: Identifier value

    Authorization:
      type: object
      required:
        - status
        - identifier
        - challenges
      properties:
        status:
          type: string
          enum: [pending, valid, invalid, deactivated, expired, revoked]
          description: Authorization status
        expires:
          type: string
          format: date-time
          description: When the authorization expires
        identifier:
          $ref: '#/components/schemas/Identifier'
        challenges:
          type: array
          items:
            $ref: '#/components/schemas/Challenge'
          description: Available challenges
        wildcard:
          type: boolean
          description: Whether this is for a wildcard identifier

    Challenge:
      type: object
      required:
        - type
        - url
        - status
        - token
      properties:
        type:
          type: string
          enum: [http-01, dns-01, device-attest-01, enroll-01, endorse-01]
          description: Challenge type
        url:
          type: string
          format: uri
          description: URL to respond to the challenge
        status:
          type: string
          enum: [pending, processing, valid, invalid]
          description: Challenge status
        token:
          type: string
          description: Challenge token
        validated:
          type: string
          format: date-time
          description: When the challenge was validated
        error:
          $ref: '#/components/schemas/ProblemDetails'

    JWSRequest:
      type: object
      description: JWS (JSON Web Signature) request per RFC 7515
      required:
        - protected
        - payload
        - signature
      properties:
        protected:
          type: string
          description: Base64url-encoded protected header
        payload:
          type: string
          description: Base64url-encoded payload (empty for POST-as-GET)
        signature:
          type: string
          description: Base64url-encoded signature

    ProblemDetails:
      type: object
      description: Problem details per RFC 7807
      required:
        - type
      properties:
        type:
          type: string
          format: uri
          description: Problem type URI
          example: "urn:ietf:params:acme:error:unauthorized"
        detail:
          type: string
          description: Human-readable description
        status:
          type: integer
          description: HTTP status code
        instance:
          type: string
          format: uri
          description: URI identifying the specific problem instance
        subproblems:
          type: array
          items:
            $ref: '#/components/schemas/Subproblem'

    Subproblem:
      type: object
      properties:
        type:
          type: string
          format: uri
        detail:
          type: string
        identifier:
          $ref: '#/components/schemas/Identifier'

  responses:
    BadRequest:
      description: Invalid request
      headers:
        Replay-Nonce:
          $ref: '#/components/headers/ReplayNonce'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "urn:ietf:params:acme:error:malformed"
            detail: "Request payload could not be parsed"
            status: 400

    Unauthorized:
      description: Authentication required or failed
      headers:
        Replay-Nonce:
          $ref: '#/components/headers/ReplayNonce'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "urn:ietf:params:acme:error:unauthorized"
            detail: "Account key mismatch"
            status: 401

    NotFound:
      description: Resource not found
      headers:
        Replay-Nonce:
          $ref: '#/components/headers/ReplayNonce'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "urn:ietf:params:acme:error:accountDoesNotExist"
            detail: "Account not found"
            status: 404

    RateLimited:
      description: Rate limit exceeded
      headers:
        Replay-Nonce:
          $ref: '#/components/headers/ReplayNonce'
        Retry-After:
          schema:
            type: integer
            description: Seconds to wait before retrying
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "urn:ietf:params:acme:error:rateLimited"
            detail: "Too many requests"
            status: 429
