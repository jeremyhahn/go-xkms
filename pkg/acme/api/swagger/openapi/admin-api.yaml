openapi: 3.1.0
info:
  title: go-xkms Admin API
  description: |
    Administrative API for the go-xkms ACME Certificate Authority.

    This API provides endpoints for:
    - **Tenant Management**: Multi-tenant CRUD operations with isolated CA hierarchies
    - **Tenant Roles/Users**: Per-tenant RBAC role and user administration
    - **Certificate Management**: List, view, and revoke certificates
    - **Account Management**: Manage ACME accounts
    - **Order Management**: View certificate orders
    - **External Account Binding (EAB)**: Manage pre-authorized account bindings
    - **Audit**: Query the append-only audit trail
    - **Algorithm Discovery**: Report the cryptographic algorithms this deployment can execute
    - **CA Status/Stats**: Monitor CA health and metrics

    ## Authentication

    Every endpoint requires either a Bearer JWT (`Authorization: Bearer <token>`)
    or an mTLS client certificate. There is no unauthenticated route on this API.

    ## Authorization

    Every operation is decorated with a `resource:action` grant (for example
    `certs:revoke`, `users:list`, `roles:create`) and evaluated against the
    caller's identity by the hosted go-qrdb node's RBAC service. A grant means
    exactly the same thing here as it does on the gRPC, QUIC and MCP admin
    transports; this API carries no role or permission model of its own. Each
    operation below documents the grant it requires. When RBAC is disabled
    (no qrdb identity plane hosted) any authenticated caller is allowed;
    authentication is mandatory either way.

  version: 1.0.0
  contact:
    name: Automate The Things, LLC
    email: support@automatethethings.com
    url: https://github.com/jeremyhahn/go-xkms
  license:
    name: AGPL-3.0 / Commercial
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: https://localhost:8443
    description: Local development server
  - url: https://ca.example.com
    description: Production server

tags:
  - name: Tenants
    description: Multi-tenant management operations (tenants:*)
  - name: Tenant CA
    description: Tenant Certificate Authority operations (ca:*)
  - name: EAB
    description: External Account Binding management (acme_eab:*)
  - name: Roles
    description: Per-tenant RBAC role management (roles:*)
  - name: Users
    description: Per-tenant user management (users:*)
  - name: Certificates
    description: Certificate management operations (certs:*)
  - name: Accounts
    description: ACME account management (acme_accounts:*)
  - name: Orders
    description: ACME order management (acme_orders:*)
  - name: Audit
    description: Audit trail query (audit:read)
  - name: Algorithms
    description: Cryptographic algorithm discovery (admin:capabilities)
  - name: Status
    description: CA status and statistics (admin:status)

security:
  - BearerAuth: []
  - mTLS: []

paths:
  # ============================================================================
  # Tenant Management Endpoints
  # ============================================================================
  # Tenant create, list, get and delete belong to xkmsd's core API
  # (pkg/api/rest/routes.go: /api/v1/tenants/ and /api/v1/tenants/{id}),
  # which is their one owner; this plane adds the rename and the
  # sub-resources below.
  /api/v1/tenants/{tenantId}:
    put:
      tags:
        - Tenants
      summary: Update tenant
      description: |
        Updates tenant name and/or settings.
        Requires admin role for the tenant.
      operationId: updateTenant
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantRequest'
      responses:
        '200':
          description: Tenant updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantInfo'
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

  /api/v1/tenants/{tenantId}/status:
    put:
      tags:
        - Tenants
      summary: Update tenant status
      description: |
        Refused: the pinned go-qrdb v0.51.0-alpha has no tenant status, so any
        status answers 400 with problem type
        urn:trusted-ca:error:tenant-status-unsupported and the tenant record is
        not changed. The 200 response applies once go-qrdb carries a tenant
        status. Requires super-admin role.
      operationId: updateTenantStatus
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantStatusRequest'
      responses:
        '200':
          description: Tenant status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Tenant status updated successfully"
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

  # ============================================================================
  # Tenant CA Endpoints
  # ============================================================================
  /api/v1/tenants/{tenantId}/root-ca:
    post:
      tags:
        - Tenant CA
      summary: Create tenant root CA
      description: |
        Creates a new root Certificate Authority for the tenant.
        The root CA is used to sign intermediate CAs.
        Requires admin role.
      operationId: createTenantRootCA
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRootCARequest'
            example:
              common_name: "ACME Corp Root CA"
              key_algorithm: "ECDSA-P384"
              validity_years: 20
      responses:
        '201':
          description: Root CA created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantRootCAInfo'
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

  /api/v1/tenants/{tenantId}/intermediate-cas:
    get:
      tags:
        - Tenant CA
      summary: List tenant intermediate CAs
      description: |
        Returns all intermediate CAs configured for the tenant.
        Requires admin role.
      operationId: listTenantIntermediateCAs
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
      responses:
        '200':
          description: >-
            List of intermediate CAs. The handler writes the array directly
            (no pagination envelope): ListTenantIntermediateCAs returns every
            intermediate CA for the tenant in one response.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TenantIntCAInfo'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '500':
          $ref: '#/components/responses/ProblemInternalError'
    post:
      tags:
        - Tenant CA
      summary: Create tenant intermediate CA
      description: |
        Creates a new intermediate CA for the tenant.
        The intermediate CA can be signed by either the global root CA or the tenant's root CA.
        Requires admin role.
      operationId: createTenantIntermediateCA
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantIntermediateCARequest'
            example:
              common_name: "ACME Corp Issuing CA"
              parent_type: "tenant"
              purpose: "server-auth"
              key_algorithm: "ECDSA-P256"
              validity_years: 10
              set_as_default: true
      responses:
        '201':
          description: Intermediate CA created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantIntCAInfo'
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

  /api/v1/tenants/{tenantId}/intermediate-cas/{caId}:
    get:
      tags:
        - Tenant CA
      summary: Get intermediate CA by ID
      description: |
        Retrieves details of a specific intermediate CA.
        Requires admin role.
      operationId: getTenantIntermediateCA
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
        - $ref: '#/components/parameters/CAIdParam'
      responses:
        '200':
          description: Intermediate CA details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantIntCAInfo'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

  /api/v1/tenants/{tenantId}/intermediate-cas/{caId}/status:
    put:
      tags:
        - Tenant CA
      summary: Update intermediate CA status
      description: |
        Updates the status of an intermediate CA.
        Valid statuses: active, pending-rotation, revoked.
        Requires admin role.
      operationId: updateTenantIntermediateCAStatus
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
        - $ref: '#/components/parameters/CAIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIntermediateCAStatusRequest'
      responses:
        '200':
          description: Intermediate CA status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Intermediate CA status updated successfully"
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

  /api/v1/tenants/{tenantId}/default-intermediate-ca:
    put:
      tags:
        - Tenant CA
      summary: Set default intermediate CA
      description: |
        Sets the default intermediate CA for certificate issuance.
        Requires admin role.
      operationId: setTenantDefaultIntermediateCA
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantDefaultCARequest'
      responses:
        '200':
          description: Default intermediate CA updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Default intermediate CA updated successfully"
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

  /api/v1/tenants/{tenantId}/ca-status:
    get:
      tags:
        - Tenant CA
      summary: Get tenant CA status
      description: |
        Returns the overall CA configuration status for a tenant,
        including root CA, intermediate CAs, and issuance capability.
        Requires admin role.
      operationId: getTenantCAStatus
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
      responses:
        '200':
          description: Tenant CA status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantCAStatusInfo'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

  # ============================================================================
  # External Account Binding (EAB) Endpoints
  # ============================================================================
  /api/v1/tenants/{tenantId}/eab:
    get:
      tags:
        - EAB
      summary: List tenant EABs
      description: |
        Returns a paginated list of External Account Bindings for the tenant.
        Requires endorser role or higher.
      operationId: listTenantEABs
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: status
          in: query
          description: Filter by EAB status
          schema:
            type: string
            enum: [pending, used, revoked, expired]
        - name: purpose
          in: query
          description: Filter by EAB purpose
          schema:
            type: string
            enum: [account-binding, endorse-01, enroll-01]
      responses:
        '200':
          description: List of EABs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEABResponse'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '500':
          $ref: '#/components/responses/ProblemInternalError'
    post:
      tags:
        - EAB
      summary: Create tenant EAB
      description: |
        Creates a new External Account Binding for pre-authorized ACME registration.
        The MAC key is returned only once in the response and cannot be retrieved later.

        Supported purposes:
        - **account-binding**: Standard ACME EAB for account creation
        - **endorse-01**: TPM endorsement key binding for device attestation
        - **enroll-01**: Certificate enrollment binding

        Requires endorser role or higher.
      operationId: createTenantEAB
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEABRequest'
            examples:
              account-binding:
                summary: Standard account binding
                value:
                  purpose: "account-binding"
                  external_account_id: "user-12345"
                  contact: ["mailto:user@example.com"]
                  expires_in_days: 7
              endorse-01:
                summary: TPM endorsement binding
                value:
                  purpose: "endorse-01"
                  device_info:
                    device_id: "device-001"
                    manufacturer: "Dell"
                    model: "PowerEdge R750"
                    ek_public_key_hash: "sha256:abc123..."
                    tpm_manufacturer: "Infineon"
                  expires_in_days: 30
              enroll-01:
                summary: Certificate enrollment binding
                value:
                  purpose: "enroll-01"
                  external_account_id: "workload-xyz"
                  metadata:
                    environment: "production"
                    service: "api-gateway"
      responses:
        '201':
          description: EAB created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEABResponse'
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

  /api/v1/tenants/{tenantId}/eab/{kid}:
    get:
      tags:
        - EAB
      summary: Get EAB by key ID
      description: |
        Retrieves details of a specific External Account Binding.
        Note: The MAC key is not returned in this response.
        Requires endorser role or higher.
      operationId: getTenantEAB
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
        - $ref: '#/components/parameters/KidParam'
      responses:
        '200':
          description: EAB details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EABInfo'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '500':
          $ref: '#/components/responses/ProblemInternalError'
    delete:
      tags:
        - EAB
      summary: Delete EAB
      description: |
        Deletes an External Account Binding.
        Requires admin role.
      operationId: deleteTenantEAB
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
        - $ref: '#/components/parameters/KidParam'
      responses:
        '200':
          description: EAB deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "EAB deleted successfully"
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

  # ============================================================================
  # Tenant Role Management Endpoints (roles:*)
  #
  # Every response body below is written directly by writeJSON (or a
  # ListResponse for the paginated list operations); every error is RFC 7807
  # application/problem+json (writeProblem). That is true of every operation
  # in this document, not only this section: matches
  # pkg/acme/admin/tenant_handlers.go exactly.
  # ============================================================================
  /api/v1/tenants/{tenantId}/roles:
    get:
      tags:
        - Roles
      summary: List tenant roles
      description: Returns a paginated list of qrdb RBAC roles for the tenant. Requires roles:list.
      operationId: listTenantRoles
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: List of roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRolesResponse'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '500':
          $ref: '#/components/responses/ProblemInternalError'
    post:
      tags:
        - Roles
      summary: Create tenant role
      description: Creates a new qrdb RBAC role scoped to the tenant. Requires roles:create.
      operationId: createTenantRole
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
            example:
              name: "endorser"
              permissions: ["acme_eab:create", "acme_eab:list"]
      responses:
        '201':
          description: Role created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleInfo'
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

  /api/v1/tenants/{tenantId}/roles/{roleID}:
    get:
      tags:
        - Roles
      summary: Get role by ID
      description: Retrieves a specific role. Requires roles:read.
      operationId: getTenantRole
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
        - $ref: '#/components/parameters/RoleIdParam'
      responses:
        '200':
          description: Role details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleInfo'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '500':
          $ref: '#/components/responses/ProblemInternalError'
    put:
      tags:
        - Roles
      summary: Update role
      description: Updates an existing role's name and/or permissions. Requires roles:update.
      operationId: updateTenantRole
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
        - $ref: '#/components/parameters/RoleIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '200':
          description: Role updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleInfo'
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '500':
          $ref: '#/components/responses/ProblemInternalError'
    delete:
      tags:
        - Roles
      summary: Delete role
      description: Deletes a role. A built-in (system) role cannot be deleted. Requires roles:delete.
      operationId: deleteTenantRole
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
        - $ref: '#/components/parameters/RoleIdParam'
      responses:
        '200':
          description: Role deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Role deleted successfully"
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

  # ============================================================================
  # Tenant User Management Endpoints (users:*)
  # ============================================================================
  /api/v1/tenants/{tenantId}/users:
    get:
      tags:
        - Users
      summary: List tenant users
      description: Returns a paginated list of qrdb users for the tenant. Requires users:list.
      operationId: listTenantUsers
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUsersResponse'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '500':
          $ref: '#/components/responses/ProblemInternalError'
    post:
      tags:
        - Users
      summary: Create tenant user
      description: >-
        Creates a new qrdb user scoped to the tenant. Authentication is
        exclusively mTLS X.509; there is no password to set. Requires
        users:create.
      operationId: createTenantUser
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            example:
              username: "jdoe"
              email: "jdoe@example.com"
              name: "Jane Doe"
              role_ids: ["role_01hq..."]
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

  /api/v1/tenants/{tenantId}/users/{userID}:
    get:
      tags:
        - Users
      summary: Get user by ID
      description: Retrieves a specific user. Requires users:read.
      operationId: getTenantUser
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '500':
          $ref: '#/components/responses/ProblemInternalError'
    put:
      tags:
        - Users
      summary: Update user
      description: Updates an existing user. Requires users:update.
      operationId: updateTenantUser
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '500':
          $ref: '#/components/responses/ProblemInternalError'
    delete:
      tags:
        - Users
      summary: Delete user
      description: Deletes a user. Requires users:delete.
      operationId: deleteTenantUser
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User deleted successfully"
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

  # ============================================================================
  # Certificate Management Endpoints
  # ============================================================================
  /admin/certificates:
    get:
      tags:
        - Certificates
      summary: List certificates
      description: |
        Returns a paginated list of all issued certificates.
        Requires viewer role or higher.
      operationId: listCertificates
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: status
          in: query
          description: Filter by certificate status
          schema:
            type: string
            enum: [valid, revoked, expired]
        - name: subject
          in: query
          description: Filter by subject (partial match)
          schema:
            type: string
      responses:
        '200':
          description: List of certificates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCertificatesResponse'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

  /admin/certificates/expiring:
    get:
      tags:
        - Certificates
      summary: List expiring certificates
      description: |
        Returns certificates that will expire within the specified number of days.
        Requires viewer role or higher.
      operationId: listExpiringCertificates
      parameters:
        - name: days
          in: query
          description: Number of days to look ahead (default 30)
          schema:
            type: integer
            default: 30
            minimum: 1
            maximum: 365
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: List of expiring certificates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCertificatesResponse'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

  /admin/certificates/{serial}:
    get:
      tags:
        - Certificates
      summary: Get certificate by serial number
      description: |
        Retrieves detailed information about a specific certificate.
        Requires viewer role or higher.
      operationId: getCertificate
      parameters:
        - $ref: '#/components/parameters/SerialParam'
      responses:
        '200':
          description: Certificate details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateInfo'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

  /admin/certificates/{serial}/revoke:
    post:
      tags:
        - Certificates
      summary: Revoke certificate
      description: |
        Revokes a certificate with an optional reason.
        Requires admin role.
      operationId: revokeCertificate
      parameters:
        - $ref: '#/components/parameters/SerialParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeRequest'
            example:
              reason: "keyCompromise"
      responses:
        '200':
          description: Certificate revoked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Certificate revoked successfully"
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

  # ============================================================================
  # Account Management Endpoints
  # ============================================================================
  /admin/accounts:
    get:
      tags:
        - Accounts
      summary: List ACME accounts
      description: |
        Returns a paginated list of all ACME accounts.
        Requires viewer role or higher.
      operationId: listAccounts
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: status
          in: query
          description: Filter by account status
          schema:
            type: string
            enum: [valid, deactivated, revoked]
      responses:
        '200':
          description: List of accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAccountsResponse'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

  /admin/accounts/{accountId}:
    get:
      tags:
        - Accounts
      summary: Get account by ID
      description: |
        Retrieves detailed information about a specific ACME account.
        Requires viewer role or higher.
      operationId: getAccount
      parameters:
        - $ref: '#/components/parameters/AccountIdParam'
      responses:
        '200':
          description: Account details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountInfo'
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '500':
          $ref: '#/components/responses/ProblemInternalError'
    delete:
      tags:
        - Accounts
      summary: Disable account
      description: |
        Disables an ACME account, preventing further certificate issuance.
        Requires admin role.
      operationId: disableAccount
      parameters:
        - $ref: '#/components/parameters/AccountIdParam'
      responses:
        '200':
          description: Account disabled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Account disabled successfully"
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

  # ============================================================================
  # Order Management Endpoints
  # ============================================================================
  /admin/orders:
    get:
      tags:
        - Orders
      summary: List orders
      description: |
        Returns a paginated list of certificate orders.
        Requires viewer role or higher.
      operationId: listOrders
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: status
          in: query
          description: Filter by order status
          schema:
            type: string
            enum: [pending, ready, processing, valid, invalid]
        - name: account_id
          in: query
          description: Filter by account ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOrdersResponse'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

  /admin/orders/{orderId}:
    get:
      tags:
        - Orders
      summary: Get order by ID
      description: |
        Retrieves detailed information about a specific order.
        Requires viewer role or higher.
      operationId: getOrder
      parameters:
        - $ref: '#/components/parameters/OrderIdParam'
        - name: account_id
          in: query
          required: true
          description: Account ID that owns the order
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderInfo'
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

  # ============================================================================
  # Status and Stats Endpoints
  # ============================================================================
  /admin/status:
    get:
      tags:
        - Status
      summary: Get CA status
      description: |
        Returns the current status of the Certificate Authority,
        including initialization state, version, and key information.
        Requires viewer role or higher.
      operationId: getStatus
      responses:
        '200':
          description: CA status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CAStatus'
              example:
                identity: "go-trusted-ca"
                initialized: true
                version: "1.0.0"
                started_at: "2025-01-03T10:00:00Z"
                key_algorithm: "ECDSA-P384"
                signature_algorithm: "SHA384-ECDSA"
                root_ca: "CN=Trusted Root CA"
                intermediate_ca: "CN=Trusted Issuing CA"
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

  /admin/stats:
    get:
      tags:
        - Status
      summary: Get CA statistics
      description: |
        Returns aggregate statistics about certificates, accounts, and orders.
        Requires viewer role or higher.
      operationId: getStats
      responses:
        '200':
          description: CA statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CAStats'
              example:
                total_certificates: 1250
                valid_certificates: 1100
                revoked_certificates: 50
                expired_certificates: 100
                total_accounts: 85
                active_accounts: 80
                total_orders: 1500
                pending_orders: 12
                completed_orders: 1450
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

  # ============================================================================
  # Audit Endpoint (audit:read)
  # ============================================================================
  /admin/audit:
    get:
      tags:
        - Audit
      summary: Query the audit trail
      description: >-
        Returns a paginated, filtered slice of the append-only audit trail.
        Answers 501 (Not Implemented, as a problem+json body) when this
        deployment has no audit trail configured, rather than claiming the
        trail is empty. Requires audit:read.
      operationId: listAuditLogs
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: event_type
          in: query
          schema:
            type: string
        - name: actor
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: resource
          in: query
          schema:
            type: string
        - name: result
          in: query
          schema:
            type: string
            enum: [success, failure]
        - name: request_id
          in: query
          schema:
            type: string
        - name: start_time
          in: query
          description: RFC 3339 timestamp, inclusive lower bound
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          description: RFC 3339 timestamp, inclusive upper bound
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Page of audit events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAuditLogsResponse'
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
        '500':
          $ref: '#/components/responses/ProblemInternalError'
        '501':
          description: No audit trail is configured on this deployment
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  # ============================================================================
  # Algorithm Discovery Endpoint (admin:capabilities)
  # ============================================================================
  /admin/algorithms:
    get:
      tags:
        - Algorithms
      summary: Discover supported cryptographic algorithms
      description: >-
        Reports the cryptographic algorithms this deployment can actually
        execute, derived from the backends currently configured: hardware
        algorithms appear only when a hardware backend is loaded. Requires
        admin:capabilities.
      operationId: getAlgorithms
      responses:
        '200':
          description: Supported algorithms
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlgorithmsResponse'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '#/components/responses/ProblemForbidden'

components:
  # ============================================================================
  # Security Schemes
  # ============================================================================
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT bearer token, `Authorization: Bearer <token>`"
    mTLS:
      type: mutualTLS
      description: Mutual TLS client certificate authentication

  # ============================================================================
  # Parameters
  # ============================================================================
  parameters:
    TenantIdParam:
      name: tenantId
      in: path
      required: true
      description: Unique tenant identifier
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]*[a-z0-9]$'
        minLength: 2
        maxLength: 63
      example: "acme-corp"

    CAIdParam:
      name: caId
      in: path
      required: true
      description: Intermediate CA identifier
      schema:
        type: string
      example: "int-ca-001"

    KidParam:
      name: kid
      in: path
      required: true
      description: EAB Key Identifier
      schema:
        type: string
      example: "eab-abc123"

    RoleIdParam:
      name: roleID
      in: path
      required: true
      description: qrdb role identifier
      schema:
        type: string
      example: "role_01hq..."

    UserIdParam:
      name: userID
      in: path
      required: true
      description: qrdb user identifier (uint64 Snowflake, decimal string)
      schema:
        type: string
        pattern: '^[0-9]+$'
      example: "123456789012345"

    SerialParam:
      name: serial
      in: path
      required: true
      description: Certificate serial number (hexadecimal)
      schema:
        type: string
        pattern: '^[0-9a-fA-F]+$'
      example: "1A2B3C4D5E6F"

    AccountIdParam:
      name: accountId
      in: path
      required: true
      description: ACME account ID
      schema:
        type: integer
        format: int64
      example: 12345

    OrderIdParam:
      name: orderId
      in: path
      required: true
      description: ACME order ID
      schema:
        type: integer
        format: int64
      example: 67890

    PageParam:
      name: page
      in: query
      description: Page number (1-indexed)
      schema:
        type: integer
        default: 1
        minimum: 1

    PerPageParam:
      name: per_page
      in: query
      description: Number of items per page
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100

  # ============================================================================
  # Response Schemas
  # ============================================================================
  responses:
    # ==========================================================================
    # RFC 7807 problem+json responses. Every admin error response, on every
    # operation in this document, is written by writeProblem
    # (pkg/acme/admin/handlers.go) or PermissionGate.Wrap's own 401/403
    # writeProblem calls (pkg/acme/admin/authz.go): there is no
    # success/data/error JSON envelope anywhere on this API, on the success
    # side or the error side.
    # ==========================================================================
    ProblemBadRequest:
      description: Bad request - invalid input
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: "urn:trusted-ca:error:bad-request"
            title: "Bad Request"
            detail: "Invalid request body"
            status: 400

    ProblemUnauthorized:
      description: Unauthorized - authentication required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: "urn:trusted-ca:error:unauthorized"
            title: "Unauthorized"
            detail: "Authentication required"
            status: 401

    ProblemForbidden:
      description: Forbidden - insufficient permissions
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: "urn:trusted-ca:error:forbidden"
            title: "Forbidden"
            detail: "Access denied: insufficient permissions"
            status: 403

    ProblemNotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: "urn:trusted-ca:error:not-found"
            title: "Not Found"
            detail: "Resource not found"
            status: 404

    ProblemInternalError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: "urn:trusted-ca:error:internal"
            title: "Internal Server Error"
            detail: "An internal error occurred"
            status: 500

  # ============================================================================
  # Schemas
  # ============================================================================
  schemas:
    # Tenant Schemas
    TenantInfo:
      type: object
      properties:
        id:
          type: string
          description: Unique tenant identifier
          example: "acme-corp"
        name:
          type: string
          description: Human-readable tenant name
          example: "ACME Corporation"
        status:
          type: string
          enum: [active, suspended, deleted]
          description: Current tenant status
          example: "active"
        root_ca:
          $ref: '#/components/schemas/TenantRootCAInfo'
        intermediate_cas:
          type: array
          items:
            $ref: '#/components/schemas/TenantIntCAInfo'
        default_intermediate_ca_id:
          type: string
          description: ID of the default intermediate CA
          example: "int-ca-001"
        settings:
          $ref: '#/components/schemas/TenantSettingsInfo'
        created_at:
          type: string
          format: date-time
          example: "2025-01-01T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2025-01-03T12:00:00Z"
        created_by:
          type: string
          description: User who created the tenant
          example: "admin@example.com"

    # KeyInfo describes one key configuration in a CA's key set (algorithm
    # agility: a CA can carry more than one signing key). Mirrors
    # admin.KeyInfo (pkg/acme/admin/types.go), emitted by admin.CAStatus.Keys,
    # admin.TenantRootCAInfo.Keys and admin.TenantIntCAInfo.Keys.
    KeyInfo:
      type: object
      properties:
        algorithm:
          type: string
          description: "Key algorithm family: ECDSA, RSA, Ed25519"
          example: "ECDSA"
        signature_algorithm:
          type: string
          example: "ECDSAWithSHA256"
        store:
          type: string
          description: "Key store backend: software, tpm2, pkcs11"
          example: "software"
        key_size:
          type: integer
          description: RSA key size in bits (RSA only)
          example: 2048
        curve:
          type: string
          description: ECDSA curve name (ECDSA only)
          example: "P-256"
        default:
          type: boolean
          description: True for the primary signing key
          example: true

    TenantRootCAInfo:
      type: object
      properties:
        common_name:
          type: string
          example: "ACME Corp Root CA"
        serial_number:
          type: string
          example: "1A2B3C4D"
        key_algorithm:
          type: string
          example: "ECDSA-P384"
        keys:
          type: array
          items:
            $ref: '#/components/schemas/KeyInfo'
        not_before:
          type: string
          format: date-time
        not_after:
          type: string
          format: date-time
        status:
          type: string
          enum: [active, revoked]
          example: "active"
        created_at:
          type: string
          format: date-time

    TenantIntCAInfo:
      type: object
      properties:
        id:
          type: string
          example: "int-ca-001"
        common_name:
          type: string
          example: "ACME Corp Issuing CA"
        serial_number:
          type: string
          example: "5E6F7A8B"
        parent_type:
          type: string
          enum: [global, tenant]
          description: Whether signed by global or tenant root CA
          example: "tenant"
        purpose:
          type: string
          description: CA purpose (general, server-auth, client-auth, etc.)
          example: "server-auth"
        key_algorithm:
          type: string
          example: "ECDSA-P256"
        keys:
          type: array
          items:
            $ref: '#/components/schemas/KeyInfo'
        not_before:
          type: string
          format: date-time
        not_after:
          type: string
          format: date-time
        status:
          type: string
          enum: [active, pending-rotation, revoked]
          example: "active"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TenantSettingsInfo:
      type: object
      properties:
        max_certificates:
          type: integer
          description: Maximum certificates allowed
          example: 1000
        max_accounts:
          type: integer
          description: Maximum ACME accounts allowed
          example: 100
        allowed_key_algorithms:
          type: array
          items:
            type: string
          example: ["ECDSA-P256", "ECDSA-P384", "RSA-2048"]
        allowed_challenge_types:
          type: array
          items:
            type: string
          example: ["http-01", "dns-01", "device-attest-01"]
        certificate_validity_days:
          type: integer
          description: Default certificate validity in days
          example: 90
        require_eab:
          type: boolean
          description: Whether EAB is required for account creation
          example: true
        allow_endorse_01:
          type: boolean
          description: Whether endorse-01 challenge is enabled
          example: true
        allow_enroll_01:
          type: boolean
          description: Whether enroll-01 challenge is enabled
          example: true

    TenantCAStatusInfo:
      type: object
      properties:
        tenant_id:
          type: string
          example: "acme-corp"
        root_ca:
          $ref: '#/components/schemas/TenantRootCAInfo'
        intermediate_cas:
          type: array
          items:
            $ref: '#/components/schemas/TenantIntCAInfo'
        default_intermediate_ca_id:
          type: string
          example: "int-ca-001"
        active_ca_count:
          type: integer
          description: Number of active intermediate CAs
          example: 2
        can_issue_certificates:
          type: boolean
          description: Whether the tenant can issue certificates
          example: true

    UpdateTenantRequest:
      type: object
      properties:
        name:
          type: string
          description: Updated tenant name
        settings:
          $ref: '#/components/schemas/TenantSettingsInfo'

    UpdateTenantStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [active, suspended, deleted]
          description: New tenant status

    CreateTenantRootCARequest:
      type: object
      required:
        - common_name
        - key_algorithm
        - validity_years
      properties:
        common_name:
          type: string
          description: CA common name
          example: "ACME Corp Root CA"
        key_algorithm:
          type: string
          description: Key algorithm (ECDSA-P256, ECDSA-P384, RSA-2048, RSA-4096)
          example: "ECDSA-P384"
        validity_years:
          type: integer
          description: Certificate validity in years
          minimum: 1
          maximum: 30
          example: 20

    CreateTenantIntermediateCARequest:
      type: object
      required:
        - common_name
        - key_algorithm
        - validity_years
      properties:
        common_name:
          type: string
          description: CA common name
          example: "ACME Corp Issuing CA"
        parent_type:
          type: string
          enum: [global, tenant]
          default: global
          description: Whether to sign with global or tenant root CA
        purpose:
          type: string
          description: CA purpose (general, server-auth, client-auth)
          example: "server-auth"
        key_algorithm:
          type: string
          description: Key algorithm
          example: "ECDSA-P256"
        validity_years:
          type: integer
          description: Certificate validity in years
          minimum: 1
          maximum: 20
          example: 10
        set_as_default:
          type: boolean
          description: Set this CA as the default for certificate issuance
          default: false

    UpdateTenantDefaultCARequest:
      type: object
      required:
        - intermediate_ca_id
      properties:
        intermediate_ca_id:
          type: string
          description: ID of the intermediate CA to set as default
          example: "int-ca-001"

    UpdateIntermediateCAStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [active, pending-rotation, revoked]
          description: New CA status

    # EAB Schemas
    EABInfo:
      type: object
      properties:
        id:
          type: string
          description: EAB key identifier (kid)
          example: "eab-abc123"
        tenant_id:
          type: string
          example: "acme-corp"
        status:
          type: string
          enum: [pending, used, revoked, expired]
          example: "pending"
        purpose:
          type: string
          enum: [account-binding, endorse-01, enroll-01]
          example: "account-binding"
        account_id:
          type: integer
          format: int64
          description: Associated ACME account ID (if used)
        external_account_id:
          type: string
          description: External reference identifier
          example: "user-12345"
        device_info:
          $ref: '#/components/schemas/EABDeviceInfo'
        contact:
          type: array
          items:
            type: string
          example: ["mailto:admin@example.com"]
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          example: "admin@example.com"
        used_at:
          type: [string, "null"]
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time

    EABDeviceInfo:
      type: object
      properties:
        device_id:
          type: string
          example: "device-001"
        manufacturer:
          type: string
          example: "Dell"
        model:
          type: string
          example: "PowerEdge R750"
        ek_public_key_hash:
          type: string
          description: SHA256 hash of the TPM endorsement key
          example: "sha256:a1b2c3d4..."
        tpm_manufacturer:
          type: string
          example: "Infineon"
        tpm_firmware_version:
          type: string
          example: "7.85.4555.0"
        metadata:
          type: object
          additionalProperties:
            type: string

    CreateEABRequest:
      type: object
      properties:
        purpose:
          type: string
          enum: [account-binding, endorse-01, enroll-01]
          default: account-binding
          description: EAB purpose
        external_account_id:
          type: string
          description: External reference identifier
        device_info:
          $ref: '#/components/schemas/EABDeviceInfo'
        contact:
          type: array
          items:
            type: string
          description: Contact URLs (mailto:, tel:, etc.)
        expires_in_days:
          type: integer
          description: Number of days until expiration
          minimum: 1
          maximum: 365
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Additional metadata key-value pairs

    CreateEABResponse:
      type: object
      properties:
        id:
          type: string
          description: EAB key identifier (kid)
          example: "eab-abc123"
        mac_key:
          type: string
          description: Base64url-encoded MAC key (shown only once)
          example: "ZOMGTlZrZW5YbGZ..."
        algorithm:
          type: string
          description: MAC algorithm
          example: "HS256"
        expires_at:
          type: string
          format: date-time

    ListEABResponse:
      description: >-
        The literal shape ListTenantEABs writes: admin.ListResponse{Items:
        eabs, Total, Page, PerPage} (pkg/acme/admin/tenant_handlers.go).
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EABInfo'
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: [integer, "null"]

    # Role Schemas (per-tenant RBAC, backed by go-qrdb sdk/go/transport.Role)
    RoleInfo:
      type: object
      properties:
        id:
          type: string
          example: "role_01hq..."
        name:
          type: string
          example: "endorser"
        tenant_id:
          type: string
          example: "acme-corp"
        permissions:
          type: array
          items:
            type: string
          description: qrdb "resource:action" permission strings
          example: ["acme_eab:create", "acme_eab:list"]
        system:
          type: boolean
          description: True for a built-in role seeded by qrdb; built-ins cannot be deleted.
        retired_permissions:
          type: array
          items:
            type: string
          description: >-
            Members of permissions that the running server's build no longer
            defines, derived on read from the live permission registry.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateRoleRequest:
      type: object
      required:
        - name
        - permissions
      properties:
        id:
          type: string
          description: Optional pre-assigned identifier; the server generates a UUID when omitted.
        name:
          type: string
          example: "endorser"
        permissions:
          type: array
          items:
            type: string
          example: ["acme_eab:create", "acme_eab:list"]

    UpdateRoleRequest:
      type: object
      properties:
        name:
          type: string
        permissions:
          type: array
          items:
            type: string

    ListRolesResponse:
      type: object
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleInfo'
        total:
          type: integer
        has_more:
          type: boolean

    # User Schemas (per-tenant, backed by go-qrdb sdk/go/transport.User)
    UserInfo:
      type: object
      properties:
        id:
          type: string
          description: uint64 Snowflake, carried as a decimal string
          example: "123456789012345"
        username:
          type: string
        email:
          type: string
          description: Canonical tenant-unique login key; empty only for system users
        name:
          type: string
        tenant_id:
          type: string
        role_ids:
          type: [array, "null"]
          description: >-
            db.User.RoleIDs carries no omitempty tag, so a user with no role
            assignments serializes this as JSON null rather than [].
          items:
            type: string
        enabled:
          type: boolean
        system:
          type: boolean
        lifecycle:
          type: string
          enum: [pending, active, suspended, locked, disabled, deleting]
        group_ids:
          type: array
          items:
            type: string
        auth_methods:
          type: array
          items:
            type: string
          example: ["webauthn", "piv"]
        last_auth:
          type: string
          format: date-time
        cert_bindings:
          type: array
          items:
            $ref: '#/components/schemas/CertBindingInfo'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CertBindingInfo:
      type: object
      properties:
        thumbprint:
          type: string
          description: base64url SHA-256 the certificate is matched by
        kind:
          type: string
          enum: [spki_thumbprint, full_cert_fingerprint, piv_attested]
        not_after:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      required:
        - username
      properties:
        username:
          type: string
        email:
          type: string
          description: Required unless without_email_login_key is true
        name:
          type: string
        without_email_login_key:
          type: boolean
          description: Creates a certificate-only or bootstrap identity with no email login key
        role_ids:
          type: array
          items:
            type: string
        group_ids:
          type: array
          items:
            type: string
        auth_methods:
          type: array
          items:
            type: string
        lifecycle:
          type: string
          enum: [pending, active, disabled]
        pending:
          type: boolean
          description: Shorthand for lifecycle "pending"

    UpdateUserRequest:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        name:
          type: string
        role_ids:
          type: array
          items:
            type: string
        group_ids:
          type: [array, "null"]
          items:
            type: string
          description: Replaces the set when non-null; null leaves it unchanged, [] clears it.
        auth_methods:
          type: [array, "null"]
          items:
            type: string
          description: Replaces the set when non-null; null leaves it unchanged, [] clears it.
        lifecycle:
          type: string
        last_auth:
          type: string
          format: date-time

    ListUsersResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserInfo'
        total:
          type: integer
        has_more:
          type: boolean

    # RFC 7807 problem detail, written by pkg/acme/admin.writeProblem for
    # every roles/users/audit/algorithms error response below.
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          example: "urn:trusted-ca:error:not-found"
        title:
          type: string
          example: "Not Found"
        detail:
          type: string
          example: "Role not found"
        status:
          type: integer
          example: 404

    # Audit Schemas
    AuditEventInfo:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        event_type:
          type: string
        actor:
          type: string
          example: "admin:user@example.com"
        resource:
          type: string
          example: "certificate:abc123"
        action:
          type: string
          example: "revoke"
        result:
          type: string
          enum: [success, failure]
        request_id:
          type: string
        source_ip:
          type: string
        user_agent:
          type: string
        details:
          type: object
          additionalProperties: true
        error_message:
          type: string
        duration_ms:
          type: integer

    ListAuditLogsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEventInfo'
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer

    # Algorithm Discovery Schemas
    AlgorithmInfo:
      type: object
      properties:
        algorithm:
          type: string
          example: "ECDSA"
        curves:
          type: array
          items:
            type: string
          example: ["P-256", "P-384"]
        key_sizes:
          type: array
          items:
            type: integer
          example: [2048, 3072, 4096]
        backends:
          type: array
          items:
            type: string
          example: ["software", "tpm2"]
        post_quantum:
          type: boolean

    AlgorithmsResponse:
      type: object
      properties:
        signing:
          type: array
          items:
            $ref: '#/components/schemas/AlgorithmInfo'
        key_encapsulation:
          type: array
          items:
            $ref: '#/components/schemas/AlgorithmInfo'

    # Certificate Schemas
    CertificateInfo:
      type: object
      properties:
        serial_number:
          type: string
          description: Certificate serial number (hex)
          example: "1A2B3C4D5E6F"
        subject:
          type: string
          description: Certificate subject DN
          example: "CN=api.example.com"
        issuer:
          type: string
          description: Certificate issuer DN
          example: "CN=ACME Corp Issuing CA"
        not_before:
          type: string
          format: date-time
        not_after:
          type: string
          format: date-time
        status:
          type: string
          enum: [valid, revoked, expired]
          example: "valid"
        issued_at:
          type: string
          format: date-time
        cert_url:
          type: string
          format: uri
          description: URL to download the certificate

    ListCertificatesResponse:
      description: >-
        The literal shape ListCertificates and ListExpiringCertificates write:
        admin.ListResponse{Items: certs, Total, Page, PerPage}
        (pkg/acme/admin/handlers.go).
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CertificateInfo'
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer

    RevokeRequest:
      type: object
      properties:
        reason:
          type: string
          description: Revocation reason code
          enum:
            - unspecified
            - keyCompromise
            - cACompromise
            - affiliationChanged
            - superseded
            - cessationOfOperation
            - certificateHold
            - removeFromCRL
            - privilegeWithdrawn
            - aACompromise
          example: "keyCompromise"

    # Account Schemas
    AccountInfo:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 12345
        status:
          type: string
          enum: [valid, deactivated, revoked]
          example: "valid"
        contact:
          type: array
          items:
            type: string
          example: ["mailto:admin@example.com"]
        created_at:
          type: string
          format: date-time
        terms_of_service_agreed:
          type: boolean
          example: true
        orders_url:
          type: string
          format: uri
        order_count:
          type: integer
          description: Total number of orders
          example: 15

    ListAccountsResponse:
      description: >-
        The literal shape ListAccounts writes: admin.ListResponse{Items:
        accounts, Total, Page, PerPage} (pkg/acme/admin/handlers.go).
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccountInfo'
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer

    # Order Schemas
    OrderInfo:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 67890
        account_id:
          type: integer
          format: int64
          example: 12345
        status:
          type: string
          enum: [pending, ready, processing, valid, invalid]
          example: "valid"
        identifiers:
          type: array
          items:
            type: string
          description: Requested identifiers
          example: ["api.example.com", "www.example.com"]
        not_before:
          type: string
          description: Requested not-before time
        not_after:
          type: string
          description: Requested not-after time
        expires:
          type: string
          description: Order expiration time
        certificate:
          type: string
          format: uri
          description: Certificate URL (if issued)
        created_at:
          type: string
          format: date-time

    ListOrdersResponse:
      description: >-
        The literal shape ListOrders writes: admin.ListResponse{Items:
        orders, Total, Page, PerPage} (pkg/acme/admin/handlers.go).
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderInfo'
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer

    # Status Schemas
    CAStatus:
      type: object
      properties:
        identity:
          type: string
          description: CA identity name
          example: "go-trusted-ca"
        initialized:
          type: boolean
          description: Whether the CA is initialized
          example: true
        version:
          type: string
          description: CA software version
          example: "1.0.0"
        started_at:
          type: string
          format: date-time
          description: CA start time
        key_algorithm:
          type: string
          description: Root CA key algorithm
          example: "ECDSA-P384"
        signature_algorithm:
          type: string
          description: Signature algorithm
          example: "SHA384-ECDSA"
        root_ca:
          type: string
          description: Root CA subject
          example: "CN=Trusted Root CA"
        intermediate_ca:
          type: string
          description: Default intermediate CA subject
          example: "CN=Trusted Issuing CA"
        keys:
          type: array
          items:
            $ref: '#/components/schemas/KeyInfo'

    CAStats:
      type: object
      properties:
        total_certificates:
          type: integer
          description: Total certificates issued
          example: 1250
        valid_certificates:
          type: integer
          description: Currently valid certificates
          example: 1100
        revoked_certificates:
          type: integer
          description: Revoked certificates
          example: 50
        expired_certificates:
          type: integer
          description: Expired certificates
          example: 100
        total_accounts:
          type: integer
          description: Total ACME accounts
          example: 85
        active_accounts:
          type: integer
          description: Active (valid) accounts
          example: 80
        total_orders:
          type: integer
          description: Total orders created
          example: 1500
        pending_orders:
          type: integer
          description: Currently pending orders
          example: 12
        completed_orders:
          type: integer
          description: Successfully completed orders
          example: 1450
