# Compose project name. This MUST be set explicitly.
#
# Without it, compose derives the project name from the directory holding this
# file — ".devcontainer" → "devcontainer" — which is exactly the name
# go-trusted-platform's stack (build/docker/devcontainer) already uses. Both
# projects then share a namespace: `docker compose exec devcontainer ...` run
# from go-xkms attaches to go-trusted-platform's container, `up -d xkms-server`
# silently matches nothing, and the volumes collide. Naming the project pins
# every container, image, volume and network to go-xkms.
name: go-xkms

services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    # Explicit image + container name so this container can never be confused
    # with another project's devcontainer.
    image: go-xkms-dev:latest
    container_name: go-xkms-devcontainer
    # Privileged mode required for QEMU with KVM acceleration
    privileged: true
    # Capabilities for QEMU/KVM and hardware testing
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN        # For mount operations
      - NET_ADMIN        # For network configuration
      - IPC_LOCK         # For TPM memory locking
    # Device access for KVM acceleration
    # Note: /dev/uhid access handled via privileged mode + mknod in post-start
    devices:
      - /dev/kvm:/dev/kvm
    # Shared memory for QEMU
    shm_size: '2gb'
    # Memory limits for TPM operations
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ..:/workspace:cached
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/home/vscode/.cache/go-build
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared socket volume for xkms server communication
      - xkms-socket:/var/run/xkms
      # The xkms-server's state directory, read-only. The daemon initializes its
      # CA here on first start and issues its own TLS server certificate from it,
      # so this is where the gRPC-over-TCP lane of the PKCS#11 suites gets the
      # root it must trust. See scripts/ensure-server-ca.sh, which normalizes it
      # into XKMS_GRPC_TLS_CA.
      - xkms-data:/xkms-data:ro
    environment:
      - GOPATH=/go
      # In-house modules resolve from Gitea tags (dependency-resolution.md §6).
      # The read-only token comes from the gitignored .devcontainer/.env.
      - GOWORK=off
      - GOPRIVATE=github.com/jeremyhahn/*
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=url.http://x:${GITEA_GO_TOKEN}@198.51.100.91:3001/jeremyhahn/.insteadOf
      - GIT_CONFIG_VALUE_0=https://github.com/jeremyhahn/
      - CGO_ENABLED=1
      - TPM_USE_SIMULATOR=true
      - TPM_SIMULATOR_HOST=swtpm
      - TPM_SIMULATOR_PORT=2321
      - SOFTHSM2_CONF=/etc/softhsm/softhsm2.conf
      - PKCS11_LIBRARY=/usr/lib/softhsm/libsofthsm2.so
      # Integration test endpoints (XKMS_* prefix for PKCS#11 module)
      - XKMS_UNIX_SOCKET=/var/run/xkms/xkms.sock
      - XKMS_GRPC_ADDR=xkms-server:9443
      - XKMS_GRPC_TLS_ENABLED=true
      # Written by scripts/ensure-server-ca.sh from the read-only xkms-data
      # mount. It must be a path the unprivileged container user can write, so
      # it is NOT /etc/xkms/certs/ca.crt (the module's compiled-in default,
      # which nothing in this stack ever creates).
      - XKMS_GRPC_TLS_CA=/tmp/xkms/ca.crt
      - XKMS_SERVER_STATE_DIR=/xkms-data
      # The same trust anchor again, under the names the PKCS#11 MODULE reads
      # (pkg/pkcs11/module/config.go). The XKMS_GRPC_TLS_* pair above is read by
      # the Go test harness, which configures an in-process module; the
      # pkcs11-tool lanes instead load the module in a separate process that has
      # only the environment to go on. Enabling TLS here is safe for the unix
      # lane: the module applies TLS only to gRPC/TCP targets and a unix://
      # target never reaches createGRPCClient's TLS branch.
      - XKMS_PKCS11_TLS_ENABLED=true
      - XKMS_PKCS11_TLS_CA=/tmp/xkms/ca.crt
      # Legacy endpoints (KEYSTORE_* prefix)
      - KEYSTORE_UNIX_SOCKET=/var/run/xkms/xkms.sock
      - KEYSTORE_REST_URL=https://xkms-server:8443
      - KEYSTORE_GRPC_ADDR=xkms-server:9443
      - KEYSTORE_QUIC_URL=https://xkms-server:8444
      - KEYSTORE_MCP_ADDR=xkms-server:8445
      - KEYSTORE_TLS_CA=/etc/xkms/certs/ca.crt
      # PKCS#11 module configuration
      - PKCS11_MODULE=/workspace/build/lib/libxkms_pkcs11.so
      - PKCS11_TOKEN_LABEL=xkms-token
      - PKCS11_PIN=87654321
      - PKCS11_SO_PIN=12345678
      # PKCS#11 module auto-initialization and persistence
      - XKMS_PKCS11_AUTO_INIT_TOKEN=true
      - XKMS_PKCS11_SO_PIN=12345678
      - XKMS_PKCS11_USER_PIN=87654321
      - XKMS_PKCS11_TOKEN_LABEL=test-token
      - XKMS_PKCS11_STORAGE_TYPE=file
      - XKMS_PKCS11_STORAGE_PATH=/tmp/pkcs11-storage
      # FIDO2 configuration (auto-detect device or use FIDO2_DEVICE_PATH)
      - FIDO2_PIN=123456
      - FIDO2_DEVICE_PATH=
      - FIDO2_USE_VIRTUAL=true
    networks:
      - xkms-dev
    depends_on:
      swtpm:
        condition: service_healthy
      softhsm:
        condition: service_healthy
    security_opt:
      - seccomp:unconfined
    command: sleep infinity

  # SWTPM TPM 2.0 Simulator (shared across all tests)
  swtpm:
    build:
      context: ../test/docker/swtpm
      dockerfile: Dockerfile
    image: go-xkms-swtpm:dev
    container_name: xkms-dev-swtpm
    volumes:
      - swtpm-state:/var/lib/swtpm/tpmstate
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2321"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - xkms-dev

  # SoftHSM PKCS#11 Service (shared across all tests)
  softhsm:
    build:
      context: ../test/docker/softhsm
      dockerfile: Dockerfile
    image: go-xkms-softhsm:dev
    container_name: xkms-dev-softhsm
    volumes:
      - softhsm-tokens:/tokens
    environment:
      - SOFTHSM2_CONF=/home/softhsm/softhsm2.conf
      - PKCS11_LIBRARY=/usr/local/lib/softhsm/libsofthsm2.so
    healthcheck:
      test: ["CMD", "test", "-f", "/usr/local/lib/softhsm/libsofthsm2.so"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - xkms-dev

  # XKMS server for integration tests (optional, started manually)
  xkms-server:
    build:
      context: ..
      dockerfile: Dockerfile
      # In-house modules resolve from Gitea tags at image build via the
      # gomodauth BuildKit secret (dependency-resolution.md §6). Stage it with
      # `make stage-gomodauth` before building this service.
      secrets:
        - gomodauth
    image: go-xkms-server:dev
    container_name: xkms-dev-server
    # Host ports are offset into a private block: this stack runs alongside
    # other project stacks (go-trusted-platform publishes 8443/9445/10443/3000)
    # and must not fight them for a host port. Nothing in the test path uses
    # these — tests reach the server over the shared xkms-socket volume or by
    # service DNS on the xkms-dev network — they exist for host-side debugging.
    ports:
      - "${XKMS_HOST_REST_PORT:-28443}:8443"    # REST API
      - "${XKMS_HOST_GRPC_PORT:-29443}:9443"    # gRPC
      - "${XKMS_HOST_QUIC_PORT:-28444}:8444"    # QUIC
      - "${XKMS_HOST_MCP_PORT:-28445}:8445"     # MCP
      - "${XKMS_HOST_METRICS_PORT:-29090}:9090" # Metrics
    volumes:
      - xkms-data:/data
      - xkms-socket:/var/run/xkms
      - ../configs/xkmsd-integration.yaml:/etc/xkms/xkmsd.yaml:ro
    environment:
      - XKMS_CONFIG=/etc/xkms/xkmsd.yaml
      - KEYSTORE_LOG_LEVEL=debug
      - KEYSTORE_DATA_DIR=/data
      - TPM_DEVICE_PATH=tcp://swtpm:2321
      - TPM_USE_SIMULATOR=true
      - PKCS11_LIBRARY=/usr/lib/softhsm/libsofthsm2.so
      - SOFTHSM2_CONF=/etc/softhsm/softhsm2.conf
    depends_on:
      swtpm:
        condition: service_healthy
      softhsm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-S", "/var/run/xkms/xkms.sock"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - xkms-dev
    # xkmsd has no insecure override: it refuses to start whenever
    # ComplianceGaps() is non-empty. The integration config therefore ships a
    # compliant posture — TLS from the embedded CA, adaptive auth (anonymous
    # only until the first user exists), and a barrier with a development
    # passphrase that auto-unseals — so the suites need no unseal ceremony and
    # no pre-seeded credentials. This instance is reachable only from the
    # private xkms-dev network and the xkms-socket volume, over a throwaway
    # data volume.
    command: ["/app/xkmsd", "-config", "/etc/xkms/xkmsd.yaml"]

  # Virtual FIDO2 Authenticator Service (for WebAuthn testing without hardware)
  # Uses software CTAP2 implementation with socket-based interface
  softfido:
    build:
      context: .
      dockerfile: Dockerfile.softfido
    image: go-xkms-softfido:dev
    container_name: xkms-dev-softfido
    volumes:
      - softfido-state:/var/lib/softfido
      - softfido-run:/var/run/softfido
    environment:
      - SOFTFIDO_PIN=123456
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - xkms-dev

volumes:
  go-mod-cache:
  go-build-cache:
  swtpm-state:
  softhsm-tokens:
  xkms-data:
  xkms-socket:
  softfido-state:
  softfido-run:

networks:
  xkms-dev:
    driver: bridge

# Module-fetch credentials for image builds: sourceable `export` lines staged
# 0600 by `make stage-gomodauth` (gitignored and dockerignored; empty when no
# Gitea token is configured, so public-proxy builds work unchanged).
secrets:
  gomodauth:
    file: ./gomodauth.env
