# Compose project name. This MUST be set explicitly.
#
# Without it, compose derives the project name from the directory holding this
# file — ".devcontainer" → "devcontainer" — which is exactly the name
# go-trusted-platform's stack (build/docker/devcontainer) already uses. Both
# projects then share a namespace: `docker compose exec devcontainer ...` run
# from go-xkms attaches to go-trusted-platform's container, `up -d xkms-server`
# silently matches nothing, and the volumes collide. Naming the project pins
# every container, image, volume and network to go-xkms.
#
# This is only the floor, for someone invoking `docker compose -f` by hand. A
# project name is host-global, so a constant one still lets two CI jobs on the
# same runner host collide with each other. The Makefile therefore overrides
# it per run with `go-xkms-$GITHUB_RUN_ID-devcontainer` (see COMPOSE_NS), and
# that override is what CI always uses.
#
# For the same reason no service below may declare `container_name:`, a fixed
# `networks: name:` or a fixed host port: each of those is absolute and
# silently defeats the project prefix. Services address each other by compose
# service name, which resolves inside the project network regardless.
name: go-xkms

services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    image: go-xkms-dev:${XKMS_IMAGE_TAG:-latest}
    # Privileged mode required for QEMU with KVM acceleration
    privileged: true
    # Capabilities for QEMU/KVM and hardware testing
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN        # For mount operations
      - NET_ADMIN        # For network configuration
      - IPC_LOCK         # For TPM memory locking
    # Device access for KVM acceleration
    # Note: /dev/uhid access handled via privileged mode + mknod in post-start
    devices:
      - /dev/kvm:/dev/kvm
    # Shared memory for QEMU
    shm_size: '2gb'
    # Memory limits for TPM operations
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ..:/workspace:cached
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/home/vscode/.cache/go-build
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared socket volume for xkms server communication
      - xkms-socket:/var/run/xkms
      # The xkms-server's state directory, read-only. The daemon initializes its
      # CA here on first start and issues its own TLS server certificate from it,
      # so this is where the gRPC-over-TCP lane of the PKCS#11 suites gets the
      # root it must trust. See scripts/ensure-server-ca.sh, which normalizes it
      # into XKMS_GRPC_TLS_CA.
      - xkms-data:/xkms-data:ro
    environment:
      # Positive devcontainer identity marker, also baked into the image
      # (.devcontainer/Dockerfile). Set here too so a container created from
      # a pre-marker image still carries it. The Makefile tests this instead
      # of /.dockerenv, which is true in ANY container and made the CI job
      # container impersonate the devcontainer (go-xkms #19).
      - XKMS_DEVCONTAINER=1
      - GOPATH=/go
      # In-house modules resolve from Gitea tags (dependency-resolution.md §6).
      # The read-only token comes from the gitignored .devcontainer/.env.
      - GOWORK=off
      - GOPRIVATE=github.com/jeremyhahn/*
      - GIT_CONFIG_COUNT=${GITEA_GIT_CONFIG_COUNT:-${GITEA_HOST:+1}}
      - GIT_CONFIG_KEY_0=url.http://x:${GITEA_GO_TOKEN}@${GITEA_HOST}/jeremyhahn/.insteadOf
      - GIT_CONFIG_VALUE_0=https://github.com/jeremyhahn/
      - CGO_ENABLED=1
      - TPM_USE_SIMULATOR=true
      - TPM_SIMULATOR_HOST=swtpm
      - TPM_SIMULATOR_PORT=2321
      - SOFTHSM2_CONF=/etc/softhsm/softhsm2.conf
      - PKCS11_LIBRARY=/usr/lib/softhsm/libsofthsm2.so
      # Integration test endpoints (XKMS_* prefix for PKCS#11 module)
      - XKMS_UNIX_SOCKET=/var/run/xkms/xkms.sock
      - XKMS_GRPC_ADDR=xkms-server:9443
      - XKMS_GRPC_TLS_ENABLED=true
      # Written by scripts/ensure-server-ca.sh from the read-only xkms-data
      # mount. It must be a path the unprivileged container user can write, so
      # it is NOT /etc/xkms/certs/ca.crt (the module's compiled-in default,
      # which nothing in this stack ever creates).
      - XKMS_GRPC_TLS_CA=/tmp/xkms/ca.crt
      # First-boot admin mTLS credential (published by ensure-server-ca.sh):
      # the unified server enforces authentication, and the admin certificate
      # is the only credential a fresh deployment holds.
      - XKMS_GRPC_TLS_CERT=/tmp/xkms/admin-cert.pem
      - XKMS_GRPC_TLS_KEY=/tmp/xkms/admin-key.pem
      - XKMS_SERVER_STATE_DIR=/xkms-data
      # The same trust anchor again, under the names the PKCS#11 MODULE reads
      # (pkg/pkcs11/module/config.go). The XKMS_GRPC_TLS_* pair above is read by
      # the Go test harness, which configures an in-process module; the
      # pkcs11-tool lanes instead load the module in a separate process that has
      # only the environment to go on. Enabling TLS here is safe for the unix
      # lane: the module applies TLS only to gRPC/TCP targets and a unix://
      # target never reaches createGRPCClient's TLS branch.
      - XKMS_PKCS11_TLS_ENABLED=true
      - XKMS_PKCS11_TLS_CA=/tmp/xkms/ca.crt
      # Legacy endpoints (KEYSTORE_* prefix)
      - KEYSTORE_UNIX_SOCKET=/var/run/xkms/xkms.sock
      - KEYSTORE_REST_URL=https://xkms-server:8443
      - KEYSTORE_GRPC_ADDR=xkms-server:9443
      - KEYSTORE_QUIC_URL=https://xkms-server:8444
      - KEYSTORE_MCP_ADDR=xkms-server:8445
      - KEYSTORE_TLS_CA=/etc/xkms/certs/ca.crt
      # PKCS#11 module configuration
      - PKCS11_MODULE=/workspace/build/lib/libxkms_pkcs11.so
      - PKCS11_TOKEN_LABEL=xkms-token
      - PKCS11_PIN=87654321
      - PKCS11_SO_PIN=12345678
      # PKCS#11 module auto-initialization and persistence
      - XKMS_PKCS11_AUTO_INIT_TOKEN=true
      - XKMS_PKCS11_SO_PIN=12345678
      - XKMS_PKCS11_USER_PIN=87654321
      - XKMS_PKCS11_TOKEN_LABEL=test-token
      - XKMS_PKCS11_STORAGE_TYPE=file
      - XKMS_PKCS11_STORAGE_PATH=/tmp/pkcs11-storage
      # FIDO2 configuration (auto-detect device or use FIDO2_DEVICE_PATH)
      - FIDO2_PIN=123456
      - FIDO2_DEVICE_PATH=
      - FIDO2_USE_VIRTUAL=true
    networks:
      - xkms-dev
    depends_on:
      swtpm:
        condition: service_healthy
      softhsm:
        condition: service_healthy
    security_opt:
      - seccomp:unconfined
    command: sleep infinity

  # SWTPM TPM 2.0 Simulator (shared across all tests)
  swtpm:
    build:
      context: ../test/docker/swtpm
      dockerfile: Dockerfile
    image: go-xkms-swtpm:${XKMS_IMAGE_TAG:-dev}
    volumes:
      - swtpm-state:/var/lib/swtpm/tpmstate
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2321"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - xkms-dev

  # SoftHSM PKCS#11 Service (shared across all tests)
  softhsm:
    build:
      context: ../test/docker/softhsm
      dockerfile: Dockerfile
    image: go-xkms-softhsm:${XKMS_IMAGE_TAG:-dev}
    volumes:
      - softhsm-tokens:/tokens
    environment:
      - SOFTHSM2_CONF=/home/softhsm/softhsm2.conf
      - PKCS11_LIBRARY=/usr/local/lib/softhsm/libsofthsm2.so
    healthcheck:
      # Loads the library rather than stat'ing it: a `test -f` cannot detect
      # the "the .so will not load" failure mode (#227).
      test: ["CMD", "softhsm2-util", "--show-slots"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - xkms-dev

  # XKMS server for integration tests (optional, started manually)
  xkms-server:
    build:
      context: ..
      dockerfile: Dockerfile
      # In-house modules resolve from Gitea tags at image build via the
      # gomodauth BuildKit secret (dependency-resolution.md §6). Stage it with
      # `make stage-gomodauth` before building this service.
      secrets:
        - gomodauth
    image: go-xkms-server:${XKMS_IMAGE_TAG:-dev}
    # Published on an EPHEMERAL host port (host side 0), not a fixed one. A
    # published host port is a host-global resource: a fixed number means this
    # stack fights other project stacks (go-trusted-platform publishes
    # 8443/9445/10443/3000) and, worse, fights the *same* stack belonging to
    # another CI job on the same runner host. Nothing in the test path needs a
    # predictable number — tests reach the server over the shared xkms-socket
    # volume or by service DNS on the xkms-dev network — so these exist purely
    # for host-side debugging. Ask docker which port it picked:
    #   docker compose -p <project> port xkms-server 8443
    # Set XKMS_HOST_*_PORT to pin one when you want a stable local endpoint.
    ports:
      - "${XKMS_HOST_REST_PORT:-0}:8443"    # REST API
      - "${XKMS_HOST_GRPC_PORT:-0}:9443"    # gRPC
      - "${XKMS_HOST_QUIC_PORT:-0}:8444"    # QUIC
      - "${XKMS_HOST_MCP_PORT:-0}:8445"     # MCP
      - "${XKMS_HOST_METRICS_PORT:-0}:9090" # Metrics
    volumes:
      - xkms-data:/data
      - xkms-socket:/var/run/xkms
      # xkmsd.yaml is baked into the image (see Dockerfile) rather than bind
      # mounted: a relative host path here resolves against the Gitea
      # Actions job container's filesystem, not the actual docker daemon
      # host, and fails outright when the daemon tries to auto-create the
      # missing mount source (task 3771: "mkdir /workspace: file exists").
    environment:
      - XKMS_CONFIG=/etc/xkms/xkmsd.yaml
      - KEYSTORE_LOG_LEVEL=debug
      - KEYSTORE_DATA_DIR=/data
      - TPM_DEVICE_PATH=tcp://swtpm:2321
      - TPM_USE_SIMULATOR=true
      - PKCS11_LIBRARY=/usr/lib/softhsm/libsofthsm2.so
      - SOFTHSM2_CONF=/etc/softhsm/softhsm2.conf
    depends_on:
      swtpm:
        condition: service_healthy
      softhsm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-S", "/var/run/xkms/xkms.sock"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      xkms-dev:
        # The dotted alias exists for the WebAuthn login matrix: a WebAuthn
        # RPID must be "localhost" or contain a dot, so the fido2 leg dials
        # this alias and the integration config's rp_id matches it. xkey
        # trusts the connection by SPKI pin, so no certificate SAN is needed.
        aliases:
          - xkms-server.test
    # xkmsd has no insecure override: it refuses to start whenever
    # ComplianceGaps() is non-empty. The integration config therefore ships a
    # compliant posture — TLS from the embedded CA, composite jwt+mtls auth
    # (the first-boot admin authenticates with the generated mTLS
    # credential), and a barrier with a development passphrase that
    # auto-unseals — so the suites need no unseal ceremony and no pre-seeded
    # credentials. This instance is reachable only from the private xkms-dev
    # network and the xkms-socket volume, over a throwaway data volume.
    command: ["/app/xkmsd", "-config", "/etc/xkms/xkmsd.yaml"]

  # quicbaasd fixture for the login verification matrix
  # (make integration-test-logins-quicbaas). Built from the sibling
  # go-quicbaas working tree with the SAME gomodauth BuildKit secret the
  # xkms-server build uses (its go.mod pins first-party modules from the
  # internal Gitea). Started only by the quicbaas logins lane — it is NOT
  # part of the default stack.
  quicbaas-server:
    build:
      context: ../../go-quicbaas
      dockerfile: Dockerfile
      args:
        # The default BUILD_TAGS is gms_pure_go only, which compiles
        # quicbaas's module REST surface out entirely ("REST server not
        # available (build with -tags rest to enable)") — the login matrix
        # needs the real REST plane. gms_pure_go must stay in the list
        # (CGO_ENABLED=0 builder).
        BUILD_TAGS: "gms_pure_go rest"
      secrets:
        - gomodauth
    image: go-quicbaas-server:${XKMS_IMAGE_TAG:-dev}
    profiles:
      - quicbaas
    volumes:
      - quicbaas-data:/data
      - ../configs/quicbaasd-integration.yaml:/etc/quicbaas/quicbaas.yaml:ro
    # "start" = single-node local PebbleDB backend (no Raft) — the right
    # shape for a login-matrix fixture.
    command: ["start", "--config", "/etc/quicbaas/quicbaas.yaml", "--data-dir", "/data"]
    healthcheck:
      # The REST port answers TLS only; a TCP connect proves liveness
      # without needing credentials inside the container.
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 8443 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    networks:
      xkms-dev:
        # Dotted alias for the WebAuthn RPID, mirroring xkms-server.test:
        # a WebAuthn RPID must be "localhost" or contain a dot.
        aliases:
          - quicbaas-server.test

  # Virtual FIDO2 Authenticator Service (for WebAuthn testing without hardware)
  # Uses software CTAP2 implementation with socket-based interface
  softfido:
    build:
      context: .
      dockerfile: Dockerfile.softfido
    image: go-xkms-softfido:${XKMS_IMAGE_TAG:-dev}
    volumes:
      - softfido-state:/var/lib/softfido
      - softfido-run:/var/run/softfido
    environment:
      - SOFTFIDO_PIN=123456
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - xkms-dev

volumes:
  go-mod-cache:
  go-build-cache:
  swtpm-state:
  softhsm-tokens:
  xkms-data:
  xkms-socket:
  quicbaas-data:
  softfido-state:
  softfido-run:

networks:
  xkms-dev:
    driver: bridge

# Module-fetch credentials for image builds: sourceable `export` lines staged
# 0600 by `make stage-gomodauth` (gitignored and dockerignored; empty when no
# Gitea token is configured, so public-proxy builds work unchanged).
secrets:
  gomodauth:
    file: ./gomodauth.env
