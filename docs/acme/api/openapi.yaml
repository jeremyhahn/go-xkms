openapi: 3.0.3
info:
  title: go-trusted-ca API
  description: |
    Complete API for go-trusted-ca Certificate Authority.

    This API provides:
    - **ACME Protocol** (RFC 8555) - Automatic certificate management
    - **Admin API** - Certificate, account, and tenant management
    - **Multi-tenant support** - Isolated certificate authorities per tenant

    ## ACME Protocol Endpoints

    The ACME endpoints implement RFC 8555 with additional extensions for:
    - TPM device attestation (device-attest-01)
    - TPM endorsement certificates (endorse-01)
    - TPM enrollment (enroll-01)

    ## Authentication

    ### ACME API
    ACME endpoints use JWS (JSON Web Signature) authentication per RFC 8555.
    Each request must include a signed JWS with:
    - `kid` - Account URL (for existing accounts)
    - `jwk` - JSON Web Key (for new account registration)
    - `nonce` - Replay protection nonce

    ### Admin API
    All admin endpoints require Bearer token authentication using JWT tokens.
    Include the token in the Authorization header:

    ```
    Authorization: Bearer <jwt_token>
    ```

    ## Role-Based Access Control

    The Admin API implements hierarchical RBAC with the following roles:

    | Role | Level | Capabilities |
    |------|-------|--------------|
    | super-admin | 100 | Full system access, manage all tenants, root CA, system config |
    | admin | 80 | Tenant-level full access, manage intermediate CAs |
    | endorser | 60 | Operator permissions plus endorse-01 EAB operations |
    | operator | 40 | Read/write access, cannot delete or manage CAs |
    | viewer | 20 | Read-only access |

  version: 1.0.0
  contact:
    name: Automate The Things, LLC
    email: support@automatethethings.com
    url: https://github.com/jeremyhahn/go-trusted-ca
  license:
    name: AGPL-3.0 / Commercial
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: https://ca.example.com
    description: Production CA server
  - url: https://ca-staging.example.com
    description: Staging CA server
  - url: http://localhost:8443
    description: Local development

tags:
  - name: ACME Directory
    description: ACME protocol discovery
  - name: ACME Accounts
    description: ACME account management (RFC 8555 Section 7.3)
  - name: ACME Orders
    description: Certificate order lifecycle (RFC 8555 Section 7.4)
  - name: ACME Challenges
    description: Domain validation (RFC 8555 Section 8)
  - name: ACME Certificates
    description: Certificate issuance and download
  - name: Certificates
    description: Admin certificate management operations
  - name: Accounts
    description: Admin ACME account management
  - name: Orders
    description: Admin ACME order management
  - name: Status
    description: CA status and statistics
  - name: Tenants
    description: Multi-tenant management (super-admin only for create/delete)
  - name: Tenant CAs
    description: Tenant Certificate Authority management
  - name: EAB
    description: External Account Binding management
  - name: Policies
    description: RBAC policy management

paths:
  # ============================================================================
  # ACME Protocol Endpoints (RFC 8555)
  # ============================================================================

  /acme/directory:
    get:
      tags:
        - ACME Directory
      summary: Get ACME directory
      description: |
        Returns the ACME server's directory of resources.
        This is the entry point for ACME clients to discover available endpoints.

        Per RFC 8555 Section 7.1.1, this endpoint provides URLs for:
        - newNonce: Get a fresh anti-replay nonce
        - newAccount: Register a new account
        - newOrder: Submit a new certificate order
        - revokeCert: Revoke a certificate
        - keyChange: Change account key

        The response also includes metadata about the server.
      operationId: getDirectory
      responses:
        '200':
          description: ACME directory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ACMEDirectory'
              example:
                newNonce: "https://ca.example.com/acme/new-nonce"
                newAccount: "https://ca.example.com/acme/new-account"
                newOrder: "https://ca.example.com/acme/new-order"
                revokeCert: "https://ca.example.com/acme/revoke-cert"
                keyChange: "https://ca.example.com/acme/key-change"
                meta:
                  termsOfService: "https://ca.example.com/terms"
                  website: "https://ca.example.com"
                  caaIdentities: ["ca.example.com"]
                  externalAccountRequired: false

  /acme/new-nonce:
    head:
      tags:
        - ACME Directory
      summary: Get new nonce (HEAD)
      description: |
        Returns a fresh nonce in the Replay-Nonce header.
        Per RFC 8555 Section 7.2, this nonce must be included in subsequent
        JWS-signed requests to prevent replay attacks.
      operationId: newNonceHead
      responses:
        '200':
          description: Nonce returned in header
          headers:
            Replay-Nonce:
              description: Fresh anti-replay nonce
              schema:
                type: string
            Cache-Control:
              description: Cache control directive
              schema:
                type: string
                example: "no-store"
    get:
      tags:
        - ACME Directory
      summary: Get new nonce (GET)
      description: |
        Returns a fresh nonce in the Replay-Nonce header.
        Identical to HEAD but with empty body.
      operationId: newNonceGet
      responses:
        '204':
          description: Nonce returned in header
          headers:
            Replay-Nonce:
              description: Fresh anti-replay nonce
              schema:
                type: string

  /acme/new-account:
    post:
      tags:
        - ACME Accounts
      summary: Create new ACME account
      description: |
        Registers a new ACME account or retrieves an existing one.

        Per RFC 8555 Section 7.3, the request body must be a JWS-signed
        JSON object containing:
        - `contact` (optional): Array of contact URLs (mailto:)
        - `termsOfServiceAgreed` (optional): Boolean indicating ToS agreement
        - `onlyReturnExisting` (optional): Only return existing account
        - `externalAccountBinding` (optional): External account binding JWS

        When External Account Binding (EAB) is required, the request must
        include a valid externalAccountBinding field.
      operationId: newAccount
      requestBody:
        description: JWS-signed account registration request
        required: true
        content:
          application/jose+json:
            schema:
              type: string
              description: JWS-signed request
            example: |
              {
                "protected": "eyJhbGciOiJFUzI1NiIsImp3ayI6ey4uLn0sIm5vbmNlIjoiLi4uIiwidXJsIjoiLi4uIn0",
                "payload": "eyJjb250YWN0IjpbIm1haWx0bzphZG1pbkBleGFtcGxlLmNvbSJdLCJ0ZXJtc09mU2VydmljZUFncmVlZCI6dHJ1ZX0",
                "signature": "..."
              }
      responses:
        '201':
          description: Account created
          headers:
            Location:
              description: Account URL
              schema:
                type: string
            Replay-Nonce:
              description: Fresh nonce for next request
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ACMEAccount'
        '200':
          description: Existing account returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ACMEAccount'
        '400':
          $ref: '#/components/responses/ACMEMalformed'
        '403':
          $ref: '#/components/responses/ACMEUnauthorized'

  /acme/account/{id}:
    post:
      tags:
        - ACME Accounts
      summary: Get or update account
      description: |
        Retrieves or updates an existing ACME account.

        Per RFC 8555 Section 7.3.2, sending an empty payload {} retrieves
        the current account state. Updates can modify:
        - `contact`: Update contact information
        - `status`: Set to "deactivated" to deactivate account
      operationId: getAccount
      parameters:
        - name: id
          in: path
          required: true
          description: Account ID
          schema:
            type: integer
            format: uint64
      requestBody:
        description: JWS-signed request (empty for GET, fields for update)
        required: true
        content:
          application/jose+json:
            schema:
              type: string
      responses:
        '200':
          description: Account details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ACMEAccount'
        '401':
          $ref: '#/components/responses/ACMEUnauthorized'
        '404':
          $ref: '#/components/responses/ACMEAccountNotFound'

  /acme/account/{id}/orders:
    post:
      tags:
        - ACME Orders
      summary: List account orders
      description: |
        Lists all orders associated with an ACME account.
        Per RFC 8555 Section 7.1.2.1.
      operationId: listAccountOrders
      parameters:
        - name: id
          in: path
          required: true
          description: Account ID
          schema:
            type: integer
            format: uint64
      responses:
        '200':
          description: List of order URLs
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      type: string
                      format: uri

  /acme/new-order:
    post:
      tags:
        - ACME Orders
      summary: Create new certificate order
      description: |
        Creates a new certificate order.

        Per RFC 8555 Section 7.4, the request must include:
        - `identifiers`: Array of identifier objects with type and value
        - `notBefore` (optional): Requested certificate start time
        - `notAfter` (optional): Requested certificate end time

        Supported identifier types:
        - `dns`: Domain name (e.g., "example.com")
        - `ip`: IP address (for device attestation)
        - `permanent-identifier`: Device identifier (for TPM enrollment)
      operationId: newOrder
      requestBody:
        required: true
        content:
          application/jose+json:
            schema:
              type: string
      responses:
        '201':
          description: Order created
          headers:
            Location:
              description: Order URL
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ACMEOrder'
        '400':
          $ref: '#/components/responses/ACMEMalformed'

  /acme/order/{id}:
    post:
      tags:
        - ACME Orders
      summary: Get order status
      description: |
        Retrieves the current status of a certificate order.
        Per RFC 8555 Section 7.4.
      operationId: getOrder
      parameters:
        - name: id
          in: path
          required: true
          description: Order ID
          schema:
            type: integer
            format: uint64
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ACMEOrder'
        '404':
          $ref: '#/components/responses/ACMENotFound'

  /acme/order/{id}/finalize:
    post:
      tags:
        - ACME Orders
      summary: Finalize order with CSR
      description: |
        Finalizes an order by submitting a Certificate Signing Request (CSR).

        Per RFC 8555 Section 7.4, the order must be in "ready" status
        (all authorizations valid). The CSR must be base64url-encoded DER.

        Supports:
        - Standard PKCS#10 CSRs (RFC 2986)
        - TCG-CSR-IDEVID for TPM enrollment (TCG specification)
      operationId: finalizeOrder
      parameters:
        - name: id
          in: path
          required: true
          description: Order ID
          schema:
            type: integer
            format: uint64
      requestBody:
        required: true
        content:
          application/jose+json:
            schema:
              type: string
            example: |
              {
                "protected": "...",
                "payload": "eyJjc3IiOiJNSUlCLi4uIn0",
                "signature": "..."
              }
      responses:
        '200':
          description: Order finalized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ACMEOrder'
        '400':
          description: Invalid CSR or order not ready
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ACMEError'
        '403':
          description: CAA validation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ACMEError'

  /acme/authz/{id}:
    post:
      tags:
        - ACME Challenges
      summary: Get authorization status
      description: |
        Retrieves the status of an authorization.
        Per RFC 8555 Section 7.5.
      operationId: getAuthorization
      parameters:
        - name: id
          in: path
          required: true
          description: Authorization ID
          schema:
            type: integer
            format: uint64
      responses:
        '200':
          description: Authorization details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ACMEAuthorization'

  /acme/challenge/{id}:
    post:
      tags:
        - ACME Challenges
      summary: Respond to challenge
      description: |
        Initiates validation of a challenge.

        Per RFC 8555 Section 7.5.1, the client posts to the challenge URL
        to indicate readiness for validation. The server will then perform
        the appropriate validation.

        Supported challenge types:
        - `http-01`: HTTP validation (port 80)
        - `dns-01`: DNS TXT record validation
        - `device-attest-01`: TPM device attestation
        - `endorse-01`: TPM EK certificate endorsement
        - `enroll-01`: TPM enrollment with TCG-CSR-IDEVID
      operationId: respondChallenge
      parameters:
        - name: id
          in: path
          required: true
          description: Challenge ID
          schema:
            type: integer
            format: uint64
      requestBody:
        required: true
        content:
          application/jose+json:
            schema:
              type: string
      responses:
        '200':
          description: Challenge status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ACMEChallenge'

  /acme/cert/{serial}:
    post:
      tags:
        - ACME Certificates
      summary: Download certificate
      description: |
        Downloads an issued certificate.
        Per RFC 8555 Section 7.4.2.

        Returns the certificate chain in PEM format:
        - End-entity certificate
        - Intermediate CA certificate(s)
        - (optionally) Root CA certificate
      operationId: downloadCertificate
      parameters:
        - name: serial
          in: path
          required: true
          description: Certificate serial number
          schema:
            type: integer
            format: uint64
      responses:
        '200':
          description: Certificate chain
          content:
            application/pem-certificate-chain:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/ACMENotFound'

  /acme/revoke-cert:
    post:
      tags:
        - ACME Certificates
      summary: Revoke certificate
      description: |
        Revokes a certificate.
        Per RFC 8555 Section 7.6.

        The request must include:
        - `certificate`: Base64url-encoded DER certificate
        - `reason` (optional): Revocation reason code (RFC 5280)
      operationId: revokeCertificate
      requestBody:
        required: true
        content:
          application/jose+json:
            schema:
              type: string
      responses:
        '200':
          description: Certificate revoked
        '400':
          $ref: '#/components/responses/ACMEMalformed'
        '403':
          $ref: '#/components/responses/ACMEUnauthorized'

  /acme/key-change:
    post:
      tags:
        - ACME Accounts
      summary: Change account key
      description: |
        Performs account key rollover.
        Per RFC 8555 Section 7.3.5.

        The request contains a nested JWS:
        - Outer JWS signed with old key
        - Inner JWS signed with new key
      operationId: keyChange
      requestBody:
        required: true
        content:
          application/jose+json:
            schema:
              type: string
      responses:
        '200':
          description: Key changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ACMEAccount'
        '400':
          $ref: '#/components/responses/ACMEMalformed'

  /acme/ca-bundle:
    get:
      tags:
        - ACME Certificates
      summary: Get CA bundle
      description: |
        Returns the CA certificate bundle in PEM format.
        This is a non-RFC 8555 convenience endpoint.

        Includes:
        - Intermediate CA certificate(s)
        - Root CA certificate
      operationId: getCABundle
      responses:
        '200':
          description: CA bundle in PEM format
          content:
            application/pem-certificate-chain:
              schema:
                type: string

  # ============================================================================
  # Admin API Endpoints
  # ============================================================================

  /admin/certificates:
    get:
      tags:
        - Certificates
      summary: List certificates
      description: |
        Retrieves a paginated list of certificates managed by the CA.
        Requires viewer role or higher.
      operationId: listCertificates
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: status
          in: query
          description: Filter by certificate status
          schema:
            type: string
            enum: [valid, revoked, expired]
        - name: subject
          in: query
          description: Filter by certificate subject (partial match)
          schema:
            type: string
      responses:
        '200':
          description: List of certificates
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CertificateInfo'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/certificates/expiring:
    get:
      tags:
        - Certificates
      summary: List expiring certificates
      description: |
        Retrieves certificates expiring within the specified number of days.
        Useful for monitoring and automated renewal workflows.
      operationId: listExpiringCertificates
      security:
        - BearerAuth: []
      parameters:
        - name: days
          in: query
          description: Number of days to look ahead for expiring certificates
          schema:
            type: integer
            default: 30
            minimum: 1
            maximum: 365
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: List of expiring certificates
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CertificateInfo'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/certificates/{serial}:
    get:
      tags:
        - Certificates
      summary: Get certificate by serial number
      description: Retrieves detailed information about a specific certificate.
      operationId: getCertificate
      security:
        - BearerAuth: []
      parameters:
        - name: serial
          in: path
          required: true
          description: Certificate serial number
          schema:
            type: string
      responses:
        '200':
          description: Certificate details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CertificateInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/certificates/{serial}/revoke:
    post:
      tags:
        - Certificates
      summary: Revoke certificate
      description: |
        Revokes a certificate. Requires admin role.
        The certificate will be added to the CRL and marked as revoked.
      operationId: adminRevokeCertificate
      security:
        - BearerAuth: []
      parameters:
        - name: serial
          in: path
          required: true
          description: Certificate serial number
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeRequest'
      responses:
        '200':
          description: Certificate revoked successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: Certificate revoked successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/accounts:
    get:
      tags:
        - Accounts
      summary: List ACME accounts
      description: Retrieves a paginated list of ACME accounts.
      operationId: listAccounts
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: status
          in: query
          description: Filter by account status
          schema:
            type: string
            enum: [valid, deactivated, revoked]
      responses:
        '200':
          description: List of accounts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AccountInfo'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/accounts/{id}:
    get:
      tags:
        - Accounts
      summary: Get account by ID
      description: Retrieves detailed information about a specific ACME account.
      operationId: adminGetAccount
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Account ID
          schema:
            type: integer
            format: uint64
      responses:
        '200':
          description: Account details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AccountInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags:
        - Accounts
      summary: Disable account
      description: |
        Disables an ACME account. Requires admin role.
        Disabled accounts cannot create new orders or certificates.
      operationId: disableAccount
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Account ID
          schema:
            type: integer
            format: uint64
      responses:
        '200':
          description: Account disabled successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: Account disabled successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/orders:
    get:
      tags:
        - Orders
      summary: List ACME orders
      description: Retrieves a paginated list of ACME orders.
      operationId: listOrders
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: status
          in: query
          description: Filter by order status
          schema:
            type: string
            enum: [pending, ready, processing, valid, invalid]
        - name: account_id
          in: query
          description: Filter by account ID
          schema:
            type: integer
            format: uint64
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/OrderInfo'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/orders/{id}:
    get:
      tags:
        - Orders
      summary: Get order by ID
      description: |
        Retrieves detailed information about a specific ACME order.
        Requires account_id query parameter.
      operationId: adminGetOrder
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Order ID
          schema:
            type: integer
            format: uint64
        - name: account_id
          in: query
          required: true
          description: Account ID that owns the order
          schema:
            type: integer
            format: uint64
      responses:
        '200':
          description: Order details
