  # ============================================================================
  /api/v1/tenants/{id}/policies:
    get:
      tags:
        - Policies
      summary: List tenant policies
      description: |
        Lists RBAC policies for a tenant.
        Delegates to RBAC PolicyEngine.
        Requires admin role.
      operationId: listTenantPolicies
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: purpose
          in: query
          description: Filter by policy purpose label
          schema:
            type: string
      responses:
        '200':
          description: List of policies
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/IAMPolicy'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags:
        - Policies
      summary: Create tenant policy
      description: |
        Creates an RBAC policy for a tenant.
        Accepts RBAC Policy format directly.
        Requires admin role.
      operationId: createTenantPolicy
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IAMPolicy'
            example:
              apiVersion: rbac.trustedca.io/v1
              kind: Policy
              metadata:
                name: custom-policy
                labels:
                  purpose: access-control
              spec:
                description: Custom access control policy
                effect: allow
                subjects:
                  - type: role
                    id: operator
                resources:
                  - type: certificate
                    pattern: "*"
                actions:
                  - read
                  - list
      responses:
        '201':
          description: Policy created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/IAMPolicy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Policy already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

