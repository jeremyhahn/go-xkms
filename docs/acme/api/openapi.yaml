    get:
      tags:
        - Policies
      summary: Get tenant policy
      description: Retrieves a policy by name.
      operationId: getTenantPolicy
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
        - name: name
          in: path
          required: true
          description: Policy name
          schema:
            type: string
      responses:
        '200':
          description: Policy details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/IAMPolicy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags:
        - Policies
      summary: Update tenant policy
      description: |
        Updates an existing policy.
        System-managed (immutable) policies cannot be modified.
        Requires admin role.
      operationId: updateTenantPolicy
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
        - name: name
          in: path
          required: true
          description: Policy name
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IAMPolicy'
      responses:
        '200':
          description: Policy updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/IAMPolicy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden - Policy is immutable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags:
        - Policies
      summary: Delete tenant policy
      description: |
        Deletes a policy.
        System-managed (immutable) policies cannot be deleted.
        Requires admin role.
      operationId: deleteTenantPolicy
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
        - name: name
          in: path
          required: true
          description: Policy name
          schema:
            type: string
      responses:
        '200':
          description: Policy deleted successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: Policy deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden - Policy is immutable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

# ==============================================================================
# Components
# ==============================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token issued by Trusted CA Auth.
        Include in Authorization header as: Bearer <token>

  parameters:
    PageParam:
      name: page
      in: query
      description: Page number for pagination
      schema:
        type: integer
        default: 1
        minimum: 1

    PerPageParam:
      name: per_page
      in: query
      description: Number of items per page
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100

    TenantIdParam:
      name: id
      in: path
      required: true
      description: Tenant ID
      schema:
        type: string

    CAIdParam:
      name: caid
      in: path
      required: true
      description: Intermediate CA ID
      schema:
        type: string

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: INVALID_REQUEST
              message: Invalid request body

    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: UNAUTHORIZED
              message: Missing or invalid Authorization header

    Forbidden:
      description: Insufficient privileges
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: FORBIDDEN
              message: Insufficient privileges

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: NOT_FOUND
              message: Resource not found

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: INTERNAL_ERROR
              message: An unexpected error occurred

    ACMEMalformed:
      description: Malformed ACME request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ACMEError'
          example:
            type: "urn:ietf:params:acme:error:malformed"
            detail: "Invalid request format"
            status: 400

    ACMEUnauthorized:
      description: ACME authorization failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ACMEError'
          example:
            type: "urn:ietf:params:acme:error:unauthorized"
            detail: "Invalid credentials"
            status: 403

    ACMENotFound:
      description: ACME resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ACMEError'
          example:
            type: "urn:ietf:params:acme:error:malformed"
            detail: "Resource not found"
            status: 404

    ACMEAccountNotFound:
      description: ACME account not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ACMEError'
          example:
            type: "urn:ietf:params:acme:error:accountDoesNotExist"
            detail: "Account does not exist"
            status: 404

  schemas:
    # --------------------------------------------------------------------------
    # ACME Protocol Types
    # --------------------------------------------------------------------------
    ACMEDirectory:
      type: object
      properties:
        newNonce:
          type: string
          format: uri
          description: URL for getting new nonces
        newAccount:
          type: string
          format: uri
          description: URL for registering new accounts
        newOrder:
          type: string
          format: uri
          description: URL for creating new orders
        revokeCert:
          type: string
          format: uri
          description: URL for revoking certificates
        keyChange:
          type: string
          format: uri
          description: URL for account key rollover
        meta:
          $ref: '#/components/schemas/ACMEMeta'

    ACMEMeta:
      type: object
      properties:
        termsOfService:
          type: string
          format: uri
          description: URL to terms of service
        website:
          type: string
          format: uri
          description: CA website URL
        caaIdentities:
          type: array
          items:
            type: string
          description: CAA identity strings
        externalAccountRequired:
          type: boolean
          description: Whether EAB is required for account creation

    ACMEAccount:
      type: object
      properties:
        status:
          type: string
          enum: [valid, deactivated, revoked]
          description: Account status
        contact:
          type: array
          items:
            type: string
          description: Contact URLs (mailto:, tel:)
        orders:
          type: string
          format: uri
          description: URL to list account orders
        externalAccountBinding:
          type: object
          description: External account binding (if used)

    ACMEOrder:
      type: object
      properties:
        status:
          type: string
          enum: [pending, ready, processing, valid, invalid]
          description: Order status
        expires:
          type: string
          format: date-time
          description: Order expiration time
        identifiers:
          type: array
          items:
            $ref: '#/components/schemas/ACMEIdentifier'
          description: Requested identifiers
        notBefore:
          type: string
          format: date-time
          description: Requested certificate validity start
        notAfter:
          type: string
          format: date-time
          description: Requested certificate validity end
        error:
          $ref: '#/components/schemas/ACMEError'
        authorizations:
          type: array
          items:
            type: string
            format: uri
          description: Authorization URLs
        finalize:
          type: string
          format: uri
          description: Finalization URL
        certificate:
          type: string
          format: uri
          description: Certificate URL (when valid)

    ACMEIdentifier:
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          enum: [dns, ip, permanent-identifier]
          description: Identifier type
        value:
          type: string
          description: Identifier value

    ACMEAuthorization:
      type: object
      properties:
        identifier:
          $ref: '#/components/schemas/ACMEIdentifier'
        status:
          type: string
          enum: [pending, valid, invalid, deactivated, expired, revoked]
          description: Authorization status
        expires:
          type: string
          format: date-time
          description: Authorization expiration
        challenges:
          type: array
          items:
            $ref: '#/components/schemas/ACMEChallenge'
          description: Available challenges
        wildcard:
          type: boolean
          description: Whether this is for a wildcard

    ACMEChallenge:
      type: object
      properties:
        type:
          type: string
          description: |
            Challenge type:
            - http-01: HTTP validation
            - dns-01: DNS TXT record validation
            - device-attest-01: TPM device attestation
            - endorse-01: TPM EK endorsement
            - enroll-01: TPM enrollment
        url:
          type: string
          format: uri
          description: Challenge URL
        status:
          type: string
          enum: [pending, processing, valid, invalid]
          description: Challenge status
        token:
          type: string
          description: Challenge token
        validated:
          type: string
          format: date-time
          description: Validation timestamp
        error:
          $ref: '#/components/schemas/ACMEError'

    ACMEError:
      type: object
      description: ACME error response per RFC 8555 Section 6.7
      properties:
        type:
          type: string
          format: uri
          description: |
            Error type URN. Common values:
            - urn:ietf:params:acme:error:accountDoesNotExist
            - urn:ietf:params:acme:error:badCSR
            - urn:ietf:params:acme:error:badNonce
            - urn:ietf:params:acme:error:caa
            - urn:ietf:params:acme:error:malformed
            - urn:ietf:params:acme:error:orderNotReady
            - urn:ietf:params:acme:error:unauthorized
        detail:
          type: string
          description: Human-readable error description
        status:
          type: integer
          description: HTTP status code
        subproblems:
          type: array
          items:
            $ref: '#/components/schemas/ACMEError'
          description: Sub-problems for compound errors

    # --------------------------------------------------------------------------
    # Base Response Types
    # --------------------------------------------------------------------------
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
        - success

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          $ref: '#/components/schemas/ErrorInfo'
      required:
        - success
        - error

    ErrorInfo:
      type: object
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: INVALID_REQUEST
        message:
          type: string
          description: Human-readable error message
          example: Invalid request parameters
      required:
        - code
        - message

    Pagination:
      type: object
      properties:
        page:
          type: integer
          description: Current page number
          example: 1
        per_page:
          type: integer
          description: Items per page
          example: 20
        total:
          type: integer
          description: Total number of items
          example: 150
      required:
        - page
        - per_page
        - total

    # --------------------------------------------------------------------------
    # Certificate Types
    # --------------------------------------------------------------------------
    CertificateInfo:
      type: object
      properties:
        id:
          type: integer
          format: uint64
          description: Internal certificate ID
        serial_number:
          type: string
          description: Certificate serial number
          example: "123456789012345678901234567890"
        subject:
          type: string
          description: Certificate subject DN
          example: "CN=example.com,O=Example Corp"
        issuer:
          type: string
          description: Certificate issuer DN
          example: "CN=Intermediate CA,O=Trusted CA"
        not_before:
          type: string
          format: date-time
          description: Certificate validity start
        not_after:
          type: string
          format: date-time
          description: Certificate validity end
        status:
          type: string
          enum: [valid, revoked, expired]
          description: Certificate status
        issued_at:
          type: string
          format: date-time
          description: When the certificate was issued
        cert_url:
          type: string
          description: URL to download the certificate

    RevokeRequest:
      type: object
      properties:
        reason:
          type: string
          description: Revocation reason (RFC 5280)
          enum:
            - unspecified
            - keyCompromise
            - caCompromise
            - affiliationChanged
            - superseded
            - cessationOfOperation
            - certificateHold
            - removeFromCRL
            - privilegeWithdrawn
            - aaCompromise
          example: keyCompromise

    # --------------------------------------------------------------------------
    # Account Types
    # --------------------------------------------------------------------------
    AccountInfo:
      type: object
      properties:
        id:
          type: integer
          format: uint64
          description: Account ID
        status:
          type: string
          enum: [valid, deactivated, revoked]
          description: Account status
        contact:
          type: array
          items:
            type: string
          description: Account contact URLs (mailto, tel)
          example: ["mailto:admin@example.com"]
        created_at:
          type: string
          format: date-time
          description: Account creation timestamp
        terms_of_service_agreed:
          type: boolean
          description: Whether ToS was agreed to
        orders_url:
          type: string
          description: URL to list account orders
        order_count:
          type: integer
          description: Total number of orders
        tenant_id:
          type: string
          description: Associated tenant ID (multi-tenant deployments)

    # --------------------------------------------------------------------------
    # Order Types
    # --------------------------------------------------------------------------
    OrderInfo:
      type: object
      properties:
        id:
          type: integer
          format: uint64
          description: Order ID
        account_id:
          type: integer
          format: uint64
          description: Associated account ID
        status:
          type: string
          enum: [pending, ready, processing, valid, invalid]
          description: Order status
        identifiers:
          type: array
          items:
            type: string
          description: Requested identifiers (domains)
          example: ["example.com", "www.example.com"]
        not_before:
          type: string
          description: Requested certificate validity start
        not_after:
          type: string
          description: Requested certificate validity end
        expires:
          type: string
          description: Order expiration time
        certificate:
          type: string
          description: Certificate URL (when status is valid)
        created_at:
          type: string
          format: date-time
          description: Order creation timestamp

    # --------------------------------------------------------------------------
    # CA Status Types
    # --------------------------------------------------------------------------
    CAStatus:
      type: object
      properties:
        identity:
          type: string
          description: CA identity/common name
          example: "Trusted CA Root"
        initialized:
          type: boolean
          description: Whether the CA is initialized
        version:
          type: string
          description: CA software version
          example: "1.0.0"
        started_at:
          type: string
          format: date-time
          description: CA start timestamp
        key_algorithm:
          type: string
          description: CA key algorithm
          example: "ECDSA-P384"
        signature_algorithm:
          type: string
          description: Signature algorithm used
          example: "SHA384-ECDSA"
        root_ca:
          type: string
          description: Root CA subject DN
        intermediate_ca:
          type: string
          description: Intermediate CA subject DN (if applicable)

    CAStats:
      type: object
      properties:
        total_certificates:
          type: integer
          description: Total certificates issued
        valid_certificates:
          type: integer
          description: Currently valid certificates
        revoked_certificates:
          type: integer
          description: Revoked certificates
        expired_certificates:
          type: integer
          description: Expired certificates
        total_accounts:
          type: integer
          description: Total ACME accounts
        active_accounts:
          type: integer
          description: Active ACME accounts
        total_orders:
          type: integer
          description: Total orders
        pending_orders:
          type: integer
          description: Pending orders
        completed_orders:
          type: integer
          description: Completed (valid) orders

    # --------------------------------------------------------------------------
    # Tenant Types
    # --------------------------------------------------------------------------
    TenantInfo:
      type: object
      properties:
        id:
          type: string
          description: Unique tenant identifier
          example: "acme-corp"
        name:
          type: string
          description: Human-readable tenant name
          example: "ACME Corporation"
        status:
          type: string
          enum: [active, suspended, deleted]
          description: Tenant status
        root_ca:
          $ref: '#/components/schemas/TenantRootCAInfo'
        intermediate_cas:
          type: array
          items:
            $ref: '#/components/schemas/TenantIntCAInfo'
        default_intermediate_ca_id:
          type: string
          description: Default intermediate CA for signing
        settings:
          $ref: '#/components/schemas/TenantSettingsInfo'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type: string
          description: User who created the tenant

    TenantRootCAInfo:
      type: object
      properties:
        common_name:
          type: string
          description: CA common name
          example: "ACME Corp Root CA"
        serial_number:
          type: string
          description: Certificate serial number
        key_algorithm:
          type: string
          enum: [RSA, ECDSA, Ed25519]
          description: Key algorithm
        not_before:
          type: string
          format: date-time
        not_after:
          type: string
          format: date-time
        status:
          type: string
          enum: [active, expired]
        created_at:
          type: string
          format: date-time

    TenantIntCAInfo:
      type: object
      properties:
        id:
          type: string
          description: Intermediate CA identifier
        common_name:
          type: string
          description: CA common name
        serial_number:
          type: string
          description: Certificate serial number
        parent_type:
          type: string
          enum: [global, tenant]
          description: Parent CA type
        purpose:
          type: string
          description: CA purpose (e.g., server-auth, client-auth)
        key_algorithm:
          type: string
          enum: [RSA, ECDSA, Ed25519]
        not_before:
          type: string
          format: date-time
        not_after:
          type: string
          format: date-time
        status:
          type: string
          enum: [active, pending-rotation, revoked, expired]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TenantSettingsInfo:
      type: object
      properties:
        max_certificates:
          type: integer
          description: Maximum certificates allowed
        max_accounts:
          type: integer
          description: Maximum accounts allowed
        allowed_key_algorithms:
          type: array
          items:
            type: string
          example: ["RSA", "ECDSA", "Ed25519"]
        allowed_challenge_types:
          type: array
          items:
            type: string
          example: ["http-01", "dns-01", "device-attest-01"]
        certificate_validity_days:
          type: integer
          description: Default certificate validity in days
        require_eab:
          type: boolean
          description: Require External Account Binding
        allow_endorse_01:
          type: boolean
          description: Allow endorse-01 challenge type
        allow_enroll_01:
          type: boolean
          description: Allow enroll-01 challenge type

    TenantCAStatusInfo:
      type: object
      properties:
        tenant_id:
          type: string
        root_ca:
          $ref: '#/components/schemas/TenantRootCAInfo'
        intermediate_cas:
          type: array
          items:
            $ref: '#/components/schemas/TenantIntCAInfo'
        default_intermediate_ca_id:
          type: string
        active_ca_count:
          type: integer
          description: Number of active CAs
        can_issue_certificates:
          type: boolean
          description: Whether the tenant can issue certificates

    CreateTenantRequest:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: Unique tenant identifier
          pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$"
          example: "acme-corp"
        name:
          type: string
          description: Human-readable tenant name
          example: "ACME Corporation"
        settings:
          $ref: '#/components/schemas/TenantSettingsInfo'

    UpdateTenantRequest:
      type: object
      properties:
        name:
          type: string
          description: Human-readable tenant name
        settings:
          $ref: '#/components/schemas/TenantSettingsInfo'

    UpdateTenantStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [active, suspended, deleted]
          description: New tenant status

    CreateTenantRootCARequest:
      type: object
      required:
        - common_name
        - key_algorithm
        - validity_years
      properties:
        common_name:
          type: string
          description: CA common name
          example: "ACME Corp Root CA"
        key_algorithm:
          type: string
          enum: [RSA, ECDSA, Ed25519]
          description: Key algorithm to use
        validity_years:
          type: integer
          minimum: 1
          maximum: 30
          default: 10
          description: Certificate validity in years

    CreateTenantIntermediateCARequest:
      type: object
      required:
        - common_name
        - key_algorithm
        - validity_years
      properties:
        common_name:
          type: string
          description: CA common name
          example: "ACME Corp Intermediate CA"
        parent_type:
          type: string
          enum: [global, tenant]
          default: global
          description: |
            Parent CA type:
            - global: Signed by the global root CA
            - tenant: Signed by the tenant's root CA
        purpose:
          type: string
          description: CA purpose (e.g., general, server-auth, client-auth)
          example: "server-auth"
        key_algorithm:
          type: string
          enum: [RSA, ECDSA, Ed25519]
          description: Key algorithm to use
        validity_years:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
          description: Certificate validity in years
        set_as_default:
          type: boolean
          default: false
          description: Set as default intermediate CA for this tenant

    UpdateTenantDefaultCARequest:
      type: object
      required:
        - intermediate_ca_id
      properties:
        intermediate_ca_id:
          type: string
          description: Intermediate CA ID to set as default

    UpdateIntermediateCAStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [active, pending-rotation, revoked]
          description: New CA status

    # --------------------------------------------------------------------------
    # EAB Types
    # --------------------------------------------------------------------------
    EABInfo:
      type: object
      properties:
        id:
          type: string
          description: EAB key identifier (kid)
        tenant_id:
          type: string
          description: Associated tenant ID
        status:
          type: string
          enum: [active, used, revoked, expired]
          description: EAB status
        purpose:
          type: string
          enum: [account-binding, endorse-01, enroll-01]
          description: EAB purpose
        account_id:
          type: integer
          format: uint64
          description: Associated account ID (after use)
        external_account_id:
          type: string
          description: External system account reference
        device_info:
          $ref: '#/components/schemas/EABDeviceInfo'
        contact:
          type: array
          items:
            type: string
          description: Contact information
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          description: User who created the EAB
        used_at:
          type: string
          format: date-time
          description: When the EAB was used
        expires_at:
          type: string
          format: date-time
          description: EAB expiration time

    EABDeviceInfo:
      type: object
      description: Device information for TPM-based attestation
      properties:
        device_id:
          type: string
          description: Unique device identifier
        manufacturer:
          type: string
          description: Device manufacturer
        model:
          type: string
          description: Device model
        ek_public_key_hash:
          type: string
          description: Hash of the TPM Endorsement Key public key
        tpm_manufacturer:
          type: string
          description: TPM manufacturer
        tpm_firmware_version:
          type: string
          description: TPM firmware version
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Additional device metadata

    CreateEABRequest:
      type: object
      properties:
        purpose:
          type: string
          enum: [account-binding, endorse-01, enroll-01]
          default: account-binding
          description: |
            EAB purpose:
            - account-binding: Standard RFC 8555 account binding
            - endorse-01: TPM device endorsement (TCG)
            - enroll-01: TPM enrollment (TCG)
        external_account_id:
          type: string
          description: Reference to external system account
        device_info:
          $ref: '#/components/schemas/EABDeviceInfo'
        contact:
          type: array
          items:
            type: string
          description: Contact URLs (mailto, tel)
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 365
          description: EAB expiration in days (0 = no expiration)
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Additional metadata

    CreateEABResponse:
      type: object
      properties:
        id:
          type: string
          description: EAB key identifier (kid)
        mac_key:
          type: string
          description: |
            Base64url-encoded MAC key.
            IMPORTANT: This is shown only once at creation time.
        algorithm:
          type: string
          description: MAC algorithm (always HS256)
          example: "HS256"
        expires_at:
          type: string
          format: date-time
          description: EAB expiration time

    # --------------------------------------------------------------------------
    # IAM Policy Types (RBAC)
    # --------------------------------------------------------------------------
    IAMPolicy:
      type: object
      description: RBAC Policy
      properties:
        apiVersion:
          type: string
          default: "rbac.trustedca.io/v1"
          example: "rbac.trustedca.io/v1"
        kind:
          type: string
          default: "Policy"
          example: "Policy"
        metadata:
          $ref: '#/components/schemas/IAMPolicyMetadata'
        spec:
          $ref: '#/components/schemas/IAMPolicySpec'

    IAMPolicyMetadata:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Unique policy name within tenant
          example: "certificate-reader"
        tenant:
          type: string
          description: Tenant ID (set automatically)
        labels:
          type: object
          additionalProperties:
            type: string
          description: Policy labels for filtering
          example:
            purpose: "access-control"
            managed-by: "admin"
        annotations:
          type: object
          additionalProperties:
            type: string
          description: Policy annotations
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time

    IAMPolicySpec:
      type: object
      properties:
        description:
          type: string
          description: Human-readable policy description
        effect:
          type: string
          enum: [allow, deny]
          description: Policy effect
        subjects:
          type: array
          items:
            $ref: '#/components/schemas/IAMSubject'
          description: Policy subjects (who)
        resources:
          type: array
          items:
            $ref: '#/components/schemas/IAMResource'
          description: Policy resources (what)
        actions:
          type: array
          items:
            type: string
          description: Allowed/denied actions
          example: ["read", "list", "create", "update", "delete"]
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/IAMCondition'
          description: Policy conditions (when)

    IAMSubject:
      type: object
      properties:
        type:
          type: string
          enum: [user, role, group, service]
          description: Subject type
        id:
          type: string
          description: Subject identifier

    IAMResource:
      type: object
      properties:
        type:
          type: string
          description: Resource type
          example: "certificate"
        pattern:
          type: string
          description: Resource pattern (supports wildcards)
          example: "*"

    IAMCondition:
      type: object
      properties:
        field:
          type: string
          description: Condition field
        operator:
          type: string
          enum: [eq, ne, gt, lt, gte, lte, in, not_in, contains, starts_with, ends_with]
          description: Comparison operator
        value:
          description: Condition value
