# Multi-account trusted-acme-client configuration example
#
# This configuration demonstrates:
# - Two ACME accounts (internal CA + Let's Encrypt)
# - Three certificate specifications with different key stores and challenges
# - Cross-signing from Let's Encrypt back to the internal CA
# - TPM-based device identity certificate
# - Auto-renewal and deploy hooks

tenant_id: "example-tenant"

storage:
  backend: "filesystem"
  options:
    path: "/var/lib/trusted-acme/client"

xkms:
  backend: "software"
  options:
    path: "/var/lib/trusted-acme/keys"

logging:
  level: "info"
  format: "json"
  output: "stdout"

challenge:
  http01:
    port: "80"
    web_root: "/var/www/acme-challenge"
    use_proxy: false
  dns01:
    provider: "route53"
    credentials:
      aws_region: "us-east-1"
      aws_profile: "acme-dns"
    ttl: 120

# ---------------------------------------------------------------------------
# Accounts
# ---------------------------------------------------------------------------
accounts:

  # Internal Trusted CA (REST transport with mutual TLS)
  trusted-ca:
    directory: "https://ca.internal.example.com:8443/acme/directory"
    email: "pki-team@example.com"
    key:
      algorithm: "ecdsa"
      size: 384
      store: "software"
    transport:
      tls_ca: "/etc/ssl/certs/internal-root-ca.pem"
      insecure: false
      timeout: 30s
    eab:
      kid: ""
      hmac_key: ""

  # Let's Encrypt production
  letsencrypt:
    directory: "https://acme-v02.api.letsencrypt.org/directory"
    email: "certs@example.com"
    key:
      algorithm: "ecdsa"
      size: 256
      store: "software"
    transport:
      tls_ca: ""
      insecure: false
      timeout: 60s
    eab:
      kid: ""
      hmac_key: ""

# ---------------------------------------------------------------------------
# Certificates
# ---------------------------------------------------------------------------
certificates:

  # Web production certificate from internal CA
  web-production:
    account: "trusted-ca"
    subject:
      common_name: "www.example.com"
      organization: "Example Corp"
      country: "US"
      state: "California"
      locality: "San Francisco"
    sans:
      - "www.example.com"
      - "example.com"
      - "api.example.com"
    key:
      algorithm: "ecdsa"
      size: 256
      store: "software"
    challenge: "http-01"
    deploy:
      cert_path: "/etc/ssl/certs/web-production.pem"
      key_path: "/etc/ssl/private/web-production-key.pem"
      chain_path: "/etc/ssl/certs/web-production-chain.pem"
      post_hook: "systemctl reload nginx"
    renewal:
      enabled: true
      threshold: 0.33
      max_retries: 5
      retry_interval: "1h"
    cross_signer:
      account: ""
      profile: ""

  # Host identity certificate with TPM key store and device attestation
  host-identity:
    account: "trusted-ca"
    subject:
      common_name: "node-01.internal.example.com"
      organization: "Example Corp"
    sans:
      - "node-01.internal.example.com"
    key:
      algorithm: "ecdsa"
      size: 256
      store: "tpm2"
      store_options:
        device: "/dev/tpmrm0"
        owner_hierarchy_auth: ""
    challenge: "device-attest-01"
    deploy:
      cert_path: "/etc/ssl/certs/host-identity.pem"
      key_path: ""
      chain_path: "/etc/ssl/certs/host-identity-chain.pem"
      post_hook: ""
    renewal:
      enabled: true
      threshold: 0.25
      max_retries: 3
      retry_interval: "2h"
    cross_signer:
      account: ""
      profile: ""

  # Public web certificate from Let's Encrypt, cross-signed by internal CA
  public-web:
    account: "letsencrypt"
    subject:
      common_name: "public.example.com"
      organization: "Example Corp"
    sans:
      - "public.example.com"
      - "shop.example.com"
    key:
      algorithm: "ecdsa"
      size: 256
      store: "software"
    challenge: "dns-01"
    deploy:
      cert_path: "/etc/ssl/certs/public-web.pem"
      key_path: "/etc/ssl/private/public-web-key.pem"
      chain_path: "/etc/ssl/certs/public-web-chain.pem"
      post_hook: "systemctl reload caddy"
    renewal:
      enabled: true
      threshold: 0.33
      max_retries: 5
      retry_interval: "1h"
    cross_signer:
      account: "trusted-ca"
      profile: "cross-sign-web"
