# Grafana datasource provisioning for go-xkms's ACME Prometheus metrics.

apiVersion: 1

datasources:
  # Prometheus, reached by service name on the same Docker network.
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      manageAlerts: true
      prometheusType: Prometheus
      cacheLevel: 'High'
      disableRecordingRules: false

  # Prometheus - for a local devcontainer or bare-metal Prometheus.
  - name: Prometheus-Local
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: false
    editable: false
    jsonData:
      httpMethod: POST
      manageAlerts: false
      prometheusType: Prometheus
      cacheLevel: 'Medium'
