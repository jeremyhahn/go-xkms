  <!--
    Frame policy only (go-xkms#1274): the only <iframe> in the app is the
    API Explorer response preview (APIExplorer.svelte), which renders
    fetched HTML via srcdoc (an about:srcdoc document) and nothing else
    opens a nested browsing context. script-src/style-src/connect-src/
    img-src are deliberately left unrestricted here -- this file cannot be
    exercised against a running GUI from this change's environment to
    confirm a stricter policy would not break the Svelte build's inline
    style attributes, xterm.js, or the Vite dev server. See
    pkg/gui/csp.go (ContentSecurityPolicy) for the header applied to the
    built Wails app, which carries the identical directives.
  -->
  <meta http-equiv="Content-Security-Policy" content="frame-src 'self' about: data:; object-src 'none'; base-uri 'self'" />
