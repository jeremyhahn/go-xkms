services:
  ble-tests:
    build:
      context: ../../../..
      dockerfile: xkey/test/integration/ble/Dockerfile
      additional_contexts:
        go-qrdb: ../../../../../go-qrdb
        go-quicraft: ../../../../../go-quicraft
        go-truststrap: ../../../../../go-truststrap
        go-codec: ../../../../../go-codec
        go-frost: ../../../../../go-frost
        go-objstore: ../../../../../go-objstore
    # Privileged plus CAP_NET_ADMIN to load hci_vhci and attach emulated controllers.
    privileged: true
    cap_add:
      - NET_ADMIN
    # AF_BLUETOOTH sockets work only in the initial network namespace.
    network_mode: host
    volumes:
      - /lib/modules:/lib/modules:ro
      - /dev:/dev
      # Only one bluetoothd can run per machine.
      - /run/dbus:/host/run/dbus:ro
