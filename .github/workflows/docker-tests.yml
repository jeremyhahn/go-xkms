name: Docker Integration Tests

on:
  workflow_dispatch:  # Manual trigger only
  # Disabled automatic triggers - functionality covered by ci.yml
  # push:
  #   branches: [ main, develop ]
  # pull_request:
  #   branches: [ main, develop ]

# Dormant (workflow_dispatch only). Same reasoning as coverage.yml: the
# toolchain and linter pins are brought to the values ci.yml gates on, and the
# GOPROXY/GOSUMDB overrides are removed under the ci-template v1.1 prohibition
# ci.yml records -- `GOSUMDB: off` disabled checksum verification for every
# third-party dependency.
env:
  GO_VERSION: '1.27.0'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run gofmt check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Code is not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.13.2

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build Docker image
        run: make docker-build

      - name: Run unit tests
        run: make docker-test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        continue-on-error: true
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build Docker image
        run: make docker-build

      - name: Run integration tests
        run: make docker-integration-test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: integration-test-results
          path: |
            *.out
            *.log

  docker-compose-tests:
    name: Docker Compose Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build with docker-compose
        run: make compose-build

      - name: Run unit tests with docker-compose
        run: make compose-test

      - name: Run integration tests with docker-compose
        run: make compose-integration

      - name: Clean up
        if: always()
        run: make compose-clean

  build-multi-arch:
    name: Multi-Architecture Build
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build multi-arch image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: go-xkms-test:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
