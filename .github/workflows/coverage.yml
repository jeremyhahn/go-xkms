name: Coverage

on:
  workflow_dispatch:  # Manual trigger only
  # Disabled automatic triggers - functionality covered by ci.yml
  # push:
  #   branches: [ master, main, develop ]
  # pull_request:
  #   branches: [ master, main, develop ]

# Dormant (workflow_dispatch only), which is exactly where toolchain drift
# hides: nothing exercises these values until someone dispatches the workflow
# and gets a result from a different Go than the gate uses.
#
# `stable` is prohibited portfolio-wide (devops.md): an unpinned toolchain
# moved a green head to red under ci.yml once already, which is why that
# workflow pins 1.26.7. This now matches it.
#
# GOPROXY/GOSUMDB overrides removed, per the same ci-template v1.1 prohibition
# ci.yml records: the runners inject GOPRIVATE, which already exempts
# first-party modules from the proxy and the checksum database, while a blanket
# `GOSUMDB: off` turned off checksum verification for every THIRD-party
# dependency, and a pinned GOPROXY breaks the build whenever an upstream
# re-points a tag.
env:
  GO_VERSION: '1.26.7'
  COVERAGE_THRESHOLD: 90

jobs:
  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run unit tests with coverage
        run: make coverage

      - name: Calculate coverage from Makefile output
        id: coverage
        run: |
          COVERAGE=$(go tool cover -func=build/coverage/coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "coverage=${COVERAGE}" >> $GITHUB_OUTPUT
          echo "Total coverage: ${COVERAGE}%"

      - name: Check coverage threshold
        run: |
          COVERAGE=${{ steps.coverage.outputs.coverage }}
          COVERAGE_INT=$(echo "${COVERAGE}" | awk '{printf "%d", $1}')
          if [ "${COVERAGE_INT}" -lt "${COVERAGE_THRESHOLD}" ]; then
            echo "Coverage ${COVERAGE}% is below threshold ${COVERAGE_THRESHOLD}%"
            exit 1
          else
            echo "Coverage ${COVERAGE}% meets threshold ${COVERAGE_THRESHOLD}%"
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./build/coverage/coverage.out
          flags: unittests
          name: go-xkms-coverage
          fail_ci_if_error: true

      - name: Upload coverage reports as artifacts
        uses: actions/upload-artifact@v6
        with:
          name: coverage-reports
          path: |
            build/coverage/coverage.html
            build/coverage/coverage.out
            build/coverage/test.log
          retention-days: 30

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = '${{ steps.coverage.outputs.coverage }}';
            const threshold = '${{ env.COVERAGE_THRESHOLD }}';
            const status = parseFloat(coverage) >= parseFloat(threshold) ? '✅' : '❌';

            const comment = `## Coverage Report ${status}

            **Total Coverage**: ${coverage}%
            **Threshold**: ${threshold}%

            ${parseFloat(coverage) >= parseFloat(threshold)
              ? '✅ Coverage meets the required threshold!'
              : '❌ Coverage is below the required threshold. Please add more tests.'}

            [View detailed coverage report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.7.2
          args: --timeout=5m

  race:
    name: Race Detector
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests with race detector
        run: make test

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run integration tests
        run: make compose-integration

      # Unconditional: a failed, timed-out or cancelled job must not leave its
      # compose stack on the runner host for the next run to collide with.
      # The project name is namespaced per run (Makefile: COMPOSE_NS), so this
      # can only remove this run's own containers, networks and volumes.
      - name: Tear down compose stack
        if: always()
        run: |
          make compose-clean || true
          make clean-run-images || true
