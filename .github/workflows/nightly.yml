# Nightly scans.

name: Nightly

# Manual only: no cron trigger.
on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

# The integration-test job below reads env.GO_VERSION.
env:
  GO_VERSION: '1.27.4'

jobs:
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # SARIF upload on github.com; other forges gate with the trivy CLI below.
      - name: Trivy scan (SARIF for code scanning)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          skip-dirs: test,examples,data,bin,build

      - name: Upload Trivy SARIF
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Trivy gate (fail on CRITICAL/HIGH)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table
          skip-dirs: test,examples,data,bin,build

      # Pinned trivy CLI install.
      - name: Install Trivy CLI (Gitea)
        if: github.server_url != 'https://github.com'
        env:
          TRIVY_VERSION: '0.75.0'
        run: |
          set -euo pipefail
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tmp="$(mktemp -d)"
          curl -sfL --retry 3 --retry-delay 5 -o "$tmp/$tarball" "$base/$tarball"
          curl -sfL --retry 3 --retry-delay 5 -o "$tmp/checksums.txt" "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          (cd "$tmp" && grep " ${tarball}\$" checksums.txt | sha256sum -c -)
          tar -xzf "$tmp/$tarball" -C "$tmp" trivy
          install -m 0755 "$tmp/trivy" /usr/local/bin/trivy
          rm -rf "$tmp"
          trivy --version

      - name: Trivy gate (Gitea)
        if: github.server_url != 'https://github.com'
        run: |
          trivy fs --scanners vuln,secret --severity CRITICAL,HIGH --exit-code 1 --format table \
            --skip-dirs test --skip-dirs examples --skip-dirs data --skip-dirs bin --skip-dirs build .

  # The full integration suite, off the push path.
  integration-test:
    name: Integration Tests
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}

    steps:
      # Never prune the whole docker host; other jobs share it.
      - name: Free up disk space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          # Remove unnecessary tools and packages to free up disk space
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          # Prune only dangling images.
          docker image prune -f || true
          docker builder prune -af || true
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: ${{ runner.environment != 'self-hosted' }}

      - name: Install dependencies
        run: go mod download

      # The default docker buildx driver handles these single-arch builds.
      - name: Build Docker image
        run: make docker-build

      # Prints the module resolution settings, never a credential value.
      - name: Devcontainer module resolution
        run: make devcontainer-module-env
        continue-on-error: true

      - name: Run integration tests
        # XKMS_COMPOSE_SERVER=1 builds and starts the compose xkms-server.
        run: XKMS_COMPOSE_SERVER=1 make integration-test
        timeout-minutes: 60

      # Always tear down the integration stacks.
      - name: Tear down integration test stacks
        if: always()
        run: |
          make clean-test-containers || true
          make devcontainer-clean || true
          make clean-run-images || true

      - name: Upload integration test results
        if: always() && github.server_url == 'https://github.com'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: integration-test-results
          path: |
            *.out
            *.log
            build/test-results/
          retention-days: 7

      # No end-of-job Docker teardown here.

  # xkey/pkg/pkcs11's unit suite.
  xkey-pkcs11-unit:
    name: xkey pkcs11 unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: ${{ runner.environment != 'self-hosted' }}

      # The cgo dependencies of the xkey module graph.
      - name: Install cgo dependencies
        run: sudo .github/scripts/apt-deps.sh libicu-dev libusb-1.0-0-dev

      - name: xkey pkcs11 unit suite
        working-directory: xkey
        run: go test -race -tags codec_json -count=1 -timeout 30m ./pkg/pkcs11/...
