        if: always()
        run: scripts/ci-registry.sh release "${TOOLCHAIN_HOLD:-}" # CUSTOMIZE (go-xkms, ruling 169)

  # nested-module-test: the nested modules' race suites.
  #
  # The image's user is unprivileged, which the xkey suites need (#332): the
  # CLI resolves the invoking user's home, and as root under sudo 44
  # cmd/xkey/cmd tests failed (run 14873).
  #
  # ./cmd/xkey/cmd runs under both tag sets: the !ble build compiles a
  # different set of files for every command with a BLE stub, and the stub's
  # flags drifted from the real command undetected (go-xkms#1318). -tags
  # tpm_simulator drives barrier auto-unseal against the in-process simulator
  # (#985). `go vet -tags ble ./...` compile-checks every ble-tagged package,
  # tests included (#31); ./pkg/phone/ runs whole under -race, never a named
  # list (#79, #27). pkg/attestation is the device attestation decision
  # (#130), named because a silent deletion there is the most expensive.
  nested-module-test:
    name: Nested Module Tests (sdk/go, xkey, web/desktop)
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}
    # v1.26: never on a draft PR, ci:full or not.
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && !github.event.pull_request.draft }}
    needs: ci-images      # CUSTOMIZE (go-xkms, ruling 169)
    permissions:          # CUSTOMIZE (go-xkms, ruling 169): pull main's toolchain image
      contents: read
      packages: read
    timeout-minutes: 110  # #1587: ~2x 55m, slowest green (forge API, last 60 CI runs, 2026-10-17)
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      CI_CACHE_CLASS: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'main' || 'pr' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh "$CI_STACK_PREFIX"

      # v1.29.4, v1.29.5: Athens first, as in the image job.
      - name: Route the image build through Athens
        run: |
          if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
            echo "GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org|direct" >> "$GITHUB_ENV"
          fi

      # CUSTOMIZE (go-xkms, ruling 169): the toolchain image from ci-images
      # (as in the image job).
      - name: Take the toolchain image
        env:
          TOOLCHAIN_REF: ${{ needs.ci-images.outputs.toolchain_ref }}
          CI_REGISTRY_USER: ${{ github.actor }}
          CI_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci-registry.sh use toolchain "$TOOLCHAIN_REF" >> "$GITHUB_ENV"

      - name: sdk/go and web/desktop tests (toolchain image)
        run: |
          scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" '
            set -e
            (cd sdk/go && go test -race -timeout 60m -v -tags codec_json ./...)
            (cd web/desktop && go test -race -timeout 60m -v ./...)
          '

      - name: xkey tests (toolchain image)
        run: |
          scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" '
            set -e
            cd xkey
            go test -race -timeout 60m -v -tags "codec_json tpm_simulator" ./internal/lifecycle/... ./pkg/phone/... ./pkg/pairing/...
            go test -race -timeout 60m -v -tags codec_json ./pkg/oath/...
            go test -race -timeout 60m -tags "codec_json tpm_simulator" -count=1 \
              ./cmd/e2eprobe ./cmd/xkey ./cmd/xkey/cmd \
              ./pkg/agent ./pkg/audit ./pkg/backendregistry ./pkg/backup \
              ./pkg/ccid ./pkg/cdp ./pkg/config ./pkg/gadget \
              ./pkg/gui ./pkg/gui/events ./pkg/ipc ./pkg/keyboard ./pkg/luks \
              ./pkg/nativemsg ./pkg/notify ./pkg/nssdb \
              ./pkg/oidc/aws ./pkg/oidc/handlers \
              ./pkg/pwimport ./pkg/qrgen ./pkg/qrscan ./pkg/secretservice \
              ./pkg/serverregistry ./pkg/shellquote ./pkg/sshlocal ./pkg/sshstore ./pkg/sync \
              ./pkg/tokenstore ./pkg/usb ./pkg/xhome
            go test -race -timeout 60m -tags "ble codec_json tpm_simulator" -count=1 ./cmd/xkey/cmd ./pkg/gui/services
            go vet -tags ble ./...
            go test -race -timeout 60m -tags ble ./pkg/phone/ -count=1
            go test -timeout 60m ./pkg/attestation/... -count=1
          '

      - name: Tear down
        if: always()
        run: scripts/ci-registry.sh release "${TOOLCHAIN_HOLD:-}" # CUSTOMIZE (go-xkms, ruling 169)

  # build-raft: the default build is standalone; `-tags raft` is the
  # clustered configuration, and each leg tests a different half of
  # pkg/config, pkg/xkms and pkg/embeddednode.
  build-raft:
    name: Build & Test (raft tag matrix, ${{ matrix.tags }})
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}
    # v1.26: never on a draft PR, ci:full or not.
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && !github.event.pull_request.draft }}
    # #1587: ~2x 13m, slowest green (forge API, last 60 CI runs, 2026-10-17;
    # run 55255's 169m apt hang excluded).
    timeout-minutes: 30
    needs: ci-images      # CUSTOMIZE (go-xkms, ruling 169)
    permissions:          # CUSTOMIZE (go-xkms, ruling 169): pull main's toolchain image
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        tags: ["codec_json", "raft codec_json"]
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      CI_CACHE_CLASS: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'main' || 'pr' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh "$CI_STACK_PREFIX"

      # v1.29.4, v1.29.5: Athens first, as in the image job.
      - name: Route the image build through Athens
        run: |
          if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
            echo "GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org|direct" >> "$GITHUB_ENV"
          fi

      # CUSTOMIZE (go-xkms, ruling 169): the toolchain image from ci-images
      # (as in the image job).
      - name: Take the toolchain image
        env:
          TOOLCHAIN_REF: ${{ needs.ci-images.outputs.toolchain_ref }}
          CI_REGISTRY_USER: ${{ github.actor }}
          CI_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci-registry.sh use toolchain "$TOOLCHAIN_REF" >> "$GITHUB_ENV"

      - name: Build, vet and test (toolchain image)
        env:
          TAGS: ${{ matrix.tags }}
        run: |
          scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "
            set -e
            go build -tags '$TAGS' ./...
            go vet -tags '$TAGS' ./pkg/server/... ./pkg/config/...
            go test -timeout 15m -tags '$TAGS' ./pkg/config/... ./pkg/xkms/... ./pkg/embeddednode/... -count=1
          "

      - name: Tear down
        if: always()
        run: scripts/ci-registry.sh release "${TOOLCHAIN_HOLD:-}" # CUSTOMIZE (go-xkms, ruling 169)

  # race: the race detector over every backend, FROST included, on SoftHSM
  # with a token at slot 0 and the trusted-firmware simulators (sdk/go/tfwsim;
  # a missing binary FAILS that test). -p 2 because under -race the
  # password-vault packages (pkg/api/mcp, pkg/api/rest) each peak near 7 GB,
  # and eight in parallel OOM-killed the job (#1389). The PR tier's race
  # check is make coverage (make test runs -race); this job adds the backend
  # tag set and stays full tier.
  race:
    name: Race Detector
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}
    # v1.26: never on a draft PR, ci:full or not.
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && !github.event.pull_request.draft }}
    needs: ci-images      # CUSTOMIZE (go-xkms, ruling 169)
    permissions:          # CUSTOMIZE (go-xkms, ruling 169): pull main's toolchain image
      contents: read
      packages: read
    timeout-minutes: 145  # #1587: ~2x 71m, slowest green (forge API, last 60 CI runs, 2026-10-17)
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      CI_CACHE_CLASS: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'main' || 'pr' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh "$CI_STACK_PREFIX"

      # v1.29.4, v1.29.5: Athens first, as in the image job.
      - name: Route the image build through Athens
        run: |
          if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
            echo "GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org|direct" >> "$GITHUB_ENV"
          fi

      # CUSTOMIZE (go-xkms, ruling 169): the toolchain image from ci-images
      # (as in the image job).
      - name: Take the toolchain image
        env:
          TOOLCHAIN_REF: ${{ needs.ci-images.outputs.toolchain_ref }}
          CI_REGISTRY_USER: ${{ github.actor }}
          CI_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci-registry.sh use toolchain "$TOOLCHAIN_REF" >> "$GITHUB_ENV"

      # -timeout 75m, not the 10m default (#1587: above this job's slowest
      # green run, 71m, forge API, last 60 CI runs, 2026-10-17, and below its
      # 145m bound; it was 30m before). The default is a PER-PACKAGE limit,
      # and pkg/pkcs11/module exceeds it on a busy runner: the `pkcs11` tag
      # enables the soft-token suite, each login paying an Argon2id
      # derivation at 64 MiB. The bound keeps a real hang bounded with ample
      # headroom over the healthy cost.
      #
      # bridge, as make coverage has, for make agsim (DS-3754): the
      # trusted-firmware root module it builds is not in go.sum, so a stage
      # resolves it only with GOPRIVATE covering it, which in-toolchain-image.sh
      # passes to a bridge stage alone. On a no-network stage Go asks the
      # checksum database instead and `go mod download` fails (run 66181).
      - name: Race detector, all backends including FROST (toolchain image)
        env:
          IN_IMAGE_NETWORK: bridge
        run: |
          scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" '
            set -e
            mkdir -p /tmp/softhsm2/tokens
            printf "directories.tokendir = /tmp/softhsm2/tokens\nobjectstore.backend = file\nlog.level = INFO\n" > /tmp/softhsm2.conf
            export SOFTHSM2_CONF=/tmp/softhsm2.conf
            softhsm2-util --init-token --slot 0 --label test-token --so-pin 1234 --pin 1234
            export TFWSIM_DIR=/src/build/agsim
            make agsim
            GOMEMLIMIT=10GiB GOMAXPROCS=8 go test -race -p 2 -timeout 75m \
              -tags="pkcs8,awskms,gcpkms,azurekv,pkcs11,vault,codec_cbor,codec_json,codec_msgpack,frost" ./...
          '

      - name: Tear down
        if: always()
        run: scripts/ci-registry.sh release "${TOOLCHAIN_HOLD:-}" # CUSTOMIZE (go-xkms, ruling 169)

  # tpm2-simulator: pkg/tpm2 against the in-process TPM simulator
  # (go-tpm-tools, cgo against libcrypto); pkg/tpm2/vtpm supervises swtpm.
  tpm2-simulator:
    name: TPM2 Simulator Tests
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}
    # v1.26: never on a draft PR, ci:full or not.
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && !github.event.pull_request.draft }}
    needs: ci-images      # CUSTOMIZE (go-xkms, ruling 169)
    permissions:          # CUSTOMIZE (go-xkms, ruling 169): pull main's toolchain image
      contents: read
      packages: read
    timeout-minutes: 25   # #1587: ~2x 10.5m, slowest green (forge API, last 60 CI runs, 2026-10-17)
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      CI_CACHE_CLASS: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'main' || 'pr' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh "$CI_STACK_PREFIX"

      # v1.29.4, v1.29.5: Athens first, as in the image job.
      - name: Route the image build through Athens
        run: |
          if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
            echo "GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org|direct" >> "$GITHUB_ENV"
          fi

      # CUSTOMIZE (go-xkms, ruling 169): the toolchain image from ci-images
      # (as in the image job).
      - name: Take the toolchain image
        env:
          TOOLCHAIN_REF: ${{ needs.ci-images.outputs.toolchain_ref }}
          CI_REGISTRY_USER: ${{ github.actor }}
          CI_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci-registry.sh use toolchain "$TOOLCHAIN_REF" >> "$GITHUB_ENV"

      - name: pkg/tpm2 on the simulator (toolchain image)
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make test-tpm2-simulator

      - name: Tear down
        if: always()
        run: scripts/ci-registry.sh release "${TOOLCHAIN_HOLD:-}" # CUSTOMIZE (go-xkms, ruling 169)

  # Job 8 (FIPS 140-3 gate) IS NOT HERE ON PURPOSE. Do not re-add it without
  # reading go-xkms #23 first. The code half landed; the job is withheld until
  # pkg/pkcs11/module's arbitrary-IV CKM_AES_GCM surface and go-tpm's
  # fips140=only panics are resolved (docs/fips/README.md "Integration
  # Points" and "Known blockers outside this repository's control"). A
  # required check that is red on arrival is the ordering mistake task #98
  # exists to prevent: callers first, gate second.
  # <<< CUSTOMIZE

  # Architecture gate (v1.20, Company Agent m270 item 9; go-xkms arch-gates).
  # go-objstore owns every blob backend (docs/00), and a repo reaches it only
  # through the packages that are its storage seam. Test files are exempt, and
  # go-objstore itself passes. CUSTOMIZE: OBJSTORE_SEAMS, an extended regex of
  # the paths that may import go-objstore (go-xkms: 'pkg/ca/|pkg/storage/');
  # empty means none may. CUSTOMIZE: the repo's own layering rules (go-xkms:
  # xkmsctl and xkey depend only on sdk/go) are further steps in this job.
  # A source check with grep, not a stage: it runs on the runner's shell.
  # v1.23: a lint-class check, so it stays on the PR tier.
  # Routing (2026-11-10): a push to main and a pull_request from this
  # repository run on the bigdisk pool [self-hosted, linux, x64, bigdisk];
  # fork PRs, workflow_dispatch and the schedule stay on ubuntu-latest. Every
  # gate is grep and sed on the checkout, so the pool needs only its own
  # checkout (token not persisted) and no Go.
  arch-gates:
    name: Architecture Gates
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","bigdisk"]') || 'ubuntu-latest' }}
    if: ${{ !github.event.pull_request.draft }}   # v1.26
    env:
      OBJSTORE_SEAMS: 'pkg/ca/|pkg/storage/'      # CUSTOMIZE
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: runner.environment == 'github-hosted'

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: runner.environment == 'self-hosted'
        with:
          persist-credentials: false

      - name: No direct go-objstore import outside the storage seam
        run: |
          if [ "$(sed -n 's/^module //p' go.mod)" = github.com/jeremyhahn/go-objstore ]; then
            echo "OK: this is go-objstore"; exit 0
          fi
          hits=$(grep -rln --include='*.go' '"github.com/jeremyhahn/go-objstore' . \
                 | grep -v '_test\.go$' \
                 | { if [ -n "$OBJSTORE_SEAMS" ]; then grep -vE "$OBJSTORE_SEAMS"; else cat; fi; } || true)
          if [ -n "$hits" ]; then
            echo "go-objstore may be imported only in the storage seam (OBJSTORE_SEAMS='$OBJSTORE_SEAMS'):"
            echo "$hits"; exit 1
          fi
          echo "OK: no go-objstore import outside the storage seam"
      # >>> CUSTOMIZE (go-xkms)
      - name: xkmsctl is sdk/go-only (production)
        run: |
          hits=$(grep -rln '"github.com/jeremyhahn/go-xkms/pkg/' --include='*.go' cmd/xkmsctl/ \
                 | grep -v '_test\.go' || true)
          if [ -n "$hits" ]; then
            echo "xkmsctl production code must depend only on sdk/go, found pkg/* imports:"; echo "$hits"; exit 1
          fi
          echo "OK: xkmsctl is sdk/go-only"

      - name: xkey is sdk/go-only (production)
        run: |
          hits=$(grep -rln '"github.com/jeremyhahn/go-xkms/pkg/' --include='*.go' xkey/ \
                 | grep -vE '/xkey/pkg/|_test\.go' || true)
          if [ -n "$hits" ]; then
            echo "xkey production code must depend only on sdk/go, found go-xkms/pkg/* imports:"; echo "$hits"; exit 1
          fi
          echo "OK: xkey is sdk/go-only"
      # <<< CUSTOMIZE

  # The single required check (devops.md §1). Every job above must appear in
  # BOTH the needs list and the results check — a gate that can pass vacuously
  # is worse than no gate. Do not use join(needs.*.result); it evaluates empty
  # on Gitea and reports success while jobs fail.
  # v1.21: on the ci-gate runners (Company Agent m386: only CI Gate runs there;
  # a 1-CPU gate runner cannot hold a stage). trivy and fips are in nightly.yml
  # (v1.9, devops.md §8a: the alpha regime).
  ci-gate:
    name: CI Gate
    # CA m2475 (2h): the gate runs on the self-hosted bigdisk pool (main pushes
    # and same-repo PRs), so it never waits in the hosted queue and always
    # reports; it needs no Docker. Fork PRs stay on ubuntu-latest.
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","bigdisk"]') || 'ubuntu-latest' }}
    # v1.29.3: on a schedule run the schedule guard decides. `busy` skips the
    # gate, so `CI / CI Gate (schedule)` posts `skipped` (Gitea 1.27.1 posts a
    # skipped job as `skipped`, not `success`), never a green nightly. Every
    # other verdict, an empty one included, runs it.
    if: ${{ always() && (github.event_name != 'schedule' || needs.schedule-guard.outputs.verdict != 'busy') }}
    # CUSTOMIZE: the repo's job list. Add every CUSTOMIZE job here AND as a
    # check line below; remove none of the template's jobs.
    needs: [changes, schedule-guard, image, lint-gates, integration, soak, arch-gates, static-analysis, build, nested-module-build, nested-module-test, build-raft, race, tpm2-simulator, ci-images] # CUSTOMIZE (go-xkms, ruling 169): ci-images
    steps:
      - name: Fail closed on any non-success
        env:
          # The full tier is CI_FULL_TIER (v1.23): every event but a PR, and a
          # PR labelled ci:full. A job marked `full` may be skipped below only
          # when it is not selected; a `pr` job may never be skipped.
          FULL_TIER: ${{ env.CI_FULL_TIER }}
          # v1.24: a `nightly` job runs on schedule and workflow_dispatch only.
          NIGHTLY: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          # v1.26: a draft PR runs no CI, so its gate fails rather than pass on skips.
          DRAFT: ${{ github.event.pull_request.draft == true }}
          # v1.29.3: the schedule guard's verdict on a schedule run.
          SCHEDULE: ${{ github.event_name == 'schedule' }}
          SCHEDULE_GUARD: ${{ needs.schedule-guard.outputs.verdict }}
        run: |
          if [ "${DRAFT}" = true ]; then
            echo "FAIL draft pull request: no CI runs on a draft. Mark it ready, then push an empty commit to start its run."
            exit 1
          fi
          BAD=0
          echo "full tier selected: ${FULL_TIER}; nightly selected: ${NIGHTLY}"
          check() { # <job> <result> <pr|full|nightly>
            case "$2" in
              success) echo "OK   $1";;
              skipped)
                if [ "$3" = full ] && [ "${FULL_TIER}" != true ]; then
                  echo "SKIP $1 (full tier not selected)"
                elif [ "$3" = nightly ] && [ "${NIGHTLY}" != true ]; then
                  echo "SKIP $1 (nightly and dispatch only)"
                else
                  echo "FAIL $1 (skipped)"; BAD=1
                fi;;
              *) echo "FAIL $1 ($2)"; BAD=1;;
            esac
          }
          # v1.29.3: a schedule run reaches this step on any verdict but
          # `busy`. Any verdict but `run` means its bigdisk jobs skipped
          # because the guard had no count: fail closed.
          if [ "${SCHEDULE}" = true ] && [ "${SCHEDULE_GUARD}" != run ]; then
            echo "FAIL schedule-guard (verdict '${SCHEDULE_GUARD:-none}': the bigdisk jobs skipped because the guard could not read the API; see its log)"; BAD=1
          fi
          # CUSTOMIZE: one line per job in needs above. A job gated to the
          # full tier by its `if:` is marked full, one gated to schedule and
          # workflow_dispatch is nightly; every other job is pr.
          check changes     "${{ needs.changes.result }}" pr
          check schedule-guard "${{ needs.schedule-guard.result }}" pr
          check image       "${{ needs.image.result }}" pr
          check lint-gates  "${{ needs.lint-gates.result }}" pr
          check integration "${{ needs.integration.result }}" full
          check soak        "${{ needs.soak.result }}" nightly
          check arch-gates  "${{ needs.arch-gates.result }}" pr
          # >>> CUSTOMIZE (go-xkms)
          check static-analysis    "${{ needs.static-analysis.result }}" pr
          check build              "${{ needs.build.result }}" pr
          check nested-module-build "${{ needs.nested-module-build.result }}" pr
          check nested-module-test "${{ needs.nested-module-test.result }}" full
          check build-raft         "${{ needs.build-raft.result }}" full
          check race               "${{ needs.race.result }}" full
          check tpm2-simulator     "${{ needs.tpm2-simulator.result }}" full
          check ci-images          "${{ needs.ci-images.result }}" pr
          # <<< CUSTOMIZE
          exit $BAD
