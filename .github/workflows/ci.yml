# ci-template: v1.15 (customized)
# Reconciled against software/templates/github-actions/ci.yml in the
# automatethethings repo (devops.md §1/§8/§9). Divergence outside the
# repo-specific blocks below is a defect.
#
# v1.15 (2026-10-05, automatethethings#209, #1422): EVERY JOB STARTS AT ONCE.
# Template v1.14 dropped the v1.9 staged fail-fast below: no job `needs:`
# lint, build or arch-gates any more, so a run takes as long as its slowest
# job -- the shortest wall-clock to a green gate, which is what an automerge
# v7 merge train waits on. A broken head now spends the heavy tier too; the
# concurrency block still sheds superseded heads. `changes` stays a `needs:`
# wherever a job reads its outputs (that is data, not staging). CI Gate still
# needs every job and fails closed on each. push runs on main only; v7's
# trains are PRs from merge-train/* and pr-scope.sh puts them on the full
# tier, as train/* was. The v1.9 history below is kept as the record.
#
# v1.9 STAGED FAIL-FAST (adopted 2026-08-21, go-xkms #37; SUPERSEDED by v1.15
# above -- the ordering it describes is gone). Fail-fast came from
# ORDERING: a cheap fast tier gates the expensive one. Measured on run 4384,
# this repo's jobs are:
#
#   fast      arch-gates 6s · build ~7m (3-way matrix, parallel) · lint 9m24s
#   expensive race 29m33s · test 16m11s · nested-module 12m21s ·
#             security 11m24s · build-raft ~8m30s (x2)
#
#   CORRECTION (2026-09-05, #392): this entry originally opened "Gitea cannot
#   cancel in-flight jobs, so fail-fast comes from ORDERING". The premise was
#   wrong -- a workflow-level `concurrency:` block DOES cancel here; see the
#   concurrency block below. The ordering it introduced is unaffected and stays
#   exactly as designed. Ordering and cancellation are COMPLEMENTARY, not
#   alternatives: ordering bounds what a BROKEN head burns (nothing supersedes
#   it), cancellation sheds a SUPERSEDED head. (v1.15 dropped the ordering by
#   owner ruling; cancellation stays.)
#
# Integration Tests (17m25s) left this file entirely on 2026-08-21 -- it was
# already advisory and is now known-red on a cause outside this repo (#61); see
# nightly.yml for the full reasoning.
#
# Before this, `test` (a full `make coverage` run) was itself the gate, so a
# compile error cost 16 minutes before anything was reported and the expensive
# tier still ran. Now a broken push reports in minutes and skips roughly 100+
# runner-minutes downstream; a green push pays one fast-tier of extra latency.
#
# (v1.9-era DEVIATION, retired by v1.15: arch-gates joined lint + build in
# the fast tier that gated the expensive jobs. With no staging it is simply
# one more job that starts at once and that CI Gate requires.)
#
# trivy already lives in nightly.yml (#43) and this repo has no fips job (its
# gate is withheld pending #23), so the template's nightly migration is a
# no-op here rather than skipped.
#
# DEVIATION from the template, deliberate (#189): the analysis tools are taken
# from the runner image rather than installed at job time. The template still
# runs `go install ...@pin` behind a retry loop; that install OVERWRITES the
# baked binary with a different version, which is the whole defect. See the
# Lint and Security Scan jobs and .github/scripts/require-tool.sh.
#
# TWO-TIER PIPELINE (2026-09-24, branch ci/two-tier-pipeline). Almost every
# change lands through a merge-train PR (head branch `train/<n>`, and since
# automerge.yml v7 `merge-train/<epoch>-<run id>`, #1422): many PRs
# merged into one branch, then that one branch fast-forwards into main. An
# ordinary PR's own CI run was therefore never the thing standing between a
# defect and main -- the train's run is -- so running the FULL 9-14 job
# matrix on every ordinary PR too was spending runner capacity the fleet does
# not have (load average 150-380, 20-40 concurrent jobs measured on the two
# runner hosts) on a signal the train re-derives from scratch anyway.
#
# Two independent axes, computed once by the `changes` job and read from its
# outputs everywhere else:
#
#   docs_only   true when every changed path is docs/**, **/*.md or
#               .changelog/** (see pr-scope.sh). Skips every Go-compiling
#               job (build, build-raft, test, race, security, docker,
#               static-analysis, the nested-module jobs) on both tiers -- a
#               documentation change
#               cannot regress code no matter which tier would otherwise
#               apply. `lint` and `arch-gates` are NOT skipped: `lint` is
#               where the xkey agent-skill reference check lives
#               (check-skill-reference), which IS a docs check, and
#               arch-gates is a six-second grep with nothing to gain by
#               excluding it.
#
#   full_tier   true for a train/* or merge-train/* PR, a PR labelled ci:full
#               (#1483), a push to main or a manual dispatch; false for every
#               other pull_request. Selects whether the full tier runs on top
#               of the PR tier:
#
#     PR tier (every run): changes, lint, static-analysis, arch-gates, build
#       (one leg compiling xkmsctl, xkmsd and xkey), nested-module-build
#       (sdk/go, xkey and web/desktop compile, not their full test suites --
#       `make vet`, already in the `lint` job's LINT_MODULES loop, covers
#       `go vet` for the nested modules on every tier), test-changed (unit
#       tests scoped to the packages the PR touched, with a best-effort
#       reverse-dependency expansion -- see changed-go-packages.sh; on the
#       full tier its steps stand down, because `test` runs every package),
#       and ci-gate.
#
#     full tier (full_tier=true): the PR tier PLUS race, build-raft, the
#       nested-module-test full suites, docker build+scan, security,
#       tpm2-simulator, and `test`, whose `make coverage` carries the root
#       89% COVERAGE_THRESHOLD gate. That gate living on the full tier is the
#       point: it was already effectively enforced only at the train, since
#       an outdated branch cannot fast-forward into main, so gating every
#       individual PR on it bought nothing but runner time.
#
#   Each full-tier job writes its condition out in full (#1483): the event
#   (push, workflow_dispatch), the ci:full label, OR full_tier -- the last is
#   what keeps trains on the full tier. A full-tier job may `needs:` a
#   PR-tier job, never the reverse. internal/buildgates parses this file and
#   fails if a job's `if:`, its CI Gate tag, or that rule disagree.
#
# ci-gate treats a job's `skipped` result as PASS exactly when the tier/
# docs-only split says that job was not supposed to run for THIS PR -- a
# `full` job when the full tier was not selected, or a Go job on a docs-only
# diff -- and as FAIL otherwise -- the same "a gate that can pass vacuously is worse than no
# gate" principle the v1.9 block above applied to the staged
# ordering, extended to cover deliberate exclusion as well as upstream
# failure.
#
# Do not add a workflow-level `paths-ignore:` for docs paths instead of the
# `changes` job: `paths-ignore` on `pull_request`/`push` makes Gitea/GitHub
# not START the workflow run at all for a matching diff, which means the
# required `CI / CI Gate (pull_request)` context never reports anything --
# not skipped, not success, nothing -- and main's branch protection then
# blocks a docs-only PR forever waiting on a context that will never exist.

name: CI

# ci-template v1.5: trunk-only triggers. main is the sole trunk since develop
# was folded into it (2aa8ab1, 2026-08-17); develop is a frozen archive and
# master has never existed in this repo. Listing a branch that can also be a PR
# head made every commit on it run CI twice — one push run and one
# pull_request run for the same sha (issue #6). The `concurrency:` block added
# in #392 does NOT dedupe those two: a push run and a pull_request run carry
# DIFFERENT refs, so they key into different groups. (This entry originally
# ended "and this Gitea has no working supersession, so the duplicate ran to
# completion", followed by a "Do NOT add a `concurrency:` block" paragraph
# citing task #88. That claim was wrong; see the concurrency block below.)
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    # No `labeled` (go-trusted-platform #853, CA m369). Gitea 1.27.1 sends
    # every label add AND remove as `label_updated`, and its matcher maps that
    # to `labeled` whichever label moved, with no `github.event.label` in the
    # payload. Each `task:*`, `code-review` or review-lock change then started
    # a run that the `concurrency` block let cancel the PR's run in progress,
    # and a run whose jobs an `if:` skips would post `skipped` over the real
    # run's `CI / *` contexts, CI Gate included. An action outside `types`
    # matches nothing: no run, no status. The cost: adding `ci:full` waits for
    # the PR's next push or update-branch, or a workflow_dispatch.
    types: [opened, synchronize, reopened]
  workflow_dispatch:                    # manual rerun — Gitea has no rerun API

# Supersession control (#392). A newer head on the same ref cancels the older
# run instead of both occupying the shared runner's `capacity: 3`. This repo
# took 15 runs on ci.yml@refs/heads/main in a five-hour sample window;
# portfolio-wide, 73% of runs are superseded but run to completion.
#
# MEASURED on Gitea 1.27.1 (2026-09-05); this CORRECTS the v1.5 and v1.9
# entries above, which asserted concurrency was unusable here:
#   - Workflow level, keyed on the REF, `cancel-in-progress: true` → Gitea
#     cancels the OLDER run and the NEWEST completes. Verified on pull_request
#     refs, on push/refs/heads/* refs, and end-to-end on the go-truststrap
#     pilot (PR #49, merged 84881ef: run 12133 cancelled, run 12134 completed
#     with all jobs reporting).
#   - Task #88's evidence was a DIFFERENT config, and this repo's own
#     d7f60eb4 is the record of it: JOB level, in task-worker.yml, group
#     `task-worker-${{ github.repository }}` with NO ref component -- so every
#     task worker in the repository shared ONE group -- and
#     `cancel-in-progress: false`. That group was not "unoccupied"; it was
#     saturated by its own siblings, and Gitea cannot QUEUE, so the false path
#     cancels. It says nothing about the true path, and "no expression fixes
#     it" did not follow from it.
#   - Task #90 still holds, and is WHY this is the only available mechanism:
#     1.27.1 publishes no `cancel` REST route at any path (only `rerun`,
#     `rerun-failed-jobs`, and a run-nested job rerun).
#   - `cancel-in-progress` does NOT evaluate expressions on 1.27.1 -- any
#     non-empty value is truthy, so a `${{ }}` rendering "false" still cancels.
#     Write the literal. (Group-key expressions DO evaluate.)
#   - The group is per-REF, so a PR's runs and main's push runs never cancel
#     each other, and two PRs never cancel each other.
#   - Cancelling cannot block a merge: a cancelled run writes `failure` to its
#     contexts, but the required context is `CI / CI Gate (pull_request)` and
#     cancellation only lands on superseded SHAs the head has moved past.
#   - ADOPTION BOUNDARY, expect it once: Gitea groups a run using the workflow
#     file OF THAT RUN, so a run created before this block landed is in no
#     group and the first push after adoption cannot supersede it. Check with
#     `git show <sha>:.github/workflows/ci.yml | grep -c '^concurrency:'`
#     before concluding a supersession failed.
#   - release.yml deliberately does NOT get this: cancelling a release
#     mid-publish is destructive. nightly.yml, coverage.yml and
#     docker-tests.yml are out of scope here too.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # PINNED (devops.md §9, documented): Go 1.27.0 reached actions/go-versions on
  # 2026-08-19 and 'stable' started resolving to it mid-branch — a green run at
  # 16:29 got 1.26.x and the next head got 1.27.0, with no change to this repo.
  # Under 1.27.0 github.com/cockroachdb/swiss fails to compile (undefined
  # fastrand64 / hashFn / getRuntimeHasher: its runtime hooks are gated on
  # toolchain version and that pinned commit does not know go1.27), which takes
  # out Unit Tests, Nested Module Tests and the lint/scan jobs that build the
  # same graph. Nothing in the tree changed; the environment moved underneath
  # the head, which is exactly what an unpinned toolchain lets happen.
  #
  # Go 1.27.0 was adopted repo-wide in #560 (module toolchains, CI, and this
  # pin all moved together; the Dockerfiles followed to close out #36), and
  # moved to 1.27.1 with go-qrdb v0.46.0-alpha, whose go.mod declares it, and
  # to 1.27.3 for GO-2026-6809 (crypto/x509 intermediate distrust). Bump
  # the patch version here as 1.27.x releases ship; re-run the swiss/pebble
  # compatibility check above before ever bumping the minor version again.
  GO_VERSION: '1.27.3'
  # ANALYSIS TOOL PINS (#189). These are the versions BAKED INTO the
  # self-hosted runner image; .github/scripts/require-tool.sh asserts the
  # binary on PATH self-reports exactly this and fails the job otherwise.
  # Nothing here installs them -- see that script for why.
  #
  # These are two copies of one number (this file and the image's Dockerfile
  # ARGs) with nothing linking them, which is exactly how the previous
  # arrangement drifted. The assertion is what turns that drift into a red job
  # naming both versions instead of a silent scan by something else. Bumping a
  # pin here is a deliberate change made in the same breath as the image.
  #
  # golangci-lint moved v2.12.2 -> v2.13.2 HERE, on measurement, not on the
  # version number. The old pin exists because @latest had moved to v2.13.0,
  # which panics under Go 1.26 ("nilness: internal error: unhandled builtin
  # recover" in honnef.co/go/tools v0.8.0-rc.1). v2.13.2 was installed and run
  # against this tree under Go 1.27.0: it does not panic, and it reports the
  # SAME seven enabled linters as v2.12.2 (errcheck, gocritic, govet,
  # ineffassign, misspell, staticcheck, unused) -- the check that matters most,
  # because the quiet way a linter bump goes wrong is dropping a linter while
  # still exiting 0. The binary measured self-reports mod sum
  # h1:bCyq3E4vo9qwzifjpzJqYndEt7Ncva80qkk8G2B4TXU=, identical to the one the
  # runner reports, so it is the same artifact and not merely the same version
  # string. v2.13.2 is also what can lint a Go 1.27 module; v2.12.2 cannot, so
  # the old install was blocking the 1.27 wave from the runner it was already
  # fixed on. This does NOT bump GO_VERSION -- that is the wave's decision
  # (company task #121), and it is now unblocked rather than made.
  #
  # golangci-lint v2.13.2 -> v2.14.0 and govulncheck v1.7.0 -> v1.8.0 follow the
  # runner image, which now ships those versions (go-quicraft made the same
  # move in v0.20). The tree lints clean on both.
  GOLANGCI_LINT_VERSION: 'v2.14.0'
  GOSEC_VERSION: 'v2.29.0'
  GOVULNCHECK_VERSION: 'v1.8.0'
  # Coverage RATCHET, not aspiration: set just under the current measured
  # baseline (89.9% at 2026-08-17) so the gate fails on regression instead
  # of being permanently red — it had never passed at 90 and therefore
  # guarded nothing. Raise it as coverage grows; 90%+ remains the
  # CLAUDE.md target and the Makefile's own gate stays at 80.
  COVERAGE_THRESHOLD: 89
  TRIVY_DIGEST: 'sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa'
  REGISTRY: ghcr.io
  IMAGE_NAME: jeremyhahn/xkms-cli
  # NO GOPROXY / GOSUMDB overrides here (ci-template v1.1 prohibition). The
  # runners inject GOPRIVATE, which already exempts first-party modules from
  # the proxy and the checksum database; a blanket `GOSUMDB: off` instead
  # turned off checksum verification for every THIRD-party dependency, and a
  # pinned GOPROXY breaks the build whenever an upstream re-points a tag
  # (go-tpm-tools v0.4.8, 2026-08-14).

jobs:
  # Job 0: Detect Changes -- classifies this run for the two-tier pipeline
  # (see the top-of-file note). Kept dependency-free (git only, no Go
  # toolchain, no `needs:`) so it starts immediately and reports back fast --
  # a `git diff` against a full clone, no compilation. `lint` and
  # `arch-gates` stay unconditional and start immediately too, same as
  # before this change. Every Go job needs this job's outputs before it can
  # start (a docs-only diff has nothing to build, and the tier picks which
  # jobs run), so each pays this job's short runtime as added latency; that
  # is a data dependency, not staging, and v1.15 keeps it.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5    # #1587: slowest green 0.8m (forge API, last 60 CI runs, 2026-10-17)
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      full_tier: ${{ steps.scope.outputs.full_tier }}
      merge_base: ${{ steps.scope.outputs.merge_base }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # pr-scope.sh diffs against the merge-base with the PR's base
          # branch (or the push's previous sha); a shallow clone can leave
          # that commit unreachable, and the script is written to FAIL OPEN
          # in that case (docs_only=false) rather than silently misclassify
          # a real code change as docs-only -- so a shallow clone would not
          # break correctness, only quietly disable the skip. Full history
          # keeps the skip working.
          fetch-depth: 0
          persist-credentials: false
      - name: Classify this run (docs-only? which tier?)
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          # head_ref/base.sha/before are look-at-only here: pr-scope.sh only
          # ever compares them against fixed patterns (train/*, all-zero) or
          # passes them to `git`, never interpolates them into a shell
          # string, so there is no injection surface despite head_ref being
          # attacker-controlled on a fork PR.
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          # Renders to exactly "true" or "false" (#1483).
          CI_FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: .github/scripts/pr-scope.sh

  # Job 1: Unit Tests with Coverage Enforcement
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    # #1587: ~2x 70m, slowest green (forge API, last 60 CI runs, 2026-10-17).
    timeout-minutes: 140
    needs: [changes]
    # Full tier only (see the top-of-file TWO-TIER PIPELINE note): this is
    # the `make coverage` run with the root 89% COVERAGE_THRESHOLD gate,
    # reserved for train/* PRs and pushes to main. An ordinary PR gets the
    # narrower `test-changed` job instead.
    if: >-
      needs.changes.outputs.docs_only != 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ci:full') ||
      needs.changes.outputs.full_tier == 'true')

    # ci-template v1.6: the Go toolchain is cgroup-unaware -- in a ~12 GB job
    # container it sees the HOST's 24 cores and 94 GB, same as the Security
    # Scan job below (2026-08-18). Here it showed up as pkg/api/mcp's
    # password-vault tests (go-xkms run 21639): -race plus unbounded
    # t.Parallel() fan-out spawned enough concurrent Argon2id-sealed barrier
    # fixtures that the job was OOM-killed ("signal: killed") even after the
    # per-test KDF cost was fixed to run cheap in tests (pkg/staticpw
    # WithPassphraseKDFParams) -- measured 2026-10-01: the same binary peaks
    # at ~20 GB RSS with GOMAXPROCS unset vs ~6.7 GB at GOMAXPROCS=8. GOMEMLIMIT
    # makes the GC respect the container budget; GOMAXPROCS bounds the worker
    # fan-out, exactly as for Security Scan.
    env:
      GOMEMLIMIT: 10GiB
      GOMAXPROCS: 8
      # make coverage runs `go test -race ./...`; -p=2 keeps at most two race
      # test binaries alive at once (pkg/api/mcp and pkg/api/rest each peak
      # near 7 GB), the same bound the fast-tier and race jobs carry.
      GOFLAGS: -p=2

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install dependencies
        run: go mod download

      - name: Install and configure SoftHSM2
        run: |
          # libicu-dev/libusb-1.0-0-dev: unconditional cgo deps of the module
          # graph (dolthub/go-icu-regex, google/gousb via go-qrdb) -- needed
          # even for the default (non-hardware) build tags, because
          # CGO_ENABLED defaults to 1 whenever a C toolchain is present.
          # swtpm: pkg/tpm2/vtpm supervises a real swtpm process per tenant,
          # and this job's `make coverage` run exercises those tests.
          sudo .github/scripts/apt-deps.sh libicu-dev libusb-1.0-0-dev swtpm
          # SoftHSM 2.7.0 from its pinned, checksum-verified release, not the
          # distro's 2.6.1, which answers an AES-GCM tag mismatch with the
          # ambiguous CKR_GENERAL_ERROR so PKCS#11 tamper cannot be classified
          # (go-xkms#1418). Installs at the distro's paths.
          sudo .github/scripts/apt-deps.sh build-essential autoconf automake libtool pkg-config libssl-dev
          sudo sh scripts/build-softhsm.sh
          # Create token directory
          mkdir -p "${GITHUB_WORKSPACE}/softhsm2/tokens"
          # Create SoftHSM2 config
          cat > "${GITHUB_WORKSPACE}/softhsm2.conf" << EOF
          directories.tokendir = ${GITHUB_WORKSPACE}/softhsm2/tokens
          objectstore.backend = file
          log.level = INFO
          EOF
          # Verify config file was created
          echo "=== SoftHSM2 Config ==="
          cat "${GITHUB_WORKSPACE}/softhsm2.conf"
          echo "=== Initializing token ==="
          # Initialize test token
          softhsm2-util --init-token --slot 0 --label "test-token" --so-pin 1234 --pin 1234
          # Verify token was created
          echo "=== Token slots ==="
          softhsm2-util --show-slots
        env:
          SOFTHSM2_CONF: ${{ github.workspace }}/softhsm2.conf

      - name: Run unit tests with coverage
        run: make coverage
        env:
          SOFTHSM2_CONF: ${{ github.workspace }}/softhsm2.conf

      # #454: a clean checkout must come out of `make test` (this job's
      # `make coverage`, which is `coverage: test` in the Makefile) exactly as
      # it went in. Before #469, test-web's `npm install` rewrote every
      # package-lock.json and vitest wrote its lcov-report trees into paths
      # git still tracked, so a green gate still left the working tree dirty
      # -- a PR that ran the gates had to be hand-restored before it could be
      # committed, and the noise was large enough to hide a real change in
      # review. #469 fixed the known offenders (`npm ci` everywhere, the
      # coverage trees gitignored and untracked); this step is the regression
      # guard, because a regenerated tracked artifact means the committed
      # artifact is stale -- a PR that trips it would otherwise ship a build
      # that differs from what's in source control. `git diff` catches a
      # tracked file being rewritten; `git status --porcelain` also catches a
      # new untracked file being left behind, which `git diff` alone would
      # miss.
      - name: Fail if make test dirtied the tree (#454)
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error::make coverage (make test) modified tracked files -- see #454"
            exit 1
          fi
          DIRTY=$(git status --porcelain)
          if [ -n "$DIRTY" ]; then
            echo "::error::make coverage (make test) left the tree dirty -- see #454"
            echo "$DIRTY"
            exit 1
          fi

      - name: Calculate coverage
        id: coverage
        run: |
          COVERAGE=$(go tool cover -func=build/coverage/coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "coverage=${COVERAGE}" >> "$GITHUB_OUTPUT"
          echo "Total coverage: ${COVERAGE}%"

      - name: Check coverage threshold
        run: |
          COVERAGE=${{ steps.coverage.outputs.coverage }}
          COVERAGE_INT=$(echo "${COVERAGE}" | awk '{printf "%d", $1}')
          if [ "${COVERAGE_INT}" -lt "${COVERAGE_THRESHOLD}" ]; then
            echo "Coverage ${COVERAGE}% is below threshold ${COVERAGE_THRESHOLD}%"
            exit 1
          else
            echo "Coverage ${COVERAGE}% meets threshold ${COVERAGE_THRESHOLD}%"
          fi

      # coverage-threshold-report pulls in two extra lanes make coverage
      # (above) doesn't run: the tpm2 simulator suite (links -lcrypto) and
      # the pkcs11-tagged suite (SoftHSM2, already installed and initialized
      # by this job's "Install and configure SoftHSM2" step above -- the
      # token directory persists for the rest of this job).
      - name: Install tpm2 simulator coverage dependencies
        run: sudo .github/scripts/apt-deps.sh libssl-dev

      - name: Report per-package coverage (issue #703)
        # Non-blocking: collects packages below 90% for tracking in #704, #705, #706
        # This will be blocking once those issues are resolved
        continue-on-error: true
        run: make coverage-threshold-report
        env:
          SOFTHSM2_CONF: ${{ github.workspace }}/softhsm2.conf

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        continue-on-error: true
        with:
          files: ./build/coverage/coverage.out
          flags: unittests
          name: go-xkms-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      # upload-artifact v4+ refuses to run against any server that is not
      # github.com -- it detects one and reports "not currently supported on
      # GHES", and Gitea presents as such (devops.md §1). Every such step in
      # this file is guarded; the work it captures has already run.
      - name: Upload coverage reports
        if: github.server_url == 'https://github.com'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-reports
          path: |
            build/coverage/coverage.html
            build/coverage/coverage.out
            build/coverage/test.log
          retention-days: 30

      - name: Comment PR with coverage
        # Skip for Dependabot PRs (no write permissions) and continue on error for forks
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        continue-on-error: true
        env:
          COVERAGE: ${{ steps.coverage.outputs.coverage }}
          THRESHOLD: ${{ env.COVERAGE_THRESHOLD }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const coverage = process.env.COVERAGE;
            const threshold = process.env.THRESHOLD;
            const status = parseFloat(coverage) >= parseFloat(threshold) ? '✅' : '❌';

            const comment = `## Coverage Report ${status}

            **Total Coverage**: ${coverage}%
            **Threshold**: ${threshold}%

            ${parseFloat(coverage) >= parseFloat(threshold)
              ? '✅ Coverage meets the required threshold!'
              : '❌ Coverage is below the required threshold. Please add more tests.'}

            [View detailed coverage report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # Job 1b: nested-module tests
  #
  # The root `go test ./...` cannot reach them: sdk/go and xkey are SEPARATE Go
  # modules, so every test under them has been dark in CI since they were
  # split out. That is how the protected-key lifecycle tests added in #26 —
  # the drains, the shutdown latches, the SDK export coverage — could all pass
  # locally while no gate ran a single one of them.
  #
  # Scoped to named packages rather than `./...` ON PURPOSE, and every xkey
  # package with a _test.go file is accounted for below: either it is in a
  # `go test` line, or it is named in the exclusion list of the "xkey unit
  # suites" step with the reason it is not (#147). An exclusion is fine; an
  # exclusion nobody chose is not.
  #
  # This job used to say that "ten packages in the xkey module fail their
  # tests identically on main". Measured (#147): every one of those reds was
  # the DAO codec tag being omitted -- `codec "json" is not supported in this
  # build` -- and with -tags codec_json all 41 of the packages this job had
  # never run were green. The carve-out was a tag omission, not a body of
  # broken tests, so the list grew from 6 package trees to 46.
  nested-module-test:
    name: Nested Module Tests (sdk/go, xkey)
    runs-on: ubuntu-latest
    timeout-minutes: 110  # #1587: ~2x 55m, slowest green (forge API, last 60 CI runs, 2026-10-17)
    # No staging behind lint/build/arch-gates (ci-template v1.15): starts at
    # once; `changes` is needed only for its outputs.
    #
    # Full tier only (TWO-TIER PIPELINE note, top of file): these are the
    # full race-detector suites. An ordinary PR gets `nested-module-build`
    # instead -- sdk/go and xkey still have to COMPILE on every PR, but the
    # full run is reserved for train/* PRs and pushes to main.
    needs: [changes]
    if: >-
      needs.changes.outputs.docs_only != 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ci:full') ||
      needs.changes.outputs.full_tier == 'true')

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Same cgo deps the Unit Tests job installs, for the same reason:
      # libicu-dev (dolthub/go-icu-regex) and libusb-1.0-0-dev (google/gousb
      # via go-qrdb) are unconditional deps of the module graph, and
      # CGO_ENABLED defaults to 1 whenever a C toolchain is present.
      #
      # This job had none, and got away with it: the `go vet -tags ble ./...`
      # step below traverses that graph and passed on our runners regardless
      # (job 19970, zero cgo/header errors in 2.25 MB of log). But "passed"
      # there rests on an undocumented property of the runner image, not on
      # anything this workflow states -- so the same step on a stock
      # ubuntu-latest could fail for an environment omission rather than a
      # code defect. Installing them makes the job say what it needs instead
      # of inheriting it.
      - name: Install cgo dependencies
        run: |
          sudo .github/scripts/apt-deps.sh libicu-dev libusb-1.0-0-dev

      # The whole module, not a hand-picked subset. sdk/go is the public SDK
      # contract every downstream consumer compiles against, and it re-exports
      # internal types by alias, so a change that looks internal can alter the
      # contract with no test here noticing. This step used to run three
      # package trees (130 of its ~1,000 test functions); the other 23 test
      # directories were dark. The root coverage job cannot reach any of it,
      # because sdk/go is a separate Go module.
      #
      # Cost, measured before widening: the full suite under -race is 26
      # packages, all green with no build tags, about one minute of wall time
      # on a development host (the largest package, client/ssh, takes ~17 s),
      # so it is cheaper than the xkey steps below. Nothing is excluded; if a
      # package must be, name it here with the reason.
      # -tags codec_json: go-qrdb's DAO serializes entities through a codec
      # compiled in only by its build tag, so the SDK's DAO-backed stores
      # (e.g. sdk/go/oidc) cannot round-trip without it. Root and xkey tests
      # already run with a codec tag.
      - name: sdk/go tests
        working-directory: sdk/go
        run: go test -race -timeout 60m -v -tags codec_json ./...

      # web/desktop is its own module, so neither the root coverage job nor
      # the steps above reach it. Without this step its tests could fail, or
      # stop compiling, without turning CI red -- which is the same "the gate
      # is honest about what it runs and silent about what it does not" gap
      # this PR is fixing for lint.
      - name: web/desktop tests
        working-directory: web/desktop
        run: go test -race -timeout 60m -v ./...

      # -tags tpm_simulator: pkg/pairing/bridge_enrollment_simulator_test.go
      # proves BridgeConfig.TPM against the in-process go-tpm-tools simulator
      # (#985). Without the tag the file is excluded from the build entirely,
      # so the compile-time proof it carries goes dark, not just unrun.
      - name: xkey lifecycle tests
        working-directory: xkey
        run: go test -race -timeout 60m -v -tags "codec_json tpm_simulator" ./internal/lifecycle/... ./pkg/phone/... ./pkg/pairing/...

      # pkg/oath's FIPS gate tests (#22) run here because `go vet -tags ble
      # ./...` below COMPILES a test but never runs it, and a test that is
      # only compiled cannot fail: 464 lines of gate tests sat in exactly that
      # state. codec_json is required: without it the package's DAO-backed
      # tests fail on "codec json is not supported in this build" rather than
      # on anything about the code. A FIPS refusal that CI never executes is a refusal nobody has
      # checked -- and under GODEBUG=fips140=only the thing being refused is a
      # standard-library PANIC, so the untested direction is a process kill on
      # a user-driven path.
      - name: xkey oath tests
        working-directory: xkey
        run: go test -race -timeout 60m -v -tags codec_json ./pkg/oath/...

      # Every other xkey unit package (#147). Before this step CI executed
      # 2,483 of the module's 13,725 test functions: the 41 packages below had
      # tests that `go vet -tags ble ./...` compiled and no job ran, and a test
      # that is only compiled cannot fail. The set is the security surface of
      # the product -- tokenstore, luks, secretservice, nssdb,
      # pivcert, sshstore, sshlocal, config, audit -- and #182 was
      # an open defect in truststore while its 266 tests sat dark.
      #
      # pkg/ca and pkg/pcr_policy were removed from this list when the
      # packages themselves were deleted upstream (xkey-side CA/PCR-policy
      # dead code cleanup); a stale entry here fails the job with
      # "[setup failed]" the moment `go test` cannot even resolve the import
      # path, before a single test runs. pkg/urlsafety later moved to sdk/go,
      # and pkg/oidc holds no Go files of its own (only its aws and handlers
      # subpackages), so neither is listed.
      #
      # -tags codec_json for the same reason as the step above: the DAO-backed
      # packages (tokenstore 49 tests, oath 30) fail without it
      # on the codec, not on the code. Measured warm at nice 19 on the runner
      # host: 159 CPU-s for the 40 packages, 1.0-2.2x under -race, so about
      # three wall-minutes against this job's 20-minute median.
      #
      # Deliberately NOT in any `go test` line, with the reason:
      #   ./pkg/pkcs11          92 CPU-s (267 under -race) for 34 tests, 37% of
      #                         the whole set's cost, 1.7x the other forty
      #                         combined. Runs nightly (nightly.yml,
      #                         xkey-pkcs11-unit) instead of on every PR.
      #   ./pkg/gui/services    (the CLI's fail-closed fingerprint and the
      #                         logins harness guard live behind it), as
      #                         whole packages (#332): 8,282 test functions,
      #                         of which the named-selector steps this
      #                         replaces ran 27. The "pre-existing failures"
      #                         that justified naming were CI running as
      #                         root (#111); as an unprivileged user both
      #                         packages are green, measured on #332.
      #   ./test/integration/…  14 dirs behind //go:build integration (+linux,
      #                         pkcs11, tpm_simulator, androidemu): they belong
      #                         to `make integration-test`, not to this job.
      #   xkey root, frontend, pkg/gui/icon, pkg/staticpw, pkg/yubikey,
      #   test/e2esupport/sshechod: no test files.
      # Anything with a _test.go that is in neither list is a gap; add it to
      # one of them in the same change that adds the tests.
      #
      # Runs as an UNPRIVILEGED user, deliberately. The runner is root, and
      # root ignores file modes: twelve tests in six of these packages
      # (gadget, gui, ipc, truststore, usb, xhome) assert the permission-denied
      # path -- a read-only parent, a 0000 socket, a mount that must fail --
      # and every one of them passed under root's bypass on the first run of
      # this step, i.e. it asserted nothing. A developer's shell is not root,
      # so the suites are written for that, and this is the one place the
      # gate's environment is made to match rather than the tests made to
      # look away (a root guard is a skip guard). The user shares the module
      # cache the earlier steps populated, read-only, and gets its own build
      # cache; GOTOOLCHAIN=local and GOPROXY=off so a missing toolchain or
      # module fails here, naming itself, instead of trying a download the
      # user cannot write into that cache.
      - name: xkey unit suites
        working-directory: xkey
        run: |
          sudo useradd --create-home --shell /bin/bash xkey-ci
          # The module cache lives under /root, which is 0700, so first grant
          # traverse -- execute, not read -- on each ancestor of the cache.
          # Then hand the cache itself to the user: go takes the per-version
          # .lock file in cache/download even when nothing is downloaded, and
          # those are root's 0644, so a read-only share fails on "open
          # ...v0.1.1.lock: permission denied" at the first import (run 14522).
          # Both changes are inside this job's throwaway container; the steps
          # after this one run as root and read the cache regardless of owner.
          # Populate the cache first: the steps above fetch only what their
          # packages import, and the ble vet step that pulls the whole module
          # graph runs after this one, so with GOPROXY=off below the six
          # packages whose deps nobody had fetched yet (wails, gozxing,
          # go-luks2, sqlite ...) died at setup on the run before this line.
          go mod download
          modcache="$(go env GOMODCACHE)"
          dir="$modcache"
          while [ "$dir" != / ]; do sudo chmod o+x "$dir"; dir="$(dirname "$dir")"; done
          sudo chown -R xkey-ci: "$modcache"
          # sudo exports SUDO_USER/SUDO_UID/SUDO_GID (root, here) into the
          # child, and the CLI honours them by design: a command run through
          # sudo resolves the INVOKING user's home so pair and fido2 share one
          # config (resolveInvokingUserHome). Under root's sudo that pointed
          # the tests at /root, unreachable as xkey-ci, and 44 cmd/xkey/cmd
          # tests failed on "xhome: could not resolve xKey home directory"
          # (run 14873). A developer's shell is not under sudo, so the
          # variables are unset: the tests see a plain user environment.
          as_xkey_ci() {
            sudo --user=xkey-ci --set-home env \
              -u SUDO_USER -u SUDO_UID -u SUDO_GID -u SUDO_COMMAND -u SUDO_HOME \
              PATH="$PATH" \
              GOTOOLCHAIN=local \
              GOMODCACHE="$modcache" \
              GOCACHE=/home/xkey-ci/.cache/go-build \
              GOPROXY=off \
            "$@"
          }
          #
          # ./cmd/xkey/cmd is in THIS line too, not only the -tags ble one
          # below: the !ble build compiles a genuinely different set of
          # source files for every command that ships a BLE stub (e.g.
          # backup_device_stub.go beside backup_device.go) -- the stub's flag
          # registration had silently drifted out of parity with the real
          # command (missing `backup from-device --key-stdin`, a missing
          # `device scan --timeout`), undetected because CI only ever
          # compiled and ran the ble variant of this package (go-xkms#1318).
          # Both tag sets now run here so that drift fails the build again.
          as_xkey_ci go test -race -timeout 60m -tags "codec_json tpm_simulator" -count=1 \
            ./cmd/e2eprobe ./cmd/xkey ./cmd/xkey/cmd \
            ./pkg/agent ./pkg/audit ./pkg/backendregistry ./pkg/backup \
            ./pkg/ccid ./pkg/cdp ./pkg/config ./pkg/gadget \
            ./pkg/gui ./pkg/gui/events ./pkg/ipc ./pkg/keyboard ./pkg/luks \
            ./pkg/nativemsg ./pkg/notify ./pkg/nssdb \
            ./pkg/oidc/aws ./pkg/oidc/handlers \
            ./pkg/pwimport ./pkg/qrgen ./pkg/qrscan ./pkg/secretservice \
            ./pkg/serverregistry ./pkg/shellquote ./pkg/sshlocal ./pkg/sshstore ./pkg/sync \
            ./pkg/tokenstore ./pkg/usb ./pkg/xhome
          # -tags ble: createFIDO2PhoneKeyBackend and the CLI's fail-closed
          # fingerprint tests are ble-only, and the four *HarnessArgv* tests
          # are the logins harness guard (#409). Measured as an unprivileged
          # user (#332): cmd/xkey/cmd 1,761 tests in 35 s, pkg/gui/services
          # 6,521 tests in 130 s, nothing environment-dependent on a host with
          # no BLE adapter and no user session.
          #
          # -tags tpm_simulator: cmd/xkey/cmd/barrier_auto_unseal_test.go
          # drives the auto-unseal path against the in-process simulator
          # (#985); no host TPM or swtpm is touched.
          as_xkey_ci go test -race -timeout 60m -tags "ble codec_json tpm_simulator" -count=1 \
            ./cmd/xkey/cmd ./pkg/gui/services

      # Compile-check EVERY ble-tagged package, tests included.
      #
      # The suite step below runs ./pkg/phone/ only, so without this nothing
      # else under `ble` is compiled by CI at all: `cmd/xkey/cmd`'s ble-tagged
      # test files drifted out of sync with the transport.Client interface and
      # the breakage sat undetected on main (#31). A test file that does not
      # compile is a test that cannot fail, and the compile-time interface
      # assertions those files carry -- the very things meant to catch
      # interface drift -- are inert while the package is unbuildable.
      #
      # `go vet` type-checks tests as well as sources, which is what a plain
      # build misses, and it does not run them -- so it stays honest about what
      # it covers. The two steps are complementary: this one catches drift
      # everywhere under the tag, the next one runs the suite that has one.
      - name: xkey ble tag set vets (build + tests)
        working-directory: xkey
        run: go vet -tags ble ./...

      # The ble-tagged half of pkg/phone holds the peripheral's key lifecycle
      # and is compiled by neither the default build nor the race job above.
      #
      # The WHOLE ble-tagged package, not a named list (#79).
      #
      # The list was correct when written: the full suite was red -- three
      # failures and four data races (#27) -- so naming the passing tests was
      # the only way to get signal without a permanently red job. That suite is
      # green now, so every test not on the list was simply dark, and any test
      # added to this package arrived dark.
      #
      # Under -race, which the named-list step was NOT. All four defects #27
      # found were data races; a non-race run would have reported none of them,
      # and the ble half of pkg/phone is precisely the concurrent code
      # (advertisement lifecycle, connection drain, key release) where they
      # live.
      #
      # No step in this job names tests any more. A -run selector that matches
      # nothing exits 0, so a named list is only as good as the names staying
      # correct, and a helper that asserts the names exist makes a rename loud
      # but cannot make an addition loud: a new test matches no selector and
      # arrives dark. Running the package removes that failure mode at the
      # source. The last two named lists, cmd/xkey/cmd and pkg/gui/services,
      # went whole in #332, and the helper went with them.
      #
      # Scoped to ./pkg/phone/: the other ble-tagged suite, cmd/xkey/cmd, runs
      # whole in the "xkey unit suites" step above as an unprivileged user
      # (#332), and compile coverage for the rest of the tag set is
      # go vet -tags ble ./... (#31), which type-checks those tests without
      # running them.
      #
      # Measured at ~33s on a workstation; if it grows materially, split it
      # rather than going back to naming tests.
      - name: xkey peripheral lifecycle (-race -tags ble)
        working-directory: xkey
        run: go test -race -timeout 60m -tags ble ./pkg/phone/ -count=1

      # The attestation DECISION's own suite. It used to live in cmd/xkey/cmd
      # behind `//go:build ble`, reachable only through the named list above --
      # so the GUI, which makes the same decision, was covered by none of it.
      # The decision moved to pkg/attestation (#130) and its tests came with
      # it, where they run in the ordinary suite for every consumer. Named
      # here anyway because this package is where a silent deletion would be
      # most expensive.
      - name: xkey device attestation decision
        working-directory: xkey
        run: go test -timeout 60m ./pkg/attestation/... -count=1

  # Job 1c: Nested Module Build (fast tier) -- sdk/go, xkey and web/desktop
  # still have to COMPILE on every ordinary PR; `go vet` for all three is
  # already covered on EVERY tier by the `lint` job's `make vet`
  # (LINT_MODULES = . sdk/go xkey web/desktop, see the Makefile), so the one
  # signal missing for a fast-tier PR was "does it still build". The full
  # race-detector suites in `nested-module-test` above are reserved for the
  # full tier (train/* PRs, pushes to main); this job is its cheap PR-tier
  # counterpart, not a replacement for it. PR tier (#1483): it runs on every
  # tier, because CI Gate lets only a full-tier job skip; it is cheap, and
  # web/desktop compiles nowhere else on the full tier.
  nested-module-build:
    name: Nested Module Build (sdk/go, xkey, web/desktop) [pr tier]
    runs-on: ubuntu-latest
    timeout-minutes: 20   # #1587: ~2x 9.4m, slowest green (forge API, last 60 CI runs, 2026-10-17)
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Same cgo deps nested-module-test installs, for the same reason:
      # dolthub/go-icu-regex and google/gousb are unconditional deps of the
      # module graph whenever CGO_ENABLED defaults to 1.
      - name: Install cgo dependencies
        run: |
          sudo .github/scripts/apt-deps.sh libicu-dev libusb-1.0-0-dev

      - name: sdk/go build
        working-directory: sdk/go
        run: go build ./...

      - name: web/desktop build
        working-directory: web/desktop
        run: go build ./...

      # Untagged, matching what a plain `go build` of the module gets: the
      # ble/tpm2/hardware-backend tags are already compile-checked on every
      # tier by the `lint` job's `go vet -tags "$(LINT_TAGS_xkey)"`, and
      # duplicating that here would buy nothing but time.
      - name: xkey build (default tags)
        working-directory: xkey
        run: go build ./...

  # Job 1d: Unit Tests (changed packages) [pr tier] -- an ordinary PR (not
  # train/*, not a push) gets a smoke test scoped to whatever it touched
  # instead of the full `make coverage` run in `test` above: the
  # authoritative, un-scoped suite (with the 89% COVERAGE_THRESHOLD gate)
  # only runs on the full tier, and every PR reaches main only through a
  # train that runs it before the fast-forward. See changed-go-packages.sh
  # for the package selection (changed root-module packages plus a
  # best-effort reverse-dependency expansion) and its fail-open behaviour --
  # a narrower-than-ideal scope here costs a later signal on the train,
  # never a gap in what actually gates main.
  test-changed:
    name: Unit Tests (changed packages) [pr tier]
    runs-on: ubuntu-latest
    timeout-minutes: 45   # #1587: ~2x 21m, slowest green (forge API, last 60 CI runs, 2026-10-17)
    needs: [changes]
    # PR tier (#1483): the job runs on every tier, because CI Gate lets only a
    # full-tier job skip. On the full tier its steps stand down instead: `test`
    # runs every root-module package with the coverage gate there, and CI Gate
    # requires it, so a scoped subset of that run would only repeat it.
    if: needs.changes.outputs.docs_only != 'true'

    # Same cgroup-unaware Go toolchain bound as the `test` job above (see its
    # comment): unbounded GOMAXPROCS OOM-killed pkg/api/rest in the fast tier.
    env:
      GOMEMLIMIT: 10GiB
      GOMAXPROCS: 8

    steps:
      - name: Full tier -- covered by Unit Tests
        if: needs.changes.outputs.full_tier == 'true'
        run: echo "Full tier -- the Unit Tests job runs every root-module package, so there is nothing to scope here."

      - name: Checkout code
        if: needs.changes.outputs.full_tier != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # changed-go-packages.sh diffs against needs.changes.outputs.merge_base,
          # a commit that has to actually be present in this job's own clone
          # (a fresh runner, possibly a different host than the `changes`
          # job ran on) -- same reasoning as the `changes` job's checkout.
          fetch-depth: 0

      - name: Set up Go
        if: needs.changes.outputs.full_tier != 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Same SoftHSM2 setup as the `test` job, for the same reason: the
      # changed-package set can legitimately include pkcs11-backed code.
      # swtpm: pkg/tpm2/vtpm supervises a real swtpm process per tenant, and
      # this job's tpm_simulator-tagged run can include that package.
      - name: Install and configure SoftHSM2
        if: needs.changes.outputs.full_tier != 'true'
        run: |
          sudo .github/scripts/apt-deps.sh libicu-dev libusb-1.0-0-dev swtpm
          # SoftHSM 2.7.0 from its pinned, checksum-verified release, not the
          # distro's 2.6.1, which answers an AES-GCM tag mismatch with the
          # ambiguous CKR_GENERAL_ERROR so PKCS#11 tamper cannot be classified
          # (go-xkms#1418). Installs at the distro's paths.
          sudo .github/scripts/apt-deps.sh build-essential autoconf automake libtool pkg-config libssl-dev
          sudo sh scripts/build-softhsm.sh
          mkdir -p "${GITHUB_WORKSPACE}/softhsm2/tokens"
          cat > "${GITHUB_WORKSPACE}/softhsm2.conf" << EOF
          directories.tokendir = ${GITHUB_WORKSPACE}/softhsm2/tokens
          objectstore.backend = file
          log.level = INFO
          EOF
          softhsm2-util --init-token --slot 0 --label "test-token" --so-pin 1234 --pin 1234
        env:
          SOFTHSM2_CONF: ${{ github.workspace }}/softhsm2.conf

      - name: Install dependencies
        if: needs.changes.outputs.full_tier != 'true'
        run: go mod download

      # pkg/acme/client's device-attest-01 DICE test enrolls the REAL
      # arduino-generic firmware, compiled for the host (go-xkms#737). The
      # simulators come from the arduino-generic module at the version go.mod
      # pins; a missing binary FAILS that test, so this job builds them.
      - name: Build the arduino-generic simulators
        if: needs.changes.outputs.full_tier != 'true'
        env:
          AGSIM_DIR: ${{ github.workspace }}/build/agsim
        run: make agsim

      - name: Determine changed packages
        if: needs.changes.outputs.full_tier != 'true'
        id: pkgs
        env:
          MERGE_BASE: ${{ needs.changes.outputs.merge_base }}
          # Must match the -tags of "Unit tests for changed packages" below,
          # so packages gated behind other tags are left out of the set.
          GO_TEST_TAGS: codec_cbor codec_json codec_msgpack tpm_simulator frost
        run: .github/scripts/changed-go-packages.sh

      # Same tag set as test-go's TEST_TAGS (Makefile), minus the hardware
      # KMS backend tags (pkcs8/awskms/gcpkms/azurekv/pkcs11/vault): this is
      # a fast-tier smoke check on a package subset, not the authoritative
      # suite, and the full backend matrix already runs in `race` on the
      # full tier.
      - name: Unit tests for changed packages
        if: needs.changes.outputs.full_tier != 'true' && steps.pkgs.outputs.packages != ''
        env:
          CGO_ENABLED: 1
          AGSIM_DIR: ${{ github.workspace }}/build/agsim
          SOFTHSM2_CONF: ${{ github.workspace }}/softhsm2.conf
          PACKAGES: ${{ steps.pkgs.outputs.packages }}
        # -p 2: go test runs up to GOMAXPROCS test binaries at once, and under
        # -race the password-vault packages (pkg/api/mcp, pkg/api/rest) each
        # peak near 7 GB, so eight in parallel OOM-killed this job (#1389).
        # PACKAGES is a space-separated list and is split into arguments.
        run: |
          # shellcheck disable=SC2086
          go test -race -p 2 -timeout 25m -tags="codec_cbor codec_json codec_msgpack tpm_simulator frost" $PACKAGES

      - name: No root-module Go changes
        if: needs.changes.outputs.full_tier != 'true' && steps.pkgs.outputs.packages == ''
        run: echo "No root-module .go files changed -- nothing to test here (sdk/go, xkey and web/desktop changes are covered by nested-module-build)."

  # Job 3: Lint
  lint:
    name: Lint
    # Dell-only runners (go-xkms#1553, DS-1849): the job's caches outgrew
    # the disk floor of the smaller fleet hosts.
    runs-on: dells
    # Backstop above golangci-lint's own 30m budget (run.timeout in
    # .golangci.yml, #360/#363), so a genuinely hung linter fails as a job
    # timeout instead of running to the runner's implicit limit. #1587: ~2x
    # the slowest green Lint job, 44m (forge API, last 60 CI runs, 2026-10-17).
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # No setup-go cache (go-xkms#1553). It never restored on this job, so
      # GOMODCACHE and GOCACHE always filled from cold, and the post step then
      # tarred both into the same container: a second copy of the largest
      # thing on the disk, written at the job's peak.
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      # go vet (and golangci-lint below, which type-checks the same graph)
      # need to compile every package reached by `./...`, including cgo
      # packages pulled in unconditionally by the module graph
      # (dolthub/go-icu-regex, google/gousb via go-qrdb) -- not gated by any
      # build tag. CGO_ENABLED defaults to 1 whenever a C toolchain is
      # present, so these headers are required regardless of which backend
      # tags this job cares about.
      - name: Install cgo dependencies
        run: |
          sudo .github/scripts/apt-deps.sh libicu-dev libusb-1.0-0-dev

      # These call the Make targets rather than reimplementing them in YAML,
      # so what CI enforces and what a developer runs locally cannot drift.
      #
      # `make vet` and `make lint` iterate LINT_MODULES: Go tooling does not
      # cross module boundaries, so the previous `go vet ./...` / bare
      # golangci-lint run from the root covered the root module only, and this
      # is a four-module repository (#81). gofmt needs no loop -- it is
      # path-based and already reached every module.
      - name: Run gofmt check
        run: make fmt-check

      - name: Run go vet
        run: make vet

      # Disk use of the three caches this job fills (go-xkms#1553): the
      # module cache, the build cache `make vet` compiled, and golangci-lint's
      # analysis cache. `make lint LINT_CI=1` below reports again after every
      # pass. always(): a run that fails on disk is the one to measure.
      - name: Report cache disk use after go vet
        if: always()
        run: .github/scripts/disk-usage.sh "after make vet"

      - name: Test the cache disk-use report
        run: .github/scripts/disk-usage-test.sh

      # The version gate has its own tests, and they run HERE rather than only
      # on a developer's machine — a guard nothing executes is a guard that can
      # rot into agreement with whatever the code does. They exist because the
      # comparison they cover is easy to write FAILING OPEN: a substring test
      # accepts v11.8.0 for a v1.8.0 pin. Fakes printing the real output
      # formats; no network, no host mutation, under a second.
      - name: Test the pinned-version gate
        run: .github/scripts/require-tool-test.sh

      # `make lint` (actionlint) and `make trivy`/`make trivy-image` must fail
      # closed when their tool is missing, never print a skip and pass
      # (go-xkms#1434). Fakes on a replaced PATH, GOPROXY=off; no network.
      - name: Test the Makefile gates fail closed
        run: .github/scripts/make-gates-test.sh

      # Same reasoning for the apt step every cgo job runs (#342): the script
      # must skip present packages, retry a bounded number of times, and
      # trust dpkg over apt's exit status. Fakes on a replaced PATH; no
      # network, no host mutation, under a second.
      - name: Test the apt dependency step
        run: .github/scripts/apt-deps-test.sh

      # The two-tier pipeline's docs-only/tier classifier (top-of-file
      # TWO-TIER PIPELINE note): every PR and push either gets Go jobs
      # skipped it should not, or has Go jobs run it should not, if this
      # gets it wrong -- so it has its own suite rather than trusting the
      # `changes` job's first real run. Real git in a throwaway repo, no
      # network, no host mutation, well under a second.
      - name: Test the docs-only/tier classifier
        run: .github/scripts/pr-scope-test.sh

      # Same reasoning for the fast tier's changed-package scoping: a wrong
      # answer here either narrows a fast-tier PR's test coverage silently
      # or (less likely, but worse) errors the job outright. Real git plus a
      # fake `go` on a replaced PATH -- see the script's own header for why
      # the reverse-dependency half is faked rather than run against this
      # module's real graph.
      - name: Test the changed-package scoping
        run: .github/scripts/changed-go-packages-test.sh

      # The tier split itself (#1483): every job is in CI Gate, its pr/full
      # tag matches its `if:`, and no PR-tier job needs a full-tier one. It
      # runs here, not only in `test`, because a ci.yml-only change touches
      # no Go package, so test-changed would never select it.
      - name: Test the CI tier gate
        run: make test-buildgates

      # NO NETWORK INSTALL (#189). golangci-lint is baked into the self-hosted
      # runner image at GOLANGCI_LINT_VERSION, in /usr/local/bin. The step this
      # replaces ran `go install ...@v2.12.2` unconditionally, which did not
      # add a tool — it OVERWROTE the image's v2.13.2 with v2.12.2 on every
      # run. Measured on the CI Lint leg: the log printed "golangci-lint has
      # version 2.12.2" on a runner carrying v2.13.2.
      #
      # The install was a network dependency as well as a substitution: every
      # host in this fleet resolves an AAAA record for sum.golang.org and none
      # has a default IPv6 route, and job containers use host networking, so a
      # module fetch intermittently dies with ENETUNREACH when Go's v6->v4
      # fallback does not complete.
      #
      # This does NOT fall back to installing when the tool is missing or the
      # version is wrong. A fallback would reinstate the substitution at exactly
      # the moment the image is wrong, and report success while doing it.
      - name: Require golangci-lint at the pinned version
        run: |
          .github/scripts/require-tool.sh \
            golangci-lint "$GOLANGCI_LINT_VERSION" \
            github.com/golangci/golangci-lint/v2/cmd/golangci-lint

      # `make lint` resolves golangci-lint with `command -v`, so it picks up
      # the baked binary the step above just verified. LINT_CI=1 reports the
      # caches' disk use after every pass and cleans golangci-lint's cache
      # whenever the next pass's tags could not reuse it (Makefile LINT_CI).
      - name: Run golangci-lint
        run: make lint LINT_CI=1

      - name: Report cache disk use after golangci-lint
        if: always()
        run: .github/scripts/disk-usage.sh "after make lint"

      # The xkey agent skill's CLI reference is generated from the cobra
      # tree. This fails when the committed reference is stale, or when
      # SKILL.md cites a command or flag xkey does not have.
      - name: Check xkey agent skill reference
        run: make -C xkey check-skill-reference

      # Public-release readiness gate (go-xkms#1030): no lab addresses,
      # fleet host names or owner workstation paths in tracked files. See
      # scripts/check-public-literals.sh for the pattern list and the
      # CLAUDE.md/AGENTS.md/.claude allowlist.
      - name: Check for internal literals (public-release readiness)
        run: make check-public-literals

  # Split out of Lint (go-xkms#1382): vet, vet-integration, golangci-lint
  # and the secure-analyzer sweep in one job grew past Lint's 60m budget on
  # the slower fleet hosts (vet 17m, vet-integration 23m, lint 15m, then the
  # analyzer), so the job was killed at the limit rather than failing on a
  # finding. These two whole-module sweeps run here, in parallel with Lint.
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 120  # #1587: ~2x 58m, slowest green (forge API, last 60 CI runs, 2026-10-17)
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Same cgo headers as Lint: both sweeps compile the full module graph.
      - name: Install cgo dependencies
        run: |
          sudo .github/scripts/apt-deps.sh libicu-dev libusb-1.0-0-dev

      # The secure-analyzer sweep reads `go vet -vettool` output and fails on
      # any line that is not a securecheck diagnostic, so a cold module cache
      # ("go: downloading ...") fails it, and the aborted module then reports
      # its allowlist entries as stale. Lint's vet steps warmed the cache
      # before this job was split out; download every module up front here.
      - name: Download modules
        run: |
          for m in . sdk/go xkey web/desktop; do (cd "$m" && go mod download); done

      # `make vet` only reaches files that compile untagged (or, for xkey,
      # under LINT_TAGS_xkey) -- every file behind an `integration` (or
      # other suite) build tag is invisible to it, which is how #636/#638
      # broke sdk/go and acme-tpm unnoticed and how the tpm2 idevid/tpmops
      # suites drifted roughly 200 references behind pkg/tpm2/store's
      # current API before anyone tripped over it (go-xkms#650). This is
      # compile-only, one `go vet` per distinct //go:build tag combination
      # under test/integration -- see scripts/vet-integration.sh for why a
      # single tag union is wrong (some suites are mutually exclusive). The
      # suites themselves still run only in the devcontainer.
      - name: Run go vet across test/integration (build-tag compile gate)
        run: make vet-integration

      # go-qrdb's pkg/secure/analyzer enforces the raw-memguard-import,
      # ssh.ParsePrivateKey and sensitive-field rules, but only where its own
      # make target runs -- and nothing in go-qrdb reaches into this
      # repository. Before this it ran nowhere here, so compliance with the
      # three rules was unmeasured (go-xkms#549). The selftest runs first: a
      # sweep whose analyzer failed to build, whose -vettool never started, or
      # whose allowlist swallowed a real finding prints approximately the same
      # "clean" result as a genuinely clean tree, so the gate has to prove it
      # can still find a known violation before its own result is evidence of
      # anything.
      - name: Prove the secure-analyzer gate goes red on a known violation
        run: make secure-analyzer-selftest

      - name: Run the secure-analyzer sweep (go-xkms#549)
        run: make secure-analyzer

  # Job 4: Security Scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15   # #1587: ~2x 7.2m, slowest green (forge API, last 60 CI runs, 2026-10-17)
    # No staging behind lint/build/arch-gates (ci-template v1.15): starts at
    # once; `changes` is needed only for its outputs.
    #
    # Full tier only (TWO-TIER PIPELINE note, top of file).
    needs: [changes]
    if: >-
      needs.changes.outputs.docs_only != 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ci:full') ||
      needs.changes.outputs.full_tier == 'true')
    permissions:
      security-events: write
      contents: read

    # ci-template v1.6: the Go toolchain is cgroup-unaware — in a 16 GB job
    # container it sees the HOST's 24 cores and 94 GB, so gosec ran 24 workers
    # and the GC grew the heap to ~27 GB, swapping 11 GB of anonymous memory
    # and stalling the whole host (memory PSI 98, 43% CPU in iowait; measured
    # 2026-08-18 from the live cgroup). GOMEMLIMIT makes the GC respect the
    # container budget; GOMAXPROCS bounds the worker fan-out.
    env:
      GOMEMLIMIT: 10GiB
      GOMAXPROCS: 8
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install cgo dependencies
        run: |
          sudo .github/scripts/apt-deps.sh libicu-dev libusb-1.0-0-dev

      - name: Verify module integrity
        run: go mod verify

      # NO NETWORK INSTALL (#189), same reason as the lint job: both tools are
      # baked into the runner image at the pinned versions above, and the
      # `go install ...@latest` steps this replaces had two further problems of
      # their own. A failed install skipped the analyser entirely and left a
      # red check carrying NO VERDICT on the code, and `@latest` made the gate
      # non-reproducible: the same commit got scanned by different analyser
      # versions on different days.
      #
      # For gosec the assertion is the deliverable rather than the pin. gosec
      # takes its version from ldflags, not the module path, so
      # `go install ...@v2.29.0` still self-reports `dev` — meaning the job log
      # could not say which scanner produced the result, and `dev` in a log
      # must not be read as "unpinned". The image builds it with -X; the
      # github.com fallback in require-tool.sh does the same.
      - name: Require gosec at the pinned version
        run: |
          .github/scripts/require-tool.sh \
            gosec "$GOSEC_VERSION" \
            github.com/securego/gosec/v2/cmd/gosec \
            -ldflags "-X main.Version=${GOSEC_VERSION}"

      - name: Run gosec security scanner
        # Exclusions (documented in Makefile):
        #   G103: unsafe calls - required for HID ioctls and protobuf generated code
        #   G104: unhandled errors - false positive for hash.Write (never returns error)
        #   G115: Integer overflow conversions - values are bounded by crypto/TPM specs
        #   G304: File path inclusion - internal paths validated at API boundaries
        #   G401: sha1.New() - required for OAEP-SHA1 and RSA-AES-KEY-WRAP-SHA1 (legacy compat)
        #   G407: False positive - gcm.Seal nonce is random (io.ReadFull), not hardcoded
        #   G505: crypto/sha1 import - required for PKCS standards, cert thumbprints, WebAuthn
        run: |
          gosec -concurrency 4 -exclude=G103,G104,G115,G304,G401,G407,G505 \
            -exclude-generated \
            -severity medium \
            -confidence medium \
            -exclude-dir=test -exclude-dir=testdata -exclude-dir=vendor \
            -stdout -verbose=text \
            -fmt sarif -out gosec-results.sarif ./...

      - name: Upload gosec results to GitHub Security
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        if: github.server_url == 'https://github.com'
        with:
          sarif_file: gosec-results.sarif
          category: gosec
      - name: Require govulncheck at the pinned version
        run: |
          .github/scripts/require-tool.sh \
            govulncheck "$GOVULNCHECK_VERSION" \
            golang.org/x/vuln/cmd/govulncheck

      - name: Run govulncheck
        run: govulncheck ./...

  # Job 4b: trivy fs -- dependency CVEs and leaked secrets in the tree
  # (devops.md §8). Scoping mirrors the `trivy` target in the Makefile; keep
  # the two identical. test/ and examples/ do not ship; data/, bin/ and build/
  # are local artifacts. There is no .trivyignore in this repo, so no
  # --ignorefile is passed.
  # Job 5: Build Binaries
  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    timeout-minutes: 35   # #1587: ~2x 17m, slowest green (forge API, last 60 CI runs, 2026-10-17)
    # Runs on BOTH tiers (TWO-TIER PIPELINE note, top of file) -- lint,
    # build and arch-gates run on every tier, and stay unconditional except for the one thing that can
    # legitimately skip them: a docs-only diff has nothing for a build to
    # compile.
    #
    # ONE leg (#1483). This was a three-leg matrix with one leg per BINARY
    # (xkmsctl, xkmsd, xkey), not per platform, so there are no "other
    # platforms" to move to the full tier: every leg was compile coverage a
    # PR needs. One job now builds all three in sequence, sharing one module
    # download and one build cache, for one runner slot instead of three.
    # release.yml owns the per-platform builds.
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install build dependencies
        run: |
          # libicu-dev: github.com/dolthub/go-icu-regex (pulled in transitively
          # via go-qrdb's embedded go-mysql-server) needs unicode/uregex.h to
          # compile under CGO. libusb-1.0-0-dev: github.com/google/gousb
          # (transitively via go-qrdb) needs libusb.h the same way. Both are
          # unconditional dependencies of the module graph, not gated by any
          # of this job's build tags, so every CGO_ENABLED=1 build here needs
          # them regardless of which backend tags are requested.
          # No SoftHSM: building only -- PKCS#11 modules are dlopen()ed at run time.
          sudo .github/scripts/apt-deps.sh libtss2-dev libicu-dev libusb-1.0-0-dev

      - name: Build xkmsctl, xkmsd and xkey with all backends
        env:
          CGO_ENABLED: 1
        run: |
          # Build with ALL backend tags enabled to test full integration
          TAGS="pkcs8,tpm2,awskms,gcpkms,azurekv,pkcs11,vault,frost"
          mkdir -p build
          go build -tags="${TAGS}" -o build/xkmsctl ./cmd/xkmsctl
          go build -tags="${TAGS}" -o build/xkmsd ./cmd/xkmsd
          # xkey is a separate Go module (xkey/go.mod) with its own
          # ./cmd/xkey package -- there is no ./cmd/xkey at the repo root.
          # Building without the production/dev/bindings tags selects
          # xkey/cmd/xkey/gui_disabled.go (CLI-only), so no frontend/GUI
          # toolchain is needed for this sanity build.
          (cd xkey && go build -tags="${TAGS}" -o ../build/xkey ./cmd/xkey)

      # The acme-client GUI is a product surface (Wails desktop,
      # conventions/frontend.md), and NOTHING in this workflow compiled it: its
      # two source files sit behind `//go:build gui`, and a build tag no job
      # ever passes is a directory the toolchain never opens. Both files
      # imported go-xkms/web/packages/client, a path that stopped existing when
      # the frontends moved under pkg/acme/web, and the repo stayed green for
      # months while `go mod tidy` on the ROOT module failed outright with
      # "no matching versions for query latest" (#48).
      #
      # So this is not a build for its own sake, it is the gate that makes the
      # tag stop rotting.
      #
      # `-tags gui` ALONE is not enough, and the first version of this step
      # made that mistake. Wails picks internal/app/app_default_unix.go unless
      # one of `production`, `dev` or `bindings` is set; that fallback's
      # CreateApp just returns "Wails applications will not build without the
      # correct build tags" and its Run is a no-op. The build succeeded, linked
      # neither gtk nor webkit (measured with ldd), compiled no desktop
      # frontend package at all -- and would have produced a binary whose GUI
      # path fails at runtime. A gate that compiles the stub in place of the
      # product is the same defect as a tag nobody passes, one level down.
      #
      # So this builds what ships: production tags, CGO on, the real backend.
      # Verified locally -- `ldd` shows libwebkit2gtk-4.1 and libgtk-3, and
      # `go list -deps` includes wails/v2/internal/frontend/desktop.
      #
      # webkit2_41 is required on Ubuntu 24.04: wails defaults to the
      # webkit2gtk-4.0 pkg-config name, which that release does not ship.
      - name: acme-client GUI toolchain
        run: |
          sudo .github/scripts/apt-deps.sh libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: acme-client compiles with the production GUI tags
        env:
          CGO_ENABLED: 1
        run: |
          go build -tags "gui production webkit2_41" -o /dev/null ./cmd/acme-client
          # `go build` ignores *_test.go entirely, so the build above cannot
          # notice the OTHER half of this defect: an untagged test file
          # referencing a symbol that exists only in the !gui build, which
          # breaks `go test -tags gui` for the whole package while every build
          # stays green. That is what acme_client_test.go was doing, and moving
          # those three tests to gui_nogui_test.go fixed an instance rather
          # than the class.
          #
          # -run '^$' compiles the test binary and runs nothing: the test
          # package has to typecheck under these tags, which is the guarantee,
          # without needing a display or a webview at runtime.
          go test -timeout 20m -run '^$' -tags "gui production webkit2_41" ./cmd/acme-client

      # The step above only typechecks (`-run '^$'`); it has never executed a
      # single gui-tagged test body, so the suites in cmd/acme-client and
      # pkg/acme/gui/... -- including the ones asserting the desktop apps
      # (admin and client) mount their router in-process via the Wails asset
      # handler and open no TCP listener of their own -- have never run in
      # CI. `production` and `webkit2_41` are dropped here: without the
      # `production` tag Wails selects its no-op unix stub (app_default_unix.go),
      # so these tests exercise the App/router construction directly without
      # needing libgtk/libwebkit at all, and adding those tags back would
      # require a real webview for no benefit. `codec_json` is required
      # instead: acme-client's DAO layer resolves accounts through go-qrdb's
      # codec registry, and without it service construction fails at runtime
      # with `codec "json" is not supported in this build`.
      - name: acme-client and GUI-tagged suites run
        run: |
          go test -timeout 20m -tags "gui codec_json" ./cmd/acme-client/... ./pkg/acme/gui/...

      - name: Upload build artifacts
        if: github.server_url == 'https://github.com'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: binaries
          path: |
            build/xkmsctl
            build/xkmsd
            build/xkey
          retention-days: 7
  # Job 5b: Clustering build-tag matrix — the raft-gated clustering code must
  # compile and pass its unit tests in BOTH the default (standalone) and
  # `-tags raft` (clustered) configurations.
  build-raft:
    name: Build & Test (raft tag matrix)
    runs-on: ubuntu-latest
    # #1587: ~2x 13m, slowest green (forge API, last 60 CI runs, 2026-10-17;
    # run 55255's 169m apt hang excluded).
    timeout-minutes: 30
    # No staging behind lint/build/arch-gates (ci-template v1.15): starts at
    # once; `changes` is needed only for its outputs.
    #
    # Full tier only (TWO-TIER PIPELINE note, top of file): this is the raft
    # tag matrix, part of "all tagged backends".
    needs: [changes]
    if: >-
      needs.changes.outputs.docs_only != 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ci:full') ||
      needs.changes.outputs.full_tier == 'true')
    strategy:
      matrix:
        tags: [ "codec_json", "raft codec_json" ]
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # See the "build" job's comment: dolthub/go-icu-regex and google/gousb
      # are unconditional cgo deps of the module graph, not gated by any tag
      # here, so they're needed even for this codec-only tag matrix whenever
      # CGO_ENABLED defaults to 1.
      - name: Install cgo dependencies
        run: |
          sudo .github/scripts/apt-deps.sh libicu-dev libusb-1.0-0-dev

      - name: Build all packages (tags="${{ matrix.tags }}")
        run: go build -tags "${{ matrix.tags }}" ./...

      - name: Vet (tags="${{ matrix.tags }}")
        run: go vet -tags "${{ matrix.tags }}" ./pkg/server/... ./pkg/config/...

      # pkg/cluster/ was removed as part of the clustering-into-pkg/xkms
      # consolidation (git history: service_cluster.go, handlers_cluster.go,
      # etc. were deleted in favor of pkg/xkms/servicer_cluster*.go); this
      # command used to also cover ./pkg/cluster/... but that path no longer
      # exists, so `go test` fails at the setup stage on every run regardless
      # of tag set. pkg/embeddednode/... is the single node builder: its
      # node_cluster.go / node_standalone.go pair is the raft boolean swap, so
      # each leg of this matrix tests a different half of it.
      - name: Test clustering packages (tags="${{ matrix.tags }}")
        run: go test -timeout 15m -tags "${{ matrix.tags }}" ./pkg/config/... ./pkg/xkms/... ./pkg/embeddednode/... -count=1

  # Job 5c: Architecture gates — enforce the layering the campaign established.
  # xkmsctl and xkey must depend only on sdk/go (never go-xkms/pkg/* internals),
  # and nothing may import go-objstore directly: storage goes through go-qrdb.
  arch-gates:
    name: Architecture Gates
    runs-on: ubuntu-latest
    timeout-minutes: 5    # #1587: slowest green 0.7m (forge API, last 60 CI runs, 2026-10-17)
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Gates target PRODUCTION Go (the shipped binary). Test files (_test.go)
      # may legitimately reach into pkg/* for fixtures, and docs are excluded.
      - name: xkmsctl is sdk/go-only (production)
        run: |
          hits=$(grep -rln '"github.com/jeremyhahn/go-xkms/pkg/' --include='*.go' cmd/xkmsctl/ \
                 | grep -v '_test\.go' || true)
          if [ -n "$hits" ]; then
            echo "xkmsctl production code must depend only on sdk/go, found pkg/* imports:"; echo "$hits"; exit 1
          fi
          echo "OK: xkmsctl is sdk/go-only"

      - name: xkey is sdk/go-only (production)
        run: |
          hits=$(grep -rln '"github.com/jeremyhahn/go-xkms/pkg/' --include='*.go' xkey/ \
                 | grep -vE '/xkey/pkg/|_test\.go' || true)
          if [ -n "$hits" ]; then
            echo "xkey production code must depend only on sdk/go, found go-xkms/pkg/* imports:"; echo "$hits"; exit 1
          fi
          echo "OK: xkey is sdk/go-only"

      - name: no direct go-objstore imports (reached only through go-qrdb's storage API)
        run: |
          hits=$(grep -rln '"github.com/jeremyhahn/go-objstore' --include='*.go' pkg/ cmd/ sdk/ test/ || true)
          if [ -n "$hits" ]; then
            echo "go-objstore is reached only through go-qrdb's storage API (qrdbsdk.Storage):"; echo "$hits"; exit 1
          fi
          echo "OK: no stray go-objstore imports"

  # Job 6: Docker Multi-Platform Build with Security Scanning
  docker:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    timeout-minutes: 90   # #1587: ~2x 45m, slowest green (forge API, last 60 CI runs, 2026-10-17)
    needs: [changes]
    # v1.15: no longer waits on security. That edge was ordering only: this
    # job publishes nothing (its push step is `if: false`; release.yml
    # publishes), so there is no artefact or side effect to hold back, and
    # CI Gate fails closed on security either way.
    # Full tier (#1483), like every other expensive job: it was push-only,
    # which put the Trivy gate AFTER main instead of in front of it. It
    # publishes nothing, so running it on a train, a ci:full PR or a
    # dispatch has no side effect. A docs-only diff has no image worth
    # building or scanning.
    if: >-
      needs.changes.outputs.docs_only != 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ci:full') ||
      needs.changes.outputs.full_tier == 'true')
    permissions:
      security-events: write
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # ghcr.io is GitHub's registry. On Gitea, secrets.GITHUB_TOKEN is the
      # LOCAL Gitea Actions token -- it authenticates to nothing on
      # ghcr.io and the login step hard-fails the whole job
      # ("denied: denied", runner-log-proven on task 2899/2900). Guarded like
      # every other GitHub-only step in this file (SARIF uploads etc.).
      - name: Log in to GitHub Container Registry
        if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.server_url == 'https://github.com'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      # docker build does NOT inherit the job environment
      # (dependency-resolution.md §6), so the Gitea fetch credentials the
      # runner injects into this job's shell (GOPRIVATE/GIT_CONFIG_*) have to
      # be staged into a file and handed to buildx as a secret mount. Empty
      # on GitHub Actions (those vars are unset there), which is fine: the
      # Dockerfile's RUN --mount=type=secret is optional and falls back to
      # public resolution.
      - name: Stage Gitea module credentials
        run: |
          umask 077
          : > gomodauth.env
          if [ -n "${GIT_CONFIG_KEY_0:-}" ]; then
            {
              echo "export GOPRIVATE=${GOPRIVATE:-}"
              echo "export GIT_CONFIG_COUNT=${GIT_CONFIG_COUNT:-1}"
              echo "export GIT_CONFIG_KEY_0=${GIT_CONFIG_KEY_0:-}"
              echo "export GIT_CONFIG_VALUE_0=${GIT_CONFIG_VALUE_0:-}"
            } > gomodauth.env
          fi

      - name: Build Docker image for scanning (amd64 only)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: Dockerfile.cli
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=dev
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.repository.updated_at }}
          secret-files: |
            gomodauth=./gomodauth.env
          # type=gha talks to the Actions cache server over HTTP. On Gitea,
          # act_runner advertises that server on an address buildx cannot
          # reach: the job container is on the host network, but buildkit runs
          # in its OWN container on the default bridge, so the build dies on
          # "connect: connection refused" before a single layer is built
          # (runner-log-proven, task 10151/#85). Cache only where the endpoint
          # exists; on Gitea the build runs uncached rather than not at all.
          cache-from: ${{ github.server_url == 'https://github.com' && 'type=gha' || '' }}
          cache-to: ${{ github.server_url == 'https://github.com' && 'type=gha,mode=max' || '' }}

      # SARIF pass, for the Security tab only. trivy-action's setup cannot
      # authenticate to github.com from a Gitea runner, and the code scanning
      # API is GitHub-only, so both steps are guarded. Neither gates -- the
      # gate is the CLI step below, which runs on both servers.
      - name: Run Trivy vulnerability scanner (SARIF for code scanning)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: github.server_url == 'https://github.com'
        with:
          version: v0.75.0
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        if: github.server_url == 'https://github.com'
        with:
          sarif_file: trivy-results.sarif
          category: trivy
      # THE GATE (devops.md §8): every image this repo builds is scanned and a
      # CRITICAL/HIGH finding fails the job, on both servers. Trivy runs from
      # its own image rather than the action, because the action installs
      # itself through a nested checkout that a self-hosted runner resolves
      # against its own server. Reproduce locally with `make trivy-image`.
      # The scanner is pinned to the version nightly.yml installs (#325);
      # bump every trivy pin in ci.yml/release.yml/nightly.yml together.
      - name: Trivy image gate (fail on CRITICAL/HIGH)
        run: |
          # Pull trivy image by digest to ensure exact version
          docker pull "aquasec/trivy:0.75.0@${TRIVY_DIGEST}"

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "aquasec/trivy:0.75.0@${TRIVY_DIGEST}" image \
              --format table \
              --severity CRITICAL,HIGH \
              --ignore-unfixed \
              --exit-code 1 \
              --no-progress \
              "${REGISTRY}/${IMAGE_NAME}:${{ github.sha }}"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          TRIVY_DIGEST: ${{ env.TRIVY_DIGEST }}

      - name: Run Grype vulnerability scanner
        uses: anchore/scan-action@3343887d815d7b07465f6fdcd395bd66508d486a # v3
        id: grype
        continue-on-error: true
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          fail-build: false
          severity-cutoff: high
      - name: Upload Grype results
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        if: github.server_url == 'https://github.com'
        continue-on-error: true
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype

  # Job 7: Race Detector
  race:
    name: Race Detector
    runs-on: ubuntu-latest
    timeout-minutes: 145  # #1587: ~2x 71m, slowest green (forge API, last 60 CI runs, 2026-10-17)
    # No staging behind lint/build/arch-gates (ci-template v1.15): starts at
    # once; `changes` is needed only for its outputs.
    #
    # Full tier only (TWO-TIER PIPELINE note, top of file).
    needs: [changes]
    if: >-
      needs.changes.outputs.docs_only != 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ci:full') ||
      needs.changes.outputs.full_tier == 'true')

    # Same cgroup-unaware Go toolchain bound as the `test` job above (see its
    # comment): unbounded GOMAXPROCS OOM-killed pkg/api/rest in the fast tier.
    env:
      GOMEMLIMIT: 10GiB
      GOMAXPROCS: 8

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install dependencies for hardware backends
        run: |
          # libicu-dev/libusb-1.0-0-dev: see the "build" job's comment --
          # unconditional cgo deps of the module graph (dolthub/go-icu-regex,
          # google/gousb via go-qrdb), needed for any CGO_ENABLED=1 build
          # regardless of tags. swtpm: pkg/tpm2/vtpm supervises a real swtpm
          # process per tenant, and `go test ./...` below includes that package.
          sudo .github/scripts/apt-deps.sh libtss2-dev libicu-dev libusb-1.0-0-dev swtpm
          # SoftHSM 2.7.0 from its pinned, checksum-verified release, not the
          # distro's 2.6.1, which answers an AES-GCM tag mismatch with the
          # ambiguous CKR_GENERAL_ERROR so PKCS#11 tamper cannot be classified
          # (go-xkms#1418). Installs at the distro's paths.
          sudo .github/scripts/apt-deps.sh build-essential autoconf automake libtool pkg-config libssl-dev
          sudo sh scripts/build-softhsm.sh

      - name: Configure SoftHSM2
        run: |
          # Create token directory
          mkdir -p "${GITHUB_WORKSPACE}/softhsm2/tokens"
          # Create SoftHSM2 config
          cat > "${GITHUB_WORKSPACE}/softhsm2.conf" << EOF
          directories.tokendir = ${GITHUB_WORKSPACE}/softhsm2/tokens
          objectstore.backend = file
          log.level = INFO
          EOF
          # Initialize test token
          softhsm2-util --init-token --slot 0 --label "test-token" --so-pin 1234 --pin 1234
          # Verify token was created
          softhsm2-util --show-slots
        env:
          SOFTHSM2_CONF: ${{ github.workspace }}/softhsm2.conf

      # pkg/acme/client's device-attest-01 DICE test enrolls the REAL
      # arduino-generic firmware, compiled for the host (go-xkms#737). The
      # simulators come from the arduino-generic module at the version go.mod
      # pins; a missing binary FAILS that test, so this job builds them.
      - name: Build the arduino-generic simulators
        env:
          AGSIM_DIR: ${{ github.workspace }}/build/agsim
        run: make agsim

      # -timeout 75m, not the 10m default (#1587: above this job's slowest
      # green run, 71m, forge API, last 60 CI runs, 2026-10-17, and below its
      # 145m bound; it was 30m before). The default is a PER-PACKAGE limit,
      # and pkg/pkcs11/module exceeds it on a busy runner: the `pkcs11` tag
      # here (and nowhere else in this file) enables the soft-token suite —
      # ~1400 tests, each login paying an Argon2id derivation at 64 MiB — so
      # the package alone accounts for most of the job. MEASURED, not
      # assumed: on a quiet runner it reports ok at 345s / 355s / 367s
      # (tasks 9158, 9946, 9235) — already 58-61% of the 600s default — and
      # on a loaded one it is killed at exactly 600s (task 10152). This is
      # STARVATION, not a hang or a regression: the runs alternate
      # pass/fail across consecutive commits (successes finish the whole job
      # in 9-15 min, failures burn 22-29 min), and the panic's own goroutine
      # dump shows argon2 mid-computation, not a deadlock. The bound keeps a
      # real hang bounded with ample headroom over the healthy cost.
      # The durable fix is to stop paying production Argon2 cost in tests.
      - name: Run tests with race detector (all backends including FROST)
        env:
          CGO_ENABLED: 1
          AGSIM_DIR: ${{ github.workspace }}/build/agsim
          SOFTHSM2_CONF: ${{ github.workspace }}/softhsm2.conf
        # -p 2: go test runs up to GOMAXPROCS test binaries at once, and under
        # -race the password-vault packages (pkg/api/mcp, pkg/api/rest) each
        # peak near 7 GB, so eight in parallel OOM-killed this job (#1389).
        run: go test -race -p 2 -timeout 75m -tags="pkcs8,awskms,gcpkms,azurekv,pkcs11,vault,codec_cbor,codec_json,codec_msgpack,frost" ./...

  # Job 7b: pkg/tpm2 on the in-process TPM simulator
  #
  # The unit job's package list greps `pkg/tpm2$` OUT (Makefile test-go), so
  # until this job existed no simulator suite ran in CI at all -- not the TCG
  # specification vectors in devid_policy_test.go, not the CSR structure test
  # against section 13.1, not the provisioning fail-closed tests. A
  # specification pinned only on developer machines is not law.
  # `make test-tpm2-simulator` is the single entry point; the suite measures
  # ~90 s on a workstation and the target bounds it at 20 minutes.
  #
  # Does not `need` [lint, build, arch-gates] (no job does since v1.15). It IS a required check
  # (see its entry in ci-gate's needs list below); the paragraph that used
  # to say otherwise here was stale.
  #
  # Full tier only (TWO-TIER PIPELINE note, top of file): part of "all
  # tagged backends" alongside `race` and `build-raft`. Needs `changes` for
  # that gating alone, not for staging.
  tpm2-simulator:
    name: TPM2 Simulator Tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: >-
      needs.changes.outputs.docs_only != 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ci:full') ||
      needs.changes.outputs.full_tier == 'true')
    timeout-minutes: 25   # #1587: ~2x 10.5m, slowest green (forge API, last 60 CI runs, 2026-10-17)

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install dependencies
        run: go mod download

      - name: Install simulator build dependencies
        run: |
          # libssl-dev: go-tpm-tools/simulator compiles the reference TPM
          # with cgo and links it against -lcrypto. libicu-dev and
          # libusb-1.0-0-dev: see the "build" job's comment. swtpm:
          # pkg/tpm2/vtpm supervises a real swtpm process per tenant.
          sudo .github/scripts/apt-deps.sh libssl-dev libicu-dev libusb-1.0-0-dev swtpm

      - name: Run pkg/tpm2 on the simulator
        env:
          CGO_ENABLED: 1
        run: make test-tpm2-simulator

  # Job 8 (FIPS 140-3 gate) IS NOT HERE ON PURPOSE. Do not re-add it without
  # reading go-xkms #23 first.
  #
  # The gate was written on issue/10-fips-gate-only and its CODE half landed in
  # this consolidation -- AES-GCM nonces are generated inside the module
  # boundary, the AEAD auto-selectors return AES-256-GCM in FIPS mode instead
  # of ChaCha20-Poly1305, and the algorithm allowlists are filtered at both
  # validation entry points. #613/#633 and go-xkms#23's second pass closed the
  # go-qrdb SHA-1 blocker (fixed upstream, pkg/role now on SHA-256) and fixed
  # every FIPS-only PANIC this repository's own code caused -- several
  # golang.org/x/crypto and crypto/hmac call sites turned the stdlib's FIPS
  # refusal into a process crash instead of an error; see docs/fips/README.md
  # "Panics the stdlib raises instead of returning an error" -- plus the
  # X25519/ChaCha20-Poly1305/ML-KEM-512 deliberately-non-approved coverage in
  # pkg/crypto/x25519, pkg/crypto/chacha20poly1305 and pkg/quantum/mlkem512.
  #
  # The JOB half is still withheld. #23's second and third passes fixed every
  # test in pkg/encoding/jwe, pkg/keyprovider/symmetric, pkg/ssh/console,
  # pkg/ssh/session, pkg/api/transport/usb, pkg/backend/software, pkg/api/mcp,
  # pkg/xkms (2,643 tests) and the smaller packages the previous version of
  # this comment listed, plus a cross-cutting production bug the work
  # surfaced along the way: the GCMNonceMode field that says which AEAD
  # construction produced a ciphertext (see docs/fips/README.md "Random-nonce
  # GCM for the default Encrypt path") was not threaded through the gRPC,
  # REST or MCP wire transports, so a default (no-explicit-nonce) symmetric
  # Encrypt under fips140=only produced a ciphertext its own matching Decrypt
  # call could not open over any of those three transports. That is fixed at
  # the wire-protocol level, not worked around in tests. Two kinds of failure
  # still remain, measured on this tree under GODEBUG=fips140=only:
  #   1. pkg/pkcs11/module: broader than the authenticated-wrap verbs alone.
  #      PKCS#11 v3.0's CKM_AES_GCM mechanism takes its IV from the caller via
  #      CK_GCM_PARAMS with no random-nonce mode to opt into, so nearly the
  #      whole CKM_AES_GCM mechanism surface is arbitrary-IV GCM -- not only
  #      the wrap verbs -- and most of pkg/testing/pkcs11test's conformance
  #      coverage exercises it (295 failures at last measurement). See
  #      docs/fips/README.md "Integration Points" for the corrected scope.
  #   2. github.com/google/go-tpm v0.9.8 panics -- not errors -- inside its
  #      own TPM2 session machinery under fips140=only, on ordinary,
  #      spec-compliant use: session HMAC authorization (crypto/hmac, a
  #      short or empty auth value is legal TPM2 protocol, not attacker
  #      input) and session parameter encryption (crypto/cipher CFB, which
  #      the TPM2 spec mandates for that purpose). This is not caused by
  #      go-xkms code and is out of scope for this repository to fix; it
  #      blocks pkg/tpm2, pkg/backend/tpm2, pkg/luks, pkg/trust/clusterca and
  #      pkg/xkms's TPM2 registration path, and needs routing upstream the
  #      same way go-qrdb's SHA-1 blocker was. Measured this pass: one such
  #      panic aborts the whole test *binary*, not just the offending test,
  #      so `go test -tags tpm_simulator ./pkg/xkms/...` under fips140=only
  #      silently never runs the majority of the package's 2,643 tests unless
  #      that one test is skipped first -- worse than "N tests fail", and the
  #      reason pkg/xkms's own FIPS coverage above had to be verified with
  #      that test skipped. See docs/fips/README.md "Known blockers outside
  #      this repository's control" for the full finding, including a related
  #      but non-fatal gorilla/websocket SHA-1 panic (recovered by net/http
  #      per-connection, so it fails WebSocket upgrades under fips140=only
  #      rather than crashing the process) and two open architecture
  #      questions for the owner: pkg/ssh/session's intentionally un-pinned
  #      curve25519-sha256 KEX offer, and pkg/api/transport/usb's Noise
  #      handshake being hard-wired to Curve25519 with no FIPS-approved
  #      substitute DH function in the pattern.
  #
  # Landing a required check that is red on arrival is the exact ordering
  # mistake task #98 exists to prevent: a gate is only safe once the code it
  # polices is already compliant. Callers first, gate second.

  # The single required check (devops.md §1). Every job above appears in BOTH
  # the needs list and the results check -- a gate that can pass vacuously is
  # worse than no gate. join(needs.*.result) is deliberately not used: it
  # evaluates empty on Gitea and reports success while jobs fail.
  #
  # TWO-TIER PIPELINE (top-of-file note): a job's `skipped` result is now
  # ambiguous between two causes that must be judged oppositely --
  #   - an upstream need (only `changes` since v1.15) failed and this job
  #     never got a chance to run -- FAIL, same as ever.
  #   - the two-tier/docs-only split deliberately excluded this job from
  #     THIS run (a fast-tier PR skipping a full-tier-only job, or a
  #     docs-only diff skipping every Go job) -- PASS, by design: failing it
  #     would make every fast-tier PR and every docs-only PR permanently
  #     unmergeable, which is the opposite of the point of this file.
  # The step below tells the two apart using needs.changes.outputs, not by
  # guessing from the result alone.
  ci-gate:
    name: CI Gate
    runs-on: ci-gate
    timeout-minutes: 5    # #1587: slowest green 0.2m (forge API, last 60 CI runs, 2026-10-17)
    if: always()
    needs: [changes, test, test-changed, nested-module-test, nested-module-build, lint, static-analysis, security, build, build-raft, arch-gates, docker, race, tpm2-simulator]

    steps:
      - name: Fail closed on any non-success
        env:
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          FULL_TIER: ${{ needs.changes.outputs.full_tier }}
        run: |
          BAD=0

          # check <tier> <job> <result> [docs]   (#1483)
          #
          #   pr    the job runs on every tier. A skip fails the gate.
          #   full  the job runs only on the full tier (push, dispatch, a
          #         train, or a ci:full PR). A skip passes only when the
          #         full tier was not selected.
          #   docs  the job also stands down on a docs-only diff, so a skip
          #         passes when docs_only is true. Lines without it belong to
          #         jobs that run even then.
          #
          # Every job in this file has exactly one line here, and its tag
          # matches its `if:`; internal/buildgates (TestCIGateTiersMatchTheJobs)
          # fails the build otherwise.
          check() {
            case "$3" in
              success) echo "OK   $2";;
              skipped)
                if [ "$1" = full ] && [ "$FULL_TIER" != "true" ]; then
                  echo "SKIP $2 (full-tier job, full tier not selected)"
                elif [ "${4:-}" = docs ] && [ "$DOCS_ONLY" = "true" ]; then
                  echo "SKIP $2 (docs-only diff)"
                else
                  echo "FAIL $2 (skipped, but should have run for this tier -- or its upstream need failed, see changes)"
                  BAD=1
                fi
                ;;
              *) echo "FAIL $2 ($3)"; BAD=1;;
            esac
          }

          check pr   changes             "${{ needs.changes.result }}"
          check pr   lint                "${{ needs.lint.result }}"
          check pr   static-analysis     "${{ needs.static-analysis.result }}"     docs
          check pr   arch-gates          "${{ needs.arch-gates.result }}"
          check pr   build               "${{ needs.build.result }}"               docs
          check pr   nested-module-build "${{ needs.nested-module-build.result }}" docs
          check pr   test-changed        "${{ needs.test-changed.result }}"        docs
          check full test                "${{ needs.test.result }}"                docs
          check full race                "${{ needs.race.result }}"                docs
          check full build-raft          "${{ needs.build-raft.result }}"          docs
          check full nested-module-test  "${{ needs.nested-module-test.result }}"  docs
          check full security            "${{ needs.security.result }}"            docs
          check full tpm2-simulator      "${{ needs.tpm2-simulator.result }}"      docs
          check full docker              "${{ needs.docker.result }}"              docs

          exit $BAD
