name: Release

on:
  push:
    tags:
      - 'v*'
  # RECOVERY PATH (go-xkms#44). A tag push is the normal trigger, but when the
  # pipeline itself is broken the tag is already published and CANNOT be moved
  # to re-fire it -- the module proxy caches a tag and deleting it does not
  # unpublish it (see the create-release comment below). v0.7.5-alpha and
  # v0.7.6-alpha were both stranded exactly this way: correct signed tags, no
  # release object, no binaries, no checksums.
  #
  # Dispatching AT the old tag does not work either: the workflow definition
  # used by a dispatch is the one AT THAT REF, and the stranded tags contain
  # the broken file with no workflow_dispatch trigger and no setup-go. So the
  # target tag arrives as an INPUT, dispatched from a branch that carries the
  # fixed workflow, and every job checks out that tag explicitly.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build a release for, e.g. v0.7.6-alpha. The tag is read, never written.'
        required: true
        type: string

env:
  # The tag this run is releasing. On a tag push github.ref_name IS the tag; on
  # a dispatch it is the branch we were dispatched from, so the input wins.
  # Every version derivation and every checkout below reads THIS, so the two
  # trigger paths cannot disagree about which tag is being released.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  # PINNED (devops.md §9, documented): same reason as ci.yml — Go 1.27.0 broke
  # github.com/cockroachdb/swiss (undefined fastrand64 / hashFn /
  # getRuntimeHasher; toolchain-gated runtime hooks the pinned commit predates).
  # Pinned HERE and not only in ci.yml because a release tag builds through this
  # workflow: an unpinned toolchain would let a green PR produce a broken
  # release from the same tree.
  #
  # Unpin with ci.yml in the Go 1.27.0 wave (company task #121).
  GO_VERSION: '1.26.7'
  REGISTRY: ghcr.io
  IMAGE_NAME_SERVER: jeremyhahn/xkms-server
  IMAGE_NAME_CLI: jeremyhahn/xkms-cli
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: off

permissions:
  contents: write
  packages: write

jobs:
  # Fails a tag whose VERSION file or CHANGELOG heading does not match it
  # (release-versioning.md P4 Option A; same job go-quicraft carries, kept in
  # step with it deliberately). Everything else here depends on this, so a
  # malformed tag fails in seconds rather than after the build matrix.
  #
  # This exists because the drift is real and repeated: go-qrdb's VERSION read
  # 0.5.7-alpha across both v0.5.8-alpha and v0.5.9-alpha, go-quicraft's read
  # 0.6.1-alpha at tag v0.6.2-alpha, and go-xkms itself published v0.7.0-alpha
  # through v0.7.4-alpha with no CHANGELOG entry for any of them. Nothing
  # reconciles VERSION against the tag (release-versioning.md §2 says so
  # outright), so the only place the mismatch can be caught is here.
  #
  # A module tag cannot be retracted -- the proxy caches it and deleting the
  # tag does not unpublish it -- so this runs before anything is created.
  # Only the ROOT tag reaches this workflow: the trigger is 'v*', which does
  # not match refs/tags/sdk/go/v* or refs/tags/xkey/v*.
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 -- the cross-pin step reads the tag namespace to decide
      # which nested modules are released, and a shallow clone has no tags.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      # THE go-xkms#44 DEFECT. The reciprocal-pin step below shells out to
      # `go list -m`, but this job never installed Go: it died with
      # `go: command not found`, exit 127, before any check ran. Because
      # validate is the first job and everything `needs:` it, the whole
      # release pipeline stopped there -- silently, for two releases.
      #
      # It reproduced clean on every developer machine precisely BECAUSE the
      # defect is the job environment and not the script: a host with Go on
      # PATH cannot see it. Do not remove this step to "simplify" the job.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Validate tag against VERSION and CHANGELOG
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "FAIL: tag v$VERSION is not a semantic version"
            exit 1
          fi
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "$FILE_VERSION" != "$VERSION" ]; then
            echo "FAIL: VERSION file says '$FILE_VERSION' but the tag says '$VERSION'"
            exit 1
          fi
          if ! grep -qE "^## \[$VERSION\]" CHANGELOG.md; then
            echo "FAIL: CHANGELOG.md has no '## [$VERSION]' section"
            exit 1
          fi
          echo "OK: tag v$VERSION matches VERSION and CHANGELOG"

      # The reciprocal cross-module pins are the other thing no in-repo check can
      # see. In a repo with nested modules, each go.mod requires its siblings BY
      # VERSION while a local-path `replace` resolves them through the working
      # tree -- so every in-repo build, and all of CI, uses the right code while
      # the recorded requirement rots. It survives `go list`, zip inspection and
      # every local check. go-xkms shipped v0.7.1-alpha pins inside the
      # v0.7.4-alpha tag exactly this way, and a consumer of
      # sdk/go@v0.7.4-alpha was handed go-xkms v0.7.1-alpha. A `replace` cannot
      # hide a grep, so compare the recorded strings.
      #
      # PORTFOLIO-PORTABLE: nothing below names this repository. The root module
      # path comes from `go list -m`, the nested modules are discovered on disk,
      # and which of them are RELEASED is read from the tag namespace (a
      # submodule at dir/ is released iff dir/v* tags exist). Copy this step into
      # any repo with nested modules unchanged; a repo with none passes it
      # trivially. Requires fetch-depth: 0 so the tags are present.
      #
      # Only RELEASED submodules are enforced. An unreleased one is checked out
      # by path and never resolved by version, so demanding it carry the release
      # version would be inventing a pin for something nobody can `go get`. It
      # is still reported, because a v0.0.0-000101... placeholder there is the
      # go-qrdb defect in miniature: harmless while the local `replace` applies,
      # fatal the day the module is published or consumed from outside.
      - name: Validate reciprocal cross-module pins
        run: |
          set -uo pipefail
          VERSION="${RELEASE_TAG#v}"
          # GOWORK=off: inside a workspace `go list -m` prints every module in
          # it and the root path below would be the wrong string.
          ROOT="$(GOWORK=off go list -m)"
          rc=0
          while IFS= read -r modfile; do
            dir="${modfile#./}"; dir="${dir%go.mod}"; dir="${dir%/}"
            if [ -n "$dir" ] && [ -z "$(git tag --list "$dir/v*")" ]; then
              scope="advisory"   # never released under this tag namespace
            else
              scope="required"
            fi
            # Requirements on the root module or any of its submodules.
            # `require (` blocks are indented; `=>` lines are replaces.
            while read -r path ver; do
              [ -n "$path" ] || continue
              if [ "$ver" = "v$VERSION" ]; then
                echo "OK:       $modfile pins $path at $ver"
              elif [ "$scope" = "advisory" ]; then
                echo "ADVISORY: $modfile (unreleased module) pins $path at '$ver'"
              else
                echo "FAIL:     $modfile pins $path at '$ver', expected 'v$VERSION'"
                rc=1
              fi
            done < <(grep -E "^[[:space:]]+($ROOT|$ROOT/[^[:space:]]+) v" "$modfile" \
                     | grep -v '=>' | awk '{print $1, $2}')
          done < <(find . -name go.mod -not -path './vendor/*' -not -path '*/testdata/*' | sort)
          if [ "$rc" -eq 0 ]; then echo "OK: every released cross-pin equals v$VERSION"; fi
          exit $rc
          exit $rc

  create-release:
    name: Create Release
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      # The commit actually being released. NOT github.sha: on a recovery
      # dispatch github.sha is the HEAD of the branch we were dispatched from
      # (main), not the tag's commit, so stamping it would brand every binary
      # with a commit that is not the one it was built from. Resolved from the
      # checked-out RELEASE_TAG instead, and consumed by every build job.
      commit: ${{ steps.get_version.outputs.commit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${RELEASE_TAG#v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          # The tag is checked out, so HEAD is the released commit -- true on
          # both trigger paths, unlike github.sha.
          echo "commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION} at $(git rev-parse HEAD)"

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            echo "First release - generating full changelog"
            CHANGELOG=$(git log --pretty=format:"* %s (%h)" --no-merges)
          else
            echo "Generating changelog from ${PREV_TAG} to ${RELEASE_TAG}"
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"* %s (%h)" --no-merges)
          fi

          # Save changelog to file
          cat > CHANGELOG.md << EOF
          ## What's Changed

          ${CHANGELOG}

          ## Installation

          ### Binary Downloads
          Download platform-specific binaries directly - ready to use immediately!

          **Available Binaries**:
          - \`xkmsctl-${{ steps.get_version.outputs.version }}-{linux,darwin}-{amd64,arm64}\` - Standard CLI
          - \`xkmsd-${{ steps.get_version.outputs.version }}-{linux,darwin}-{amd64,arm64}\` - Standard Server
          - \`xkey-${{ steps.get_version.outputs.version }}-linux-{amd64,arm64}\` - Virtual FIDO2 Device
          - \`xkmsctl-${{ steps.get_version.outputs.version }}-linux-{amd64,arm64}-fips\` - FIPS 140-3 compliant CLI
          - \`xkmsd-${{ steps.get_version.outputs.version }}-linux-{amd64,arm64}-fips\` - FIPS 140-3 compliant Server

          **Quick Start**:
          \`\`\`bash
          # Download and run CLI directly (Linux amd64 example)
          wget https://github.com/${{ github.repository }}/releases/download/v${{ steps.get_version.outputs.version }}/xkmsctl-${{ steps.get_version.outputs.version }}-linux-amd64
          chmod +x xkmsctl-${{ steps.get_version.outputs.version }}-linux-amd64
          ./xkmsctl-${{ steps.get_version.outputs.version }}-linux-amd64 --help
          \`\`\`

          ### Docker Images
          \`\`\`bash
          # Multi-protocol server (REST, gRPC, QUIC, MCP)
          docker pull ghcr.io/jeremyhahn/xkms-server:${{ steps.get_version.outputs.version }}

          # CLI tool
          docker pull ghcr.io/jeremyhahn/xkms-cli:${{ steps.get_version.outputs.version }}
          \`\`\`

          ### Verify Checksums
          \`\`\`bash
          sha256sum -c checksums.txt
          \`\`\`

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${RELEASE_TAG}
          EOF

          cat CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.version, 'alpha') || contains(steps.get_version.outputs.version, 'beta') || contains(steps.get_version.outputs.version, 'rc') }}
          generate_release_notes: false

  build-binaries:
    name: Build Binaries (${{ matrix.platform }}, ${{ matrix.variant }})
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Standard builds
          - platform: linux/amd64
            arch: amd64
            variant: standard
            fips: false
          - platform: linux/arm64
            arch: arm64
            variant: standard
            fips: false
          # FIPS 140-3 compliant builds (Linux only, uses Go's GOFIPS140 mode)
          - platform: linux/amd64
            arch: amd64
            variant: fips
            fips: true
          - platform: linux/arm64
            arch: arm64
            variant: fips
            fips: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.platform }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build binaries in native container
        run: |
          # Create a build script
          cat > build.sh << 'EOF'
          #!/bin/bash
          set -e

          # Install build dependencies. libicu-dev/libusb-1.0-0-dev are cgo
          # build deps of the module graph itself (dolthub/go-icu-regex,
          # google/gousb via go-qrdb), not gated by any backend tag.
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libsofthsm2 \
            libsofthsm2-dev \
            softhsm2 \
            libtss2-dev \
            libicu-dev \
            libusb-1.0-0-dev \
            ca-certificates \
            file \
            libssl-dev \
            git

          # Build information
          VERSION="${VERSION}"
          GOARCH="${GOARCH}"
          WITH_FIPS="${WITH_FIPS}"
          CGO_MODE="1"

          # Handle FIPS builds (uses Go's built-in FIPS 140-3 mode)
          if [ "$WITH_FIPS" = "true" ]; then
            export GOFIPS140=v1.0.0
            # FIPS builds use CGO_ENABLED=0 for pure Go crypto
            CGO_MODE="0"
            # gms_pure_go selects go-mysql-server's non-cgo regex engine
            # (internal/regex/regex_pure.go); without it, the cgo-only
            # variant (which needs github.com/dolthub/go-icu-regex) fails
            # with "build constraints exclude all Go files" under
            # CGO_ENABLED=0 -- this is a required tag whenever cgo is off,
            # not merely an optional one (matches the Makefile's own
            # CLI_BUILD_TAGS).
            BUILD_FLAGS="-tags=pkcs8,awskms,gcpkms,azurekv,vault,gms_pure_go"
            echo "Building FIPS 140-3 compliant binary with GOFIPS140=v1.0.0"
            echo "Note: FIPS builds exclude TPM2/PKCS11 backends (require CGO)"
          else
            # Standard build with all backends
            BUILD_FLAGS="-tags=pkcs8,tpm2,pkcs11,awskms,gcpkms,azurekv,vault,frost"
            echo "Building standard binary with all backends"
          fi

          # Static linking flags (adjust for FIPS builds which don't use CGO)
          if [ "$CGO_MODE" = "0" ]; then
            LDFLAGS="-X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE} -s -w"
          else
            LDFLAGS="-X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE} -s -w -linkmode external -extldflags '-static'"
          fi

          echo "Building for linux/${GOARCH} with CGO_ENABLED=${CGO_MODE}"
          echo "Build flags: ${BUILD_FLAGS}"

          mkdir -p /src/dist

          # Build CLI
          echo "Building xkmsctl..."
          CGO_ENABLED=${CGO_MODE} go build -buildvcs=false -ldflags="${LDFLAGS}" ${BUILD_FLAGS} \
            -o /src/dist/xkmsctl \
            ./cmd/xkmsctl

          # Build multi-protocol Server (supports REST, gRPC, QUIC, MCP)
          echo "Building xkmsd..."
          CGO_ENABLED=${CGO_MODE} go build -buildvcs=false -ldflags="${LDFLAGS}" ${BUILD_FLAGS} \
            -o /src/dist/xkmsd \
            ./cmd/xkmsd

          # Build Virtual FIDO2 Device (Linux only, requires CGO for UHID)
          # Note: xkey is Linux-only due to UHID dependency
          if [ "$CGO_MODE" = "1" ]; then
            echo "Building xkey..."
            # xkey is a separate Go module (xkey/go.mod) with its own
            # ./cmd/xkey package -- there is no ./cmd/xkey at the repo root
            # (same pattern ci.yml's Build Binaries matrix step uses). Without
            # the `cd xkey` this resolves to /src/cmd/xkey, which does not
            # exist: "stat /src/cmd/xkey: directory not found" (task 3598).
            (cd /src/xkey && CGO_ENABLED=1 go build -buildvcs=false -ldflags="${LDFLAGS}" ${BUILD_FLAGS} \
              -o /src/dist/xkey \
              ./cmd/xkey)
          else
            echo "Skipping xkey for FIPS build (requires CGO)"
          fi

          # Verify binaries are statically linked
          echo ""
          echo "Verifying static builds..."
          for binary in /src/dist/*; do
            echo "Checking $binary:"
            file "$binary"
            ldd "$binary" 2>&1 || echo "  ✓ Static binary (no dynamic dependencies)"
            echo ""
          done

          # Set permissions
          chmod +x /src/dist/*
          EOF

          chmod +x build.sh

          # Run build in a native container for the target architecture.
          #
          # NOT `docker run -v $(pwd):/workspace`: $(pwd) here is a path
          # INSIDE THIS JOB CONTAINER (e.g. /workspace/jeremyhahn/go-xkms),
          # but act_runner talks to the HOST's docker daemon over the
          # socket -- the daemon tries to bind-mount that path from ITS OWN
          # filesystem, where it doesn't exist in that shape. Runner-log-
          # proven (task 2893 and every other Build Binaries run):
          #   docker: Error response from daemon: error while creating mount
          #   source path '/workspace/jeremyhahn/go-xkms': mkdir /workspace:
          #   file exists
          # `docker cp` sidesteps this entirely: the CLI (running in this job
          # container, which does have the files) streams them to the daemon
          # over the API rather than asking the daemon to resolve a bind-mount
          # path itself, so it works regardless of where the two filesystems
          # actually live relative to each other.
          #
          # `docker create` (unlike `docker run`) does not reliably forward
          # bare `-e NAME` host-value passthrough, so each credential var is
          # explicitly expanded here (empty string when unset, e.g. on
          # GitHub Actions -- same no-op behavior as before).
          CID=$(docker create \
            --platform=${{ matrix.platform }} \
            -w /src \
            -e VERSION="${{ needs.create-release.outputs.version }}" \
            -e COMMIT="${{ needs.create-release.outputs.commit }}" \
            -e DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -e GOARCH="${{ matrix.arch }}" \
            -e WITH_FIPS="${{ matrix.fips }}" \
            -e GOPRIVATE="${GOPRIVATE:-}" \
            -e GIT_CONFIG_COUNT="${GIT_CONFIG_COUNT:-}" \
            -e GIT_CONFIG_KEY_0="${GIT_CONFIG_KEY_0:-}" \
            -e GIT_CONFIG_VALUE_0="${GIT_CONFIG_VALUE_0:-}" \
            golang:bookworm \
            bash /src/build.sh)
          docker cp . "$CID":/src
          docker start -a "$CID"
          mkdir -p dist
          docker cp "$CID":/src/dist/. ./dist/
          docker rm "$CID" >/dev/null

          # Verify binaries were created
          echo "Build artifacts:"
          ls -lh dist/

      - name: Prepare release assets
        run: |
          # Set variant suffix based on build type
          if [ "${{ matrix.variant }}" = "fips" ]; then
            VARIANT_SUFFIX="-fips"
          else
            VARIANT_SUFFIX=""
          fi

          VERSION="${{ needs.create-release.outputs.version }}"
          ARCH="${{ matrix.arch }}"

          # Create renamed binaries with platform/variant info
          cd dist

          for binary in xkmsctl xkmsd xkey; do
            if [ -f "$binary" ]; then
              # Create binary with full name including platform/arch/variant
              NEW_NAME="${binary}-${VERSION}-linux-${ARCH}${VARIANT_SUFFIX}"
              cp "$binary" "../${NEW_NAME}"

              # Generate SHA256 for individual binary
              cd ..
              sha256sum "${NEW_NAME}" > "${NEW_NAME}.sha256"
              cd dist
            fi
          done

          cd ..

          echo "Created release assets:"
          ls -lh xkmsctl-* xkmsd-* xkey-* 2>/dev/null || ls -lh xkmsctl-* xkmsd-*

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            xkmsctl-${{ needs.create-release.outputs.version }}-linux-${{ matrix.arch }}${{ matrix.variant == 'fips' && '-fips' || '' }}
            xkmsctl-${{ needs.create-release.outputs.version }}-linux-${{ matrix.arch }}${{ matrix.variant == 'fips' && '-fips' || '' }}.sha256
            xkmsd-${{ needs.create-release.outputs.version }}-linux-${{ matrix.arch }}${{ matrix.variant == 'fips' && '-fips' || '' }}
            xkmsd-${{ needs.create-release.outputs.version }}-linux-${{ matrix.arch }}${{ matrix.variant == 'fips' && '-fips' || '' }}.sha256

      - name: Upload xkey release assets
        if: matrix.variant == 'standard'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            xkey-${{ needs.create-release.outputs.version }}-linux-${{ matrix.arch }}
            xkey-${{ needs.create-release.outputs.version }}-linux-${{ matrix.arch }}.sha256

  build-darwin-binaries:
    name: Build Darwin Binaries (${{ matrix.arch }})
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Standard builds (cross-compiled from Linux)
          - arch: amd64
          - arch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build darwin binaries
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          # Standard build without CGO (cross-compiled). gms_pure_go selects
          # go-mysql-server's non-cgo regex engine -- without it the cgo-only
          # variant (github.com/dolthub/go-icu-regex) fails to build under
          # CGO_ENABLED=0. Required, not optional, whenever cgo is off
          # (matches the Makefile's own CLI_BUILD_TAGS).
          #
          # KNOWN REMAINING BLOCKER even with this tag: go-qrdb's
          # pkg/discovery/multicast.go references syscall.SOCK_CLOEXEC /
          # syscall.SOCK_NONBLOCK unconditionally (no GOOS build constraint),
          # which only exist on Linux. Cross-compiling to darwin therefore
          # still fails inside go-qrdb itself; this is an upstream go-qrdb
          # bug, not something fixable from this repo's build tags. See the
          # CI audit report for details.
          BUILD_FLAGS="-tags=pkcs8,awskms,gcpkms,azurekv,vault,gms_pure_go"
          echo "Building for darwin/${{ matrix.arch }} with CGO_ENABLED=0"

          LDFLAGS="-X main.version=${VERSION} -X main.commit=${{ needs.create-release.outputs.commit }} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ) -s -w"

          mkdir -p dist

          echo "Build flags: ${BUILD_FLAGS}"

          # Build CLI
          echo "Building xkmsctl..."
          go build -buildvcs=false -ldflags="${LDFLAGS}" ${BUILD_FLAGS} \
            -o dist/xkmsctl \
            ./cmd/xkmsctl

          # Build Server
          echo "Building xkmsd..."
          go build -buildvcs=false -ldflags="${LDFLAGS}" ${BUILD_FLAGS} \
            -o dist/xkmsd \
            ./cmd/xkmsd

          # Note: xkey is Linux-only (requires UHID)

          # Verify binaries
          echo "Build artifacts:"
          ls -lh dist/
          file dist/*

      - name: Prepare release assets
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          ARCH="${{ matrix.arch }}"

          # Create renamed binaries with platform/arch info
          cd dist

          for binary in xkmsctl xkmsd; do
            if [ -f "$binary" ]; then
              # Create binary with full name including platform/arch
              NEW_NAME="${binary}-${VERSION}-darwin-${ARCH}"
              cp "$binary" "../${NEW_NAME}"

              # Generate SHA256 for individual binary
              cd ..
              sha256sum "${NEW_NAME}" > "${NEW_NAME}.sha256"
              cd dist
            fi
          done

          cd ..

          echo "Created release assets:"
          ls -lh xkmsctl-* xkmsd-*

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            xkmsctl-${{ needs.create-release.outputs.version }}-darwin-${{ matrix.arch }}
            xkmsctl-${{ needs.create-release.outputs.version }}-darwin-${{ matrix.arch }}.sha256
            xkmsd-${{ needs.create-release.outputs.version }}-darwin-${{ matrix.arch }}
            xkmsd-${{ needs.create-release.outputs.version }}-darwin-${{ matrix.arch }}.sha256

  build-docker:
    name: Build Docker Server Image
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ghcr.io is GitHub's registry. On Gitea, secrets.GITHUB_TOKEN is the
      # LOCAL Gitea Actions token -- it authenticates to nothing on ghcr.io
      # and this step hard-fails the whole job before any Dockerfile is even
      # built ("denied: denied", runner-log-proven on task 2899). The scan
      # build below (push: false, load: true) needs no registry auth at all,
      # so guarding only login + the final push keeps that build+scan
      # working on Gitea while skipping what only GitHub can do.
      - name: Log in to GitHub Container Registry
        if: github.server_url == 'https://github.com'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_SERVER }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create Dockerfile for server
        run: |
          # Create a production Dockerfile for the multi-protocol server
          cat > Dockerfile.release << 'EOF'
          # Multi-stage Dockerfile for xkms production deployment
          # Stage 1: Builder
          FROM golang:bookworm AS builder

          ENV GOTOOLCHAIN=auto

          # Install build dependencies. libicu-dev/libusb-1.0-0-dev are cgo
          # build deps of the module graph itself (dolthub/go-icu-regex,
          # google/gousb via go-qrdb), not gated by any backend tag.
          RUN apt-get update && apt-get install -y --no-install-recommends \
              build-essential \
              pkg-config \
              libsofthsm2 \
              libtss2-dev \
              libicu-dev \
              libusb-1.0-0-dev \
              ca-certificates \
              && rm -rf /var/lib/apt/lists/*

          WORKDIR /build

          # Copy go mod files
          COPY go.mod go.sum ./
          COPY sdk/go/go.mod sdk/go/go.sum ./sdk/go/

          # Copy the xkey module files before go mod download (required for
          # the replace directive: go.mod replaces
          # github.com/jeremyhahn/go-xkms/xkey with ./xkey, and go mod
          # download reads that go.mod even though this image never builds
          # xkey itself).
          COPY xkey/go.mod xkey/go.sum ./xkey/

          # In-house modules resolve from Gitea tags (dependency-resolution.md
          # §6). The fetch token arrives as a BuildKit secret, never a build
          # arg or ENV, so it never becomes a layer. The mount is optional by
          # design: with no secret supplied these modules resolve from the
          # public proxy once tags are mirrored (§7).
          RUN --mount=type=secret,id=gomodauth \
              set -eu; \
              if [ -f /run/secrets/gomodauth ]; then . /run/secrets/gomodauth; fi; \
              go mod download

          # Copy source code
          COPY . .

          # Build the server with all backends enabled
          ARG VERSION
          ARG COMMIT
          ARG DATE

          RUN CGO_ENABLED=1 GOOS=linux go build \
              -buildvcs=false \
              -tags="pkcs8,tpm2,pkcs11,awskms,gcpkms,azurekv,vault,frost" \
              -ldflags="-X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE} -s -w" \
              -o /build/xkmsd \
              ./cmd/xkmsd

          # Stage 2: Runtime
          FROM debian:bookworm-slim

          # Install runtime dependencies
          RUN apt-get update && apt-get install -y --no-install-recommends \
              ca-certificates \
              libsofthsm2 \
              softhsm2 \
              libtss2-esys-3.0.2-0 \
              libtss2-tcti-device0 \
              && rm -rf /var/lib/apt/lists/*

          # Create non-root user
          RUN useradd -m -u 1000 xkms

          # Create directories
          RUN mkdir -p /etc/xkms /var/lib/xkms /var/lib/softhsm/tokens && \
              chown -R xkms:xkms /etc/xkms /var/lib/xkms /var/lib/softhsm

          # Copy binary from builder
          COPY --from=builder /build/xkmsd /usr/local/bin/xkmsd

          # Switch to non-root user
          USER xkms

          # Expose ports for all protocols: REST, gRPC, QUIC, MCP
          EXPOSE 8080 8443 9090 9091

          ENTRYPOINT ["/usr/local/bin/xkmsd"]
          CMD ["-config", "/etc/xkms/config.yaml"]
          EOF

      # docker build does NOT inherit the job environment
      # (dependency-resolution.md §6), so the Gitea fetch credentials the
      # runner injects into this job's shell (GOPRIVATE/GIT_CONFIG_*) have to
      # be staged into a file and handed to buildx as a secret mount. Empty
      # on GitHub Actions (those vars are unset there), which is fine: the
      # Dockerfile's RUN --mount=type=secret is optional and falls back to
      # public resolution.
      - name: Stage Gitea module credentials
        run: |
          umask 077
          : > gomodauth.env
          if [ -n "${GIT_CONFIG_KEY_0:-}" ]; then
            {
              echo "export GOPRIVATE=${GOPRIVATE:-}"
              echo "export GIT_CONFIG_COUNT=${GIT_CONFIG_COUNT:-1}"
              echo "export GIT_CONFIG_KEY_0=${GIT_CONFIG_KEY_0:-}"
              echo "export GIT_CONFIG_VALUE_0=${GIT_CONFIG_VALUE_0:-}"
            } > gomodauth.env
          fi

      # devops.md §8: no image reaches a registry unscanned. Built amd64-only
      # and loaded into the local daemon so Trivy can read it; the multi-arch
      # push below shares the same buildx cache, so this costs a load rather
      # than a rebuild.
      - name: Build server image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_SERVER }}:release-scan
          build-args: |
            VERSION=${{ needs.create-release.outputs.version }}
            COMMIT=${{ needs.create-release.outputs.commit }}
            DATE=${{ github.event.repository.updated_at }}
          secret-files: |
            gomodauth=./gomodauth.env
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image gate (fail on CRITICAL/HIGH)
        # --ignore-unfixed matches ci.yml's Docker job gate (09abcaa): base-
        # image CVEs with no available fix (e.g. zlib1g CVE-2023-45853,
        # marked will_not_fix upstream) fail this scan every run otherwise
        # (task 3604).
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
              --format table \
              --severity CRITICAL,HIGH \
              --ignore-unfixed \
              --exit-code 1 \
              --no-progress \
              "${REGISTRY}/${IMAGE_NAME_SERVER}:release-scan"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME_SERVER: ${{ env.IMAGE_NAME_SERVER }}

      # No credentials to push with on Gitea (see the login step above) --
      # skip the push there rather than fail after a successful scan.
      - name: Build and push Docker image
        if: github.server_url == 'https://github.com'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.create-release.outputs.version }}
            COMMIT=${{ needs.create-release.outputs.commit }}
            DATE=${{ github.event.repository.updated_at }}
          secret-files: |
            gomodauth=./gomodauth.env
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-docker-cli:
    name: Build Docker CLI Image
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # See the server-image job's comment: ghcr.io login always fails on
      # Gitea (no valid credential), so it's guarded to GitHub only.
      - name: Log in to GitHub Container Registry
        if: github.server_url == 'https://github.com'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_CLI }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      # docker build does NOT inherit the job environment
      # (dependency-resolution.md §6); see the server job for why this file
      # is staged and handed to buildx as a secret.
      - name: Stage Gitea module credentials
        run: |
          umask 077
          : > gomodauth.env
          if [ -n "${GIT_CONFIG_KEY_0:-}" ]; then
            {
              echo "export GOPRIVATE=${GOPRIVATE:-}"
              echo "export GIT_CONFIG_COUNT=${GIT_CONFIG_COUNT:-1}"
              echo "export GIT_CONFIG_KEY_0=${GIT_CONFIG_KEY_0:-}"
              echo "export GIT_CONFIG_VALUE_0=${GIT_CONFIG_VALUE_0:-}"
            } > gomodauth.env
          fi

      # devops.md §8: no image reaches a registry unscanned. See the server job
      # for why this builds amd64-only and loads rather than pushing.
      - name: Build CLI image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.cli
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_CLI }}:release-scan
          build-args: |
            VERSION=${{ needs.create-release.outputs.version }}
            COMMIT=${{ needs.create-release.outputs.commit }}
            DATE=${{ github.event.repository.updated_at }}
          secret-files: |
            gomodauth=./gomodauth.env
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image gate (fail on CRITICAL/HIGH)
        # --ignore-unfixed matches ci.yml's Docker job gate (09abcaa) and the
        # server image gate above (task 3605).
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
              --format table \
              --severity CRITICAL,HIGH \
              --ignore-unfixed \
              --exit-code 1 \
              --no-progress \
              "${REGISTRY}/${IMAGE_NAME_CLI}:release-scan"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME_CLI: ${{ env.IMAGE_NAME_CLI }}

      # No credentials to push with on Gitea (see the login step above).
      - name: Build and push CLI Docker image
        if: github.server_url == 'https://github.com'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.cli
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.create-release.outputs.version }}
            COMMIT=${{ needs.create-release.outputs.commit }}
            DATE=${{ github.event.repository.updated_at }}
          secret-files: |
            gomodauth=./gomodauth.env
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-checksums:
    name: Create Master Checksums
    needs: [create-release, build-binaries, build-darwin-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the tag name
          TAG_NAME=${RELEASE_TAG}

          # Download all release assets
          gh release download ${TAG_NAME} --pattern "*.sha256" --dir checksums || true

      - name: Create master checksums file
        run: |
          if [ -d checksums ]; then
            cd checksums
            cat *.sha256 > ../checksums.txt 2>/dev/null || echo "No checksums found" > ../checksums.txt
            cd ..
          else
            echo "No checksums directory found" > checksums.txt
          fi

          echo "Master checksums file created:"
          cat checksums.txt

      - name: Upload master checksums to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: checksums.txt

  announce-release:
    name: Announce Release
    needs: [create-release, build-binaries, build-darwin-binaries, build-docker, build-docker-cli]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Update release notes
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: context.ref.replace('refs/tags/', '')
            });

            const currentBody = release.data.body || '';
            const dockerInfo = `\n\n## Docker Images\n\nMulti-protocol server supporting REST, gRPC, QUIC, and MCP:\n\n- \`ghcr.io/jeremyhahn/xkms-server:${{ needs.create-release.outputs.version }}\`\n\nCLI tool:\n\n- \`ghcr.io/jeremyhahn/xkms-cli:${{ needs.create-release.outputs.version }}\`\n\nAll images support both \`linux/amd64\` and \`linux/arm64\` platforms.\n`;

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              body: currentBody + dockerInfo
            });

      - name: Release summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Version: **${{ needs.create-release.outputs.version }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Binaries" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **xkmsctl** - CLI tool" >> $GITHUB_STEP_SUMMARY
          echo "- **xkmsd** - Multi-protocol server (REST, gRPC, QUIC, MCP)" >> $GITHUB_STEP_SUMMARY
          echo "- **xkey** - Virtual FIDO2 device (Linux only)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Linux Binaries" >> $GITHUB_STEP_SUMMARY
          echo "- **Standard** (amd64, arm64) - xkmsctl, xkmsd, xkey" >> $GITHUB_STEP_SUMMARY
          echo "- **FIPS 140-3** (amd64, arm64) - xkmsctl, xkmsd (GOFIPS140=v1.0.0)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### macOS/Darwin Binaries" >> $GITHUB_STEP_SUMMARY
          echo "- **Standard** (amd64, arm64) - xkmsctl, xkmsd" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Docker Images" >> $GITHUB_STEP_SUMMARY
          echo "- Multi-arch (amd64, arm64)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All artifacts include SHA256 checksums for verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Docker Images" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "# Multi-protocol server (REST, gRPC, QUIC, MCP)" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/jeremyhahn/xkms-server:${{ needs.create-release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# CLI tool" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/jeremyhahn/xkms-cli:${{ needs.create-release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
