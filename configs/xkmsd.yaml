# Default xkmsd configuration
# Uses xkms-data/ in current working directory (no root required)

server:
  host: "127.0.0.1"
  rest_port: 8443
  grpc_port: 9443
  quic_port: 8444
  mcp_port: 8445
  # Reverse proxies (IP or CIDR) allowed to name the client in
  # X-Forwarded-For / X-Real-IP for the REST login rate limiter. Empty (the
  # default) trusts none: requests are keyed on the peer IP.
  # trusted_proxies: ["10.0.0.10"]

protocols:
  unix: true
  rest: false
  grpc: false
  quic: false
  mcp: false

unix:
  enabled: true
  socket_path: "xkms-data/xkms.sock"
  socket_mode: "0660"
  protocol: "grpc"

logging:
  level: "info"
  format: "json"

# xkmsd refuses to start unless encryption-at-rest, TLS, authentication and a CA
# are all configured (cmd/xkmsd checks config.ComplianceGaps; there is no
# override). The defaults below are the compliant baseline, and they need no
# manual provisioning: the embedded CA below mints the TLS server certificate on
# first start.
tls:
  enabled: true

auth:
  enabled: true
  type: "composite"

# Encryption at rest. There is no config-sourced boot-time secret: a software
# strategy (passphrase/shamir) never auto-unseals from configuration, matching
# go-qrdb's own SealConfig. `xkmsd init` provisions the barrier; after every
# restart an operator unseals the node through go-qrdb's own barrier
# surface; xkms does not re-expose it.
# For unattended auto-unseal, configure a hardware seal strategy instead
# (barrier.strategy: "tpm2" or "pkcs11").
barrier:
  enabled: true
  strategy: "passphrase"

ratelimit:
  enabled: false

metrics:
  enabled: false
  path: "/metrics"
  port: 9090

health:
  enabled: true
  path: "/health"

datastore:
  # The single global datastore every subsystem stores through -- keys,
  # users, RBAC, CA serials/revocations, ACME state,
  # everything. Durable embedded PebbleDB by default. Use "file" for one
  # plain file per key (human-inspectable), or "memory" for tests -- never
  # in production, it discards all state on restart. mode "standalone"
  # (the default) hosts this datastore in this process; mode "remote"
  # instead dials an already-running qrdb cluster (see datastore.remote).
  engine: "pebble"
  path: "xkms-data/storage"

rng:
  mode: "software"
  fallback_mode: "software"

default_backend: "software"

backends:
  # Software backends (always available, no privileges required)
  software:
    enabled: true
    path: "xkms-data/keys/software"

  pkcs8:
    enabled: true
    path: "xkms-data/keys/pkcs8"

  # Hardware and cloud backends are commented out: this preset is the
  # zero-privilege default, and a backend enabled here that cannot reach its
  # device or credentials aborts daemon startup. Uncomment the one you have.

  # tpm2:
  #   enabled: true
  #   device_path: "/dev/tpmrm0"
  #   # Development without a TPM: use the in-process simulator instead.
  #   use_simulator: false

  # pkcs11:
  #   enabled: true
  #   library: "/usr/lib/softhsm/libsofthsm2.so"
  #   token: "xkms"
  #   pin: ""

  # awskms:
  #   enabled: true
  #   region: "us-east-1"

  # gcpkms:
  #   enabled: true
  #   project_id: ""
  #   location: "us-east1"
  #   key_ring: "xkms"

  # azurekv:
  #   enabled: true
  #   vault_url: ""
  #   # Remaining credentials come from the standard Azure environment variables.
  #   # allow_local_vault_url: false  # dev-only: permits a localhost/127.0.0.1 vault_url

  # vault:
  #   enabled: true
  #   address: "http://localhost:8200"
  #   # Token comes from the VAULT_TOKEN environment variable.

# Embedded certificate authority. This is what makes the secure defaults above
# self-provisioning: on first start xkmsd creates the root below, issues its own
# TLS server certificate from it, and persists both. Subsequent starts load
# them. Point `selected-ca` at a different identity to issue from another root.
ca:
  identity:
    - subject:
        cn: "xkms Root CA"
        organization: "go-xkms"
      valid: 10
      keys:
        - algorithm: "ECDSA"
          ecc:
            curve: "P-256"
          hash: "SHA-256"
          key-type: "CA"
      keystore-type: "software"
      is-root: true
  selected-ca: 0
  default-validity-days: 365
