# Integration test xkmsd configuration
# Uses shared socket volume for devcontainer communication

server:
  host: "0.0.0.0"
  rest_port: 8443
  grpc_port: 9443
  quic_port: 8444
  mcp_port: 8445

protocols:
  unix: true
  rest: true
  grpc: true
  quic: true
  mcp: true

unix:
  socket_path: "/var/run/xkms/xkms.sock"

logging:
  level: "debug"
  format: "json"

tls:
  enabled: true
  server_cn: "xkms-server"
  # "verify" so the composite jwt+mtls auth chain below can actually resolve
  # an mTLS identity: without it the TLS layer never sends a
  # CertificateRequest, so no client (including the first-boot admin
  # credential) can ever present one, and every mTLS/PIV login path silently
  # 401s with "no client certificate provided" regardless of the auth.type
  # below. "verify" (rather than "request") also verifies a presented
  # certificate against the server's client-CA pool, which auth.piv_login
  # requires; it still keeps anonymous connections working for every other
  # suite that shares this fixture, since no certificate is required.
  client_auth: "verify"
  # The first-boot admin credential is issued by `xkmsd init`'s one-shot
  # bootstrap CA, not by this server's embedded CA, so "verify" accepts it only
  # with that CA in the client-CA pool. init writes its bundle beside the
  # credential, before the daemon starts (.devcontainer/docker-compose.yml).
  client_cas:
    - "/data/storage/ca-bundle.pem"
  # The WebAuthn login matrix dials the compose service by its dotted
  # network alias (see the webauthn block below), so the auto-issued
  # server certificate must cover that name for CA-verified clients.
  extra_sans:
    - "xkms-server.test"

auth:
  enabled: true
  type: "composite"
  # Enables POST /api/v1/auth/login/piv: a client certificate the TLS
  # layer verified (PIV slot cert or mTLS identity) whose SPKI thumbprint
  # binds to an enrolled user may exchange it for a session token pair,
  # once it has proven its key is on a smartcard or the deployment has
  # opted out of that proof below.
  piv_login:
    enabled: true
    # The login verification matrix presents software test certificates with
    # no attestation chain, so this fixture opts out of the smartcard proof
    # explicitly; the tokens it mints record attest_level "unattested". A
    # production deployment sets attestation_roots instead.
    allow_unattested: true

# WebAuthn/FIDO2 login ceremonies for the login verification matrix
# (integration-test-logins): xkey drives "auth register" / "auth login"
# against these public ceremony routes with a headless virtual
# authenticator. A WebAuthn RPID must be "localhost" or contain a dot
# (go-webauthn validates it as a domain string), so the compose service
# carries the dotted network alias "xkms-server.test" and the fido2 leg
# dials that alias; rp_id must equal the effective domain of the origin
# the client reports, or every ceremony fails origin validation.
# Registration stays open (the default) so the suite can self-enroll its
# throwaway test user.
webauthn:
  enabled: true
  rp_id: "xkms-server.test"
  rp_origins:
    - "https://xkms-server.test:8443"
  rp_display_name: "xKMS Integration"
  attestation_preference: "none"
  authenticator_attachment: ""
  resident_key: "preferred"
  user_verification: "preferred"
  # Registration is closed by default (go-xkms#184); the suite creates its
  # users through open sign-up, so opt in explicitly.
  allow_public_registration: true

# Encryption at rest. xkmsd refuses to start without this: cmd/xkmsd has no
# --insecure override, so a config that leaves the barrier off cannot serve the
# suite at all. There is no config-sourced boot-time secret any more (matching
# go-qrdb's own SealConfig): a software strategy never auto-unseals from
# configuration.
#
# KNOWN GAP (go-xkms#653): storage.backend is "qrdb" below, so xkmsd's
# ComplianceGaps gate requires a hardware seal strategy to start unattended,
# and this file cannot supply one safely today -- the barrier's own tpm2
# auto-unseal probe would open its own long-lived connection to the same
# single-client swtpm mssim port the (currently disabled) backends.tpm2
# section below documents, reproducing the healthcheck breakage that section
# explains. Until that constraint is resolved (or passphrase/shamir is wired
# into the qrdb node's own barrier behind its sealed-window ceremony, an
# owner-approved architecture decision), this file -- and
# TestShippedDaemonConfigsAreCompliant/xkmsd-integration.yaml -- documents a
# real, expected compliance gap rather than papering over it.
barrier:
  enabled: true
  strategy: "passphrase"
  # `xkmsd init` initializes the barrier on a fresh volume (the compose
  # service's command); the server then boots sealed and serves the sealed
  # window on server.host until .devcontainer/scripts/open-server-barrier.sh
  # (run by the Makefile's devcontainer-server-wait) unseals it from the
  # devcontainer.
  # server.host must stay 0.0.0.0 -- the suites dial xkms-server:9443 over the
  # compose network once it is unsealed -- so the window binds it too.
  # Listening beyond loopback is acceptable here only because this is a
  # throwaway per-run test server: the window is reachable on the run's
  # private xkms-dev compose network (and the runner host's ephemeral debug
  # port mapping), stays open only until the wait step opens it seconds after
  # start, and guards a test passphrase over a disposable data volume. Same
  # precedent as test/integration/cluster/config.node.yaml; a deployment binds
  # the window to loopback or a trusted management interface.
  sealed_window_allow_remote: true

ratelimit:
  enabled: false

metrics:
  enabled: true
  path: "/metrics"
  port: 9090

health:
  enabled: true
  path: "/health"

datastore:
  engine: "pebble"
  mode: "standalone"  # network protocols require the embedded qrdb node (unified API server)
  path: "/data/storage"

rng:
  mode: "software"
  fallback_mode: "software"

default_backend: "software"

# The PKCS#11 module implements the full OASIS mechanism set, which includes the
# SHA-1 signature mechanisms the spec defines and legacy applications still use
# (CKM_SHA1_RSA_PKCS, CKM_ECDSA_SHA1). The module names the digest on the wire
# and the daemon performs it, so the conformance suite can only exercise those
# mechanisms against a daemon that has opted in: xkms refuses the
# collision-broken digests by default, whether or not it is running in FIPS
# mode. This is the documented opt-in, scoped to a container-local test daemon.
#
# The opt-in is a ceiling, not a floor: a FIPS run of the same suite ignores it
# (types.SetAllowWeakHashes refuses to loosen inside the validated module's
# boundary), withholds the non-approved mechanisms from C_GetMechanismList and
# refuses them outright, so nothing tries to use one. Kept in step with
# scripts/start-test-xkmsd.sh, the fallback that serves the same socket when
# the compose xkms-server service is not running.
crypto:
  allow_weak_hashes: true

backends:
  software:
    enabled: true
    path: "/data/keys"

  # SoftHSM2 backend for pkcs11 backend testing
  # Uses SoftHSM installed in the xkms-server container
  pkcs11:
    enabled: true
    library: "/usr/lib/softhsm/libsofthsm2.so"
    token: "xkms-test"
    pin: "1234"

  # TPM 2.0 backend, served by the swtpm software TPM the compose stack runs
  # alongside xkms-server on the xkms-dev network. No hardware TPM is touched:
  # the host's /dev/tpmrm0 is never opened, which is what keeps this safe to
  # run in CI.
  #
  # The address is given as simulator_host / simulator_port, not device_path.
  # A device_path is opened as a file (or a Unix socket when it ends in
  # ".sock") — pkg/backend/tpm2/config.go passes it straight to
  # pkgtpm2.Config.Device, and pkg/tpm2/tpm.go os.OpenFile()s it — so a
  # "tcp://host:port" string there names a file that does not exist and never
  # reaches swtpm. Only the simulator_host pair is translated into the TCP
  # transport (Config.ToTPMConfig maps it to CommandAddress and clears
  # UseSimulator), and it is the pairing test/integration/api/config.test.yaml
  # already uses against the same image. Setting use_simulator with no
  # simulator_host instead selects the in-process go-tpm-tools simulator, which
  # is absent unless the daemon is built with -tags tpm_simulator, and the
  # server refuses to start.
  #
  # enabled is false, and flipping it to true is the only change needed to run
  # the OpenSSL matrix against the TPM. It is off by default because the daemon
  # holds the swtpm connection for its whole lifetime and swtpm's mssim command
  # port serves exactly one client: a second connection blocks instead of being
  # refused, so the compose healthcheck ("nc -z localhost 2321",
  # .devcontainer/docker-compose.yml) stops returning and swtpm is marked
  # unhealthy for as long as the daemon runs. Every integration target gates on
  # "swtpm: condition: service_healthy", so leaving this on takes out the whole
  # suite, not just the TPM lane — observed here as "dependency failed to start:
  # container <project>-swtpm-1 is unhealthy" on targets that never touch the TPM.
  # Fixing the healthcheck to probe something that does not open a second client
  # session is what makes this safe to enable by default.
  tpm2:
    enabled: false
    use_simulator: true
    simulator_host: "swtpm"
    simulator_port: 2321

# Certificate Authority configuration
# Auto-initialized on first startup, loaded on subsequent startups
ca:
  identity:
    - subject:
        cn: "Integration Test Root CA"
        organization: "go-xkms Integration Tests"
        country: "US"
      valid: 10
      keys:
        - algorithm: "ECDSA"
          ecc:
            curve: "P-256"
          hash: "SHA-256"
          signature-algorithm: "ECDSAWithSHA256"
          store: "software"
          key-type: "CA"
      keystore-type: "software"
      is-root: true
      max-path-length: 1
  selected-ca: 0
  default-validity-days: 365
  include-localhost-sans: true
  home-dir: "/data/ca"
