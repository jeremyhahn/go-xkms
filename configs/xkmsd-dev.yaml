# Development xkmsd configuration
# Uses xkms-data/ in current working directory with debug logging

server:
  host: "127.0.0.1"
  rest_port: 8443
  grpc_port: 9443
  quic_port: 8444
  mcp_port: 8445

protocols:
  unix: true
  rest: false
  grpc: false
  quic: false
  mcp: false

unix:
  enabled: true
  socket_path: "xkms-data/xkms.sock"
  socket_mode: "0660"
  protocol: "grpc"

logging:
  level: "debug"
  format: "text"

# xkmsd refuses to start unless encryption-at-rest, TLS, authentication and a CA
# are all configured (cmd/xkmsd checks config.ComplianceGaps; there is no
# override), so a "just run it locally" config still has to be a compliant one.
# Nothing here needs provisioning: the embedded CA at the end of this file mints
# the TLS server certificate on first start.
tls:
  enabled: true

auth:
  enabled: true
  type: "composite"

# Encryption at rest. There is no config-sourced boot-time secret any more
# (matching go-qrdb's own SealConfig): a software strategy never auto-unseals
# from configuration. This file's storage backend is "file" (below), so the
# qrdb node-barrier auto-unseal gate does not apply to it either way; the
# daemon boots with xkms's own barrier sealed, and `xkmsctl barrier init` /
# `xkmsctl barrier unseal` provision and unseal it, exactly as a real
# deployment does.
barrier:
  enabled: true
  strategy: "passphrase"

ratelimit:
  enabled: false

metrics:
  enabled: false
  path: "/metrics"
  port: 9090

health:
  enabled: true
  path: "/health"

datastore:
  engine: "file"
  path: "xkms-data/storage"

rng:
  mode: "software"
  fallback_mode: "software"

default_backend: "software"

backends:
  software:
    enabled: true
    path: "xkms-data/keys"

# Embedded certificate authority. On first start xkmsd creates this root, issues
# its own TLS server certificate from it, and persists both under storage.path;
# subsequent starts load them. A development root -- do not trust it anywhere.
ca:
  identity:
    - subject:
        cn: "xkms Development Root CA"
        organization: "go-xkms"
      valid: 10
      keys:
        - algorithm: "ECDSA"
          ecc:
            curve: "P-256"
          hash: "SHA-256"
          key-type: "CA"
      keystore-type: "software"
      is-root: true
  selected-ca: 0
  default-validity-days: 365
