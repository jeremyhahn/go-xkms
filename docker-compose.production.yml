services:
  # Unified server (all protocols)
  xkms-server:
    # `docker compose build` is unsupported here — see
    # Dockerfile.compose-build-unsupported and docs/deployment/docker.md
    # ("Building Images"). Build with `make docker-build-server` (or
    # `docker-build-all`); this image: tag is what that target produces.
    build:
      context: .
      dockerfile: Dockerfile.compose-build-unsupported
      args:
        MAKE_TARGET: docker-build-server
    image: go-xkms-server:${VERSION:-latest}
    container_name: xkms-server
    ports:
      - "8443:8443"   # REST
      - "9443:9443"   # gRPC
      - "8444:8444/udp" # QUIC
      - "9444:9444"   # MCP
    volumes:
      - xkms-data:/var/lib/xkms
      - ./configs:/etc/xkms:ro
    environment:
      - KEYSTORE_CONFIG=/etc/xkms/config.yaml
    restart: unless-stopped
    networks:
      - xkms-net
    healthcheck:
      # curl -k, matching the image HEALTHCHECK: the listener presents the
      # certificate the daemon mints from its own CA, which no trust store
      # knows about, and the Debian runtime has no busybox wget.
      test: ["CMD", "curl", "-fsSk", "https://localhost:8443/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # REST-only server
  xkms-rest:
    # `docker compose build` is unsupported here — see
    # Dockerfile.compose-build-unsupported and docs/deployment/docker.md
    # ("Building Images"). Build with `make docker-build-rest` (or
    # `docker-build-all`); this image: tag is what that target produces.
    build:
      context: .
      dockerfile: Dockerfile.compose-build-unsupported
      args:
        MAKE_TARGET: docker-build-rest
    image: go-xkms-rest:${VERSION:-latest}
    container_name: xkms-rest
    ports:
      - "8445:8443"
    volumes:
      - xkms-rest-data:/var/lib/xkms
      - ./configs:/etc/xkms:ro
    environment:
      - KEYSTORE_CONFIG=/etc/xkms/config-rest.yaml
    restart: unless-stopped
    networks:
      - xkms-net
    healthcheck:
      # curl -k, matching the image HEALTHCHECK: the listener presents the
      # certificate the daemon mints from its own CA, which no trust store
      # knows about, and the Debian runtime has no busybox wget.
      test: ["CMD", "curl", "-fsSk", "https://localhost:8443/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles:
      - rest-only

  # gRPC-only server
  xkms-grpc:
    # `docker compose build` is unsupported here — see
    # Dockerfile.compose-build-unsupported and docs/deployment/docker.md
    # ("Building Images"). Build with `make docker-build-grpc` (or
    # `docker-build-all`); this image: tag is what that target produces.
    build:
      context: .
      dockerfile: Dockerfile.compose-build-unsupported
      args:
        MAKE_TARGET: docker-build-grpc
    image: go-xkms-grpc:${VERSION:-latest}
    container_name: xkms-grpc
    ports:
      - "9445:9443"
    volumes:
      - xkms-grpc-data:/var/lib/xkms
      - ./configs:/etc/xkms:ro
    environment:
      - KEYSTORE_CONFIG=/etc/xkms/config-grpc.yaml
    restart: unless-stopped
    networks:
      - xkms-net
    healthcheck:
      test: ["CMD", "sh", "-c", "netstat -an | grep 9443 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles:
      - grpc-only

  # QUIC-only server
  xkms-quic:
    # `docker compose build` is unsupported here — see
    # Dockerfile.compose-build-unsupported and docs/deployment/docker.md
    # ("Building Images"). Build with `make docker-build-quic` (or
    # `docker-build-all`); this image: tag is what that target produces.
    build:
      context: .
      dockerfile: Dockerfile.compose-build-unsupported
      args:
        MAKE_TARGET: docker-build-quic
    image: go-xkms-quic:${VERSION:-latest}
    container_name: xkms-quic
    ports:
      - "8446:8444/udp"
    volumes:
      - xkms-quic-data:/var/lib/xkms
      - ./configs:/etc/xkms:ro
    environment:
      - KEYSTORE_CONFIG=/etc/xkms/config-quic.yaml
    restart: unless-stopped
    networks:
      - xkms-net
    healthcheck:
      test: ["CMD", "sh", "-c", "netstat -anu | grep 8444 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles:
      - quic-only

  # MCP-only server
  xkms-mcp:
    # `docker compose build` is unsupported here — see
    # Dockerfile.compose-build-unsupported and docs/deployment/docker.md
    # ("Building Images"). Build with `make docker-build-mcp` (or
    # `docker-build-all`); this image: tag is what that target produces.
    build:
      context: .
      dockerfile: Dockerfile.compose-build-unsupported
      args:
        MAKE_TARGET: docker-build-mcp
    image: go-xkms-mcp:${VERSION:-latest}
    container_name: xkms-mcp
    ports:
      - "9446:9444"
    volumes:
      - xkms-mcp-data:/var/lib/xkms
      - ./configs:/etc/xkms:ro
    environment:
      - KEYSTORE_CONFIG=/etc/xkms/config-mcp.yaml
    restart: unless-stopped
    networks:
      - xkms-net
    healthcheck:
      test: ["CMD", "sh", "-c", "netstat -an | grep 9444 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles:
      - mcp-only

networks:
  xkms-net:
    driver: bridge

volumes:
  xkms-data:
    driver: local
  xkms-rest-data:
    driver: local
  xkms-grpc-data:
    driver: local
  xkms-quic-data:
    driver: local
  xkms-mcp-data:
    driver: local
