openapi: 3.0.3
info:
  title: go-trusted-ca Admin API
  description: |
    Administrative API for managing the go-trusted-ca Certificate Authority.

    This API provides endpoints for:
    - **Tenant Management**: Multi-tenant CRUD operations with isolated CA hierarchies
    - **Certificate Management**: List, view, and revoke certificates
    - **Account Management**: Manage ACME accounts
    - **Order Management**: View certificate orders
    - **External Account Binding (EAB)**: Manage pre-authorized account bindings
    - **Policy Management**: RBAC policy configuration
    - **CA Status/Stats**: Monitor CA health and metrics

    ## Authentication

    All endpoints require authentication via API key or mTLS client certificate.
    Role-based access control (RBAC) determines operation permissions.

    ## Roles

    | Role | Level | Permissions |
    |------|-------|-------------|
    | super-admin | 100 | Full system access, manage all tenants and root CA |
    | admin | 80 | Tenant-level full access, manage intermediate CAs |
    | endorser | 60 | Operator permissions plus EAB management |
    | operator | 40 | Read/write access, no delete or CA management |
    | viewer | 20 | Read-only access |

  version: 1.0.0
  contact:
    name: Automate The Things, LLC
    email: support@automatethethings.com
    url: https://github.com/jeremyhahn/go-trusted-ca
  license:
    name: AGPL-3.0 / Commercial
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: https://localhost:8443
    description: Local development server
  - url: https://ca.example.com
    description: Production server

tags:
  - name: Tenants
    description: Multi-tenant management operations (super-admin/admin)
  - name: Tenant CA
    description: Tenant Certificate Authority operations
  - name: EAB
    description: External Account Binding management
  - name: Policies
    description: RBAC policy management
  - name: Certificates
    description: Certificate management operations
  - name: Accounts
    description: ACME account management
  - name: Orders
    description: ACME order management
  - name: Status
    description: CA status and statistics

security:
  - ApiKeyAuth: []
  - mTLS: []

paths:
  # ============================================================================
  # Tenant Management Endpoints
  # ============================================================================
  /api/v1/tenants:
    get:
      tags:
        - Tenants
      summary: List all tenants
      description: |
        Returns a paginated list of all tenants in the system.
        Requires super-admin role.
      operationId: listTenants
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: status
          in: query
          description: Filter by tenant status
          schema:
            type: string
            enum: [active, suspended, deleted]
      responses:
        '200':
          description: List of tenants
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TenantInfo'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Tenants
      summary: Create a new tenant
      description: |
        Creates a new tenant with optional settings configuration.
        Requires super-admin role.
      operationId: createTenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
            example:
              id: "acme-corp"
              name: "ACME Corporation"
              settings:
                max_certificates: 1000
                max_accounts: 100
                allowed_key_algorithms: ["ECDSA-P256", "ECDSA-P384", "RSA-2048"]
                certificate_validity_days: 90
                require_eab: true
                allow_endorse_01: true
                allow_enroll_01: true
      responses:
        '201':
          description: Tenant created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TenantInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Tenant already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: "ALREADY_EXISTS"
                  message: "Tenant already exists"
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/tenants/{tenantId}:
    get:
      tags:
        - Tenants
      summary: Get tenant by ID
      description: |
        Retrieves detailed information about a specific tenant.
        Admin can view their own tenant; super-admin can view all.
      operationId: getTenant
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
      responses:
        '200':
          description: Tenant details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TenantInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Tenants
      summary: Update tenant
      description: |
        Updates tenant name and/or settings.
        Requires admin role for the tenant.
      operationId: updateTenant
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantRequest'
      responses:
        '200':
          description: Tenant updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TenantInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Tenants
      summary: Delete tenant
      description: |
        Permanently deletes a tenant and all associated resources.
        Requires super-admin role. This operation cannot be undone.
      operationId: deleteTenant
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
      responses:
        '200':
          description: Tenant deleted successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: "Tenant deleted successfully"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/tenants/{tenantId}/status:
    put:
      tags:
        - Tenants
      summary: Update tenant status
      description: |
        Updates the status of a tenant (active, suspended, or deleted).
        Requires super-admin role.
      operationId: updateTenantStatus
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantStatusRequest'
      responses:
        '200':
          description: Tenant status updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: "Tenant status updated successfully"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ============================================================================
  # Tenant CA Endpoints
  # ============================================================================
  /api/v1/tenants/{tenantId}/root-ca:
    post:
      tags:
        - Tenant CA
      summary: Create tenant root CA
      description: |
        Creates a new root Certificate Authority for the tenant.
        The root CA is used to sign intermediate CAs.
        Requires admin role.
      operationId: createTenantRootCA
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRootCARequest'
            example:
              common_name: "ACME Corp Root CA"
              key_algorithm: "ECDSA-P384"
              validity_years: 20
      responses:
        '201':
          description: Root CA created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TenantRootCAInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/tenants/{tenantId}/intermediate-cas:
    get:
      tags:
        - Tenant CA
      summary: List tenant intermediate CAs
      description: |
        Returns all intermediate CAs configured for the tenant.
        Requires admin role.
      operationId: listTenantIntermediateCAs
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
      responses:
        '200':
          description: List of intermediate CAs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TenantIntCAInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Tenant CA
      summary: Create tenant intermediate CA
      description: |
        Creates a new intermediate CA for the tenant.
        The intermediate CA can be signed by either the global root CA or the tenant's root CA.
        Requires admin role.
      operationId: createTenantIntermediateCA
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantIntermediateCARequest'
            example:
              common_name: "ACME Corp Issuing CA"
              parent_type: "tenant"
              purpose: "server-auth"
              key_algorithm: "ECDSA-P256"
              validity_years: 10
              set_as_default: true
      responses:
        '201':
          description: Intermediate CA created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TenantIntCAInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/tenants/{tenantId}/intermediate-cas/{caId}:
    get:
      tags:
        - Tenant CA
      summary: Get intermediate CA by ID
      description: |
        Retrieves details of a specific intermediate CA.
        Requires admin role.
      operationId: getTenantIntermediateCA
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
        - $ref: '#/components/parameters/CAIdParam'
      responses:
        '200':
          description: Intermediate CA details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TenantIntCAInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/tenants/{tenantId}/intermediate-cas/{caId}/status:
    put:
      tags:
        - Tenant CA
      summary: Update intermediate CA status
      description: |
        Updates the status of an intermediate CA.
        Valid statuses: active, pending-rotation, revoked.
        Requires admin role.
      operationId: updateTenantIntermediateCAStatus
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
        - $ref: '#/components/parameters/CAIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIntermediateCAStatusRequest'
      responses:
        '200':
          description: Intermediate CA status updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: "Intermediate CA status updated successfully"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/tenants/{tenantId}/default-intermediate-ca:
    put:
      tags:
        - Tenant CA
      summary: Set default intermediate CA
      description: |
        Sets the default intermediate CA for certificate issuance.
        Requires admin role.
      operationId: setTenantDefaultIntermediateCA
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantDefaultCARequest'
      responses:
        '200':
          description: Default intermediate CA updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: "Default intermediate CA updated successfully"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/tenants/{tenantId}/ca-status:
    get:
      tags:
        - Tenant CA
      summary: Get tenant CA status
      description: |
        Returns the overall CA configuration status for a tenant,
        including root CA, intermediate CAs, and issuance capability.
        Requires admin role.
      operationId: getTenantCAStatus
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
      responses:
        '200':
          description: Tenant CA status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TenantCAStatusInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ============================================================================
  # External Account Binding (EAB) Endpoints
  # ============================================================================
  /api/v1/tenants/{tenantId}/eab:
    get:
      tags:
        - EAB
      summary: List tenant EABs
      description: |
        Returns a paginated list of External Account Bindings for the tenant.
        Requires endorser role or higher.
      operationId: listTenantEABs
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: status
          in: query
          description: Filter by EAB status
          schema:
            type: string
            enum: [pending, used, revoked, expired]
        - name: purpose
          in: query
          description: Filter by EAB purpose
          schema:
            type: string
            enum: [account-binding, endorse-01, enroll-01]
      responses:
        '200':
          description: List of EABs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/EABInfo'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - EAB
      summary: Create tenant EAB
      description: |
        Creates a new External Account Binding for pre-authorized ACME registration.
        The MAC key is returned only once in the response and cannot be retrieved later.

        Supported purposes:
        - **account-binding**: Standard ACME EAB for account creation
        - **endorse-01**: TPM endorsement key binding for device attestation
        - **enroll-01**: Certificate enrollment binding

        Requires endorser role or higher.
      operationId: createTenantEAB
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEABRequest'
            examples:
              account-binding:
                summary: Standard account binding
                value:
                  purpose: "account-binding"
                  external_account_id: "user-12345"
                  contact: ["mailto:user@example.com"]
                  expires_in_days: 7
              endorse-01:
                summary: TPM endorsement binding
                value:
                  purpose: "endorse-01"
                  device_info:
                    device_id: "device-001"
                    manufacturer: "Dell"
                    model: "PowerEdge R750"
                    ek_public_key_hash: "sha256:abc123..."
                    tpm_manufacturer: "Infineon"
                  expires_in_days: 30
              enroll-01:
                summary: Certificate enrollment binding
                value:
                  purpose: "enroll-01"
                  external_account_id: "workload-xyz"
                  metadata:
                    environment: "production"
                    service: "api-gateway"
      responses:
        '201':
          description: EAB created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CreateEABResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/tenants/{tenantId}/eab/{kid}:
    get:
      tags:
        - EAB
      summary: Get EAB by key ID
      description: |
        Retrieves details of a specific External Account Binding.
        Note: The MAC key is not returned in this response.
        Requires endorser role or higher.
      operationId: getTenantEAB
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
        - $ref: '#/components/parameters/KidParam'
      responses:
        '200':
          description: EAB details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EABInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - EAB
      summary: Delete EAB
      description: |
        Deletes an External Account Binding.
        Requires admin role.
      operationId: deleteTenantEAB
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
        - $ref: '#/components/parameters/KidParam'
      responses:
        '200':
          description: EAB deleted successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: "EAB deleted successfully"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ============================================================================
  # Policy Management Endpoints (RBAC)
  # ============================================================================
  /api/v1/tenants/{tenantId}/policies:
    get:
      tags:
        - Policies
      summary: List tenant policies
      description: |
        Returns a paginated list of RBAC policies for the tenant.
        Policies are managed via RBAC.
        Requires admin role.
      operationId: listTenantPolicies
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: purpose
          in: query
          description: Filter by policy label purpose
          schema:
            type: string
      responses:
        '200':
          description: List of policies
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/IAMPolicy'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Policies
      summary: Create tenant policy
      description: |
        Creates a new RBAC policy for the tenant.
        Uses RBAC policy format.
        Requires admin role.
      operationId: createTenantPolicy
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IAMPolicy'
            example:
              apiVersion: "rbac.trustedca.io/v1"
              kind: "Policy"
              metadata:
                name: "allow-server-certs"
                labels:
                  purpose: "certificate-issuance"
              spec:
                description: "Allow issuance of server certificates"
                effect: "allow"
                subjects:
                  - kind: "ServiceAccount"
                    name: "acme-client"
                resources:
                  - kind: "Certificate"
                    name: "*"
                actions:
                  - "issue"
                  - "renew"
                conditions:
                  - attribute: "certificate.type"
                    operator: "equals"
                    value: "server"
      responses:
        '201':
          description: Policy created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/IAMPolicy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Policy already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/tenants/{tenantId}/policies/{policyName}:
    get:
      tags:
        - Policies
      summary: Get policy by name
      description: |
        Retrieves a specific RBAC policy by name.
        Requires admin role.
      operationId: getTenantPolicy
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
        - $ref: '#/components/parameters/PolicyNameParam'
      responses:
        '200':
          description: Policy details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/IAMPolicy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Policies
      summary: Update policy
      description: |
        Updates an existing RBAC policy.
        System-managed policies cannot be modified.
        Requires admin role.
      operationId: updateTenantPolicy
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
        - $ref: '#/components/parameters/PolicyNameParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IAMPolicy'
      responses:
        '200':
          description: Policy updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/IAMPolicy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Policy is immutable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: "POLICY_IMMUTABLE"
                  message: "System-managed policies cannot be modified"
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Policies
      summary: Delete policy
      description: |
        Deletes an RBAC policy.
        System-managed policies cannot be deleted.
        Requires admin role.
      operationId: deleteTenantPolicy
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
        - $ref: '#/components/parameters/PolicyNameParam'
      responses:
        '200':
          description: Policy deleted successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: "Policy deleted successfully"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Policy is immutable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ============================================================================
  # Certificate Management Endpoints
  # ============================================================================
  /admin/certificates:
    get:
      tags:
        - Certificates
      summary: List certificates
      description: |
        Returns a paginated list of all issued certificates.
        Requires viewer role or higher.
      operationId: listCertificates
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: status
          in: query
          description: Filter by certificate status
          schema:
            type: string
            enum: [valid, revoked, expired]
        - name: subject
          in: query
          description: Filter by subject (partial match)
          schema:
            type: string
      responses:
        '200':
          description: List of certificates
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CertificateInfo'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/certificates/expiring:
    get:
      tags:
        - Certificates
      summary: List expiring certificates
      description: |
        Returns certificates that will expire within the specified number of days.
        Requires viewer role or higher.
      operationId: listExpiringCertificates
      parameters:
        - name: days
          in: query
          description: Number of days to look ahead (default 30)
          schema:
            type: integer
            default: 30
            minimum: 1
            maximum: 365
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: List of expiring certificates
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CertificateInfo'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/certificates/{serial}:
    get:
      tags:
        - Certificates
      summary: Get certificate by serial number
      description: |
        Retrieves detailed information about a specific certificate.
        Requires viewer role or higher.
      operationId: getCertificate
      parameters:
        - $ref: '#/components/parameters/SerialParam'
      responses:
        '200':
          description: Certificate details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CertificateInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/certificates/{serial}/revoke:
    post:
      tags:
        - Certificates
      summary: Revoke certificate
      description: |
        Revokes a certificate with an optional reason.
        Requires admin role.
      operationId: revokeCertificate
      parameters:
        - $ref: '#/components/parameters/SerialParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeRequest'
            example:
              reason: "keyCompromise"
      responses:
        '200':
          description: Certificate revoked successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: "Certificate revoked successfully"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ============================================================================
  # Account Management Endpoints
  # ============================================================================
  /admin/accounts:
