# trivy secret-scanner config (CUSTOMIZE, go-xkms). ci.yml's `trivy image`
# on the integration image passes it as --secret-config.
#
# The integration image carries the third-party Go module cache at
# /gomodcache (build/docker/devcontainer/Dockerfile, GOMODCACHE). Upstream
# test fixtures there (a sample key in labstack/echo's _fixture/certs, a
# documented example SAS URL in aws-sdk-go) match trivy's secret rules but are
# not this repository's secrets. This allow-rule exempts that path from the
# SECRET scanner only: the vulnerability scanner still reads /gomodcache, and a
# secret anywhere else in the image (the repository's own /src layer included)
# still fails the scan.
allow-rules:
  - id: third-party-go-module-cache
    description: Upstream fixtures in the image's Go module cache, not repository secrets
    path: ^/?gomodcache/
