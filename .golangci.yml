# golangci-lint v2 configuration for go-xkms.
#
# devops.md §8 makes six linters mandatory: errcheck, staticcheck, unused,
# ineffassign, misspell and gocritic. The first four arrive with the "standard"
# default set (identical to golangci-lint's zero-config default); misspell and
# gocritic are enabled explicitly below. None of them may be disabled.
#
# Two scoped exclusions, each with a reason:
#
#   - errcheck is not enforced inside _test.go files. The overwhelming majority
#     of findings there are unactionable cleanup/setup calls (Close, Setenv/
#     Unsetenv, Write, Encode) whose failure cannot change a test outcome.
#     errcheck stays strict for all production code, where an unchecked error is
#     a real defect.
#
#   - gocritic is not enforced in examples/ or in tests. examples/ is
#     documentation that happens to compile: it is written for readability, and
#     rewriting it to satisfy performance checks makes it worse at its job.

# Issue output caps: UNLIMITED, decided rather than inherited (#225).
#
# golangci-lint applies three output filters by default, and this file used to
# set none of them, so the gate reported a FLOOR rather than a count:
#
#   max-same-issues        3   -- per identical message text
#   max-issues-per-linter  50
#   uniq-by-line           true -- only the first finding on a given line
#
# The caps never produced a false green: exit-code is 1 while any issue
# survives filtering, and a filter can only reduce a printed count, never take
# one from >=1 to 0. What they distort is the reported EXTENT, and that costs
# real time twice over. A family sharing one message prints three at a time, so
# fixing what was printed and pushing yields three more -- indistinguishable
# from a regression to whoever is watching, at a full CI cycle per round on a
# runner that is the binding constraint. And work gets sized against the
# printed number: the v2.12.2 -> v2.13.2 bump (#189) was scoped against 14
# SA1019 findings that were themselves capped.
#
# Unlimited rather than a larger bound, because any bound reintroduces exactly
# that failure the moment a family exceeds it, and a number that is sometimes a
# count and sometimes a floor cannot be reasoned about. Readability is not the
# constraint worth optimising here: the gate is green, so the everyday output
# is empty, and the run that prints hundreds is the run that most needs to show
# them all.
#
# uniq-by-line is included for the same reason. It is a different filter --
# deduplication by location rather than a count -- but it hides a second,
# DIFFERENT finding on a line that already has one, which is the same defect in
# a different costume.
#
# Measured with the runner's golangci-lint v2.13.2 before changing anything:
# uncapping reveals no hidden findings. Root, sdk/go and web/desktop each
# report "0 issues." capped and uncapped; xkey's non-usb subtrees likewise.
# So this change cannot turn the gate red -- it only makes the next backlog
# report its true size the first time rather than the third.
issues:
  max-same-issues: 0
  max-issues-per-linter: 0
  uniq-by-line: false

version: "2"

linters:
  default: standard
  enable:
    - misspell
    - gocritic
  settings:
    gocritic:
      # Diagnostics and performance only. The style and opinionated tags flag
      # rewrites rather than defects, and at this codebase's size they would
      # bury the diagnostics this gate exists for.
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        # Both demand changing exported signatures across the whole API
        # surface; that is an API decision, not a lint fix.
        - hugeParam
        - rangeValCopy
  exclusions:
    generated: lax
    rules:
      # Test files: cleanup/setup error returns are unactionable noise.
      - path: _test\.go
        linters:
          - errcheck
          - gocritic
      # Examples are documentation first.
      - path: examples/
        linters:
          - gocritic
