# golangci-lint v2 configuration for go-xkms.

# Issue output caps: unlimited.
issues:
  max-same-issues: 0
  max-issues-per-linter: 0
  uniq-by-line: false

version: "2"

# Findings report path, line and message only, never the source line.
output:
  formats:
    text:
      path: stdout
      print-issued-lines: false

# Lint budget: 30m of wall clock, shared by every caller.
run:
  timeout: 30m

linters:
  default: standard
  enable:
    - misspell
    - gocritic
    # forbidigo carries exactly one rule; see its settings.
    - forbidigo
    # nolintlint: every //nolint directive must name its linter and give a reason.
    - nolintlint
    # err113 is not enabled repository-wide yet.
  settings:
    forbidigo:
      forbid:
        # Identity.HasRole is go-qrdb's, so it cannot be removed here.
        - pattern: '\.HasRole$'
          msg: "compares a role name against role identifiers (go-xkms#1074); use auth.Authorizer, or auth.HoldsSystemRole for role membership"
    gocritic:
      # Diagnostics and performance only.
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        # Both would change exported signatures across the API.
        - hugeParam
        - rangeValCopy
    nolintlint:
      # A //nolint must name its linter and explain itself.
      require-explanation: true
      require-specific: true
  exclusions:
    generated: lax
    rules:
      # Test files: cleanup/setup error returns are unactionable noise.
      - path: _test\.go
        linters:
          - errcheck
          - gocritic
      # Examples are documentation first.
      - path: examples/
        linters:
          - gocritic
