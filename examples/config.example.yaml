# Example configuration for xkms server
#
# By default, xkmsd only listens on Unix socket for local IPC.
# Enable REST, gRPC, QUIC, or MCP protocols as needed for remote access.

server:
  host: "0.0.0.0"
  rest_port: 8443
  grpc_port: 9443
  quic_port: 8444
  mcp_port: 9444

# Protocol settings
# Unix socket is enabled by default for local CLI communication.
# Enable network protocols only when remote access is required.
protocols:
  unix: true           # Local Unix socket (default: true)
  rest: false          # REST/HTTP API (enable for remote access)
  grpc: false          # gRPC API (enable for remote access)
  quic: false          # QUIC/HTTP3 API (enable for remote access)
  mcp: false           # MCP JSON-RPC API (enable for AI/LLM integration)

# Unix socket configuration
unix:
  socket_path: "/var/run/xkms/xkms.sock"
  socket_mode: "0660"  # File permissions for the socket

logging:
  level: "info"        # debug, info, warn, error
  format: "json"       # json, text

tls:
  enabled: true
  cert_file: "/path/to/cert.pem"
  key_file: "/path/to/key.pem"
  ca_file: "/path/to/ca.pem"  # Optional, for mTLS
  min_version: "1.3"  # 1.0, 1.1, 1.2, 1.3

  # Client certificate policy. "require_and_verify" is what makes the mTLS
  # authenticator below enforcing: every client must present a certificate
  # issued by one of the CAs in client_cas.
  client_auth: "require_and_verify"  # none, request, require, verify, require_and_verify
  client_cas:
    - "/path/to/client-ca.pem"

# Authentication
#
# Authenticator selection is fail-closed: an unknown type, or a type whose
# required companion configuration is missing, aborts startup instead of
# serving requests anonymously.
#
#   mtls      - client certificate identity. Requires tls.enabled: true.
#   jwt       - bearer tokens. Requires auth.jwt.public_key_file.
#   adaptive  - unauthenticated only while no user exists, then delegates to
#               the required authenticator. Requires auth.jwt.public_key_file,
#               because the login/WebAuthn ceremony issues JWTs.
#   composite - chains several methods. Requires auth.composite.methods.
#   noop      - no authentication at all. xkmsd refuses to start with it
#               (config.ComplianceGaps reports it; there is no override).
#
# mTLS is the recommended production configuration: identity is bound to a
# client certificate verified against tls.client_cas, and nothing extra has to
# be provisioned or rotated on the server beyond the CA.
auth:
  enabled: true
  type: "mtls"  # noop, mtls, jwt, adaptive, composite
  mtls: true
  # Role-based authorization for every transport (REST, gRPC, QUIC, MCP).
  # Requires storage.backend "qrdb" -- see the note there.
  enable_rbac: true

  # Required for type "jwt" and for type "adaptive": the PEM public key used to
  # verify bearer tokens. Uncomment together with the matching type and replace
  # the placeholder path -- startup fails while the key is missing or unreadable.
  # jwt:
  #   public_key_file: "/path/to/jwt-public.pem"  # PLACEHOLDER: replace with a real key
  #   issuer: "https://issuer.example.com"
  #   audience: ["xkms"]
  #   algorithm: "RS256"

  # Required for type "composite": the methods to chain, first success wins.
  # composite:
  #   methods: ["jwt", "mtls"]

# Metadata storage for keys, certificates and service state.
# backend: pebble (durable embedded default), file (one plain file per key),
# qrdb (shared hosted node) or memory (tests only).
#
# "qrdb" is required by auth.enable_rbac above: roles and permissions live in
# the qrdb identity plane, and it is the only backend that provides one. With
# any other backend the authorizer cannot be built and every transport would
# authorize every request, so the daemon refuses to start in that combination.
storage:
  backend: "qrdb"
  path: "/var/lib/xkms/storage"

# Default backend used when a request does not name one.
default_backend: "pkcs8"

# At least one backend must be enabled.
backends:
  pkcs8:
    enabled: true
    path: "/var/lib/xkms/keys"

  # tpm2:
  #   enabled: true
  #   device: "/dev/tpmrm0"
  #   key_dir: "/var/lib/xkms/keys/tpm2"

  # pkcs11:
  #   enabled: true
  #   library_path: "/usr/lib/softhsm/libsofthsm2.so"
  #   token_label: "xkms"
  #   pin: "1234"  # prefer an environment variable in production

# Rate limiting configuration
# Applied uniformly across all APIs (REST, gRPC, QUIC, MCP)
ratelimit:
  enabled: true
  requests_per_min: 600    # Sustained rate: 600 requests per minute (10/sec)
  burst: 100               # Allow bursts up to 100 requests
  cleanup_interval_sec: 600  # Clean up idle clients every 10 minutes
  max_idle_sec: 1800       # Remove clients idle for 30 minutes

metrics:
  enabled: true
  path: "/metrics"
  port: 9090

health:
  enabled: true
  path: "/health"

# Random Number Generation (RNG) configuration
# Controls the source of cryptographic randomness used for key generation,
# nonces, and other security-critical operations.
#
# Mode options:
#   - "auto" (default): Automatically select best available hardware RNG
#                       Priority: PKCS#11 > TPM2 > Software
#   - "software": Use crypto/rand from Go standard library
#   - "tpm2": Use TPM 2.0 hardware RNG
#   - "pkcs11": Use PKCS#11 HSM RNG
#
# Environment variables:
#   XKMS_RNG_MODE          - Override mode
#   XKMS_RNG_FALLBACK_MODE - Override fallback mode
#   XKMS_RNG_TPM2_DEVICE   - TPM device path
#   XKMS_RNG_PKCS11_MODULE - PKCS#11 module path
#   XKMS_RNG_PKCS11_PIN    - PKCS#11 PIN (prefer env var over config)
rng:
  mode: "auto"             # auto, software, tpm2, pkcs11
  fallback_mode: "software"  # Fallback if primary fails

  # TPM2-specific settings (optional, used when mode is "tpm2" or "auto")
  # tpm2:
  #   device: "/dev/tpm0"           # TPM device path
  #   use_simulator: false           # Connect to TPM simulator instead
  #   simulator_host: "localhost"    # Simulator hostname
  #   simulator_port: 2321           # Simulator port

  # PKCS#11-specific settings (optional, used when mode is "pkcs11" or "auto")
  # pkcs11:
  #   module: "/usr/lib/libsofthsm2.so"  # PKCS#11 library path
  #   slot_id: 0                          # Token slot ID
  #   pin_required: true                  # Whether PIN is needed
  #   # pin: "1234"                       # PIN (prefer XKMS_RNG_PKCS11_PIN env var)
