# Default configuration for xkmsd
#
# This is the minimal configuration that enables only Unix socket
# for local IPC. Use this when the xkms CLI is the only client.
#
# For remote access, copy this file and enable the desired protocols
# (rest, grpc, quic, mcp) in the protocols section.

server:
  host: 127.0.0.1
  rest_port: 8443
  grpc_port: 9443
  quic_port: 8444
  mcp_port: 9444

# Protocol settings
# Only Unix socket is enabled by default for local CLI communication.
protocols:
  unix: true    # Local Unix socket (always enabled for CLI)
  rest: false   # REST/HTTP API
  grpc: false   # gRPC API
  quic: false   # QUIC/HTTP3 API
  mcp: false    # MCP JSON-RPC API

# Unix socket configuration
unix:
  socket_path: /var/run/xkms/xkms.sock

logging:
  level: info
  format: json

# The Unix socket is TLS-only. Without cert_file/key_file the node serves its
# bootstrap certificate, which names localhost (the authority a unix:// client
# dials).
tls:
  enabled: true
  include_localhost_sans: true

# Authentication cannot be disabled. The composite chain verifies client
# certificates and the session JWTs the built-in token issuer mints.
auth:
  enabled: true
  type: composite

# Rate limiting is typically not needed for local access
ratelimit:
  enabled: false

metrics:
  enabled: true
  path: /metrics
  port: 9090

health:
  enabled: true
  path: /health

datastore:
  engine: file
  path: /var/lib/xkms/metadata

# Default backend for key operations
default_backend: pkcs8

backends:
  pkcs8:
    enabled: true
    path: /var/lib/xkms/keys
